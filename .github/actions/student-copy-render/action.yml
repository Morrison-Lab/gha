name: Render and check a student copy on the cluster
description: >-
  Render the student copy and the answer key, render each question on its
  own, and run the repository's check over every render, as ONE HTCondor job
  through condor-batch (falling back to the runner as condor-batch does).
  Grading repositories (mlg, mcsg) call this instead of each carrying the
  steps. The step lines are written by student-copy-render/student_copy_steps.py.
inputs:
  check:
    description: The check command, one line, run after every render.
    required: true
  documents:
    description: >-
      `all` for a bare `quarto render` of each profile, or a file inside the
      checkout listing the documents to render, one per line (an empty file
      renders none).
    default: all
  fragments:
    description: >-
      `all` for every file `fragment-glob` matches, or a file inside the
      checkout listing the questions to render on their own.
    default: all
  fragment-glob:
    description: The questions that `all` in `fragments` renders.
    default: exercises/*/_exr-*.qmd
  parallel:
    description: Questions rendered at once after the first.
    default: '4'
  head:
    description: Passed to condor-batch.
    default: csci-lab-head.cs.wwu.edu:922
  image:
    description: Passed to condor-batch.
    default: ''
  image-file:
    description: >-
      Passed to condor-batch: the repository's image on the runner, built by
      condor-batch/image/build-repo-ci.sh as <repo>-ci.sif.
    default: ''
  output:
    description: Passed to condor-batch.
    default: _output
  wait-minutes:
    description: Passed to condor-batch.
    default: ''
  working-directory:
    description: Passed to condor-batch.
    default: .
runs:
  using: composite
  steps:
    - name: Write the cluster steps
      id: build
      shell: bash
      env:
        SC_CHECK: ${{ inputs.check }}
        SC_DOCUMENTS: ${{ inputs.documents }}
        SC_FRAGMENTS: ${{ inputs.fragments }}
        SC_FRAGMENT_GLOB: ${{ inputs.fragment-glob }}
        SC_PARALLEL: ${{ inputs.parallel }}
        SCRIPT: ${{ github.action_path }}/../../../student-copy-render/student_copy_steps.py
      run: |
        set -euo pipefail
        steps=$(python3 "$SCRIPT")
        printf '%s\n' "$steps"
        delim="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
        { echo "steps<<$delim"; printf '%s\n' "$steps"; echo "$delim"; } >> "$GITHUB_OUTPUT"

    # On the cluster every line runs even when an earlier one fails, and the
    # step fails with the last failing line's exit code. When condor-batch
    # falls back to the runner, it stops at the first failing line instead.
    - name: Render and check on the cluster
      uses: Morrison-Lab/gha/.github/actions/condor-batch@v3
      with:
        steps: ${{ steps.build.outputs.steps }}
        head: ${{ inputs.head }}
        image: ${{ inputs.image }}
        image-file: ${{ inputs.image-file }}
        output: ${{ inputs.output }}
        wait-minutes: ${{ inputs.wait-minutes }}
        working-directory: ${{ inputs.working-directory }}
