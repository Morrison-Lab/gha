name: Detect PR workflow-file edits
description: >-
  Lists the PR's changed files and classifies whether any top-level GitHub
  Actions workflow YAML changed, and whether the caller review workflow is
  among them. Wraps detect-pr-workflow-edits.sh via github.action_path
  (gha#598).

inputs:
  pr-number:
    description: Pull request number.
    required: true
  caller-workflow-path:
    description: Caller review workflow path (e.g. .github/workflows/claude-review.yml).
    required: false
    default: ''
  repo:
    description: Repository name (owner/repo).
    required: false
    default: ${{ github.repository }}
  github-token:
    description: GitHub token used to list the PR's files.
    required: false
    default: ${{ github.token }}

outputs:
  workflow_edits:
    description: "'true' when the PR edits a top-level .github/workflows/*.yml file."
    value: ${{ steps.detect.outputs.workflow_edits }}
  caller_edited:
    description: "'true' when the PR edits the caller review workflow."
    value: ${{ steps.detect.outputs.caller_edited }}
  edited_path:
    description: >-
      First matching workflow path, or empty. Empty when the PR file list
      could not be completed; see list_incomplete.
    value: ${{ steps.detect.outputs.edited_path }}
  list_incomplete:
    description: >-
      'true' when the PR file list could not be completed (API failure or
      GitHub's 3000-file cap). workflow_edits is then true and edited_path
      is empty --- not a fake workflow filename.
    value: ${{ steps.detect.outputs.list_incomplete }}

runs:
  using: composite
  steps:
    - name: Detect workflow-file edits
      id: detect
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ inputs.pr-number }}
        CALLER_WF_PATH: ${{ inputs.caller-workflow-path }}
      run: |
        set -euo pipefail
        ACTION_SCRIPTS="${{ github.action_path }}/../../workflows/scripts"
        if ! files=$(REPO="$REPO" PR_NUMBER="$PR_NUMBER" bash "$ACTION_SCRIPTS/list-pr-changed-files.sh"); then
          echo "::warning::Could not list a complete file set for PR #$PR_NUMBER; treating as a workflow-file edit so the review restores default-branch YAML rather than executing an unknown or truncated PR tree (gha#598)."
          echo "workflow_edits=true" >> "$GITHUB_OUTPUT"
          echo "caller_edited=false" >> "$GITHUB_OUTPUT"
          echo "edited_path=" >> "$GITHUB_OUTPUT"
          echo "list_incomplete=true" >> "$GITHUB_OUTPUT"
        else
          PR_CHANGED_FILES="$files" bash "$ACTION_SCRIPTS/detect-pr-workflow-edits.sh"
          echo "list_incomplete=false" >> "$GITHUB_OUTPUT"
        fi
