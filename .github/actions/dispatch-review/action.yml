name: Dispatch code review
description: >-
  Resolves PR_BRANCH / PR_HEAD_REPO (including API lookup fallback when checkout
  was skipped), determines whether --ref should be passed (omitting --ref for
  fork PRs or when PR_BRANCH cannot be resolved), and dispatches the code review
  workflow via `gh workflow run`. Wraps
  .github/workflows/scripts/dispatch-review.sh, located via
  github.action_path. (gha#419)

inputs:
  pr-number:
    description: Issue or PR number.
    required: true
  pr-branch:
    description: PR head branch name if known (e.g. from checkout step).
    required: false
    default: ''
  pr-head-repo:
    description: PR head repo full name if known (e.g. from checkout step).
    required: false
    default: ''
  review-workflow-file:
    description: Name of the review workflow file to dispatch.
    required: false
    default: 'claude-code-review.yml'
  context-notice:
    description: Optional context suffix for failure warning log message.
    required: false
    default: ''
  github-token:
    description: 'Token with actions:write permission used to dispatch the workflow.'
    required: false
    default: ${{ github.token }}
  dry-run:
    description: Print the gh workflow run command without executing it.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Dispatch review workflow
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_BRANCH: ${{ inputs.pr-branch }}
        PR_HEAD_REPO: ${{ inputs.pr-head-repo }}
        REVIEW_WF: ${{ inputs.review-workflow-file }}
        CONTEXT_NOTICE: ${{ inputs.context-notice }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        SCRIPT="${{ github.action_path }}/../../workflows/scripts/dispatch-review.sh"
        bash "$SCRIPT"
