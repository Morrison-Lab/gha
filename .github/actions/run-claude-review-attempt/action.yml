name: Run a Claude Code Review attempt
description: >-
  Runs a single attempt of the `code-review` plugin via
  `anthropics/claude-code-action`, with claude-code-review.yml's review-only
  `allowedTools`/`disallowedTools` and prompt. Extracted into a composite
  action (rather than left inline) so claude-code-review.yml can invoke it
  TWICE — once for the initial attempt, once as a same-prompt retry when the
  first attempt stubs out (gha#185) — without duplicating this ~100-line
  `with:` block between two near-identical steps, which the review priorities
  in this repo's own CLAUDE.md flag as a DRY violation.

inputs:
  claude-code-oauth-token:
    description: Forwarded to claude-code-action's claude_code_oauth_token.
    required: false
    default: ''
  anthropic-api-key:
    description: Forwarded to claude-code-action's anthropic_api_key.
    required: false
    default: ''
  pr-number:
    description: PR number under review (already resolved by the caller).
    required: true
  prior-context:
    description: Prior-round review context, from claude-code-review.yml's gather-context job.
    required: false
    default: ''
  incremental-context:
    description: >-
      The computed what-changed-since-the-last-round section, from
      claude-code-review.yml's "Compute what changed since the last reviewed
      commit" step (gha#709). Empty on a first round, or when the prior
      reviewed commit is not reachable in this checkout. Computed by the
      workflow with git itself, because a reviewer deriving the range from
      comment history has misstated it and approved over the commit it
      missed.
    required: false
    default: ''
  labmanual-guidance:
    description: Lab-manual review guidance, from claude-code-review.yml's Compose lab-manual review guidance step.
    required: false
    default: ''
  pr-state:
    description: >-
      The PR's live `state` field ("open" or "closed"), fetched by
      claude-code-review.yml's stash step at the start of the run. Handed to
      the reviewer as an authoritative fact so it never has to infer
      open/closed status from commit messages (gha#295).
    required: false
    default: ''
  pr-merged:
    description: >-
      The PR's live `merged` field ("true" or "false"), fetched alongside
      pr-state above. See pr-state's description.
    required: false
    default: ''
  pr-diff-file:
    description: >-
      Absolute path of a file holding the PR's diff, written by
      claude-code-review.yml before this action runs. Absolute because Claude
      Code's Read tool requires an absolute `file_path`. Naming it in the prompt
      is the point: the reviewer wants the diff in a file so it can chunk or
      count a large one, and at the time it had no route to that, so it spent
      whole runs retrying redirect variants until the denial count starved it
      (gha#541, gha#543). It could write one for itself now (gha#572 granted
      `Edit(//tmp/**)`), but handing it the file costs the reviewer nothing
      and is still the better default. Empty when the write failed, in which
      case the prompt falls back to the bare-command instructions below.
    required: false
    default: ''
  latexmacros-guidance:
    description: >-
      LaTeX-macro review guidance, from claude-code-review.yml's Compose
      LaTeX-macro review guidance step.
    required: false
    default: ''
  prompt-addendum:
    description: Repo-specific review guidance (claude-code-review.yml's prompt-addendum input).
    required: false
    default: ''
  track-progress:
    description: Already-resolved 'true'/'false' string for claude-code-action's track_progress.
    required: true
  show-full-output:
    description: Forwarded to claude-code-action's show_full_output.
    required: true
  allowed-bots:
    description: Forwarded to claude-code-action's allowed_bots.
    required: true
  is-retry:
    description: >-
      'true' when this is the same-prompt retry attempt run after the first
      attempt completed without an SDK error but produced no verdict (gha#185).
      Adds an extra, more forceful instruction to the system prompt so the
      retry doesn't repeat the same stub outcome.
    required: false
    default: 'false'
  model:
    description: >-
      Model for the reviewer to run on, passed through as the Claude Code
      CLI's --model flag (e.g. claude-opus-4-8). Empty (default) omits the
      flag entirely, falling through to claude-code-action's own default.
    required: false
    default: ''
  use-ai-config:
    description: >-
      'true' (the default) to install the Morrison-Lab/ai-config plugin
      alongside the built-in code-review plugin below
      (claude-code-review.yml's use-ai-config input). Any other value
      skips it.
    required: false
    default: 'true'
  extra-plugin-marketplaces:
    description: >-
      Extra newline-separated plugin marketplace Git URLs, appended to the
      built-in marketplaces below (claude-code-review.yml's
      plugin-marketplaces input). Empty by default.
    required: false
    default: ''
  extra-plugins:
    description: >-
      Extra newline-separated plugin refs to install, appended to the
      built-in plugins below (claude-code-review.yml's plugins input).
      Empty by default.
    required: false
    default: ''
  github-token:
    description: >-
      Token forwarded to claude-code-action's github_token input. When set,
      the action skips its OIDC App-token exchange (OVERRIDE_GITHUB_TOKEN in
      anthropics/claude-code-action v1.0.196 src/github/token.ts, measured
      2026-08-26) and uses this token instead. That exchange's
      DEFAULT_PERMISSIONS are contents/pull_requests/issues write, and
      additional_permissions merges on top of those defaults rather than
      replacing them, so it cannot be the downscope. The calling job's
      GITHUB_TOKEN -- contents: read, no forge-write -- is the downscope
      (gha#580). Defaults to github.token so a forgotten pass still uses
      the job token rather than falling through to the write App token.
      Skipping that exchange is also what stops a remaining workflow-content
      mismatch from skipping the review after this checkout restored
      `.github/workflows/` from the default branch (gha#598).
    required: false
    default: ${{ github.token }}
  workflow-fallback:
    description: >-
      "true" when this checkout replaced `.github/workflows/` with the
      default-branch tree (gha#598). The prompt then tells the reviewer to
      take workflow diffs from the saved PR diff, not from on-disk YAML.
    required: false
    default: 'false'

outputs:
  execution_file:
    description: Passthrough of claude-code-action's execution_file output.
    value: ${{ steps.run.outputs.execution_file }}

runs:
  using: composite
  steps:
    - name: Run Claude Code Review
      id: run
      uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7 # v1.0.206
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        # Skip the App-token exchange. DEFAULT_PERMISSIONS in the pinned
        # action are write; additional_permissions cannot drop them. The
        # job token is contents:read (gha#580). See the github-token input.
        github_token: ${{ inputs.github-token }}
        # anthropics/claude-code-action #1048 (v1.0.196): 'false' restores
        # during-session posting and skips the post-session Haiku
        # classify-and-post step (`if: ... != 'false'` in action.yml).
        # It does NOT mean "do not post". Inline posts are disabled by
        # not starting the server: prepareMcpConfig() only adds
        # github_inline_comment when allowedTools contains
        # mcp__github_inline_comment__* or mcp__github__* (pinned
        # src/mcp/install-mcp-server.ts, measured 2026-08-26). Neither
        # prefix is allowlisted below, so the model has no tool to 403
        # on. 'true' would still run the post-session poster against
        # this read-only job token if a buffer existed.
        classify_inline_comments: 'false'
        # Leaving the ai-config and extra-* slots as blank lines is safe when
        # they're unset: the upstream action's installPlugins() trims and
        # filters blank lines before parsing, so a blank line adds no
        # marketplace/plugin. (Verified against the pinned
        # claude-code-action's base-action/src/install-plugins.ts:
        # parseMarketplaces()/parsePlugins() both `.map(trim).filter(length)`.)
        #
        # The ai-config URL and plugin ref are spelled out here AND in
        # claude.yml (the agent's copy) rather than shared from one place: a
        # composite action cannot `uses:` a sibling local action, because a
        # relative path resolves against the CALLER's checkout instead of this
        # action's (gha#284), so a shared composite would break for every
        # consumer. Update both sites together.
        plugin_marketplaces: |
          https://github.com/anthropics/claude-code.git
          ${{ inputs.use-ai-config == 'true' && 'https://github.com/Morrison-Lab/ai-config.git' || '' }}
          ${{ inputs.extra-plugin-marketplaces }}
        plugins: |
          code-review@claude-code-plugins
          ${{ inputs.use-ai-config == 'true' && 'ai-config@Morrison-Lab' || '' }}
          ${{ inputs.extra-plugins }}
        # The inline-comment MCP tool (`mcp__github_inline_comment__create_inline_comment`)
        # is intentionally NOT allowlisted, and neither is `mcp__github__*`
        # (the docker GitHub MCP): either prefix starts the inline-comment
        # server in prepareMcpConfig(). That server posts during the model
        # turn, and gha#580 moved every forge write off this job. Tag mode
        # always starts github_comment (mcp__github_comment__update_claude_comment),
        # not github_inline_comment, and is forced off below. Findings go
        # in the packed summary the posting job uploads.
        # ...and keep this a REVIEW-ONLY run. Even with a read-only contents
        # token, tag mode hands the reviewer git add/commit/rm and the action's
        # default prompt tells it to commit+push, so it flails through
        # permission denials and posts a misleading "grant me git permissions"
        # comment. Disallow the git-write tools (disallowed beats the action's
        # generated allow-list) and tell the agent up front not to attempt
        # edits, so it folds any would-be fix into its review instead.
        #
        # NOTE: the paragraph below describes the allowlist as it stood
        # BEFORE gha#566/gha#572, when Bash was granted command by command.
        # `Bash` is granted whole now and `Bash(python3 -m:*)` is no longer
        # denied -- see the gha#566/gha#572 block further down, which is the
        # current state. This is kept because it records WHY the CAS tools
        # were wanted, which is still the reason the `pip-packages` /
        # `apt-packages` inputs exist.
        #
        # `Bash(python3:*)` and `Bash(maxima:*)` let the reviewer actually
        # run the computer-algebra tools the `pip-packages` / `apt-packages`
        # inputs install (SymPy, Maxima) to symbolically check a derivation
        # under review, instead of only tracing the algebra by eye (gha#154,
        # gha#199). `Bash(python3:*)` also covers running an existing Python
        # script under the checkout (e.g. a CI guard against sample input).
        # This job gets no git-write capability from these, but on a
        # same-repo (non-fork) PR it does hold CLAUDE_CODE_OAUTH_TOKEN /
        # ANTHROPIC_API_KEY as secrets. `Bash(python3:*)` already permits
        # running arbitrary `.py` files, so ALSO denying `python3 -c` bought
        # little real protection while blocking the inline SymPy one-liners
        # the CAS-review addendum (`prompt-addendum`) tells the reviewer to
        # run — so `-c` is allowed. `Bash(python3 -m:*)` stays denied:
        # module execution (pip installs, `http.server`, …) isn't needed for
        # symbolic checks and is a broader grant. All git-write tools remain
        # denied below.
        #
        # `Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),
        # Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)`
        # are the read-only `gh` subcommands the upstream `code-review`
        # plugin's own `/code-review` command declares as `allowed-tools`
        # (github.com/anthropics/claude-code, plugins/code-review/commands/
        # code-review.md). Without them, every one of the plugin's 4
        # parallel sub-agents hits a permission denial on each attempt.
        # #187 already stopped a denial from ending the run early, but a
        # heavier prompt (e.g. a dispatched re-review carrying prior-review
        # context) can still rack up enough denials across all 4 sub-agents
        # — reproduced with permission_denials_count:28, num_turns:50 on a
        # dispatched re-review of PR #183 — that the run finishes
        # is_error:false but never emits a concluding verdict block: the
        # same stub-review signature check-review-execution.sh detects
        # (gha#173, Lacaedemon/sparta#590), from this separate cause.
        # `gh pr comment` -- also in the plugin's declared tool list, and
        # re-granted by its command frontmatter (`allowed-tools`), so a bare
        # allowlist omission does NOT block it -- is explicitly DENIED in
        # `--disallowedTools` below (deny beats a command's own allow-list).
        # claude-code-review.yml posts the review itself via its "Post review
        # comment" step (with run-link header, dedup/collapse, and cost
        # linkage), so a plugin self-post produces a duplicate top-level
        # comment (the agent's as `claude[bot]`, the workflow's as
        # `github-actions[bot]`) that the collapse step -- which matches on
        # the workflow's run URL -- can never fold. Denying the tool, plus
        # the prompt below telling the agent to OUTPUT its review rather than
        # post it, closes that channel; it also retires the raw-`gh pr
        # comment`-republishing class (gha#312/#318/#381), since the agent
        # never issues the command, so there is nothing to republish.
        #
        # `WebFetch` and `Bash(curl:*)` let the reviewer fetch the rendered
        # output a repo's `prompt-addendum` may tell it to check the diff
        # against — e.g. "verify each computed value and figure against the
        # PR-preview site" (rme). The `code-review` plugin fans out to 4
        # parallel sub-agents, each of which then tries to fetch the preview
        # for every value/figure and — with no fetch tool granted — racks up
        # a denial per attempt, enough to finish is_error:false but never
        # emit a verdict (the gha#173 stub signature again, this time from a
        # third cause; reproduced at permission_denials_count:36 on
        # rme#954). This adds no exfiltration capability beyond
        # `Bash(python3:*)` above, which already permits arbitrary network
        # calls via `urllib`; it just lets the reviewer fetch directly
        # instead of scripting it. (`WebFetch` is GET-only; `Bash(curl:*)`
        # is a prefix match that also allows write verbs like `curl -X POST`
        # / `--data` / `-T`, but those stay within the `python3` network
        # capability already granted.) The `--append-system-prompt` below is
        # updated in lockstep to tell the reviewer these fetch tools ARE
        # available — granting the tool without that leaves the prompt saying
        # "no fetch tools; don't fetch", which would defeat the grant.
        #
        # `WebSearch` gives the reviewer full web-search access for
        # fact-checking (gha#266). The review guidelines ask it to verify
        # prose claims, citations/DOIs/URLs, and code/math against external
        # sources, and the prompt's hallucination watch asks it to confirm
        # references actually exist — but `WebFetch`/`curl` only retrieve a
        # URL the reviewer already has; search is what locates the
        # authoritative source in the first place. No new egress
        # capability: search queries are served through the Anthropic API,
        # not the runner's own network, and `Bash(python3:*)` /
        # `Bash(curl:*)` above already permit arbitrary direct requests
        # (gha#240 tracks that standing tradeoff). As with the fetch tools,
        # the `--append-system-prompt` below is updated in lockstep to say
        # search is available.
        #
        # `ScheduleWakeup,SendMessage,Monitor` are interactive-session-only
        # orchestration tools (schedule a future turn, message another agent,
        # stream a background process) that make no sense in a one-shot
        # headless CI run: there is no later turn for a scheduled wakeup to
        # fire into, and no other agent to message. anthropics/claude-code-action#1462
        # documents exactly this failure mode — the model calls one of these
        # in good faith, ends its turn believing it'll resume later, the
        # process then exits (killing any background subagent it also
        # spawned), and the run reports success with no review ever posted
        # (gha#218's root cause 2 matches this signature: a background Agent
        # call followed by ScheduleWakeup, never resumes). Denying them
        # outright is safer than the prompt-only mitigation below on its
        # own, and doesn't touch the `code-review` plugin's own legitimate
        # `Task`/`Agent` fan-out to its 4 parallel sub-agents, which uses a
        # different tool than these three.
        #
        # That carve-out for the fan-out was too broad, and gha#392 is the
        # bill for it. `Agent`'s `run_in_background` parameter defaults to
        # TRUE, so the "legitimate same-run fan-out" this comment blesses
        # is itself a background spawn -- the model then ends its turn
        # waiting for completion notifications that only a later turn can
        # deliver, which is the same shape as the three tools denied above,
        # reached without calling any of them. Denying `Agent` would close
        # it and would also break the plugin's intended parallelism, so the
        # prompt below requires `run_in_background: false` instead. Read
        # the two together: these three tools are denied outright because
        # they have no synchronous form, while `Agent` is allowed in its
        # synchronous form only.
        #
        # Measured on Morrison-Lab/ai-config#986, run 30671528617: eight
        # `Agent` calls, `is_error: false`, `stop_reason: end_turn`,
        # $9.76, and a final message reading "Waiting for the remaining
        # background agents to complete." in place of a verdict.
        #
        # gha#532: that prompt mitigation RECURRED, on ai-config#1744 run
        # 32347489886 -- four background agents spawned and the turn ended
        # waiting on them, with the synchronous-only instruction verbatim in
        # the prompt at the time. A prompt is a request, not a constraint, so
        # `Agent(run_in_background:true)` and its `Task` alias are DENIED
        # below, using Claude Code's parameter-scoped rule form. That is
        # narrower than denying `Agent` outright, which gha#392's follow-up
        # rejected because it would also break the plugin's legitimate
        # synchronous fan-out.
        #
        # **This closes one of two routes, not both.** A parameter the model
        # omits is never matched, and `run_in_background` DEFAULTS to true, so
        # a call that simply omits it still backgrounds and this rule does not
        # see it. The prompt instruction below therefore stays: it covers the
        # omission route, the deny covers the explicit-`true` one, and neither
        # is redundant. Do not remove the prompt text on the strength of this
        # rule.
        #
        # `Task` is listed beside `Agent` defensively rather than on evidence
        # both names are live: the CLI version is not pinned here, and a deny
        # rule matching nothing costs nothing while a missing one costs the
        # whole mitigation.
        #
        # The denials these rules produce are excluded from the stub-retry
        # gate in check-review-execution.sh -- see gha#550 review finding 1
        # there. A denial we engineered is not evidence the reviewer was
        # starved, which is what that threshold infers.
        #
        # CLAUDE.md's "A prompt instruction is a request; a permission rule is
        # a constraint" carries the docs citations, the deny-not-allow
        # correction, and the CLI verification (with its negative control) --
        # kept there rather than restated here, matching how
        # compose-review-failure-report.sh stays terse beside its own CLAUDE.md
        # section.
        #
        # A fourth stub-review cause, gha#541, needs no new tool grant —
        # `Bash(gh pr diff:*)` above already covers it; the failure was in HOW
        # the reviewer used it. On a large diff, the agent reached for
        # `gh pr diff ... > /tmp/pr.diff; wc -l ...` (or `gh pr diff ... |
        # grep ...`) to chunk the output, and every variant was denied.
        # Measured on ucdavis/win#78, run 32415477507: 15+ redirect/pipe/mkdir
        # variants denied, `permission_denials_count:33`,
        # `total_cost_usd:2.29`, no verdict.
        #
        # This comment used to explain that as a command "rejected as a WHOLE
        # command even though the allowed part matches exactly", and as a
        # sandbox hard block on file writes "so no allowlist entry can satisfy
        # it". Both readings were wrong, which is worth recording rather than
        # quietly deleting, because each argued against the fix gha#566 and
        # gha#572 have now made.
        #
        # Claude Code's matcher is shell-operator aware: it splits on `&&`,
        # `||`, `;`, `|`, `|&`, `&` and newlines, and requires EVERY segment
        # to match (code.claude.com/docs/en/permissions). So the chained call
        # was never refused as one unit — `gh pr diff` matched fine, and `wc`
        # and `grep` were the segments with no allow rule of their own. And
        # the file writes were reported in the execution file's
        # `permission_denials`, which is the permission layer rather than a
        # sandbox: a `Write` grant is precisely what they lacked.
        #
        # Both are moot now that Bash is granted whole and `Edit(//tmp/**)`
        # is allowed, but the correction matters more than the moot-ness — a
        # wrong mechanism recorded in a comment is what makes the next reader
        # rule out the real fix. A bare `gh pr diff <n> --repo <owner>/<repo>`
        # is still the cheapest form and the prompt still recommends it, now
        # on efficiency grounds rather than permission ones.
        #
        # That bare call's own OUTPUT can still exceed Claude Code's Bash
        # tool's ~30,000-character inline ceiling on a genuinely large diff —
        # ucdavis/win#78's own diff measures 114,587 bytes / 2,464 lines,
        # about 3.8x that ceiling.
        # Past it, a valid (exit 0) result comes back as a preview plus the
        # path of a file the HARNESS already saved, not the full text inline
        # (code.claude.com/docs/en/tools-reference).
        # That harness-written file sits in the session's own working
        # directory, and Read is already in the action's base allowlist (see
        # the top-of-file comment), so reading it back always worked.
        # The prompt below tells the reviewer to Read that path rather than
        # re-capturing the same bytes itself.
        #
        # ---------------------------------------------------------------
        # gha#566 / gha#572: `Bash` is granted WHOLE, not command by command.
        # ---------------------------------------------------------------
        # The allowlist used to name `python3`, `maxima`, `curl` and six
        # read-only `gh` subcommands. Bash is allowlist-gated, so everything
        # else was denied -- no `git` at all, no `bash`, not even a `for`
        # loop. That starved real reviews, repeatedly and expensively:
        #
        #   ai-config#1841  14 denials  git show/worktree, on a PR about git
        #   ai-config#1860  22 denials  $5.32   a bare `for` loop over paths
        #   ai-config#1874  21 denials  $6.11   git fetch + git show
        #   gha#571         37 denials  $9.87   bash on a shell test suite
        #   gha#576         11 denials  $4.68   mkdir + fixture for a detector
        #
        # Every one produced NO verdict, and each crossed the gha#198
        # threshold, so the workflow declined to retry -- the spend bought
        # nothing. The two issues are one gap seen from two angles, which is
        # why this widens Bash structurally instead of adding commands one at
        # a time: the next denied command is always some ordinary shell the
        # list happened not to name.
        #
        # Note what this does NOT change. `Bash(python3:*)` and `Bash(curl:*)`
        # were already granted, and between them they are arbitrary code
        # execution plus arbitrary authenticated network access -- so blanket
        # Bash adds no capability CLASS that was not already reachable, only
        # a shorter route to it. The run is also same-repo only: a fork PR
        # cannot read the OAuth token, and dispatched reviews of forks are
        # refused outright by claude-code-review.yml's own guard (gha#235).
        # So the realistic failure this list guards against is the reviewer
        # doing something careless, not an attacker doing something clever.
        #
        # The deny list therefore grew: `gh pr merge`, `gh pr edit`,
        # `gh issue comment`, `gh api` and their siblings were not on the old
        # allowlist, so a blanket Bash grant would newly permit them in their
        # plainest form. `gh api` is denied wholesale rather than by method,
        # because `gh api repos/o/r -X POST` puts the verb after the path and
        # no prefix pattern can catch both orderings; the read-only `gh pr` /
        # `gh issue` / `gh search` subcommands remain available.
        #
        # **These denials are guard rails against an accident, NOT a security
        # boundary, and the difference is worth stating because the list looks
        # like one.** A prefix rule cannot contain a general shell: the model
        # could reach a denied command by wrapping it, and the `Edit(//tmp)`
        # scope constrains the Write TOOL while a redirect or `sed -i` writes
        # wherever the runner account can.
        #
        # Note what that does and does not say about this change. It is not a
        # regression, because the hole predates it: `Bash(python3:*)` was
        # already granted, and `python3 -c "subprocess.run(['gh','pr','merge'
        # ,...])"` matched the allowlist and no deny prefix, so every mutation
        # named above was already reachable and the old deny list was already
        # advisory. Blanket Bash shortens the route rather than opening it.
        #
        # It is also not a reason to skip the denials. The failure actually
        # worth preventing here is the reviewer helpfully doing something
        # destructive in good faith, and a prefix rule stops exactly that,
        # because a model acting in good faith issues the plain command. What
        # the list cannot do is stop a model acting against instructions --
        # and only an architectural split (a read-only model job handing its
        # output to a separate trusted posting job) would, which is gha#580.
        #
        # Two properties of Claude Code's permission model make this sound,
        # both from code.claude.com/docs/en/permissions rather than assumed:
        # deny is evaluated before allow and a broad deny cannot carry
        # allowlist exceptions, so these denials beat the blanket grant; and
        # the matcher is shell-operator aware, splitting on `&&`, `||`, `;`,
        # `|`, `|&`, `&` and newlines and requiring EVERY segment to match.
        # The second is what makes prefix denials trustworthy here -- a
        # chained `cd /tmp && git commit` is still refused at its second
        # segment. It also explains the compound-command shape gha#572
        # recorded: `bash suite.sh; echo "EXIT: $?"` failed not because the
        # whole string was matched as one unit, but because `echo` needed an
        # allow rule of its own. Blanket Bash dissolves that too.
        #
        # `Bash(python3 -m:*)` is REMOVED from the deny list. It was there
        # because module execution was "a broader grant than symbolic checks
        # need", which no longer holds once Bash is granted whole -- and it
        # was actively harmful: `python3 -m pytest check-phi/tests/` is the
        # command this repo's own CLAUDE.md documents for running its Python
        # suites, so the deny starved the reviewer on exactly the tests it is
        # asked to verify. That is gha#572's defect in miniature.
        #
        # `Edit(//tmp/**)` is the other half of gha#572. A reviewer that
        # wants to check something programmatically has to be able to stage a
        # scratch script; denying that pushes it toward eyeballing, which is
        # the opposite of what this repo's "Never just theorize -- investigate
        # empirically" section asks for.
        #
        # Two spelling details, and BOTH are needed -- getting either wrong
        # produces a rule that is accepted and then silently never consulted,
        # which is worse than no rule because it reads as a working grant.
        # The `//` prefix is the documented form for a filesystem-absolute
        # path; a single leading `/` is anchored at the project instead. And
        # the tool name must be `Edit`, not `Write`: the docs say Claude Code
        # "checks file permissions against `Edit(path)` and `Read(path)` rules
        # only", and to "use `Edit(docs/**)` in place of `Write(docs/**)`" --
        # so `Edit` is what governs the Write, MultiEdit and NotebookEdit
        # tools too. This shipped as `Write(//tmp/**)` first and a reviewer
        # caught it; the `//` fix is what made the wrong tool name easy to
        # miss.
        #
        # Scoping it to `/tmp` keeps the reviewer's own scratch work out of
        # the checkout. It does NOT make the checkout unwritable -- see the
        # guard-rails paragraph above; a general shell writes wherever the
        # runner account can, and the prompt asks the reviewer not to.
        claude_args: >-
          --allowedTools
          "Bash,Edit(//tmp/**),WebFetch,WebSearch"
          --disallowedTools
          "Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git push:*),Bash(*git-push.sh*),Bash(gh pr comment:*),Bash(gh pr create:*),Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh pr reopen:*),Bash(gh pr edit:*),Bash(gh pr ready:*),Bash(gh pr review:*),Bash(gh pr lock:*),Bash(gh pr unlock:*),Bash(gh pr update-branch:*),Bash(gh pr revert:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh issue close:*),Bash(gh issue reopen:*),Bash(gh issue edit:*),Bash(gh issue delete:*),Bash(gh issue develop:*),Bash(gh issue lock:*),Bash(gh issue unlock:*),Bash(gh issue pin:*),Bash(gh issue unpin:*),Bash(gh issue transfer:*),Bash(gh api:*),Bash(gh release:*),Bash(gh workflow run:*),Bash(gh run cancel:*),Bash(gh run rerun:*),Bash(gh secret:*),Bash(gh variable:*),Bash(gh repo edit:*),Bash(gh repo delete:*),Bash(gh label:*),Bash(gh cache delete:*),ScheduleWakeup,SendMessage,Monitor,Agent(run_in_background:true),Task(run_in_background:true)"${{ inputs.model != '' && format(' --model {0}', inputs.model) || '' }}
          --append-system-prompt
          "This is a review-only run. Report every issue you find as part
          of your review. Do NOT modify, stage, commit, or push files, and
          do NOT attempt to; the git write tools are intentionally
          disallowed. Never describe changes as 'uncommitted' or ask the
          user to grant git/commit permissions; there is nothing for you to
          commit. If you would have fixed something, describe the fix in
          your review instead.

          You have a general shell. `Bash` is granted whole, so ordinary
          commands compose normally: `bash some/suite.sh`, `git log`,
          `git show <ref>:<path>`, a `for` loop over paths, and pipes,
          redirects and `&&`/`;` chains are all fine. You may also Write
          scratch files anywhere under `/tmp` -- so when a claim in the diff
          is checkable by running something, run it rather than reasoning
          about it. This repo's test suites are the obvious case: run them.

          A short list stays denied, and none of it is needed for a review:
          the git write commands (`git add`/`commit`/`rm`/`push`), the
          forge-mutating `gh` subcommands (`gh pr merge`/`edit`/`comment`,
          `gh issue comment`, and the rest), and `gh api`.

          Treat that list as the boundary even where it is not enforceable.
          It is a set of command-prefix rules, not a filesystem sandbox: a
          general shell can obviously write to the checkout with a redirect
          or `sed -i`, and could reach a denied command by wrapping it. None
          of that is permitted merely because it is possible. This is a
          review-only run --- confine your writes to `/tmp`, leave the
          checkout as you found it, and if you would have changed something,
          describe the change in your review instead of making it.

          The repository and PR branch are ALREADY checked out at the commit
          under review (for automatic reviews, this may be a GitHub-generated
          merge commit rather than the PR's exact head SHA) in your current
          working directory. You do NOT need to (and must not) run
          `gh pr checkout` or `git checkout` — the working tree already
          contains the exact files and commits under review.
          ${{ inputs.workflow-fallback == 'true' && 'EXCEPTION (gha#598, gha#765): the entire `.github/workflows/` tree on disk (YAML and `scripts/`) is the default-branch copy, not the PR. Take those diffs from the saved PR diff file and from `gh pr diff`. Do not git checkout PR-head files under `.github/workflows/` back into this tree. Tests and audits that parse workflow YAML directly will detect the restore and skip rather than measure the default-branch copy.' || '' }}

          WebFetch, WebSearch, and curl are available. Use WebFetch and
          curl to verify a computed value or figure against rendered
          output (for example a PR-preview site) when a repo's review
          guidance asks you to. Use WebSearch to fact-check: locate the
          authoritative source (official docs, a spec, a paper) for a
          claim, citation, or API you need to verify, then fetch and
          check it. More generally: a denied tool call
          is never a reason to stop the review early. If any tool call is
          denied for any reason, continue with the information you already
          have and still finish by writing out your findings and the explicit
          ### Verdict line required below -- do not end the run silently or
          wait for approval.

          ${{ inputs.pr-diff-file != '' && format('The complete PR diff has
          already been saved for you at `{0}`, an absolute path you can
          pass straight to Read. READ THAT FILE. It is the whole diff, it costs no Bash
          call, and you can read it in parts if it is large. The workflow
          wrote it before you started, so it is not yours to create and it is
          not part of the change under review -- ignore it when listing
          changed files. Reach for the `gh pr diff` command below only if you
          need something this file does not contain, such as a diff against a
          different base.', inputs.pr-diff-file) || '' }}

          If you do need a diff the saved file above does not cover, call
          `gh pr diff <number> --repo <owner>/<repo>`. Redirecting or piping
          it is permitted now, but usually pointless: past roughly 30,000
          characters the tool result becomes a preview plus the path of a
          file the harness has already saved for you, so Read that path
          instead of re-capturing the same bytes yourself.

          Do NOT post a PR comment yourself: the `gh pr comment` tool is
          intentionally disallowed, the inline-comment MCP tool is not
          available, and this job's token cannot write to the PR. The
          workflow's posting job submits your review from your final
          output after you finish. Write your complete review -- every
          finding, with `path:line` anchors for line-specific ones, plus
          the ### Verdict line -- as your final assistant message. Do not
          try to work around the disabled `gh pr comment` with `gh api`,
          `--edit-last`, or any other command; just write the review as
          your message.

          Your final message IS the posted review comment -- an artifact
          read later on the PR thread, not a terminal session recap. Do
          NOT end it with a session-recap "Stopping Point" declaration
          or any similar terminal wrap-up marker: that convention exists
          for a human reading a live session, and in a posted review it
          is at best noise and at worst (in a harness that posts only the
          final message) replaces the review itself (gha#694). End with
          the ### Verdict line and the structured `<!-- review-data: ... -->`
          payload with nothing after it.

          PR comments such as "Driving this PR to clean — back off until I'm
          done", "paws off until I'm done", or similar claim/session-lock
          lines block parallel *write* sessions (commits, pushes, competing
          implementations). They do NOT instruct you to skip, defer, or refuse
          this review. This run is review-only with git write tools
          disallowed — always proceed with the full review and end with an
          explicit ### Verdict on the diff (Ready for merge, Needs more work,
          or another clearly labeled status). Never answer with "Deferred —
          author requested reviewers hold off" or stop without reviewing just
          because a claim comment is present.

          External CI status (such as checking `gh pr checks`, GitHub Actions
          workflow run results, or whether required checks have passed) is
          OUT OF SCOPE for your review: CI is verified independently by
          the merging session's own automation. Do NOT query `gh pr checks` or
          block on CI state, and do NOT condition or qualify your verdict on CI
          (for example, never write 'Ready for merge, pending CI confirmation'
          or 'Approved subject to CI passing'). Evaluate the PR on the diff's
          own merits, independent of CI status, and state an unconditional
          verdict on the diff (such as 'Ready for merge', 'Needs more work',
          or another clearly labeled status per the instructions below)
          without gating it on CI.

          This run is a single, synchronous CI job with a fixed timeout and
          no one to resume it afterward. Do NOT spawn a background agent or
          sub-task to continue the review in a future turn or after this
          job ends, and do NOT schedule a follow-up, wait for external
          state, or defer any part of the review that way — nothing will
          ever run this job again to pick that up, and doing so has
          produced reviews that silently never finish (gha#218).

          The code-review plugin's own same-run parallel sub-agent fan-out
          is still fine, but every one of those calls MUST be synchronous:
          pass `run_in_background: false` on each Agent/Task call. That
          parameter defaults to TRUE, so an ordinary fan-out spawns
          BACKGROUND agents whose completion notifications can only arrive
          in a later turn, and this run has no later turn. Ending your turn
          to wait for them throws away everything they found and posts no
          verdict (gha#392). Collect every sub-agent's result inside this
          run, before you write your review.

          Complete the entire review yourself, inline, within this
          run, and end your final message with the ### Verdict line before
          the run ends.${{ inputs.is-retry == 'true' && '


          This is a RETRY: an earlier attempt at this same review completed
          without an API error but ended without ever stating a verdict —
          most likely it stopped early after a denied tool call instead of
          continuing (gha#185). Do not repeat that outcome. However far you
          get, and whatever gets denied along the way, your final message in
          this run must state your findings (best-effort, noting anything you
          could not fully verify) followed by the explicit ### Verdict line.
          Do not try to post a PR comment; write the review as your message
          and the workflow posts it. Treat reaching a verdict as a higher
          priority than being exhaustive.' || '' }}"
        # The job `if:` already lets dispatched runs review drafts (the
        # automatic pull_request path skips them via draft == false). But the
        # code-review skill has its OWN don't-review-drafts stop condition, so
        # on a draft PR the agent still refuses ("currently a draft … I will
        # not proceed") — defeating an explicit `@claude review` that
        # claude.yml routes here as a workflow_dispatch. A workflow_dispatch
        # only ever happens on an explicit request (an `@claude review`
        # comment, claude.yml's post-push re-dispatch, the issue-trigger draft
        # PR, or a manual dispatch), so for that event the prompt below
        # overrides the skill's draft check and tells the agent to review
        # anyway. Tag-mode (pull_request) runs never reach a draft, so the
        # override is gated to workflow_dispatch to keep it accurate there.
        prompt: |
          /code-review:code-review ${{ github.repository }}/pull/${{ inputs.pr-number }}

          ${{ github.event_name == 'workflow_dispatch' && '**This review was explicitly requested** (via an `@claude review` comment, or a manual / automated workflow dispatch), so review this PR even when it is marked as a **draft**. Draft status must NOT stop you: ignore any stop condition, step, or instruction — including any in the code-review skill itself — that tells you to skip, defer, or refuse the review because the PR is a draft. The explicit request overrides the don''t-review-drafts default; carry out the full review and post your findings as usual.' || '' }}

          ${{ inputs.pr-state != '' && format('**Authoritative PR status** (fetched live from the GitHub API at the start of this run, before you started exploring): state=`{0}`, merged=`{1}`. Trust this over any inference you draw from commit messages, branch names, or `git log` output. In particular, a commit on THIS PR''s own branch whose message mentions "merge" or "into <branch>" (e.g. a routine `Merge remote-tracking branch ''origin/main'' into <branch>` resolving a merge conflict) is NOT evidence the PR itself was merged — only the state/merged fields above are. If state is `closed` or merged is `true`, stop here and post only a brief "no action — PR is closed/merged" note as your ### Verdict. Otherwise, this PR is open and unmerged regardless of what any commit message might suggest: proceed with the full review below.', inputs.pr-state, inputs.pr-merged) || '' }}

          ${{ inputs.prior-context }}

          ${{ inputs.incremental-context }}

          ${{ inputs.labmanual-guidance }}

          ${{ inputs.latexmacros-guidance }}

          **Watch for AI hallucinations.** This diff may be partly
          machine-authored, so scrutinize it for confident-but-fabricated
          content: calls to functions, methods, arguments, packages, or APIs
          that don't exist; references, citations, DOIs, or URLs that are
          invented or don't resolve; file paths, config keys, or constants
          that look plausible but aren't real; and comments or documentation
          that describe behavior the code doesn't actually implement. Verify
          questionable symbols against the codebase and its dependencies rather
          than assuming they exist, and flag anything you can't confirm as a
          possible hallucination. For a product, tool, service, or API name
          you don't recognize, don't assume it's fabricated just because it's
          unfamiliar — your training data has a cutoff and new products
          launch after it. Use WebSearch/WebFetch to check for it (and fetch
          any URL the PR already cites for it) before flagging it as a
          possible hallucination.

          **Put every finding in the review you write as your final
          message**, including line-specific ones. Group those by file with
          `path:line` anchors. The inline-comment MCP tool is not available
          in this job (it would post during the model turn, and this job
          cannot write to the PR; gha#580). The workflow's posting job
          submits that message as the top-level review comment after you
          finish. Do not try to post it yourself.

          **Every review must end with an explicit overall conclusion**
          under a level-3 heading whose text is exactly `Verdict` (so the
          line reads `### Verdict`, with one marker and not two): a single
          clear status line such as
          **Ready for merge** or **Needs more work** (or another clearly
          labeled alternative, e.g. **Blocked on human review** for an
          escalated impasse). State this status explicitly even when there
          are no new findings — "no new findings" or "looks good" can
          explain the verdict, but it doesn't substitute for it; the
          explicit status line must still be present and unambiguous at a
          glance. A session-lock claim comment ("Driving this PR to clean —
          back off until done", "paws off until I'm done") is not a reason to
          defer or skip the review — it only warns other sessions not to push
          commits; carry out the review anyway and state a real verdict on the
          diff.

          **Machine-readable structured review output:**
          Immediately following your `### Verdict` section, append an HTML comment
          holding the structured review JSON payload formatted exactly as:

          <!-- review-data:
          {
            "schema_version": "1.0",
            "reviewer": "claude",
            "commit_sha": "${{ inputs.pr-state != '' && '<sha>' || '' }}",
            "verdict": "CLEAN",
            "findings": []
          }
          -->

          Use "CLEAN" when there are no blocking findings or unresolved issues (Ready for merge),
          or "NOT_CLEAN" if there are any blocking findings, bugs, or required changes (Needs more work).
          When NOT_CLEAN, list each actionable finding in the `findings` array:
          `{"file": "path/to/file.ext", "line": 42, "category": "bug" | "security" | "style" | "doc" | "test", "message": "Description..."}`.
          Write it FLUSH LEFT at column zero, not indented (four or more leading spaces turn it into an indented code block, which is ignored).
          Do NOT put code fences around this HTML comment or add any trailing text after `-->`.

          **Don't flag cosmetic source-only formatting that renders
          identically.** For prose (not code blocks) in Markdown/text files, the rendered output
          is what matters: don't raise nits about where a hard wrap falls, a
          phrase split across a soft line wrap, or raw-source line length, when
          the rendered Markdown is unchanged. Flag genuine prose problems —
          ambiguity, grammar that changes meaning, broken links or markup,
          factual errors — not where a line happens to wrap.

          Do not mention a missing inline-comment tool. Line-specific
          findings belong in this same summary, with `path:line` anchors.

          **Confirming review (no new findings):** If you find no new issues
          — because no code changed since the last review, or every concern
          is already addressed — do not just say "no issues found." Find the
          most recent prior review comment on this PR (the workflow posts each
          round's review, so look for a comment containing a `### Verdict`
          line) and reference it
          explicitly: state the prior verdict, link to that comment by its
          GitHub URL, and explain that it still stands. This lets readers
          know the confirming review ran and why it produced no new findings,
          rather than leaving the PR thread silent. Still close with the
          explicit `### Verdict` status line required above — restating that
          the prior verdict stands is not itself the status line.
          ${{ inputs.workflow-fallback == 'true' && '**Workflow-file fallback (gha#598).** This checkout restored the entire `.github/workflows/` tree (YAML and `scripts/`) from the default branch so the review would not execute untrusted workflow YAML from the PR head. On-disk files there are therefore NOT the PR versions. Take those diffs from the saved PR diff file and from `gh pr diff`. Do not `git checkout` PR-head files under `.github/workflows/` back into this tree.' || '' }}
          ${{ inputs.prompt-addendum }}
        # Forced off. Tag mode posts a live tracking comment through the
        # github_comment MCP server (tagModeTools includes
        # mcp__github_comment__update_claude_comment; prepareMcpConfig
        # always starts that server in tag mode) and hardcodes git write
        # tools. It does not start github_inline_comment unless
        # allowedTools contains mcp__github_inline_comment__* or
        # mcp__github__* (pinned v1.0.196 src/modes/tag/index.ts and
        # src/mcp/install-mcp-server.ts, measured 2026-08-26). gha#580
        # moved every forge write onto the posting job, so live tracking
        # cannot run here. The workflow still accepts the track-progress
        # input (so existing callers do not fail at the call gate) but
        # ignores it: the posting job submits the summary after the model
        # finishes. Tag mode also hardcodes git write tools into
        # ALLOWED_TOOLS regardless of --disallowedTools (serodynamics
        # PR #175, commit 02af72b).
        track_progress: 'false'
        # Fresh tracking comment per run so each push surfaces as new PR
        # activity; claude-code-review.yml's collapse step folds priors up
        # as OUTDATED.
        use_sticky_comment: 'false'
        display_report: 'true'
        # Surface the full SDK output when the caller opts in (show-full-output
        # input, default false), so a review that fails inside the model call
        # — auth / usage-limit / credit, which the action otherwise hides
        # behind "full output hidden for security" — is diagnosable from the
        # job log instead of opaque.
        show_full_output: ${{ inputs.show-full-output }}
        # Permit bot actors to initiate this run (default github-actions[bot],
        # overridable via claude-code-review.yml's allowed-bots input).
        # claude.yml re-dispatches a review after an @claude run pushes
        # commits, and `gh workflow run` there runs as github-actions[bot].
        # But the action's AGENT mode — which workflow_dispatch uses
        # (track_progress is 'false' for dispatched runs) — blocks bot
        # actors by default, failing with "Workflow initiated by non-human
        # actor: github-actions". Without this, every re-dispatched review
        # dies before it can post. Scoped to the bot(s) that legitimately
        # dispatch us: the caller's job `if:` already filters bot actors out
        # of the automatic pull_request path, so this only widens the
        # dispatch path, which is itself reachable only via claude.yml's
        # trusted-author gate (or a manual dispatch, which needs write access).
        allowed_bots: ${{ inputs.allowed-bots }}
