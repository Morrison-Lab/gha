name: Generate altdoc multiversion landing page
description: >-
  Generate a root `index.html` redirect (plus `.nojekyll`) pointing at a
  docs subdirectory (e.g. dev/ or latest-tag/), for a gh-pages site that
  keeps versioned docs in subdirectories rather than at the root, and
  optionally a `404.html` that redirects retired version directories to
  their replacements. Shared internal helper for the
  altdoc-multiversion-docs reusable workflow -- ported from
  d-morrison/rpt's bespoke docs.yaml script.
inputs:
  target:
    description: >-
      Docs subdirectory the root page should redirect to (e.g. "dev" or
      "latest-tag"), without leading/trailing slashes.
    required: true
  output-dir:
    description: Directory to write the generated index.html/.nojekyll into.
    default: 'site-root'
  base-url:
    description: >-
      Override the docs base URL (e.g. "https://owner.github.io/repo/").
      Leave empty to derive it from GITHUB_REPOSITORY.
    default: ''
  legacy-paths:
    description: >-
      Retired docs subdirectories to redirect, as comma- or newline-separated
      `old=new` pairs (e.g. "main=dev"). Generates a site-root `404.html` that
      rewrites any request under `old/` to the same path under `new/`,
      including deep links. Leave empty (the default) to generate no
      `404.html`. Redirection requires JavaScript; without it the page renders
      as a plain not-found notice linking to the docs root.
    default: ''
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.x'

    # See generate-altdoc-version-dropdown/action.yml's identical step for
    # why this calls resolve_base_url.py directly via github.action_path
    # instead of nesting a `uses: ./...` step.
    - name: Resolve base URL
      id: base-url
      shell: bash
      env:
        DOCS_BASE_URL: ${{ inputs.base-url }}
      run: python3 "${{ github.action_path }}/../resolve-altdoc-base-url/resolve_base_url.py"

    - name: Generate landing page
      shell: bash
      env:
        LANDING_TARGET: ${{ inputs.target }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        DOCS_BASE_URL: ${{ steps.base-url.outputs.base-url }}
      run: python3 "$GITHUB_ACTION_PATH/generate_multiversion_landing_page.py"

    # Written into the same output directory as the landing page above, so it
    # is deployed by the caller's "Deploy root landing page" step. That step
    # runs with `clean: true` and a `clean-exclude` list that does not name
    # retired version directories, so a redirect written anywhere else would
    # be deleted on the next default-branch push.
    - name: Generate legacy-path redirects
      shell: bash
      env:
        LEGACY_PATHS: ${{ inputs.legacy-paths }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        DOCS_BASE_URL: ${{ steps.base-url.outputs.base-url }}
      run: python3 "$GITHUB_ACTION_PATH/generate_legacy_redirects.py"
