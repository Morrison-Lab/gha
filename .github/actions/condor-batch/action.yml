name: Run bundled steps on the cluster
description: >-
  Run several shell steps as one HTCondor job on a WWU CS cluster head,
  falling back to the runner when the cluster cannot be used.
inputs:
  steps:
    description: One shell command per line. Fewer than two are run on the runner.
    required: true
  head:
    description: >-
      Cluster head node, or a space- or comma-separated list of heads, each
      host or host:port (csci-lab-head.cs.wwu.edu:922): runs are spread over them and fall back to the next head that answers ssh.
      With more than one head (counting `fallback-head`), each is first asked for its idle jobs and for how
      many copies of the job fit in its unclaimed slots, and heads with more room than waiting jobs go first (gha#2093).
    default: cse-head.cluster.cs.wwu.edu
  fallback-head:
    description: >-
      Heads, in the same form as `head`, tried only after every `head` has
      failed to answer ssh or to start the job within `idle-minutes`. They
      are never chosen by the spreading, so a head whose queue is often long
      stays usable without delaying the runs that would start there (gha#2091).
      A fallback head that reports more room than waiting jobs still goes first (gha#2093).
    default: ''
  working-directory:
    description: Checkout to copy to the cluster.
    default: .
  image:
    description: >-
      Apptainer image on the cluster home to run every step in.
      Empty runs the steps directly on the execute node.
    default: ''
  image-file:
    description: >-
      Apptainer image file on the runner, used when the job lands on a CSCI
      desktop-pool head (csci-lab). It is copied to the head and transferred
      with the job, so nothing is read from the head's home. Empty runs the
      steps directly there.
    default: ''
  output:
    description: >-
      Path inside the checkout (such as _site) that the job returns, or
      several separated by commas (such as _site,_freeze; no spaces in a path).
      They come back through HTCondor file transfer and are unpacked at the
      same paths in the checkout. A path the job never made is skipped. Empty
      returns nothing.
    default: ''
  wait-minutes:
    description: >-
      Longest wait, in whole minutes, for the cluster job to end. A job that
      has not ended by then is removed and the steps run on the runner. Set it
      below the job's timeout-minutes, or the job timeout cancels the step
      before the fallback can run (gha#2037). Empty waits as long as the job
      takes.
    default: ''
  idle-minutes:
    description: >-
      Longest time, in whole minutes, the cluster job may sit idle in the
      queue. A job that has not started by then is removed and the steps run
      on the runner; a job that has started is left alone (gha#2085). Empty
      waits for the job to start as long as it takes.
    default: ''
  allow-local-fallback:
    description: >-
      'false' fails the step instead of running the steps on the runner when
      the cluster cannot be used. Render composites pass 'false': CI rendering
      on the self-hosted runners (cf463-01, cf463-02) and on Ezra's Mac is
      banned (gha#2108).
    default: 'true'
runs:
  using: composite
  steps:
    - name: Run steps
      shell: bash
      env:
        STEPS: ${{ inputs.steps }}
        CONDOR_HEAD: ${{ inputs.head }}
        CONDOR_FALLBACK_HEAD: ${{ inputs.fallback-head }}
        CONDOR_IMAGE: ${{ inputs.image }}
        CONDOR_IMAGE_FILE: ${{ inputs.image-file }}
        CONDOR_OUTPUT: ${{ inputs.output }}
        CONDOR_WAIT_MINUTES: ${{ inputs.wait-minutes }}
        CONDOR_IDLE_MINUTES: ${{ inputs.idle-minutes }}
        WORKDIR: ${{ inputs.working-directory }}
        ALLOW_LOCAL_FALLBACK: ${{ inputs.allow-local-fallback }}
        SCRIPT: ${{ github.action_path }}/../../../condor-batch/condor-batch.sh
        SLOT_SCRIPT: ${{ github.action_path }}/../../../scripts/with-render-slot.sh
      run: |
        set -uo pipefail
        steps_file="$RUNNER_TEMP/condor-steps.txt"
        printf '%s\n' "$STEPS" > "$steps_file"
        run_local() {
          if [ "${ALLOW_LOCAL_FALLBACK:-true}" = "false" ]; then
            echo "::error::not running the steps on the runner ($1): CI rendering on self-hosted runners is banned (gha#2108)"
            exit 1
          fi
          echo "::notice::running the steps on the runner: $1"
          # Steps sent to the cluster are the heavy ones, so a fallback takes
          # one of the host's render slots and holds it until this shell exits
          # (gha#2062).
          # shellcheck source=/dev/null
          source "$SLOT_SCRIPT" && acquire_render_slot
          cd "$WORKDIR"
          while IFS= read -r cmd <&3; do
            [ -n "${cmd//[[:space:]]/}" ] || continue
            bash -c "$cmd" < /dev/null || exit $?
          done 3< "$steps_file"
        }
        key="${CONDOR_SSH_KEY:-$HOME/.ssh/id_ed25519_condor}"
        [ -r "$key" ] || { run_local "no cluster key on this runner"; exit $?; }
        rc=0
        bash "$SCRIPT" "$WORKDIR" "$steps_file" || rc=$?
        case "$rc" in
          71) run_local "too few steps to bundle"; exit $? ;;
          70) run_local "the cluster job did not run normally"; exit $? ;;
          *) exit "$rc" ;;
        esac
