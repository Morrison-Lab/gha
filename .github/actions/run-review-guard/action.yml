name: Run review guard
description: >-
  Runs claude-code-review.yml's check-review-execution.sh guard script,
  located via github.action_path rather than a separate checkout resolved
  from github.job_workflow_ref. That resolution came back empty at runtime
  on real consumer runs even though the calling step passed it correctly
  (gha#196) — a composite action's own files are always reachable via
  github.action_path regardless of how the calling reusable workflow was
  invoked (workflow_call, a re-dispatched workflow_dispatch, automatic
  pull_request, ...), the same reasoning parse-workflow-ref itself relies on.

inputs:
  execution-file:
    description: Path to the claude-code-action execution-output file to check.
    required: true

outputs:
  quota_exhausted:
    description: >-
      'true' when the run was skipped because the API rejected the request
      before Claude did any work (quota exhaustion, auth failure, or similar
      pre-processing rejection).
    value: ${{ steps.run.outputs.quota_exhausted }}
  quota_reason:
    description: >-
      Which quota case set quota_exhausted (gha#804): `rejected-at-door`
      (the zero-cost, turn-1 rejection above) or `midrun-429` (the API
      returned 429 after real turns; gha#520). Written beside
      quota_exhausted on exactly those two exits and on no other, so empty
      means the run did not skip for quota. A composite's step outputs are
      invisible to its caller unless re-declared here; the first draft of
      gha#804 omitted this block and the feature was inert for both cases.
    value: ${{ steps.run.outputs.quota_reason }}
  quota_message:
    description: >-
      The API's own result message on a quota skip, collapsed to one line
      and passed through the same credential redaction as denied_tools,
      since it reaches a PR comment (gha#804). Empty when the result
      carried none. Free text: a caller reads it through env:, never
      through an expression in a run: body.
    value: ${{ steps.run.outputs.quota_message }}
  review_text_file:
    description: Path to the extracted verdict-bearing review text, when the review completed cleanly.
    value: ${{ steps.run.outputs.review_text_file }}
  stub_review:
    description: >-
      'true' when the run completed without an SDK-level error but produced
      no verdict line — the retryable "stub review" signature (gha#185). The
      caller can use this to retry once instead of failing outright.
    value: ${{ steps.run.outputs.stub_review }}
  total_cost_usd:
    description: >-
      This attempt's total_cost_usd from the execution output, when present
      (gha#219) — set regardless of whether the attempt succeeded, was a
      quota skip, or was a stub, since cost is incurred either way.
    value: ${{ steps.run.outputs.total_cost_usd }}
  denials:
    description: >-
      The permission_denials_count from the execution result (or sentinel
      999999 if missing/unparseable).
    value: ${{ steps.run.outputs.denials }}
  max_denials:
    description: >-
      The stub-retry threshold this run actually compared its denial count
      against (STUB_RETRY_MAX_DENIALS, default 5). Emitted so a caller quoting
      the threshold in a report cannot restate a default that was overridden.
    value: ${{ steps.run.outputs.max_denials }}
  failure_kind:
    description: >-
      Which failure this attempt hit, on every path that exits non-zero:
      `short-circuit`, `hard-error`, `no-output`, `stub`, `high-denial`, or
      `deferred`. Per-attempt, like `stub_review` and `action_short_circuit`
      beside it -- deciding which attempt's kind stands is the caller's job
      (gha#543).
    value: ${{ steps.run.outputs.failure_kind }}
  denied_tools:
    description: >-
      Single-line summary of WHICH tools were denied, in the same wording
      gha#544 added to the job log ("Taskx6 Bashx3 (sample: ...)"), or one of
      the two wordings meaning the names could not be recovered.

      Written once the execution result has been parsed, which is BEFORE every
      exit that reports on a review -- so a caller gated on this step having
      FAILED can still read it (gha#543). It is NOT written on the two
      short-circuit exits (no execution file, no result object), which return
      before the denial count is computed; there is no denial data to report on
      those, since nothing about the run was ever parsed.

      So empty is two facts, not one: the run had zero denials, or the run
      short-circuited before anything could be counted. `denials` separates
      them -- it is `0` in the first case and absent in the second -- and a
      caller must branch on both rather than reading empty as "no denials"
      (gha#548 review, finding 8).
    value: ${{ steps.run.outputs.denied_tools }}
  action_short_circuit:
    description: >-
      'true' when the run failed because the action short-circuited before
      writing an execution result (missing execution file or missing result
      object in output; gha#368).
    value: ${{ steps.run.outputs.action_short_circuit }}
  no_execution_file:
    description: >-
      'true' when no execution-output file was created by the action (gha#368).
    value: ${{ steps.run.outputs.no_execution_file }}
  no_result:
    description: >-
      'true' when the execution-output file contains no result object (gha#368).
    value: ${{ steps.run.outputs.no_result }}

runs:
  using: composite
  steps:
    - name: Run check-review-execution.sh
      id: run
      shell: bash
      env:
        EXECUTION_FILE: ${{ inputs.execution-file }}
      # check-review-execution.sh lives in ../../workflows/scripts/ relative
      # to this action's own directory — two levels up (out of
      # run-review-guard/, out of actions/) lands at .github/, then down into
      # workflows/scripts/.
      run: bash "${{ github.action_path }}/../../workflows/scripts/check-review-execution.sh" "$EXECUTION_FILE"
