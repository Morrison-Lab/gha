name: Check page length (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for the job. Use a self-hosted label only for a
          private repository; never for a public one, whose pull requests
          can run arbitrary code on it.
        type: string
        default: ''
      python-version:
        description: Python version to set up.
        type: string
        default: '3.x'
      whole-tree:
        description: >-
          Scan every tracked file the globs match, in full, instead of only the
          lines a pull request adds. Use it to measure a corpus.
        type: boolean
        default: false
      globs:
        description: >-
          Space-separated git pathspecs of tracked files to check (recursive
          by default).
        type: string
        default: '*.qmd'
      paths-ignore:
        description: >-
          Comma/newline-separated glob patterns (relative paths) to skip.
        type: string
        default: ''
      max-math:
        description: Largest number of math expressions a page may have.
        type: string
        default: '600'
      max-lines:
        description: Largest number of source lines a page may have, includes expanded.
        type: string
        default: '5000'
      fail:
        description: >-
          Fail the workflow when a touched page is over a limit
          (else non-blocking). Defaults to false (warning annotations only).
        type: boolean
        default: false

jobs:
  check-page-length:
    runs-on: ${{ inputs.runs-on || (github.event.repository.private && vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so PR runs can diff added lines against the base.
          fetch-depth: 0

      - name: Check page length
        uses: Morrison-Lab/gha/check-page-length@v3
        with:
          python-version: ${{ inputs.python-version }}
          whole-tree: ${{ inputs.whole-tree }}
          globs: ${{ inputs.globs }}
          paths-ignore: ${{ inputs.paths-ignore }}
          max-math: ${{ inputs.max-math }}
          max-lines: ${{ inputs.max-lines }}
          fail: ${{ inputs.fail }}
          # On PRs, check only lines added relative to the base; otherwise
          # (push) there is no base to diff against, so the check is skipped.
          # On pull_request, HEAD is GitHub's merge ref and HEAD^1 is the base tip
          # it was built on. The payload's pull_request.base.sha can lag that tip,
          # counting the base's newer commits as added by the PR (gha#1007).
          base-ref: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
