name: Request Dependabot PR Review

# Dogfoods request-dependabot-review.yml against this repo's own Dependabot
# PRs (see #252). Uses a local `./` ref rather than `@v2` because the tag
# hasn't been advanced to include this brand-new workflow yet (see
# CLAUDE.md, "About this repo") — the same local-ref convention
# `_selftest.yml` uses for pre-release capabilities.
#
# Note: request-dependabot-review.yml's own internal step still references
# its build-reviewer-args composite via `d-morrison/gha/...@v2` (matching
# test-coverage.yml/bump-submodule.yml's precedent for internal composite
# refs), so this dogfood workflow won't fully succeed on a real Dependabot
# PR here until @v2 is advanced past this PR's merge.

on:
  pull_request:
    types: [opened]

jobs:
  request-review:
    permissions:
      pull-requests: write
    uses: ./.github/workflows/request-dependabot-review.yml
    with:
      reviewers: d-morrison
