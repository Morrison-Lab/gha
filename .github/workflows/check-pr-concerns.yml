name: Check pull request concerns (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for the job. Use a self-hosted label only for a
          private repository; never for a public one, whose pull requests
          can run arbitrary code on it.
        type: string
        default: ubuntu-latest
      python-version:
        description: Python version to set up.
        type: string
        default: '3.x'
      content-paths:
        description: Comma/newline-separated globs for content; empty uses the defaults.
        type: string
        default: ''
      infra-paths:
        description: Comma/newline-separated globs for infrastructure; empty uses the defaults.
        type: string
        default: ''
      paths-ignore:
        description: Comma/newline-separated globs counted as neither.
        type: string
        default: ''
      exempt-label:
        description: >-
          Label that lifts the check. Read live through the API, so a label
          added after the run started still counts on a re-run.
        type: string
        default: mixed-ok
      fail:
        description: >-
          Fail the workflow when the PR mixes content and infrastructure
          (else non-blocking). Defaults to true.
        type: boolean
        default: true

jobs:
  check-pr-concerns:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so PR runs can diff against the base.
          fetch-depth: 0

      - name: Read the exemption label
        id: label
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ inputs.exempt-label }}
        run: |
          set -euo pipefail
          labels=$(gh api --paginate "repos/$REPO/issues/$PR/labels" --jq '.[].name')
          if printf '%s\n' "$labels" | grep -Fxiq -- "$LABEL"; then
            echo "exempt=true" >> "$GITHUB_OUTPUT"
          else
            echo "exempt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check pull request concerns
        uses: Morrison-Lab/gha/check-pr-concerns@v3
        with:
          python-version: ${{ inputs.python-version }}
          content-paths: ${{ inputs.content-paths }}
          infra-paths: ${{ inputs.infra-paths }}
          paths-ignore: ${{ inputs.paths-ignore }}
          exempt: ${{ steps.label.outputs.exempt || 'false' }}
          fail: ${{ inputs.fail }}
          # On pull_request, HEAD is GitHub's merge ref and HEAD^1 is the base tip
          # it was built on (gha#1007). On a push there is no base, so it skips.
          base-ref: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
