name: Check term links at first use (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for the job. Use a self-hosted label only for a
          private repository; never for a public one, whose pull requests
          can run arbitrary code on it.
        type: string
        default: ''
      python-version:
        description: Python version to set up.
        type: string
        default: '3.x'
      whole-tree:
        description: >-
          Report every finding in every tracked file the globs match, instead
          of only those on lines a pull request adds. Use it to measure a corpus.
        type: boolean
        default: false
      globs:
        description: >-
          Space-separated git pathspecs of tracked files to check (recursive
          by default).
        type: string
        default: '*.qmd'
      paths-ignore:
        description: >-
          Comma/newline-separated glob patterns (relative paths) to skip.
        type: string
        default: ''
      terms-file:
        description: >-
          Path to a file of extra technical terms, one per line.
        type: string
        default: ''
      terms-from:
        description: >-
          Space-separated `owner/repo` names of prerequisite sites (for example
          `Morrison-Lab/mds Morrison-Lab/pds Morrison-Lab/sds`). Each is cloned
          shallowly and its definitions make its terms known here (gha#1462).
          Left empty, it defaults to the sites before the calling repository in
          the course sequence (mds, pds, sds, lds; gha#1503), and to none for any
          other repository. Pass `none` to turn the default off.
          A private repository needs the `terms-from-token` secret.
        type: string
        default: ''
      allow-file:
        description: >-
          Path to a file of terms to leave alone, one per line.
        type: string
        default: ''
      fail:
        description: >-
          Fail the workflow when a finding is reported (else non-blocking).
          Defaults to true; false reports warning annotations only.
        type: boolean
        default: true

    secrets:
      WORKFLOW_TOKEN:
        description: Optional GitHub token with read access to private `terms-from` repositories.
        required: false

jobs:
  check-term-links:
    runs-on: ${{ inputs.runs-on || (github.event.repository.private && vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so PR runs can diff added lines against the base.
          fetch-depth: 0

      - name: Fetch prerequisite sites for their terms
        id: terms-from
        shell: bash
        env:
          TERMS_FROM: ${{ inputs.terms-from }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # Default: the sites before this one in the course sequence
          # (ai-config shared/writing/course-sequence.md).
          explicit=true
          if [ -z "$TERMS_FROM" ]; then
            explicit=false
            repo_lc=$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')
            case "$repo_lc" in
              morrison-lab/pds | morrison-lab/cds | morrison-lab/mcs) TERMS_FROM="Morrison-Lab/mds" ;;
              morrison-lab/sds | morrison-lab/ids) TERMS_FROM="Morrison-Lab/mds Morrison-Lab/pds" ;;
              morrison-lab/lds | morrison-lab/rme) TERMS_FROM="Morrison-Lab/mds Morrison-Lab/pds Morrison-Lab/sds" ;;
              # dds (deep learning) builds on lds; lds is private, so without
              # WORKFLOW_TOKEN its clone only warns, and mds, pds, and sds still load (gha#1523).
              morrison-lab/mlg | morrison-lab/dds) TERMS_FROM="Morrison-Lab/mds Morrison-Lab/pds Morrison-Lab/sds Morrison-Lab/lds" ;;
              *) TERMS_FROM="" ;;
            esac
          fi
          if [ "$TERMS_FROM" = "none" ]; then
            TERMS_FROM=""
          fi
          dirs=""
          for repo in $TERMS_FROM; do
            dest="$RUNNER_TEMP/terms-from/${repo//\//__}"
            url="https://x-access-token:${GH_TOKEN}@github.com/${repo}.git"
            if git clone --quiet --depth 1 "$url" "$dest"; then
              rm -rf "$dest/.git"
              dirs="$dirs $dest"
            elif [ "$explicit" = true ]; then
              exit 1
            else
              # A defaulted site the token cannot read (a private repository)
              # must not turn a previously green job red.
              echo "::warning::Could not clone ${repo} for its terms; pass WORKFLOW_TOKEN or set terms-from: none."
            fi
          done
          echo "dirs=${dirs# }" >> "$GITHUB_OUTPUT"

      - name: Check term links at first use
        uses: Morrison-Lab/gha/check-term-links@v3
        with:
          terms-dirs: ${{ steps.terms-from.outputs.dirs }}
          python-version: ${{ inputs.python-version }}
          whole-tree: ${{ inputs.whole-tree }}
          globs: ${{ inputs.globs }}
          paths-ignore: ${{ inputs.paths-ignore }}
          terms-file: ${{ inputs.terms-file }}
          allow-file: ${{ inputs.allow-file }}
          fail: ${{ inputs.fail }}
          # On pull_request, HEAD is GitHub's merge ref and HEAD^1 is the base tip
          # it was built on. The payload's pull_request.base.sha can lag that tip,
          # counting the base's newer commits as added by the PR (gha#1007).
          # On a push there is no base, so the check skips.
          base-ref: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
