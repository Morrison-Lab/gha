name: Check exercises end with a task (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to set up.
        type: string
        default: '3.x'
      whole-tree:
        description: >-
          Scan every tracked file the globs match, in full, instead of only
          the exercises a pull request touches. Use it to measure a corpus.
        type: boolean
        default: false
      globs:
        description: >-
          Space-separated git pathspecs of tracked files to check (recursive
          by default).
        type: string
        default: '*.qmd'
      fail:
        description: >-
          Fail the workflow when an exercise does not end with a task.
          Defaults to true; false gives warning annotations only.
        type: boolean
        default: true

jobs:
  check-exercise-ends-with-task:
    runs-on: ${{ (github.event.repository.private && vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so PR runs can diff added lines against the base.
          fetch-depth: 0

      - name: Check exercises end with a task
        uses: Morrison-Lab/gha/check-exercise-ends-with-task@v3
        with:
          python-version: ${{ inputs.python-version }}
          whole-tree: ${{ inputs.whole-tree }}
          globs: ${{ inputs.globs }}
          fail: ${{ inputs.fail }}
          # On PRs, check only exercises with a line added relative to the base;
          # otherwise (push) there is no base to diff against, so the check is
          # skipped. On pull_request, HEAD is GitHub's merge ref and HEAD^1 is
          # the base tip it was built on (gha#1007).
          base-ref: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
