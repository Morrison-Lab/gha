name: Check Formatting (reusable)

# Derived from IndrajeetPatil/workflows check-formatting.yaml (MIT).
# https://github.com/IndrajeetPatil/workflows/blob/main/.github/workflows/check-formatting.yaml

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for the job. Use a self-hosted label only for a
          private repository; never for a public one, whose pull requests
          can run arbitrary code on it.
        type: string
        default: ubuntu-latest
      version:
        description: >-
          Air release to install via posit-dev/setup-air (for example `0.11.0`).
          Pin a release rather than `latest`.
        type: string
        default: '0.11.0'
      path:
        description: >-
          Path to format, relative to the repository root. Passed after
          `--` to `air format --check -- <path>`.
        type: string
        default: '.'

jobs:
  check-formatting:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check R formatting
        uses: Morrison-Lab/gha/check-formatting@v3
        with:
          version: ${{ inputs.version }}
          path: ${{ inputs.path }}
