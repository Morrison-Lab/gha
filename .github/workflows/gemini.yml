name: Gemini CLI (reusable)

# Agent-mode Gemini CLI workflow. Responds to "@gemini" or "@gemini-cli"
# mentions in issues, issue comments, PR review comments, and PR reviews. Also
# runs unattended on workflow_dispatch/schedule events.
#
# The caller stub (see examples/gemini.yml) holds the `on:` triggers; this
# reusable workflow inherits the caller's event context. Requires the
# GEMINI_API_KEY secret.
#
# Mirrors claude.yml's shape where the two overlap: the same detect-bot-mention
# gate (so a mention quoted in a code block or blockquote doesn't spend a run),
# the same detect-review-request routing (an `@gemini review` dispatches the
# dedicated reviewer instead of self-reviewing), and the same `--ref` handling
# on that dispatch (#285).

on:
  workflow_call:
    inputs:
      setup-r:
        description: Install R before running Gemini CLI.
        type: boolean
        default: true
      install-quarto:
        description: Install Quarto so Gemini CLI can render .qmd files.
        type: boolean
        default: false
      apt-packages:
        description: Extra apt packages to install before setup.
        type: string
        default: ''
      pip-packages:
        description: Python packages to install with pip3.
        type: string
        default: ''
      checkout-submodules:
        description: Check out git submodules.
        type: boolean
        default: false
      prompt-addendum:
        description: Extra prompt instructions appended to Gemini CLI prompt.
        type: string
        default: ''
      gemini-model:
        description: Model override passed to run-gemini-cli (e.g. gemini-2.5-flash).
        type: string
        default: 'gemini-2.5-flash'
      review-workflow-file:
        description: >-
          Workflow file (in the caller repo) dispatched on `@gemini review`
          mentions. Defaults to the name examples/gemini-code-review.yml is
          copied to, mirroring claude.yml's own review-workflow-file default.
        type: string
        default: 'gemini-code-review.yml'
    secrets:
      GEMINI_API_KEY:
        required: false
      SUBMODULES_TOKEN:
        required: false

jobs:
  gemini:
    # Only trigger for trusted authors (OWNER / MEMBER / COLLABORATOR) on the
    # four reactive events. Each association check is scoped to the event it
    # belongs to, which is load-bearing rather than tidiness: an
    # `issue_comment` payload carries BOTH `comment.author_association` (the
    # commenter) and `issue.author_association` (whoever opened the issue), so
    # an un-scoped `||` chain passes whenever the *thread* was opened by a
    # trusted author, regardless of who is commenting. Any untrusted user
    # commenting `@gemini` on an OWNER-opened issue would then start a
    # write-scoped LLM run. Same gate, and same reasoning, as claude.yml.
    #
    # workflow_dispatch/schedule have no body or author_association to gate
    # on and need none: workflow_dispatch requires repo write access, and a
    # cron trigger has no actor at all --- it exists only because someone with
    # write access committed its config to the default branch (gha#245).
    if: |
      (github.event_name == 'issue_comment' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'

    # Serialize sessions per issue/PR so rapid mentions don't fire competing
    # runs racing to push the same branch. `cancel-in-progress: false` queues
    # a new mention behind the running session rather than killing it, and
    # `|| github.run_id` keeps an unexpected event with no issue/PR number
    # from collapsing the group and serializing every session globally.
    concurrency:
      group: gemini-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false

    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    steps:
      - name: Detect genuine @gemini or @gemini-cli mention
        id: detect-mention
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        uses: Morrison-Lab/gha/.github/actions/detect-bot-mention@v2
        with:
          comment-body: ${{ github.event.comment.body || '' }}
          review-body: ${{ github.event.review.body || '' }}
          issue-body: ${{ github.event.issue.body || '' }}
          issue-title: ${{ github.event.issue.title || '' }}
          bot-name: '@gemini,@gemini-cli'

      - name: Detect @gemini review request
        id: detect-review
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        uses: Morrison-Lab/gha/.github/actions/detect-review-request@v2
        with:
          comment-body: ${{ github.event.comment.body || '' }}
          review-body: ${{ github.event.review.body || '' }}
          bot-name: '@gemini,@gemini-cli'

      # An `@gemini review` routes to the dedicated reviewer rather than being
      # answered by the agent, so this step and the gate below are ordered:
      # dispatch first, then skip the agent for the rest of the job.
      # `github.event.issue.pull_request` is present only when the issue IS a
      # PR, so it is what separates an `@gemini review` on a pull request from
      # the same words on a plain issue. Without it the `gh api .../pulls/N`
      # below 404s on a normal issue and, under `set -euo pipefail`, fails the
      # whole job over a request that was simply not about a PR.
      - name: Dispatch review workflow if @gemini review was requested
        if: >-
          steps.detect-mention.outputs.match != 'false' &&
          steps.detect-review.outputs.match == 'true' &&
          (github.event.issue.pull_request || github.event.pull_request.number)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REVIEW_WF: ${{ inputs.review-workflow-file }}
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ]; then
            echo "::warning::No PR number on this event; skipping $REVIEW_WF dispatch."
            exit 0
          fi
          # Belt and braces: the step `if:` above already establishes this is a
          # PR, but a lookup failure here should degrade to a warning rather
          # than redden the job, since the mention itself was legitimate.
          if ! PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER" 2>/dev/null); then
            echo "::warning::Could not read PR #$PR_NUMBER; skipping $REVIEW_WF dispatch."
            exit 0
          fi
          # PR_JSON came from the lookup above. --ref pins the dispatched run's
          # check-runs to the PR's head branch instead of the default branch
          # that workflow_dispatch falls back to when no ref is given (#285).
          PR_BRANCH=$(jq -r '.head.ref' <<< "$PR_JSON")
          PR_HEAD_REPO=$(jq -r '.head.repo.full_name' <<< "$PR_JSON")
          # A fork PR's head branch only exists in the fork, not in $REPO, so
          # --ref would fail to resolve there (#289). Fall back to no --ref for
          # fork PRs; the check-run then mis-attributes to the default branch,
          # the lesser problem.
          REF_ARGS=(--ref "$PR_BRANCH")
          if [ "$PR_HEAD_REPO" != "$REPO" ]; then
            echo "::notice::PR #$PR_NUMBER is from a fork ($PR_HEAD_REPO); dispatching $REVIEW_WF without --ref."
            REF_ARGS=()
          fi
          echo "Dispatching $REVIEW_WF for PR #$PR_NUMBER ($PR_BRANCH)."
          gh workflow run "$REVIEW_WF" --repo "$REPO" "${REF_ARGS[@]}" -f pr_number="$PR_NUMBER"

      # A step's `exit 0` ends only that step, never the job, so a "skip" step
      # that just echoes and exits leaves every later step running anyway.
      # Compute the decision once here and gate each later step on it, the same
      # way claude.yml gates on its own `steps.gate.outputs.skip`.
      - name: Decide whether the agent should run
        id: gate
        env:
          MENTION_MATCH: ${{ steps.detect-mention.outputs.match }}
          REVIEW_MATCH: ${{ steps.detect-review.outputs.match }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$MENTION_MATCH" = "false" ]; then
            echo "No genuine @gemini mention outside code blocks or quotes; skipping the agent."
            skip=true
          elif [ "$REVIEW_MATCH" = "true" ]; then
            echo "Handled as a review dispatch; skipping the agent."
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ inputs.checkout-submodules }}
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      # Passed via env rather than inlined into the script, so a caller's value
      # is a shell word list and never interpreted as script.
      - name: Install system apt packages
        if: steps.gate.outputs.skip != 'true' && inputs.apt-packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          set -euo pipefail
          sudo apt-get update
          # Unquoted on purpose: the input is a space-separated package list.
          # shellcheck disable=SC2086
          sudo apt-get install -y $APT_PACKAGES

      - name: Set up Python pip packages
        if: steps.gate.outputs.skip != 'true' && inputs.pip-packages != ''
        env:
          PIP_PACKAGES: ${{ inputs.pip-packages }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          pip3 install --break-system-packages $PIP_PACKAGES

      - name: Set up R
        if: steps.gate.outputs.skip != 'true' && inputs.setup-r
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          use-public-rspm: true

      - name: Set up Quarto
        if: steps.gate.outputs.skip != 'true' && inputs.install-quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      # Pinned to a release SHA per README's "Pinning third-party actions".
      # Note the tag: run-gemini-cli publishes v0 / v0.1.x, with no v1 tag at
      # all, so a `@v1` ref fails to resolve and the step never runs.
      - name: Run Gemini CLI
        if: steps.gate.outputs.skip != 'true'
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ inputs.gemini-model }}
          prompt: |
            ${{ inputs.prompt-addendum }}
            Address the requested changes or instructions for this issue or PR.
