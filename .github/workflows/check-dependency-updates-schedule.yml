name: Check Dependency Updates Schedule

# Scheduled automated dependency freshness audit for Morrison-Lab/gha.
# Mines upstream releases for recent updates, security fixes, and features
# across pinned third-party actions and tools, and surfaces high-value
# opportunities as tracked issues.

on:
  schedule:
    - cron: '0 14 * * 1' # Weekly on Monday at 14:00 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run audit and output to step summary without creating issues
        type: boolean
        default: false
      max-issues:
        description: Maximum number of opportunity/to-do issues to file
        type: number
        default: 5

jobs:
  audit:
    # timeout-minutes is defined in the reusable workflow
    permissions:
      contents: read
      issues: write
    uses: Morrison-Lab/gha/.github/workflows/check-dependency-updates.yml@v3
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      dry-run: ${{ inputs.dry-run || false }}
      max-issues: ${{ inputs.max-issues || 5 }}
