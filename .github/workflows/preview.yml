name: Quarto Preview Build (reusable)

# Build half of the PR-preview family. Runs read-only in the (possibly fork)
# PR context and uploads the rendered site + PR metadata as an artifact; the
# deploy half (preview-deploy.yml) picks that up in the base-repo context via
# workflow_run and publishes to gh-pages. Keeping the two halves split is the
# trust boundary — never collapse them into one privileged job.
#
# The caller stub (see examples/preview.yml) owns the `on: pull_request:`
# triggers (types + paths); this reusable workflow inherits the caller's event
# context.

on:
  workflow_call:
    inputs:
      path:
        description: >-
          Path (relative to the caller repo root) to the Quarto project to
          render: the directory containing _quarto.yml. Defaults to the repo
          root. Set it when the site lives in a subdirectory (matches
          quarto-publish's `path`).
        type: string
        default: '.'
      r-version:
        description: R version to install with r-lib/actions/setup-r.
        type: string
        default: '4.6.0'
      apt-packages:
        description: >-
          System (apt) packages to install before R/Quarto setup, space-separated.
          Defaults to the shared renv stack plus the preview build helpers; set
          to an empty string to skip the apt step.
        type: string
        default: >-
          jags libcurl4-openssl-dev libpng-dev libfontconfig1-dev libjpeg-dev
          libglpk-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libtiff5-dev
          libwebp-dev libnode109 cmake libgit2-dev libnode-dev libx11-dev pandoc
      use-renv:
        description: Restore R dependencies with renv. Set false for non-renv repos.
        type: boolean
        default: true
      r-packages:
        description: R packages to install when use-renv is false, space-, comma-, or newline-separated.
        type: string
        default: ''
      install-package:
        description: Run `R CMD INSTALL <path>` to install the caller repo as a local package before rendering.
        type: boolean
        default: true
      setup-chrome:
        description: Install Chrome (needed by Quarto for revealjs / screenshot rendering).
        type: boolean
        default: true
      tinytex:
        description: Install TinyTeX (and PDF render dependencies) before rendering.
        type: boolean
        default: false
      submodules:
        description: Passed to actions/checkout `submodules` ('recursive', 'true', or 'false').
        type: string
        default: 'recursive'
      render-profile:
        description: Quarto `--profile` to render with.
        type: string
        default: 'website'
      output-dir:
        description: Directory the rendered site is written to, relative to `path`. Defaults to `_site`.
        type: string
        default: '_site'
      formats:
        description: Space-separated list of formats to render (e.g. 'html docx pdf revealjs'), or 'default' for bare render.
        type: string
        default: ''
      extra-preview-labels:
        description: >-
          JSON array string of additional PR label names that trigger a preview
          re-render on add or remove (e.g. '["preview:tracked-changes"]'), beyond
          the built-in set ('clear freezer', 'preview:pdf', 'preview:docx', 'preview:revealjs').
        type: string
        default: '[]'
      fail-on-render-warning:
        description: Fail the build if Quarto emits any render warnings (WARN in the render log).
        type: boolean
        default: false
      forbid-log-patterns:
        description: Newline-separated fixed string patterns that will fail the build if found in the Quarto render log.
        type: string
        default: ''
      detect-changed-chapters:
        description: >-
          Compare this run's render against the copy published on the deployed
          branch and expose which chapters differ as workflow outputs. Implied
          by changed-chapters-banner.
        type: boolean
        default: false
      changed-chapters-banner:
        description: Add a banner to the preview home page naming the chapters that differ from the published render.
        type: boolean
        default: false
      changed-chapters-glob:
        description: Glob, relative to the rendered site root, selecting the files the comparison treats as chapters.
        type: string
        default: 'chapters/*.html'
      deployed-branch:
        description: Branch holding the published render to compare against.
        type: string
        default: 'gh-pages'
      deployed-subdir:
        description: Path prefix, within the deployed branch, at which the published site root lives.
        type: string
        default: ''
      changed-chapters-normalize-patterns:
        description: >-
          Newline-separated regexes whose matches are blanked before comparison,
          in addition to the built-in ones (htmlwidget element ids and ISO-8601
          datetimes).
        type: string
        default: ''
      banner-index:
        description: Home page the banner is inserted into, relative to the rendered site root.
        type: string
        default: 'index.html'
      docx-tracked-changes:
        description: Generate Word DOCX documents with tracked changes against the published version on the deployed branch.
        type: boolean
        default: false
      docx-tracked-changes-glob:
        description: Glob, relative to the rendered site root, selecting the DOCX files to generate tracked changes for.
        type: string
        default: 'chapters/*.docx'
    outputs:
      changed-chapters:
        description: JSON array of chapter ids that differ from the published render.
        value: ${{ jobs.build.outputs.changed-chapters }}
      any-changed:
        description: '`true` when at least one chapter differs, `false` otherwise.'
        value: ${{ jobs.build.outputs.any-changed }}
      detection-status:
        description: '`compared` or `skipped`; an empty changed-chapters means nothing changed only under `compared`.'
        value: ${{ jobs.build.outputs.detection-status }}
      skip-reason:
        description: Why the comparison was skipped; empty when it ran.
        value: ${{ jobs.build.outputs.skip-reason }}
      docx-status:
        description: '`generated` or `skipped`; an empty docx-tracked-changes-files means nothing changed only under `generated`.'
        value: ${{ jobs.build.outputs.docx-status }}
      docx-skip-reason:
        description: Why DOCX tracked changes generation was skipped; empty when it ran.
        value: ${{ jobs.build.outputs.docx-skip-reason }}
      docx-tracked-changes-files:
        description: JSON array of generated tracked changes DOCX file paths relative to the site root.
        value: ${{ jobs.build.outputs.docx-tracked-changes-files }}
      any-docx-changed:
        description: '`true` when at least one DOCX file differs from published render, `false` otherwise.'
        value: ${{ jobs.build.outputs.any-docx-changed }}

jobs:
  build:
    # Run for all events except label add/remove events for labels other than the recognized preview labels,
    # so an unrelated label add or remove doesn't spin up a (useless) build.
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      contains(fromJSON('["clear freezer", "preview:pdf", "preview:docx", "preview:revealjs"]'), github.event.label.name) ||
      (inputs.extra-preview-labels != '' && inputs.extra-preview-labels != '[]' && contains(fromJSON(inputs.extra-preview-labels), github.event.label.name))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Cancel an in-progress preview build when a newer commit on the same ref
    # supersedes it. Without cancel-in-progress the default is false, so a fresh
    # push QUEUES behind the stale run and the up-to-date preview is delayed
    # until the obsolete one finishes (see d-morrison/rme#812).
    concurrency:
      group: preview-${{ github.ref }}
      cancel-in-progress: true
    # Read-only: this job runs in the fork's restricted context and must never
    # write to the base repo. All writes are handled by preview-deploy.yml,
    # which runs in the base-repo context via workflow_run.
    permissions:
      contents: read
    outputs:
      changed-chapters: ${{ steps.build.outputs.changed-chapters }}
      any-changed: ${{ steps.build.outputs.any-changed }}
      detection-status: ${{ steps.build.outputs.detection-status }}
      skip-reason: ${{ steps.build.outputs.skip-reason }}
      docx-status: ${{ steps.build.outputs.docx-status }}
      docx-skip-reason: ${{ steps.build.outputs.docx-skip-reason }}
      docx-tracked-changes-files: ${{ steps.build.outputs.docx-tracked-changes-files }}
      any-docx-changed: ${{ steps.build.outputs.any-docx-changed }}
    steps:
      - name: Build preview
        id: build
        uses: Morrison-Lab/gha/preview@v2
        # The `type: boolean` inputs above are coerced to the strings
        # 'true'/'false' when passed to the composite action, which compares
        # them as strings (e.g. `inputs.use-renv == 'true'`).
        with:
          path: ${{ inputs.path }}
          r-version: ${{ inputs.r-version }}
          apt-packages: ${{ inputs.apt-packages }}
          use-renv: ${{ inputs.use-renv }}
          r-packages: ${{ inputs.r-packages }}
          install-package: ${{ inputs.install-package }}
          setup-chrome: ${{ inputs.setup-chrome }}
          tinytex: ${{ inputs.tinytex }}
          submodules: ${{ inputs.submodules }}
          render-profile: ${{ inputs.render-profile }}
          output-dir: ${{ inputs.output-dir }}
          formats: ${{ inputs.formats }}
          fail-on-render-warning: ${{ inputs.fail-on-render-warning }}
          forbid-log-patterns: ${{ inputs.forbid-log-patterns }}
          detect-changed-chapters: ${{ inputs.detect-changed-chapters }}
          changed-chapters-banner: ${{ inputs.changed-chapters-banner }}
          changed-chapters-glob: ${{ inputs.changed-chapters-glob }}
          deployed-branch: ${{ inputs.deployed-branch }}
          deployed-subdir: ${{ inputs.deployed-subdir }}
          changed-chapters-normalize-patterns: ${{ inputs.changed-chapters-normalize-patterns }}
          banner-index: ${{ inputs.banner-index }}
          docx-tracked-changes: ${{ inputs.docx-tracked-changes }}
          docx-tracked-changes-glob: ${{ inputs.docx-tracked-changes-glob }}
