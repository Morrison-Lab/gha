name: Check for secrets (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: gitleaks release version to install (without the leading `v`).
        type: string
        default: '8.30.1'
      checksums-sha256:
        description: >-
          Expected SHA-256 of the release's own
          `gitleaks_<version>_checksums.txt`; bump alongside `version`.
        type: string
        default: '061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae'
      config:
        description: >-
          Path to a gitleaks TOML config with extra rules or allowlists;
          defaults to `.gitleaks.toml` when present.
        type: string
        default: ''
      paths-ignore:
        description: >-
          Comma/newline-separated file paths to skip. Go regexes, not globs,
          and matched unanchored -- anchor with `^` when that matters.
        type: string
        default: ''
      allowlist-file:
        description: >-
          Path to a file of regexes, one per line (commas are regex syntax
          here, not separators); a finding whose matched text matches any of
          them is suppressed. Defaults to `.github/secrets-allowlist.txt`.
        type: string
        default: ''
      log-opts:
        description: >-
          `git log` options narrowing which commits are scanned; empty scans
          all of `HEAD`'s history.
        type: string
        default: ''
      fail:
        description: >-
          Fail the workflow when a possible secret is found (else warn only).
        type: boolean
        default: true

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, because a secret removed in a later commit is still
          # exposed and so is still worth finding. The action refuses to run
          # against a shallow clone rather than report a partial scan clean.
          fetch-depth: 0

      - name: Check for secrets
        uses: Morrison-Lab/gha/check-secrets@v2
        with:
          version: ${{ inputs.version }}
          checksums-sha256: ${{ inputs.checksums-sha256 }}
          config: ${{ inputs.config }}
          paths-ignore: ${{ inputs.paths-ignore }}
          allowlist-file: ${{ inputs.allowlist-file }}
          log-opts: ${{ inputs.log-opts }}
          fail: ${{ inputs.fail }}
