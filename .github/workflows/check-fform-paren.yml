name: Check f forms written as \name\paren{...} (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to set up.
        type: string
        default: '3.x'
      whole-tree:
        description: >-
          Scan every tracked file the globs match, in full, instead of only the
          lines a pull request adds. Use it to measure a corpus.
        type: boolean
        default: false
      macros-file:
        description: >-
          Path of the macros file whose providecommand/newcommand definitions
          of XXXf macros name the known f forms. Needs the latex-macros
          submodule checked out (see submodules); a missing file skips the
          check with a warning.
        type: string
        default: 'latex-macros/macros.qmd'
      globs:
        description: >-
          Space-separated git pathspecs of tracked files to check (recursive
          by default).
        type: string
        default: '*.qmd *.Rmd *.md'
      paths-ignore:
        description: >-
          Comma/newline-separated glob patterns (relative paths) to skip.
        type: string
        default: ''
      submodules:
        description: >-
          Passed to actions/checkout as its submodules input ('true',
          'recursive' or 'false'), so the latex-macros submodule is available.
        type: string
        default: 'true'
      submodule-paths:
        description: >-
          Whitespace-separated submodule paths to initialize, for example
          `latex-macros`, instead of the `submodules` input. Use it when the
          repository has a private submodule beside the public one this check
          needs, so a full checkout would fail. Empty (the default) uses
          `submodules`.
        type: string
        default: ''
      fail:
        description: >-
          Fail the workflow when a name-paren use with an f form is found
          (else non-blocking). Defaults to false (warning annotations only).
        type: boolean
        default: false

jobs:
  check-fform-paren:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so PR runs can diff added lines against the base.
          fetch-depth: 0
          submodules: ${{ inputs.submodule-paths == '' && inputs.submodules || 'false' }}

      - name: Check out only the named submodules
        if: inputs.submodule-paths != ''
        uses: Morrison-Lab/gha/.github/actions/checkout-submodules@v3
        with:
          paths: ${{ inputs.submodule-paths }}

      - name: Check f forms written as name-paren
        uses: Morrison-Lab/gha/check-fform-paren@v3
        with:
          python-version: ${{ inputs.python-version }}
          whole-tree: ${{ inputs.whole-tree }}
          macros-file: ${{ inputs.macros-file }}
          globs: ${{ inputs.globs }}
          paths-ignore: ${{ inputs.paths-ignore }}
          fail: ${{ inputs.fail }}
          # On PRs, check only lines added relative to the base; otherwise
          # (push) there is no base to diff against, so the check is skipped.
          # On pull_request, HEAD is GitHub's merge ref and HEAD^1 is the base tip
          # it was built on. The payload's pull_request.base.sha can lag that tip,
          # counting the base's newer commits as added by the PR (gha#1007).
          base-ref: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
