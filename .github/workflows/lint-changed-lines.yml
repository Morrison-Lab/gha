name: Lint changed lines (reusable)

on:
  workflow_call:
    inputs:
      path:
        description: Path to the R package root (holding DESCRIPTION).
        type: string
        default: '.'
      install-quarto:
        description: Install Quarto when setting up R dependencies.
        type: boolean
        default: false
      use-renv:
        description: >-
          Restore R dependencies with renv (r-lib/actions/setup-renv) instead of
          DESCRIPTION-based setup-r-dependencies. Set true for renv-pinned repos.
        type: boolean
        default: false
      renv-cache-version:
        description: Cache version suffix passed to setup-renv.
        type: string
        default: '1'
      apt-packages:
        description: Extra apt packages to install before setting up R/renv dependencies (space-separated).
        type: string
        default: ''
      extra-packages:
        description: >-
          Extra R packages to install (space- or comma-separated; passed to
          setup-r-dependencies under DESCRIPTION, or installed from CRAN under
          use-renv: true). gh and lintr are always installed.
        type: string
        default: ''
      install-package:
        description: >-
          Run `R CMD INSTALL` before linting so object_usage_linter can
          resolve the package's own functions. Set false for a non-package repo.
        type: boolean
        default: true
      fail:
        description: Fail the workflow when a lint is found on a changed line.
        type: boolean
        default: true

jobs:
  lint-changed-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the PR head, not the default refs/pull/N/merge ref: the
          # changed-line set comes from the PR "files" patch, whose line
          # numbers are relative to the PR head. The merge ref's line numbers
          # can drift from those if the base branch has advanced in the same
          # file region, which would silently drop real lints on changed lines.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Lint changed lines
        uses: Morrison-Lab/gha/lint-changed-lines@v2
        with:
          path: ${{ inputs.path }}
          install-quarto: ${{ inputs.install-quarto }}
          use-renv: ${{ inputs.use-renv }}
          renv-cache-version: ${{ inputs.renv-cache-version }}
          apt-packages: ${{ inputs.apt-packages }}
          extra-packages: ${{ inputs.extra-packages }}
          install-package: ${{ inputs.install-package }}
          fail: ${{ inputs.fail }}
