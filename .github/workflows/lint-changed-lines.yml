name: Lint changed lines (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for the job. Use a self-hosted label only for a
          private repository; never for a public one, whose pull requests
          can run arbitrary code on it.
        type: string
        default: ''
      path:
        description: Path to the R package root (holding DESCRIPTION).
        type: string
        default: '.'
      install-quarto:
        description: Install Quarto when setting up R dependencies.
        type: boolean
        default: false
      use-renv:
        description: >-
          Restore R dependencies with renv (r-lib/actions/setup-renv) instead of
          DESCRIPTION-based setup-r-dependencies. Set true for renv-pinned repos.
        type: boolean
        default: false
      renv-cache-version:
        description: Cache version suffix passed to setup-renv.
        type: string
        default: '1'
      apt-packages:
        description: Extra apt packages to install before setting up R/renv dependencies (space-separated).
        type: string
        default: ''
      extra-packages:
        description: >-
          Extra R packages to install (space- or comma-separated; passed to
          setup-r-dependencies under DESCRIPTION, or installed from CRAN under
          use-renv: true). gh and lintr are always installed.
        type: string
        default: ''
      install-package:
        description: >-
          Run `R CMD INSTALL` before linting so object_usage_linter can
          resolve the package's own functions. Set false for a non-package repo.
        type: boolean
        default: true
      fail:
        description: Fail the workflow when a lint is found on a changed line.
        type: boolean
        default: true
      file-pattern:
        description: >-
          Regular expression matched against each changed file's path; only
          matching files are linted. The default lints R source files only;
          use '[.]([Rr]|[Rr]md|[Qq]md)$' to also lint R chunks in Quarto and
          R Markdown documents.
        type: string
        default: '[.][Rr]$'
      lms-ref:
        description: >-
          Commit SHA (or tag) of Morrison-Lab/psc to install the lms package
          from. When set, changed lines are linted with
          lms::default_linters(nested_calls = TRUE) instead of the linters in
          the repository's .lintr.R (its exclusions still apply). Empty keeps
          the repository's own linters.
        type: string
        default: ''

jobs:
  lint-changed-lines:
    runs-on: ${{ inputs.runs-on || (github.event.repository.private && vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the PR head, not the default refs/pull/N/merge ref: the
          # changed-line set comes from the PR "files" patch, whose line
          # numbers are relative to the PR head. The merge ref's line numbers
          # can drift from those if the base branch has advanced in the same
          # file region, which would silently drop real lints on changed lines.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Lint changed lines
        uses: Morrison-Lab/gha/lint-changed-lines@v3
        with:
          path: ${{ inputs.path }}
          install-quarto: ${{ inputs.install-quarto }}
          use-renv: ${{ inputs.use-renv }}
          renv-cache-version: ${{ inputs.renv-cache-version }}
          apt-packages: ${{ inputs.apt-packages }}
          extra-packages: ${{ inputs.extra-packages }}
          install-package: ${{ inputs.install-package }}
          fail: ${{ inputs.fail }}
          file-pattern: ${{ inputs.file-pattern }}
          lms-ref: ${{ inputs.lms-ref }}
