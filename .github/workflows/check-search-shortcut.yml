name: Check site search shortcut (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for the job. Use a self-hosted label only for a
          private repository; never for a public one, whose pull requests
          can run arbitrary code on it.
        type: string
        default: ''
      python-version:
        description: Python version to set up.
        type: string
        default: '3.x'
      globs:
        description: >-
          Space-separated git pathspecs of tracked files to check. A
          literal-prefix pathspec is root-anchored, so the default adds
          `*/_quarto*.yml` for subdirectories.
        type: string
        default: '_quarto*.yml */_quarto*.yml'
      paths-ignore:
        description: >-
          Comma/newline-separated glob patterns (relative paths) to skip.
        type: string
        default: ''
      fail:
        description: >-
          Fail the workflow when a site opens search on f or s (else
          non-blocking). Defaults to true.
        type: boolean
        default: true

jobs:
  check-search-shortcut:
    runs-on: ${{ inputs.runs-on || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check site search shortcut
        uses: Morrison-Lab/gha/check-search-shortcut@v3
        with:
          python-version: ${{ inputs.python-version }}
          globs: ${{ inputs.globs }}
          paths-ignore: ${{ inputs.paths-ignore }}
          fail: ${{ inputs.fail }}
