name: Check Python chunks in qmd files (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for the job. Use a self-hosted label only for a
          private repository; never for a public one, whose pull requests
          can run arbitrary code on it.
        type: string
        default: ''
      python-version:
        description: Python version to set up.
        type: string
        default: '3.x'
      config:
        description: Path to the Ruff configuration file.
        type: string
        default: 'ruff.toml'
      whole-tree:
        description: >-
          Check every tracked file the globs match, instead of only the files
          a pull request changes.
        type: boolean
        default: false
      globs:
        description: Space-separated git pathspecs of tracked files to check.
        type: string
        default: '*.qmd'
      fail:
        description: Fail the workflow when a chunk has a finding (else warn only).
        type: boolean
        default: true

jobs:
  check-python-qmd-chunks:
    runs-on: ${{ inputs.runs-on || (github.event.repository.private && vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so PR runs can diff changed files against the base.
          fetch-depth: 0

      - name: Check Python chunks
        uses: Morrison-Lab/gha/check-python-qmd-chunks@v3
        with:
          python-version: ${{ inputs.python-version }}
          config: ${{ inputs.config }}
          whole-tree: ${{ inputs.whole-tree }}
          globs: ${{ inputs.globs }}
          fail: ${{ inputs.fail }}
          # On pull_request, HEAD is GitHub's merge ref and HEAD^1 is the base
          # tip it was built on (gha#1007).
          base-ref: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
