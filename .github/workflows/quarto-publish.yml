name: Quarto Publish (reusable)

# Render a Quarto project and deploy it to the gh-pages branch, which GitHub
# Pages serves. Wraps the `quarto-publish` composite (setup + render) and adds
# a gh-pages deploy that preserves the PR-preview subtree. Consumers target this
# workflow with a small caller stub (see examples/quarto-publish.yml) pinned to
# @v1.
#
# One-time consumer setup: repo Settings -> Pages -> Source =
# "Deploy from a branch", branch `gh-pages` / `(root)`.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for every job. Use a self-hosted label only for a
          private repository; never for a public one, whose pull requests
          can run arbitrary code on it. A self-hosted runner without root
          cannot run steps that call apt or sudo, such as `apt-packages`.
        type: string
        default: ubuntu-latest
      path:
        description: Path (in the caller repo) to the Quarto project to render (the dir with _quarto.yml).
        type: string
        default: '.'
      setup-r:
        description: Install R and project R dependencies before rendering (for R/knitr Quarto projects).
        type: boolean
        default: false
      r-packages:
        description: r-lib/actions package specs installed when setup-r is true and use-renv is false.
        type: string
        default: |
          any::knitr
          any::rmarkdown
      use-renv:
        description: Restore R dependencies with renv instead of r-packages (requires setup-r).
        type: boolean
        default: false
      install-package:
        description: Run R CMD INSTALL on path before rendering (requires setup-r).
        type: boolean
        default: false
      setup-chrome:
        description: Install Chrome via browser-actions/setup-chrome before rendering.
        type: boolean
        default: false
      tinytex:
        description: Install TinyTeX (needed to render PDF outputs).
        type: boolean
        default: false
      setup-julia:
        description: >-
          Install Julia before rendering, for pages that execute `{julia}`
          chunks (under knitr, through the R package JuliaCall, which goes in
          r-packages). See the composite's input for details.
        type: boolean
        default: false
      julia-version:
        description: Julia version to install. Only used when setup-julia is true.
        type: string
        default: '1'
      apt-packages:
        description: Extra apt packages to install before rendering (space-separated).
        type: string
        default: ''
      output-dir:
        description: Directory the rendered site is written to (relative to `path`), forwarded to `quarto render --output-dir` (overrides any `_quarto.yml` setting). Defaults to `_site`.
        type: string
        default: '_site'
      render-profile:
        description: Quarto `--profile` to render with (e.g. 'website'). Empty to omit.
        type: string
        default: ''
      formats:
        description: >-
          Whitespace- or newline-separated Quarto output formats to render
          individually in order (e.g. "pdf docx revealjs html"). When set,
          renders each format in its own process passing --no-clean to
          subsequent formats, preventing V8 heap exhaustion on large
          multi-format sites.
        type: string
        default: ''
      per-file-formats:
        description: >-
          Whitespace- or newline-separated Quarto output formats (e.g. "pdf")
          to render one file at a time, each in its own process, after the
          normal render. Prevents Deno heap exhaustion on a large PDF pass.
          List the other formats in `formats` so the normal pass skips these.
        type: string
        default: ''
      freeze-cache:
        description: Restore and save Quarto _freeze directory via actions/cache keyed on renv.lock and commit SHA.
        type: boolean
        default: false
      deno-v8-options:
        description: Options passed to Deno V8 via QUARTO_DENO_V8_OPTIONS to raise the heap cap for large site renders.
        type: string
        default: '--max-old-space-size=12288,--max-heap-size=12288'
      fail-on-render-warning:
        description: Fail the build if Quarto emits any render warnings (WARN in the render log).
        type: boolean
        default: false
      forbid-log-patterns:
        description: Newline-separated fixed string patterns that will fail the build if found in the Quarto render log.
        type: string
        default: ''
      timezone:
        description: >-
          IANA time zone (e.g. 'America/Los_Angeles') exported as TZ for the render
          and later steps, so date: last-modified stamps are not in UTC.
          Empty leaves the runner's time zone unchanged.
        type: string
        default: ''
      timeout-minutes:
        description: >-
          Timeout, in minutes, for the render (build job). Default 45 is the hang
          ceiling, not a budget; raise it for a site whose full render (every
          page in every format) takes longer. A caller cannot set
          timeout-minutes on a job that uses `uses:`.
        type: number
        default: 45
      checkout-submodules:
        description: Initialize the caller's git submodules before rendering.
        type: boolean
        default: false
      pre-render-artifact:
        description: >-
          Name of a workflow-run artifact to download into the project before
          rendering — lets an earlier job inject build-time assets (e.g.
          recorded media) the site references. Empty to skip.
        type: string
        default: ''
      pre-render-artifact-path:
        description: >-
          Directory (in the caller repo) to extract pre-render-artifact into.
          Defaults to the workspace root when omitted; set it when the artifact
          should land in a subdirectory the site references.
        type: string
        default: ''
      deploy:
        description: Deploy the rendered site to the gh-pages branch. Set false to render only (e.g. a build check); the caller still grants contents:write, since the deploy job is part of the workflow.
        type: boolean
        default: true
    secrets:
      SUBMODULES_TOKEN:
        description: Token with read access to private submodules (only needed when checkout-submodules is true).
        required: false

jobs:
  # Render the site and stage it as an artifact. Held to contents:read so the
  # render step never has write access — even though the caller grants
  # contents:write (a reusable workflow's caller must grant write because the
  # deploy job below declares it, even when deploy is false). Only the deploy
  # job actually uses the write token.
  build:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout submodules
        if: inputs.checkout-submodules
        uses: Morrison-Lab/gha/.github/actions/checkout-submodules@v3
        with:
          submodules-token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Download pre-render artifact
        # Best-effort: a caller's optional asset-builder job may have failed or
        # produced nothing; the site still renders (with fallbacks) without it.
        if: inputs.pre-render-artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.pre-render-artifact }}
          path: ${{ inputs.pre-render-artifact-path }}

      - name: Render site
        # Pinned @v1 per repo convention; the released tag moves to the
        # render-only composite when this branch-deploy change ships as v2. The
        # current @v1 composite also renders into output-dir (it just uploads a
        # now-unused Pages artifact afterward), so the staged site below is the
        # same either way.
        uses: Morrison-Lab/gha/quarto-publish@v3
        with:
          path: ${{ inputs.path }}
          setup-r: ${{ inputs.setup-r }}
          r-packages: ${{ inputs.r-packages }}
          use-renv: ${{ inputs.use-renv }}
          install-package: ${{ inputs.install-package }}
          setup-chrome: ${{ inputs.setup-chrome }}
          tinytex: ${{ inputs.tinytex }}
          setup-julia: ${{ inputs.setup-julia }}
          julia-version: ${{ inputs.julia-version }}
          apt-packages: ${{ inputs.apt-packages }}
          output-dir: ${{ inputs.output-dir }}
          render-profile: ${{ inputs.render-profile }}
          formats: ${{ inputs.formats }}
          per-file-formats: ${{ inputs.per-file-formats }}
          freeze-cache: ${{ inputs.freeze-cache }}
          deno-v8-options: ${{ inputs.deno-v8-options }}
          fail-on-render-warning: ${{ inputs.fail-on-render-warning }}
          forbid-log-patterns: ${{ inputs.forbid-log-patterns }}
          timezone: ${{ inputs.timezone }}

      - name: Stage rendered site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quarto-publish-site
          path: ${{ inputs.path }}/${{ inputs.output-dir }}
          retention-days: 1

  # Push the staged site to gh-pages. Only this job needs contents:write, and
  # it is skipped entirely when deploy is false.
  deploy:
    needs: build
    if: inputs.deploy
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    # Serialize deploys to gh-pages so main-site publishes, PR previews, and
    # preview cleanups queue rather than race or clobber each other's commits.
    # Note: GitHub Actions only retains *one* pending run per concurrency group
    # (superseding older pending runs in the queue), rather than buffering
    # unbounded pending runs. cancel-in-progress: false queues rather than kills.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # JamesIves pushes to gh-pages from a git working copy, so check out first.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download staged site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quarto-publish-site
          path: _quarto_publish_site

      - name: Disable Jekyll on the served site
        # Branch-served Pages runs the rendered output through Jekyll, which
        # drops files and folders whose names start with `_` (Quarto emits
        # `_`-prefixed assets). A `.nojekyll` at the gh-pages root turns Jekyll
        # off for the whole site, previews included. `quarto publish gh-pages`
        # adds this automatically; we deploy with JamesIves, so add it here.
        shell: bash
        run: touch _quarto_publish_site/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: _quarto_publish_site
          branch: gh-pages
          # Preserve the PR-preview subtree: the preview family writes per-PR
          # sites under pr-preview/, and a main-site deploy must not wipe them.
          # `pr-preview/` is the umbrella dir pr-preview-action documents for
          # this "deploy both to gh-pages" case.
          clean: true
          clean-exclude: pr-preview/
