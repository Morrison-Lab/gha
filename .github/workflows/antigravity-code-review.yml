name: Antigravity Code Review & Audit (reusable)

# Reusable Google Antigravity SDK PR review, security audit, and test generation workflow.
# Supports workflow_dispatch and pull_request runs.

on:
  workflow_call:
    inputs:
      mode:
        description: 'Operational mode: code-review, security-audit, or test-generation'
        type: string
        default: 'code-review'
      pr-number:
        description: 'Pull request number to analyze (required for workflow_dispatch)'
        type: string
        default: ''
      prompt-addendum:
        description: 'Extra prompt instructions appended to the agent task prompt'
        type: string
        default: ''
      checkout-submodules:
        description: 'Check out git submodules'
        type: boolean
        default: false
      model:
        description: 'Model override passed to the Antigravity SDK (optional)'
        type: string
        default: ''
      trigger-policy:
        description: 'Trigger policy mode: any (default), on-push (only automatic PR updates), or on-request (only manual workflow_dispatch)'
        type: string
        default: 'any'
      workload-identity-provider:
        description: 'Full GCP Workload Identity Provider resource name'
        type: string
        default: ''
      service-account:
        description: 'GCP Service Account email to impersonate'
        type: string
        default: ''
      gcp-project:
        description: >-
          GCP project id. Required alongside `workload-identity-provider` for
          the OIDC credentials to be USED: minting them authenticates to GCP,
          but the SDK only routes through Vertex AI when told to, so without
          this the review still calls the Gemini Developer API and still needs
          GEMINI_API_KEY (gha#672 review, finding 1).
        type: string
        default: ''
      gcp-location:
        description: >-
          Vertex AI location (e.g. `us-central1`). Used with `gcp-project`.
        type: string
        default: ''
      max-diff-lines:
        description: 'Maximum modified lines allowed in a PR diff before skipping review'
        type: string
        default: '2000'
      max-diff-files:
        description: 'Maximum modified files allowed in a PR diff before skipping review'
        type: string
        default: '50'
      fail-on-error:
        description: >-
          Whether a genuine error (metadata fetch, diff fetch, empty diff,
          or an execution failure) reddens the check. Defaults to true:
          those paths return before any PR comment is posted, so exiting 0
          leaves a green check over a silent thread (gha#672 review,
          finding 2).
        type: boolean
        default: true
    secrets:
      GEMINI_API_KEY:
        required: false
      SUBMODULES_TOKEN:
        required: false

jobs:
  antigravity-review:
    if: >-
      (inputs.trigger-policy == 'any' ||
       (inputs.trigger-policy == 'on-push' && github.event_name == 'pull_request') ||
       (inputs.trigger-policy == 'on-request' && github.event_name == 'workflow_dispatch')) &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.draft == false &&
          # `safe-to-test` is a TRUST BOUNDARY, not a convenience label: it lets a
          # fork PR's code run with GEMINI_API_KEY (and, where configured, GCP
          # credentials) in scope. Apply it only after a maintainer has read the
          # fork's diff, and re-apply per push -- a label set before a later push
          # still admits that push. This is the repo's only ok-to-test-style
          # bypass (gha#672 review, finding 3).
          (github.event.pull_request.head.repo.full_name == github.repository || contains(github.event.pull_request.labels.*.name, 'safe-to-test')) &&
          github.event.sender.type != 'Bot'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    concurrency:
      group: antigravity-review-${{ inputs.mode }}-${{ inputs.pr-number || github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Resolve PR number
        id: resolve-pr
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr-number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR_NUM="${INPUT_PR_NUMBER:-$EVENT_PR_NUMBER}"
          if [ -z "$PR_NUM" ]; then
            echo "::error::No PR number available to analyze."
            exit 1
          fi
          if [[ ! "$PR_NUM" =~ ^[0-9]+$ ]]; then
            echo "::error::PR number must be digits only; got '$PR_NUM'."
            exit 1
          fi
          echo "pr-num=$PR_NUM" >> "$GITHUB_OUTPUT"

      - name: Guard dispatched reviews against fork / Dependabot PRs
        id: dispatch-guard
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr-num }}
        run: |
          set -euo pipefail
          if ! PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json isCrossRepository,author,labels); then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::error::Could not resolve PR #$PR_NUMBER's cross-repository status; failing closed."
            exit 1
          fi
          IS_CROSS_REPO=$(jq -r '.isCrossRepository' <<< "$PR_JSON")
          AUTHOR_LOGIN=$(jq -r '.author.login' <<< "$PR_JSON")
          HAS_SAFE_LABEL=$(jq -r 'if .labels then (.labels | map(.name == "safe-to-test") | any) else false end' <<< "$PR_JSON")
          if [[ "$AUTHOR_LOGIN" == "dependabot[bot]" ]]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Dispatched review of PR #$PR_NUMBER skipped -- Dependabot PR."
          elif [[ "$IS_CROSS_REPO" == "true" && "$HAS_SAFE_LABEL" != "true" ]]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Dispatched review of PR #$PR_NUMBER skipped -- fork PR without safe-to-test label."
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      # The caller's own repo is checked out with the runner's default
      # github.token, never SUBMODULES_TOKEN --- that secret authenticates a
      # CROSS-OWNER submodule fetch and has no reason to (and, when a
      # consumer sets it correctly for its own submodule, frequently cannot)
      # read the caller's own repo (gha#442). Submodule auth is handled below
      # by the shared checkout-submodules composite, the same one
      # claude-code-review.yml already uses.
      - name: Checkout repository
        if: success() && steps.dispatch-guard.outputs.blocked != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout submodules
        if: success() && steps.dispatch-guard.outputs.blocked != 'true' && inputs.checkout-submodules
        uses: Morrison-Lab/gha/.github/actions/checkout-submodules@v2
        with:
          submodules-token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Run Antigravity Action
        if: success() && steps.dispatch-guard.outputs.blocked != 'true'
        uses: Morrison-Lab/gha/antigravity-review@v2
        with:
          mode: ${{ inputs.mode }}
          pr-number: ${{ steps.resolve-pr.outputs.pr-num }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          model: ${{ inputs.model }}
          prompt-addendum: ${{ inputs.prompt-addendum }}
          trigger-policy: ${{ inputs.trigger-policy }}
          post-comment: 'true'
          workload-identity-provider: ${{ inputs.workload-identity-provider }}
          service-account: ${{ inputs.service-account }}
          gcp-project: ${{ inputs.gcp-project }}
          gcp-location: ${{ inputs.gcp-location }}
          max-diff-lines: ${{ inputs.max-diff-lines }}
          max-diff-files: ${{ inputs.max-diff-files }}
          fail-on-error: ${{ inputs.fail-on-error }}
