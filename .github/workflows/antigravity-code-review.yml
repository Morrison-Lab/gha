name: Antigravity Code Review & Audit (reusable)

# Reusable Google Antigravity SDK PR review, security audit, and test generation workflow.
# Supports workflow_dispatch and pull_request runs.

on:
  workflow_call:
    inputs:
      mode:
        description: 'Operational mode: code-review, security-audit, or test-generation'
        type: string
        default: 'code-review'
      pr-number:
        description: 'Pull request number to analyze (required for workflow_dispatch)'
        type: string
        default: ''
      prompt-addendum:
        description: 'Extra prompt instructions appended to the agent task prompt'
        type: string
        default: ''
      checkout-submodules:
        description: 'Check out git submodules'
        type: boolean
        default: false
      model:
        description: 'Model override passed to the Antigravity SDK (optional)'
        type: string
        default: ''
      trigger-policy:
        description: 'Trigger policy mode: any (default), on-push (only automatic PR updates), or on-request (only manual workflow_dispatch)'
        type: string
        default: 'any'
    secrets:
      GEMINI_API_KEY:
        required: false
      SUBMODULES_TOKEN:
        required: false

jobs:
  antigravity-review:
    if: >-
      (inputs.trigger-policy == 'any' ||
       (inputs.trigger-policy == 'on-push' && github.event_name == 'pull_request') ||
       (inputs.trigger-policy == 'on-request' && github.event_name == 'workflow_dispatch')) &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.sender.type != 'Bot'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    concurrency:
      group: antigravity-review-${{ inputs.mode }}-${{ inputs.pr-number || github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Resolve PR number
        id: resolve-pr
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr-number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR_NUM="${INPUT_PR_NUMBER:-$EVENT_PR_NUMBER}"
          if [ -z "$PR_NUM" ]; then
            echo "::error::No PR number available to analyze."
            exit 1
          fi
          if [[ ! "$PR_NUM" =~ ^[0-9]+$ ]]; then
            echo "::error::PR number must be digits only; got '$PR_NUM'."
            exit 1
          fi
          echo "pr-num=$PR_NUM" >> "$GITHUB_OUTPUT"

      - name: Guard dispatched reviews against fork / Dependabot PRs
        id: dispatch-guard
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr-num }}
        run: |
          set +e -uo pipefail
          if ! PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json isCrossRepository,author); then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::error::Could not resolve PR #$PR_NUMBER's cross-repository status; failing closed."
            exit 1
          fi
          IS_CROSS_REPO=$(jq -r '.isCrossRepository' <<< "$PR_JSON")
          AUTHOR_LOGIN=$(jq -r '.author.login' <<< "$PR_JSON")
          if [[ "$IS_CROSS_REPO" == "true" || "$AUTHOR_LOGIN" == "dependabot[bot]" ]]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Dispatched review of PR #$PR_NUMBER skipped -- fork or Dependabot PR."
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: success() && steps.dispatch-guard.outputs.blocked != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.checkout-submodules }}
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Run Antigravity Action
        if: success() && steps.dispatch-guard.outputs.blocked != 'true'
        uses: Morrison-Lab/gha/antigravity-review@v2
        with:
          mode: ${{ inputs.mode }}
          pr-number: ${{ steps.resolve-pr.outputs.pr-num }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          model: ${{ inputs.model }}
          prompt-addendum: ${{ inputs.prompt-addendum }}
          trigger-policy: ${{ inputs.trigger-policy }}
          post-comment: 'true'
