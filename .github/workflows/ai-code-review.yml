name: AI Code Review (reusable)

# Reusable multi-agent PR review workflow. Picks one of the configured AI
# agents at random and dispatches that agent's own review workflow for the PR,
# falling through to the next candidate when one can't be dispatched or fails
# during execution (#444).
#
# Scope of the fallback: covers agents that cannot be dispatched (no secret
# configured, or workflow file missing) as well as dispatched runs that fail
# partway through execution (#444). When a dispatched agent run fails or is
# cancelled, the selector falls through to try the next candidate agent.
#
# The caller stub (see examples/ai-code-review.yml) holds the `on:` triggers.

on:
  workflow_call:
    inputs:
      agents:
        description: Comma-separated list of AI agents to select from (e.g. 'claude, gemini').
        type: string
        default: 'claude, gemini'
      pr-number:
        description: Pull request number to review (required for workflow_dispatch).
        type: string
        default: ''
      claude-review-workflow-file:
        description: >-
          Caller-repo workflow file dispatched for a Claude review. Defaults to
          the name examples/claude-code-review.yml is copied to.
        type: string
        default: 'claude-code-review.yml'
      gemini-review-workflow-file:
        description: >-
          Caller-repo workflow file dispatched for a Gemini review. Defaults to
          the name examples/gemini-code-review.yml is copied to.
        type: string
        default: 'gemini-code-review.yml'
      antigravity-review-workflow-file:
        description: >-
          Caller-repo workflow file dispatched for an Antigravity review. Defaults to
          the name examples/antigravity-code-review.yml is copied to.
        type: string
        default: 'antigravity-code-review.yml'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false

jobs:
  select-and-review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.sender.type != 'Bot'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      # The one permission the dispatch needs: `gh workflow run` against the
      # caller's own repo. `actions: write` on GITHUB_TOKEN covers it, so no
      # PAT is involved --- and the picked agent's own review workflow
      # declares whatever permissions it needs for itself.
      actions: write

    # Two dispatches for the same PR would put two agents' reviews on it,
    # which is the opposite of picking one. Grouped per PR so a later push
    # cancels the pending selection rather than adding to it. Cancelling
    # cannot un-dispatch an agent whose run already started; it only stops a
    # second selection from being made, which is what this group is for.
    concurrency:
      group: ai-review-${{ inputs.pr-number || github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Resolve PR info
        id: pr-info
        uses: Morrison-Lab/gha/.github/actions/resolve-pr-info@v2
        with:
          pr-number: ${{ inputs.pr-number || github.event.pull_request.number || github.event.issue.number }}

      - name: Try candidate review workflows until one dispatches
        id: dispatch-first-available
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number || github.event.issue.number }}
          RAW_AGENTS: ${{ inputs.agents }}
          REPO: ${{ github.repository }}
          CLAUDE_WF: ${{ inputs.claude-review-workflow-file }}
          GEMINI_WF: ${{ inputs.gemini-review-workflow-file }}
          ANTIGRAVITY_WF: ${{ inputs.antigravity-review-workflow-file }}
          PR_BRANCH: ${{ steps.pr-info.outputs.pr_branch }}
          PR_HEAD_REPO: ${{ steps.pr-info.outputs.pr_head_repo }}
          IS_FORK: ${{ steps.pr-info.outputs.is_fork }}
          REF_ARG: ${{ steps.pr-info.outputs.ref_arg }}
          # Secret *presence*, not the secret itself: a `secrets.X != ''`
          # comparison is evaluated by Actions, so only the boolean reaches
          # the runner.
          HAS_CLAUDE_SECRET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
          HAS_GEMINI_SECRET: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          set -euo pipefail

          if [ -z "$PR_NUMBER" ]; then
            echo "::error::No PR number available for AI review."
            exit 1
          fi
          # Same digits-only guard gemini-code-review.yml applies. The value is
          # quoted at every use below, so this is not the last line of defence
          # --- it is so a malformed workflow_dispatch input fails here, with a
          # message naming the problem, rather than as a puzzling `gh api` 404.
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::PR number must be digits only; got '$PR_NUMBER'."
            exit 1
          fi

          mapfile -t AGENTS < <(tr ',' '\n' <<< "$RAW_AGENTS" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' \
            | shuf)

          if [ "${#AGENTS[@]}" -eq 0 ]; then
            echo "::error::No valid agents configured in the 'agents' input: '$RAW_AGENTS'"
            exit 1
          fi

          echo "Candidate agents, in the order they will be tried: ${AGENTS[*]}"

          REF_ARGS=()
          BRANCH_FILTER=()
          if [ -n "$REF_ARG" ]; then
            REF_ARGS=($REF_ARG)
            BRANCH_FILTER=(--branch "$PR_BRANCH" --event workflow_dispatch)
          fi
          if [ "$IS_FORK" = "true" ]; then
            echo "::notice::PR #$PR_NUMBER is from a fork ($PR_HEAD_REPO); dispatching without --ref."
          fi

          for agent in "${AGENTS[@]}"; do
            # One dispatch block for every agent: the per-agent difference is
            # which secret gates it and which workflow file it dispatches, so
            # only those two are resolved here.
            case "$agent" in
              claude) has_secret="$HAS_CLAUDE_SECRET"; agent_wf="$CLAUDE_WF" ;;
              gemini) has_secret="$HAS_GEMINI_SECRET"; agent_wf="$GEMINI_WF" ;;
              antigravity) has_secret="$HAS_GEMINI_SECRET"; agent_wf="$ANTIGRAVITY_WF" ;;
              *)
                echo "::warning::Unknown agent '$agent'; trying the next candidate."
                continue
                ;;
            esac

            if [ "$has_secret" != "true" ]; then
              echo "::notice::Agent '$agent' has no API key/token secret configured; trying the next candidate."
              continue
            fi

            echo "Dispatching $agent_wf for PR #$PR_NUMBER ($agent)."
            START_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            if gh workflow run "$agent_wf" --repo "$REPO" "${REF_ARGS[@]}" -f pr_number="$PR_NUMBER"; then
              echo "Dispatched the review to $agent ($agent_wf)."

              # Locate the dispatched workflow run (scoped to $PR_BRANCH for same-repo PRs)
              RUN_ID=""
              for attempt in {1..12}; do
                sleep 5
                RUN_ID=$(gh run list --workflow "$agent_wf" --repo "$REPO" "${BRANCH_FILTER[@]}" --limit 5 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$START_TIME\") | .databaseId" | head -n1 || true)
                if [ -n "$RUN_ID" ]; then
                  break
                fi
              done

              if [ -n "$RUN_ID" ]; then
                echo "Tracking dispatched run $RUN_ID for agent '$agent'..."
                if gh run watch "$RUN_ID" --repo "$REPO"; then
                  CONCLUSION=$(gh run view "$RUN_ID" --repo "$REPO" --json conclusion --jq '.conclusion' || true)
                  if [ "$CONCLUSION" = "success" ] || [ "$CONCLUSION" = "neutral" ] || [ "$CONCLUSION" = "skipped" ]; then
                    echo "Agent '$agent' completed review successfully (conclusion: $CONCLUSION)."
                    exit 0
                  fi
                  echo "::warning::Dispatched run $RUN_ID for agent '$agent' completed with status '$CONCLUSION'; trying the next candidate agent."
                else
                  echo "::warning::Dispatched run $RUN_ID for agent '$agent' failed during execution; trying the next candidate agent."
                fi
              else
                echo "::notice::Could not locate queued run ID for $agent_wf within timeout; assuming dispatch succeeded."
                exit 0
              fi
            else
              echo "::warning::Could not dispatch $agent_wf for '$agent'; trying the next candidate agent."
            fi
          done

          echo "::error::Every configured AI agent was tried; none could be dispatched or completed successfully."
          exit 1
