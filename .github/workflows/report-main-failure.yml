name: Report main failure (reusable)

# Follow up on a workflow that failed on the default branch, from a
# `workflow_run` caller stub (see examples/report-main-failure.yml).
#
# - A run that was cancelled or skipped is ignored: superseded runs cancel
#   themselves on every merge, and a cancel is not a regression.
# - A first attempt whose failed jobs all look like infrastructure (the job
#   failed before its first real step, or no step failed at all, as when a
#   runner is lost) is re-run once, and nothing is filed.
# - Any other failure, or a second infrastructure-looking failure, files an
#   issue titled `Main CI failing: <workflow>`, or comments on the one already
#   open, through the `open-failure-issue` composite. A second
#   infrastructure-looking failure carries the `infra-suspect` label.
#
# Permissions: `issues: write` to file, `actions: write` to re-run. The caller
# must grant both.

on:
  workflow_call:
    inputs:
      labels:
        description: >-
          Comma-separated labels for a newly filed issue. Labels the calling
          repository does not define are dropped with a warning.
        type: string
        default: ''

jobs:
  report:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
      && github.event.workflow_run.event != 'pull_request'
    runs-on: ${{ (github.event.repository.private && vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      issues: write
      actions: write
    steps:
      - name: Classify the failure
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # A failed job is infrastructure-looking when its first failed step
          # is set-up or checkout, or when no step failed at all (runner lost,
          # job cancelled by its timeout).
          infra="$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" --paginate \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out")
              | ([.steps[] | select(.conclusion == "failure")] | first) as $s
              | ($s == null) or ($s.name | test("^(Set up job|Run actions/checkout|Checkout)"; "i"))]
              | if length == 0 then "false" elif all then "true" else "false" end' \
            | tail -n 1)"
          echo "infra=${infra}" >> "$GITHUB_OUTPUT"
          echo "Failed jobs all look like infrastructure: ${infra}"

      - name: Re-run once
        id: rerun
        if: steps.classify.outputs.infra == 'true' && github.event.workflow_run.run_attempt == 1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run rerun "${RUN_ID}" --failed
          echo "Re-running failed jobs of run ${RUN_ID} once; no issue filed."

      - name: File or update the failure issue
        if: steps.rerun.outcome != 'success'
        uses: Morrison-Lab/gha/.github/actions/open-failure-issue@v3
        with:
          title: "Main CI failing: ${{ github.event.workflow_run.name }}"
          labels: >-
            ${{ inputs.labels }}${{ steps.classify.outputs.infra == 'true' && (inputs.labels && ',infra-suspect' || 'infra-suspect') || '' }}
          body: |
            `${{ github.event.workflow_run.name }}` failed on `${{ github.event.workflow_run.head_branch }}`.

            - **Run:** ${{ github.event.workflow_run.html_url }} (attempt ${{ github.event.workflow_run.run_attempt }})
            - **Commit:** `${{ github.event.workflow_run.head_sha }}`
            - **Looks like infrastructure:** ${{ steps.classify.outputs.infra == 'true' && 'yes, and the re-run also failed; check the runner before the code' || 'no' }}

            Later failures of this workflow are added here as comments.
            Close this once the workflow is green again.

            _Filed automatically by the `report-main-failure` reusable workflow._
