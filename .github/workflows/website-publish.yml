# Publish this repo's Quarto documentation site to GitHub Pages on `main`.
# Dogfoods the reusable quarto-publish workflow exactly as a consumer would,
# pinned to the moving `@v2` major tag (the branch-deploy line cut in #118/#120).
#
# One-time repo setup: Settings -> Pages -> Build and deployment -> Source =
# "Deploy from a branch", branch `gh-pages` / `(root)`. Do this AFTER the first
# branch deploy has populated gh-pages, so the site never serves an empty root.
name: Quarto Publish (website)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same branch so we only publish the latest commit.
# The called workflow handles serializing the actual gh-pages git push.
concurrency:
  group: website-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # timeout-minutes is defined in the reusable workflow
    permissions:
      # Push the rendered site to gh-pages.
      contents: write
    uses: Morrison-Lab/gha/.github/workflows/quarto-publish.yml@v2
    with:
      # The Quarto project lives in website/; it is pure markdown, so the other
      # defaults (setup-r: false, output-dir: _site, deploy: true) are correct.
      path: website

  report-failure:
    needs: publish
    if: >-
      always()
      && needs.publish.result == 'failure'
      && github.event_name != 'pull_request'
    permissions:
      issues: write
    uses: Morrison-Lab/gha/.github/workflows/report-failure.yml@v2
    with:
      title: Publish workflow is failing
      body: The documentation site did not deploy, so the published site may be stale.
