# Publish this repo's Quarto documentation site to GitHub Pages on `main`.
# Dogfoods the reusable quarto-publish workflow exactly as a consumer would,
# pinned to the moving `@v2` major tag (the branch-deploy line cut in #118/#120).
#
# One-time repo setup: Settings -> Pages -> Build and deployment -> Source =
# "Deploy from a branch", branch `gh-pages` / `(root)`. Do this AFTER the first
# branch deploy has populated gh-pages, so the site never serves an empty root.
name: Quarto Publish (website)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys so two pushes don't race on the gh-pages branch.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      # Push the rendered site to gh-pages.
      contents: write
    uses: d-morrison/gha/.github/workflows/quarto-publish.yml@v2
    with:
      # The Quarto project lives in website/; it is pure markdown, so the other
      # defaults (setup-r: false, output-dir: _site, deploy: true) are correct.
      path: website

  # Dogfoods report-failure exactly as a consumer would. This workflow only
  # runs on pushes to main and on dispatch, so nothing else would surface a
  # failed deploy short of someone opening the Actions tab.
  report-failure:
    needs: publish
    if: always() && needs.publish.result == 'failure'
    permissions:
      issues: write
    uses: d-morrison/gha/.github/workflows/report-failure.yml@v2
    with:
      title: Website publish workflow is failing
      body: The gha documentation site did not deploy, so the published site may be stale.
