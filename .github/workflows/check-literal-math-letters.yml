name: Check literal letters in math (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to set up.
        type: string
        default: '3.x'
      whole-tree:
        description: >-
          Scan every tracked file the globs match, in full, instead of only the
          lines a pull request adds. Use it to measure a corpus.
        type: boolean
        default: false
      globs:
        description: >-
          Space-separated git pathspecs of tracked files to check (recursive
          by default).
        type: string
        default: '*.qmd *.md *.Rmd'
      paths-ignore:
        description: >-
          Comma/newline-separated glob patterns (relative paths) to skip.
        type: string
        default: ''
      fail:
        description: >-
          Fail the workflow when a literal letter is found (else non-blocking).
          Defaults to false (warning annotations only).
        type: boolean
        default: false

      mode:
        description: >-
          `all` flags every standalone letter; `known` flags only a letter
          or Greek command that has a semantic macro (see the action's
          description). Defaults to `all`.
        type: string
        default: 'all'
      deprecated-files:
        description: >-
          Space-separated paths of interpretation files whose rows mark a
          macro `deprecated, use \x` (for example
          `latex-macros/interpretations.tsv`). A use of one is flagged. Needs
          the file checked out (see submodules). Empty skips the rule.
        type: string
        default: ''
      submodules:
        description: >-
          Passed to actions/checkout as its submodules input ('true',
          'recursive' or 'false'), so a macros submodule is available for
          `deprecated-files`.
        type: string
        default: 'false'

jobs:
  check-literal-math-letters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so PR runs can diff added lines against the base.
          fetch-depth: 0
          submodules: ${{ inputs.submodules }}

      - name: Check literal letters in math
        uses: Morrison-Lab/gha/check-literal-math-letters@v3
        with:
          python-version: ${{ inputs.python-version }}
          whole-tree: ${{ inputs.whole-tree }}
          globs: ${{ inputs.globs }}
          paths-ignore: ${{ inputs.paths-ignore }}
          fail: ${{ inputs.fail }}
          mode: ${{ inputs.mode }}
          deprecated-files: ${{ inputs.deprecated-files }}
          # On PRs, check only lines added relative to the base; otherwise
          # (push) there is no base to diff against, so the check is skipped.
          # On pull_request, HEAD is GitHub's merge ref and HEAD^1 is the base tip
          # it was built on. The payload's pull_request.base.sha can lag that tip,
          # counting the base's newer commits as added by the PR (gha#1007).
          base-ref: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
