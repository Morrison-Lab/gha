name: Claude Code Review (reusable)

# Read-only Claude PR review workflow. Runs the upstream
# `code-review@claude-code-plugins` plugin on a PR and posts its findings.
# Ported from the canonical d-morrison versions (serodynamics / qwt / rme).
#
# The caller stub (see examples/claude-code-review.yml) holds the `on:`
# triggers — `pull_request` for automatic review and `workflow_dispatch` so
# claude.yml can re-dispatch a review after an @claude run pushes commits.
# The stub passes the dispatch's pr_number through as the `pr-number` input.
#
# This workflow is read-only: it always runs claude-code-action in agent mode
# (track_progress: false) so git write tools are never in ALLOWED_TOOLS.
# Tag mode hardcodes git write tools regardless of --disallowedTools, which
# caused unauthorized commits (serodynamics PR #175, commit 02af72b). Agent
# mode fixes this; cancel-in-progress: true is safe because no push can occur.

on:
  workflow_call:
    inputs:
      pr-number:
        description: PR number to review (set by claude.yml's workflow_dispatch; empty for pull_request runs).
        type: string
        default: ''
      prompt-addendum:
        description: Repo-specific review guidance appended to the plugin prompt.
        type: string
        default: ''
      checkout-submodules:
        description: >-
          Check out submodules so the reviewer can read their contents instead
          of reporting them as "not initialized". Needed for repos whose
          analyses reference a submodule. Private submodules require the
          SUBMODULES_TOKEN secret; public submodules clone anonymously without it.
        type: boolean
        default: false
      allowed-bots:
        description: >-
          Comma-separated bot actors the reviewer accepts (passed to
          claude-code-action's allowed_bots). The default, github-actions[bot],
          is the actor `gh workflow run` uses when claude.yml re-dispatches a
          review, so those dispatched reviews aren't rejected as "non-human" —
          which is all gha's own setup needs (the job `if:` below already filters
          bot-authored pushes off the automatic pull_request path). Override only
          if you loosen that gate to review bot-authored pushes directly.
        type: string
        default: 'github-actions[bot]'
      track-progress:
        description: >-
          Enable tag mode (track_progress: true) for pull_request events so the
          reviewer posts a live tracking comment and can use the inline-comment
          tool. Defaults to false (agent mode), which is safe but produces
          summary-only reviews. Set to true only after anthropics/claude-code-action#1415
          ships a read_only input — until then, tag mode grants git write tools
          and the reviewer may push commits to the branch.
        type: boolean
        default: false
      show-full-output:
        description: >-
          Show the full JSON output from Claude Code (passed through to
          claude-code-action's show_full_output). Off by default. Turn it on to
          diagnose a review that fails inside the model call: the action
          otherwise hides the SDK output ("full output hidden for security"), so
          an auth / usage-limit / credit rejection — which surfaces as a
          0-cost, single-turn result with is_error:true — is unreadable from the
          failing check alone.
        type: boolean
        default: false
      apt-packages:
        description: >-
          Space-separated system packages to `apt-get install` before the
          review runs (e.g. `maxima` for a computer-algebra system so the
          reviewer's Bash tool can symbolically check a derivation it's
          reviewing). Mirrors claude.yml's `apt-packages` input. Empty by
          default — most repos don't need any.
        type: string
        default: ''
      pip-packages:
        description: >-
          Space-separated pip packages to install (`pip3 install
          --break-system-packages`) before the review runs (e.g. `sympy` for
          symbolic math). Mirrors claude.yml's `pip-packages` input. Empty by
          default.
        type: string
        default: ''
      lab-manual:
        description: >-
          Hold the PR to the SERG lab manual (coding style, coding practices,
          repository conventions) during the review, in addition to correctness.
          On by default for the R-package / Quarto repos this workflow targets;
          set false for repos where that R/tidyverse/Quarto-focused manual
          doesn't apply (e.g. a pure GitHub Actions, shell, or docs repo), so the
          reviewer isn't handed guidance irrelevant to the diff.
        type: boolean
        default: true
    secrets:
      # `required: false` so callers don't hard-fail at the call gate on
      # fork `pull_request` events, where secrets are unavailable: GitHub
      # evaluates required secrets before this workflow's job-level `if:`
      # (which already skips fork PRs) can run. With it optional, fork PRs
      # skip cleanly instead of red-X'ing. Same-repo runs still pass it.
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      SUBMODULES_TOKEN:
        required: false

jobs:
  # Fetch the last few claude[bot] review comments so the reviewer can skip
  # findings that were already raised, rebutted, and resolved in a prior round.
  # Runs under the same conditions as the review job so it skips together with
  # it (fork PRs, drafts, bot-triggered synchronize events).
  gather-context:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.sender.type != 'Bot'
      )
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    outputs:
      prior-context: ${{ steps.fetch.outputs.prior-context }}
    steps:
      - name: Fetch prior claude[bot] review comments
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          REPO: ${{ github.repository }}
        run: |
          # Issue comments hold the summary/tracking comment (verdict).
          # Filter to comments that contain a review heading to exclude
          # @claude task-handler responses (which also post as claude[bot] but
          # use "Claude finished…" / "Claude Code is working…" headers, not
          # the "### Code Review:" / "### Verdict" heading the review workflow uses).
          SUMMARY=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.user.login == "claude[bot]" and (.body | test("### (Code Review|Verdict)")))] | .[-3:] |
                  map("=== Summary posted \(.created_at) ===\n\(.body)") | join("\n\n")' \
            2>/dev/null || true)
          # PR review comments hold the per-line inline findings — these are the
          # most important for deduplication since the prompt tells Claude not to
          # restate inline findings in the summary.
          INLINE=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.user.login == "claude[bot]")] | .[-30:] |
                  map("=== Inline finding on \(.path):\(.line // .original_line) ===\n\(.body)") | join("\n\n")' \
            2>/dev/null || true)
          REVIEWS=$(printf '%s\n\n%s' "$INLINE" "$SUMMARY" | head -c 12000)
          DELIMITER="eof_$(openssl rand -hex 8)"
          {
            echo "prior-context<<${DELIMITER}"
            if [[ -n "${REVIEWS//[$'\n ']/}" ]]; then
              printf '%s\n' \
                '## Prior review context' \
                '' \
                'The comments below are your inline findings and summary verdicts from prior review rounds.' \
                'Before posting findings, check whether each one was already raised in a prior round.' \
                'If it was, and the author replied with a rebuttal explaining why the code is correct' \
                'or the finding is a false positive, and that thread was resolved — do not re-raise it.' \
                'Only re-raise if the current diff introduces a new instance on a different line,' \
                'or if the fix the author claimed to make is absent from the current diff.' \
                '' \
                "$REVIEWS"
            fi
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

  claude-review:
    needs: gather-context
    # Serialize runs per PR. The stash/restore reviewer dance below assumes
    # only one run mutates the reviewer list at a time. `cancel-in-progress:
    # true` is safe because this workflow is read-only (it never pushes, so it
    # can't cancel its own triggered run).
    #
    # A single @claude push can land here twice — the `synchronize` auto-review
    # AND claude.yml's re-dispatched review, both keyed on the same PR number —
    # so the later run supersedes (cancels) the earlier one. That's the intended
    # dedupe: the survivor posts the current review and the collapse/cancel
    # steps fold the other as OUTDATED, leaving one visible review per push.
    #
    # Caveat for require-review (below): a CANCELED claude-review run makes
    # require-review FAIL outright (cancelled != skipped, so its `if:` still
    # runs the assert, which then sees a non-success result). A consumer PR
    # that pushes a commit and ALSO posts an `@claude review` comment around
    # the same time — or whose claude.yml agent run finishes and re-dispatches
    # a review 1-3 minutes later, landing on top of the next push's
    # auto-review — can show a red require-review that is just this race, not
    # a real review failure. Check whether claude-review's conclusion is
    # `cancelled` (not `failure`) before troubleshooting the PR's content; the
    # survivor run's review is what to trust. To avoid triggering the race,
    # don't post `@claude review` immediately after pushing — let the
    # automatic review run alone, or wait for any in-flight dispatched review
    # to finish first.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || inputs.pr-number }}
      cancel-in-progress: true

    # Dispatched runs review unconditionally (so a review fires on the draft PR
    # claude.yml opens for an issue trigger). Otherwise skip — don't fail —
    # drafts, Dependabot, fork PRs (forks can't read the OAuth token), and
    # bot-triggered `synchronize` events (e.g. @claude pushing a commit), which
    # would otherwise red-X an automatic review of a bot-authored diff.
    if: >-
      always() &&
      needs.gather-context.result != 'cancelled' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.sender.type != 'Bot'
        )
      )

    outputs:
      quota_exhausted: ${{ steps.resolve-final.outputs.quota_exhausted }}

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      # Let the action install its github_ci MCP server so the reviewer can
      # read CI/check-run status for the PR. Without actions: read it logs
      # "Skipping CI server installation" and reviews blind to CI state.
      actions: read

    steps:
      # A PR that changes the review workflow file itself can't be reviewed by
      # the action: its App-token exchange requires the workflow to match the
      # default branch, so it 401s ("Workflow validation failed … must have
      # identical content to the … default branch") until merged — the action
      # says this is normal and to ignore it. Rather than post a failing check,
      # detect that case and skip the review; it runs normally once merged. The
      # file checked is the CALLER's review workflow, derived from
      # github.workflow_ref (owner/repo/.github/workflows/<file>@ref ->
      # .github/workflows/<file>): in a workflow_call run the github context is
      # the caller's, so workflow_ref is the consumer's stub — the callee
      # (reusable) path is exposed separately as github.job_workflow_ref — hence
      # this matches whatever name the consumer's stub uses, not just the
      # claude-code-review.yml convention. (Ported from qwt — gha #45.)
      - name: Parse caller workflow ref
        id: caller-wf
        uses: d-morrison/gha/.github/actions/parse-workflow-ref@v2
        with:
          workflow-ref: ${{ github.workflow_ref }}

      - name: Skip self-review when the PR edits this workflow
        id: selfmod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          WF_PATH: ${{ steps.caller-wf.outputs.path }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' 2>/dev/null || true)
          if printf '%s\n' "$files" | grep -qxF "$WF_PATH"; then
            echo "self_mod=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$PR_NUMBER edits $WF_PATH — skipping self-review (the action 401s on workflow validation until merged; it runs after merge)."
          else
            echo "self_mod=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.selfmod.outputs.self_mod != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      # Initialize submodules so the reviewer can read their contents — without
      # this, reviews of files that include or reference a submodule report it
      # as "not initialized". The shared composite action handles the
      # SUBMODULES_TOKEN insteadOf rewrite and the anonymous fallback; see
      # .github/actions/checkout-submodules.
      - name: Checkout submodules
        if: steps.selfmod.outputs.self_mod != 'true' && inputs.checkout-submodules
        uses: d-morrison/gha/.github/actions/checkout-submodules@v2
        with:
          submodules-token: ${{ secrets.SUBMODULES_TOKEN }}

      # Optional system/pip packages the reviewer's Bash tool can use — e.g. a
      # computer-algebra system (`apt-packages: maxima`, `pip-packages: sympy`)
      # so a math-heavy repo's reviewer can symbolically check a derivation
      # instead of eyeballing it. Empty by default; most repos need neither.
      - name: Install packages
        if: steps.selfmod.outputs.self_mod != 'true'
        uses: d-morrison/gha/.github/actions/install-packages@v2
        with:
          apt-packages: ${{ inputs.apt-packages }}
          pip-packages: ${{ inputs.pip-packages }}

      # Clear the requested reviewers (human and AI, e.g. Copilot) before
      # Claude runs so they aren't notified mid-run, then re-add them when
      # Claude finishes so the re-add fires a fresh notification — letting a
      # reviewer see Claude's review before starting their own. Also snapshot
      # the PR head SHA for the post-step.
      - name: Stash and clear reviewers; record starting head SHA
        id: stash
        if: steps.selfmod.outputs.self_mod != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
        run: |
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          echo "head_before=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          REVIEWERS_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers")
          USERS=$(echo "$REVIEWERS_JSON" | jq -c '[.users[].login]')
          TEAMS=$(echo "$REVIEWERS_JSON" | jq -c '[.teams[].slug]')
          # Capture AI reviewers (bot-type users, e.g. Copilot) separately so
          # the commit path can restore them best-effort — a bad bot login
          # shouldn't drop human reviewer re-requests. Human reviewers are
          # derived from USERS_BEFORE minus AI_USERS_BEFORE.
          # (`user.type` is always present in the REST user object.)
          AI_USERS=$(echo "$REVIEWERS_JSON" | jq -c '[.users[] | select(.type == "Bot") | .login]')
          echo "users=$USERS" >> "$GITHUB_OUTPUT"
          echo "teams=$TEAMS" >> "$GITHUB_OUTPUT"
          echo "ai_users=$AI_USERS" >> "$GITHUB_OUTPUT"
          if [ "$USERS" != "[]" ] || [ "$TEAMS" != "[]" ]; then
            # `|| true` is intentional and asymmetric with the restore step: a
            # failed stash leaves reviewers in place (recoverable); a failed
            # restore would drop them entirely (not recoverable).
            jq -n --argjson users "$USERS" --argjson teams "$TEAMS" \
              '{reviewers: $users, team_reviewers: $teams}' \
              | gh api -X DELETE "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" --input - || true
          fi

      # Compose the SERG lab-manual review guidance, gated on the `lab-manual`
      # input. Empty when a caller opts out (e.g. a non-R/Quarto repo), so the
      # reviewer isn't handed R/tidyverse-specific instructions irrelevant to its
      # diff. Interpolated into the prompt below as
      # `steps.labmanual.outputs.guidance`. Kept as a here-doc (not an inline
      # `${{ ... && '...' || '' }}` ternary) because the guidance is multi-line.
      - name: Compose lab-manual review guidance
        id: labmanual
        if: steps.selfmod.outputs.self_mod != 'true'
        env:
          LAB_MANUAL: ${{ inputs.lab-manual }}
        run: |
          if [ "$LAB_MANUAL" != "true" ]; then
            printf 'guidance=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DELIM="labman_$(openssl rand -hex 8)"
          {
          printf '%s\n' "guidance<<$DELIM"
          cat <<'GUIDANCE'
          **Hold this PR to the SERG lab manual.** This repository is part
          of the `d-morrison` / `UCD-SERG` / `ucdavis` family of R-package
          and Quarto repositories, so evaluate the diff against the
          [UCD-SERG lab manual](https://ucd-serg.github.io/lab-manual/) —
          the lab's authority on coding, reproducibility, and collaboration
          conventions — in addition to correctness. Especially:

          - [Coding style](https://ucd-serg.github.io/lab-manual/coding-style.html) —
            object naming, line breaks/formatting, function documentation,
            comments, message/communication style, and Quarto code-reference
            conventions (backticked `pkg::fn()`, markdown package links, no
            raw HTML in `.qmd`).
          - [Coding practices](https://ucd-serg.github.io/lab-manual/coding-practices.html) —
            function decomposition and
            [length limits](https://ucd-serg.github.io/lab-manual/coding-practices.html#function-length-limits),
            testing requirements, the QA checklist, documentation, `{here}`
            for paths, and tidyverse idioms.
          - [Code repositories](https://ucd-serg.github.io/lab-manual/code-repositories.html) —
            repository organization and version-control practices.

          The manual defers to the [tidyverse style guide](https://style.tidyverse.org/)
          for R; prefer tidyverse idioms and the native `|>` pipe. Cite the
          relevant manual section when raising a point, and distinguish
          blocking issues from optional suggestions.
          GUIDANCE
          printf '%s\n' "$DELIM"
          } >> "$GITHUB_OUTPUT"

      # The actual claude-code-action call (allowedTools/disallowedTools,
      # system prompt, review prompt) lives in the run-claude-review-attempt
      # composite action so it can be invoked a second time, unchanged, as a
      # same-prompt retry below — without duplicating that ~100-line `with:`
      # block between two near-identical steps (gha#185; see the composite
      # action's own header comment for why a duplicated inline step would be
      # a DRY violation this repo's CLAUDE.md flags).
      - name: Run Claude Code Review
        id: claude-review
        if: steps.selfmod.outputs.self_mod != 'true'
        uses: d-morrison/gha/.github/actions/run-claude-review-attempt@v2
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}
          prior-context: ${{ needs.gather-context.outputs.prior-context }}
          labmanual-guidance: ${{ steps.labmanual.outputs.guidance }}
          prompt-addendum: ${{ inputs.prompt-addendum }}
          track-progress: ${{ inputs.track-progress && github.event_name == 'pull_request' && 'true' || 'false' }}
          show-full-output: ${{ inputs.show-full-output }}
          allowed-bots: ${{ inputs.allowed-bots }}

      # Guard: fail the check when the Claude run ended with is_error:true.
      # The action exits 0 even in that case (the result object's subtype is
      # "success" but is_error is true), so without this step a silently-failed
      # review looks green. Runs only when claude-review exited 0 (outcome ==
      # 'success'); if the action step itself failed, the job is already red.
      # Falls back to the well-known temp path when the action doesn't expose
      # the execution_file output on the pinned version.
      #
      # Special case: when total_cost_usd==0 and num_turns==1, the API rejected
      # the request before Claude did any work (quota exhaustion, auth failure,
      # or similar pre-processing rejection). Failing the check in this case is
      # wrong — the PR hasn't been reviewed, but it also hasn't been found to
      # have problems. Skip gracefully instead and post a comment so the author
      # knows to re-trigger once the quota resets.
      # The guard logic itself lives in scripts/check-review-execution.sh so
      # it can be exercised offline against canned fixtures (see
      # scripts/tests/), without a live Claude API call — see the
      # `review-fail-check` job in _selftest.yml (#174). That script lives in
      # THIS reusable workflow's own repo (d-morrison/gha), not the caller's
      # — the "Checkout repository" step above checks out the CALLER, not
      # d-morrison/gha. #191 tried resolving d-morrison/gha's own ref via
      # github.job_workflow_ref and checking it out into a side directory, but
      # that context var came back EMPTY at this call site on real consumer
      # runs even though the calling step passed it correctly (gha#196) — the
      # #191 fix was only unit-tested via the sed-parsing logic in isolation,
      # never exercised end-to-end. Delegate to a composite action instead: a
      # composite action's own files are always reachable via
      # github.action_path regardless of how the calling reusable workflow was
      # invoked (workflow_call, a re-dispatched workflow_dispatch, automatic
      # pull_request, ...) — the same reasoning that made parse-workflow-ref
      # itself a composite action rather than a checked-out script.
      - name: Resolve execution file path
        id: exec-file
        if: steps.claude-review.outcome == 'success'
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [[ -z "$EXECUTION_FILE" ]]; then
            EXECUTION_FILE="${RUNNER_TEMP:-/home/runner/work/_temp}/claude-execution-output.json"
            echo "::warning::execution_file output not set; falling back to $EXECUTION_FILE"
          fi
          echo "path=$EXECUTION_FILE" >> "$GITHUB_OUTPUT"

      # Persist the raw execution output regardless of what the guard finds,
      # so a stub-review recurrence (gha#185, gha#198) has a downloadable
      # turn-by-turn transcript to diagnose instead of needing show-full-output
      # flipped on ahead of time and a lucky re-trigger — the gap that left
      # #185's original report undiagnosable ("the exact denied tool call
      # isn't visible in the log"). continue-on-error: the artifact is a
      # diagnostic nicety, never a reason to fail an otherwise-clean review.
      - name: Upload review execution output
        if: steps.exec-file.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-review-execution-${{ github.run_id }}-${{ github.run_attempt }}-attempt1
          path: ${{ steps.exec-file.outputs.path }}
          retention-days: 14
          if-no-files-found: warn

      # continue-on-error: true so a stub result (gha#185) doesn't red-X the
      # job outright — the retry block below gets a chance to recover it
      # first. "Resolve final review outcome" (below) is what actually fails
      # the job for real when neither attempt produces a usable review.
      - name: Fail the check if the review did not complete (attempt 1)
        id: fail-check
        if: steps.claude-review.outcome == 'success'
        continue-on-error: true
        uses: d-morrison/gha/.github/actions/run-review-guard@v2
        with:
          execution-file: ${{ steps.exec-file.outputs.path }}

      # Same-prompt retry, ONLY for the specific signature this issue tracks:
      # the SDK call succeeded (no is_error, no quota/auth rejection) and
      # produced real, non-empty text, but never stated a verdict —
      # reproduced repeatedly with a low permission_denials_count, consistent
      # with a single denied tool call derailing an otherwise-short run
      # (gha#185). A hard SDK error or genuinely empty output is a different
      # failure class (not retried here). A run stubbing for a DIFFERENT
      # reason (e.g. gha#198's much-higher-denial-count signature, which has
      # repeatedly NOT recovered on retry per #198's own findings) is
      # excluded by check-review-execution.sh's own
      # permission_denials_count <= STUB_RETRY_MAX_DENIALS (default 5) check
      # — stub_review is NOT set purely from "no verdict"; the denial-count
      # gate is what actually keeps this retry from firing on #198's pattern
      # (gha#201 review caught an earlier version of this comment claiming
      # that exclusion without the code actually implementing it).
      #
      # Empirically, re-running has recovered cleanly for THIS (low-denial)
      # signature: the issue's original report noted two other runs on the
      # same PR completed normally, and this recurrence was itself found by
      # re-running the same PR.
      - name: Retry Claude Code Review after a stub result
        id: claude-review-retry
        if: >-
          steps.claude-review.outcome == 'success' &&
          steps.fail-check.outcome == 'failure' &&
          steps.fail-check.outputs.stub_review == 'true'
        continue-on-error: true
        uses: d-morrison/gha/.github/actions/run-claude-review-attempt@v2
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}
          prior-context: ${{ needs.gather-context.outputs.prior-context }}
          labmanual-guidance: ${{ steps.labmanual.outputs.guidance }}
          prompt-addendum: ${{ inputs.prompt-addendum }}
          track-progress: ${{ inputs.track-progress && github.event_name == 'pull_request' && 'true' || 'false' }}
          show-full-output: ${{ inputs.show-full-output }}
          allowed-bots: ${{ inputs.allowed-bots }}
          is-retry: 'true'

      - name: Resolve execution file path (retry)
        id: exec-file-retry
        if: steps.claude-review-retry.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude-review-retry.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [[ -z "$EXECUTION_FILE" ]]; then
            EXECUTION_FILE="${RUNNER_TEMP:-/home/runner/work/_temp}/claude-execution-output.json"
            echo "::warning::execution_file output not set; falling back to $EXECUTION_FILE"
          fi
          echo "path=$EXECUTION_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload review execution output (retry)
        if: steps.exec-file-retry.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-review-execution-${{ github.run_id }}-${{ github.run_attempt }}-attempt2
          path: ${{ steps.exec-file-retry.outputs.path }}
          retention-days: 14
          if-no-files-found: warn

      - name: Fail the check if the retry also did not complete
        id: fail-check-retry
        if: steps.exec-file-retry.outcome == 'success'
        continue-on-error: true
        uses: d-morrison/gha/.github/actions/run-review-guard@v2
        with:
          execution-file: ${{ steps.exec-file-retry.outputs.path }}

      # Single point that decides which attempt's outputs the rest of the job
      # uses, and the ONLY step that genuinely fails the job when neither
      # attempt produced a usable review (both "Fail the check" steps above
      # are continue-on-error so a recovered retry doesn't leave the job
      # red). Runs unconditionally (always()) so it can report cleanly even
      # if an earlier step in this chain errored outright.
      - name: Resolve final review outcome
        id: resolve-final
        if: always() && steps.selfmod.outputs.self_mod != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.fail-check.outcome }}" == "success" ]]; then
            echo "review_text_file=${{ steps.fail-check.outputs.review_text_file }}" >> "$GITHUB_OUTPUT"
            echo "quota_exhausted=${{ steps.fail-check.outputs.quota_exhausted }}" >> "$GITHUB_OUTPUT"
            echo "Attempt 1 completed cleanly."
            exit 0
          fi
          if [[ "${{ steps.fail-check-retry.outcome }}" == "success" ]]; then
            echo "review_text_file=${{ steps.fail-check-retry.outputs.review_text_file }}" >> "$GITHUB_OUTPUT"
            echo "quota_exhausted=${{ steps.fail-check-retry.outputs.quota_exhausted }}" >> "$GITHUB_OUTPUT"
            echo "::notice::Attempt 1 produced a stub review (no verdict, gha#185); the retry recovered cleanly."
            exit 0
          fi
          # Both attempts failed to produce a usable review. Attribute the
          # failure to whichever attempt actually ran last, rather than
          # always citing attempt 1's stub_review flag — the retry can fail
          # for a DIFFERENT reason than attempt 1 did (a hard SDK error, an
          # empty result, or another stub that this time exceeded the
          # denial-count threshold), and misattributing that undercuts this
          # PR's own diagnosability goal (gha#201 review finding 2).
          if [[ "${{ steps.fail-check-retry.outcome }}" == "failure" ]]; then
            if [[ "${{ steps.fail-check-retry.outputs.stub_review }}" == "true" ]]; then
              echo "::error::Attempt 1 produced a stub review (gha#185) and the retry ALSO ended without a verdict with a low denial count — treating as a failed review."
            else
              echo "::error::Attempt 1 produced a stub review (gha#185) but the retry failed for a different reason (hard SDK error, empty output, or a no-verdict result above the denial-count threshold) — treating as a failed review."
            fi
          elif [[ "${{ steps.claude-review-retry.outcome }}" == "success" ]]; then
            echo "::error::Attempt 1 produced a stub review (gha#185) and the retry ran but never produced a checkable execution file — treating as a failed review."
          elif [[ "${{ steps.fail-check.outputs.stub_review }}" == "true" ]]; then
            echo "::error::Attempt 1 produced a stub review (gha#185's low-denial signature) but the retry itself did not run to completion — treating as a failed review."
          else
            echo "::error::Claude review did not complete successfully and was not eligible for a stub-review retry (either a hard SDK error, empty output, or a no-verdict result above the denial-count threshold — see gha#198)."
          fi
          exit 1

      # When the API rejected the request before Claude could review (quota
      # exhaustion, auth failure, etc.), post a notice so the PR author knows
      # why the review didn't run and how to re-trigger it.
      - name: Post quota-exhausted comment
        if: steps.resolve-final.outputs.quota_exhausted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "> [!WARNING]
          > **Claude review skipped — API quota exhausted.** The \`CLAUDE_CODE_OAUTH_TOKEN\` account's API quota is exhausted. Re-trigger the review by pushing a new commit or re-running the workflow once the quota resets. [View run]($RUN_URL)"

      # In agent mode, display_report writes Claude's output to the step
      # summary, not to the PR. Post it manually here. Tag mode auto-posts
      # the tracking comment on pull_request events, so skip this step then
      # (it would duplicate the comment). Always run on workflow_dispatch
      # since the action rejects track_progress there regardless. Closes #87.
      - name: Post review comment
        if: >-
          steps.resolve-final.outcome == 'success' &&
          steps.resolve-final.outputs.quota_exhausted != 'true' &&
          !(inputs.track-progress && github.event_name == 'pull_request')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_TEXT_FILE: ${{ steps.resolve-final.outputs.review_text_file }}
        run: |
          # resolve-final already picked the winning attempt's extracted and
          # validated review text (and would have failed the job if neither
          # attempt produced one), so reuse its file instead of re-parsing
          # $EXECUTION_FILE here too.
          REVIEW="$(cat "$REVIEW_TEXT_FILE")"
          if [[ -z "$REVIEW" ]]; then
            echo "No review text found in execution output; skipping comment."
            exit 0
          fi
          # Include the run URL so the collapse step can match this comment by
          # run ID (same regex: `actions/runs/<id>` in the body).
          # Write the body to a file and post it with --body-file so the review
          # text — which can contain backticks, $(...), quotes, or a leading
          # `---` — is never re-parsed by the shell as it would be if inlined as
          # a --body argument. printf assembles the file at runtime, which also
          # keeps the `---` separator off column 0: a bare `---` on its own line
          # at column 0 in a YAML run block is read as a document separator by
          # both PyYAML and GitHub Actions' parser, truncating the script
          # mid-string and producing "unexpected EOF" on the runner.
          BODY_FILE="$(mktemp)"
          printf '%s\n\n---\n\n%s' \
            "**Claude finished review** — [View run]($RUN_URL)" \
            "$REVIEW" > "$BODY_FILE"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$BODY_FILE"

      # With sticky disabled, every run leaves its own review comment. Collapse
      # the older ones (minimize as OUTDATED) so the PR shows one expanded,
      # current review with history folded beneath it. Only THIS workflow's
      # review comments are touched — identified by the run each comment links
      # to (its workflow `path` is this file) — so `@claude` task comments from
      # claude.yml (same `claude[bot]` author) are left alone.
      #
      # Not gated to pull_request: a dispatched (workflow_dispatch / agent-mode)
      # review that wins the per-PR concurrency race must fold the earlier
      # pushes' review comments too, or they linger now that dispatched runs can
      # succeed (allowed_bots, above). The run_id→path match already scopes this
      # to this workflow's comments, so running it on dispatched reviews is safe.
      # The "Post review comment" step above ensures that dispatched and
      # pull_request runs always leave a comment with an `actions/runs/<id>` link,
      # so this collapse step can match and fold it in future rounds.
      - name: Collapse previous Claude review comments
        if: >-
          steps.resolve-final.outcome == 'success' &&
          steps.resolve-final.outputs.quota_exhausted != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          # The caller invokes this reusable workflow, so a comment "belongs"
          # to this review iff its linked run used the same workflow file the
          # current run did. Reuse the `caller-wf` step's already-parsed path
          # (from github.workflow_ref) instead of re-deriving it here.
          THIS_WF: ${{ steps.caller-wf.outputs.path }}
        run: |
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[]
                  | select(.user.login == "claude[bot]")
                  | "\(.node_id)\t\(((.body | capture("actions/runs/(?<r>[0-9]+)").r)?) // "")"' \
          | while IFS=$'\t' read -r NODE_ID RUN_ID; do
              [ -z "$RUN_ID" ] && continue
              [ "$RUN_ID" = "$CURRENT_RUN_ID" ] && continue
              WF_PATH=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.path' 2>/dev/null || true)
              [ "$WF_PATH" = "$THIS_WF" ] || continue
              echo "Collapsing review comment $NODE_ID (run $RUN_ID)"
              gh api graphql -f query='
                mutation($id: ID!) {
                  minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                    minimizedComment { isMinimized }
                  }
                }' -f id="$NODE_ID" || true
            done

      # When this run is canceled (e.g. cancel-in-progress fires because a newer
      # commit superseded it), any tracking comment left by a tag-mode run
      # (track-progress: true) would be stuck showing "review in progress".
      # In agent mode (the default), no tracking comment is created, so this
      # step is a no-op — kept as a safety net for tag-mode opt-in callers.
      # The comment is identified by its run ID link — the same matcher the
      # collapse step uses.
      - name: Explain and fold tracking comment when canceled
        if: cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          NOTE=$(printf '> [!WARNING]\n> **Review canceled.** This run was canceled before it finished — superseded by a newer review of the same PR (`cancel-in-progress`), e.g. a later commit or a re-dispatched review. A fresh review runs on the latest commit; see the [canceled run](%s).\n\n---\n\n' "$RUN_URL")
          # The paginated list already carries each comment's body, so capture it
          # here (base64-encoded so an embedded tab/newline can't break the
          # tab-delimited `read`) rather than making a second per-comment fetch.
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[]
                  | select(.user.login == "claude[bot]")
                  | "\(.node_id)\t\(.id)\t\(((.body | capture("actions/runs/(?<r>[0-9]+)").r)?) // "")\t\(.body | @base64)"' \
          | while IFS=$'\t' read -r NODE_ID COMMENT_ID RUN_ID B64_BODY; do
              [ "$RUN_ID" = "$CURRENT_RUN_ID" ] || continue
              echo "Annotating and folding canceled tracking comment $COMMENT_ID (run $RUN_ID)"
              BODY=$(printf '%s' "$B64_BODY" | base64 -d)
              gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -f body="${NOTE}${BODY}" \
                || echo "::warning::Could not update canceled tracking comment $COMMENT_ID."
              gh api graphql -f query='
                mutation($id: ID!) {
                  minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                    minimizedComment { isMinimized }
                  }
                }' -f id="$NODE_ID" || echo "::warning::Could not fold canceled tracking comment."
            done

      - name: Re-assign reviewers after Claude finishes
        if: always() && steps.stash.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          HEAD_BEFORE: ${{ steps.stash.outputs.head_before }}
          USERS_BEFORE: ${{ steps.stash.outputs.users }}
          TEAMS_BEFORE: ${{ steps.stash.outputs.teams }}
          AI_USERS_BEFORE: ${{ steps.stash.outputs.ai_users }}
        run: |
          PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          HEAD_AFTER=$(echo "$PR_JSON" | jq -r '.head.sha')

          if [ "$HEAD_AFTER" = "$HEAD_BEFORE" ]; then
            # No new commits — restore the original reviewer set.
            USERS=${USERS_BEFORE:-[]}
            TEAMS=${TEAMS_BEFORE:-[]}
            if [ "$USERS" = "[]" ] && [ "$TEAMS" = "[]" ]; then
              echo "No reviewers were originally requested."
              exit 0
            fi
            echo "Restoring original reviewers."
            # No `|| true`: a failed restore silently drops the reviewer, so
            # fail loudly instead of letting them vanish.
            jq -n --argjson users "$USERS" --argjson teams "$TEAMS" \
              '{reviewers: $users, team_reviewers: $teams}' \
              | gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" --input -
            exit 0
          fi

          # Claude pushed commits. Re-request the human reviewers that were
          # stashed before the run — anyone originally requested who isn't a
          # bot — AND put back any AI reviewers (e.g. Copilot) and team reviewers.
          # These are separate POSTs (POST adds to the requested set, it doesn't
          # replace it): the human re-request fails loudly if it errors; AI-user
          # and team restores are best-effort so a bad login/slug can't undo the
          # human re-request.
          #
          # Use USERS_BEFORE (minus AI_USERS_BEFORE) instead of the PR's
          # current assignee list: a human reviewer who isn't a PR assignee
          # would otherwise lose their review request on every commit push.
          AI_USERS=${AI_USERS_BEFORE:-[]}
          HUMAN_USERS=$(jq -cn \
            --argjson all "${USERS_BEFORE:-[]}" \
            --argjson bots "$AI_USERS" \
            '[($all[]) | select(. as $u | ($bots | index($u)) == null)]')
          if [ "$HUMAN_USERS" != "[]" ]; then
            echo "Re-requesting human reviewers: $HUMAN_USERS"
            jq -n --argjson users "$HUMAN_USERS" '{reviewers: $users}' \
              | gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" --input -
          else
            echo "No human reviewers to re-request."
          fi

          if [ "$AI_USERS" != "[]" ]; then
            echo "Restoring AI reviewers: $AI_USERS"
            jq -n --argjson users "$AI_USERS" '{reviewers: $users}' \
              | gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" --input - \
              || echo "::warning::Could not restore AI reviewers ($AI_USERS)."
          fi

          TEAMS=${TEAMS_BEFORE:-[]}
          if [ "$TEAMS" != "[]" ]; then
            echo "Restoring team reviewers: $TEAMS"
            jq -n --argjson teams "$TEAMS" '{team_reviewers: $teams}' \
              | gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" --input - \
              || echo "::warning::Could not restore team reviewers ($TEAMS)."
          fi

          if [ "$HUMAN_USERS" = "[]" ] && [ "$AI_USERS" = "[]" ] && [ "$TEAMS" = "[]" ]; then
            echo "No human reviewers, AI reviewers, or team reviewers to restore; leaving reviewers cleared."
          fi

  # Gate job: skipped (gray) when the claude-review job was itself skipped
  # (fork/draft/bot) or when the API quota was exhausted. Passes on a clean
  # review, fails when the review job failed for a real reason.
  #
  # GitHub Actions can only produce a "skipped" job conclusion via a false
  # `if:` — a running job can only conclude success or failure. This second
  # job is the mechanism: when quota_exhausted=true the `if:` is false and
  # the job shows the gray skip icon instead of a misleading green checkmark.
  #
  # Consumers should use this job's name (e.g. `review / require-review`) in
  # branch protection required-checks instead of (or in addition to)
  # `review / claude-review`. A skipped result does not block merging; a
  # failing result does.
  require-review:
    needs: claude-review
    # Run when the claude-review job ran and quota was not exhausted.
    # Skip (gray) when:
    #   - claude-review was skipped (fork/draft/bot `if:` was false)
    #   - quota_exhausted=true (API rejected the request before any work)
    if: >-
      always() &&
      needs.claude-review.result != 'skipped' &&
      !fromJSON(needs.claude-review.outputs.quota_exhausted || 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Assert review succeeded
        run: |
          if [[ "${{ needs.claude-review.result }}" != "success" ]]; then
            echo "::error::Claude review job did not succeed (result: ${{ needs.claude-review.result }})."
            exit 1
          fi
          echo "Claude review completed."
