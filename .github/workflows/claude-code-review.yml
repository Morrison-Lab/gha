name: Claude Code Review (reusable)

# Read-only Claude PR review workflow. Runs the upstream
# `code-review@claude-code-plugins` plugin on a PR and posts its findings.
# Ported from the canonical d-morrison versions (serodynamics / qwt / rme).
#
# The caller stub (see examples/claude-code-review.yml) holds the `on:`
# triggers — `pull_request` for automatic review and `workflow_dispatch` so
# claude.yml can re-dispatch a review after an @claude run pushes commits.
# The stub passes the dispatch's pr_number through as the `pr-number` input.
#
# This workflow is read-only: it always runs claude-code-action in agent mode
# (track_progress: false) so git write tools are never in ALLOWED_TOOLS.
# Tag mode hardcodes git write tools regardless of --disallowedTools, which
# caused unauthorized commits (serodynamics PR #175, commit 02af72b). Agent
# mode fixes this; cancel-in-progress: true is safe because no push can occur.

on:
  workflow_call:
    inputs:
      pr-number:
        description: PR number to review (set by claude.yml's workflow_dispatch; empty for pull_request runs).
        type: string
        default: ''
      prompt-addendum:
        description: Repo-specific review guidance appended to the plugin prompt.
        type: string
        default: ''
      checkout-submodules:
        description: >-
          Check out submodules so the reviewer can read their contents instead
          of reporting them as "not initialized". Needed for repos whose
          analyses reference a submodule. Private submodules require the
          SUBMODULES_TOKEN secret; public submodules clone anonymously without it.
        type: boolean
        default: false
      allowed-bots:
        description: >-
          Comma-separated bot actors the reviewer accepts (passed to
          claude-code-action's allowed_bots). The default, github-actions[bot],
          is the actor `gh workflow run` uses when claude.yml re-dispatches a
          review, so those dispatched reviews aren't rejected as "non-human" —
          which is all gha's own setup needs (the job `if:` below already filters
          bot-authored pushes off the automatic pull_request path). Override only
          if you loosen that gate to review bot-authored pushes directly.
        type: string
        default: 'github-actions[bot]'
      track-progress:
        description: >-
          Enable tag mode (track_progress: true) for pull_request events so the
          reviewer posts a live tracking comment and can use the inline-comment
          tool. Defaults to false (agent mode), which is safe but produces
          summary-only reviews. Set to true only after anthropics/claude-code-action#1415
          ships a read_only input — until then, tag mode grants git write tools
          and the reviewer may push commits to the branch.
        type: boolean
        default: false
      show-full-output:
        description: >-
          Show the full JSON output from Claude Code (passed through to
          claude-code-action's show_full_output). Off by default. Turn it on to
          diagnose a review that fails inside the model call: the action
          otherwise hides the SDK output ("full output hidden for security"), so
          an auth / usage-limit / credit rejection — which surfaces as a
          0-cost, single-turn result with is_error:true — is unreadable from the
          failing check alone.
        type: boolean
        default: false
      apt-packages:
        description: >-
          Space-separated system packages to `apt-get install` before the
          review runs (e.g. `maxima` for a computer-algebra system so the
          reviewer's Bash tool can symbolically check a derivation it's
          reviewing). Mirrors claude.yml's `apt-packages` input. Empty by
          default — most repos don't need any.
        type: string
        default: ''
      pip-packages:
        description: >-
          Space-separated pip packages to install (`pip3 install
          --break-system-packages`) before the review runs (e.g. `sympy` for
          symbolic math). Mirrors claude.yml's `pip-packages` input. Empty by
          default.
        type: string
        default: ''
      lab-manual:
        description: >-
          Hold the PR to the SERG lab manual (coding style, coding practices,
          repository conventions) during the review, in addition to correctness.
          On by default for the R-package / Quarto repos this workflow targets;
          set false for repos where that R/tidyverse/Quarto-focused manual
          doesn't apply (e.g. a pure GitHub Actions, shell, or docs repo), so the
          reviewer isn't handed guidance irrelevant to the diff.
        type: boolean
        default: true
      check-latex-macros:
        description: >-
          Check PR diffs for LaTeX math that could be simplified using an
          existing macro from the d-morrison/macros submodule, and for
          nontrivial math expressions (more than ~5 constituent parts)
          repeated 3+ times with no existing macro — a candidate for a new
          one. Off by default. The macro checks read definitions only from
          a locally checked-out submodule (the repo's own pinned version
          is authoritative, so the reviewer is told not to fetch the
          upstream macros repo instead): set checkout-submodules: true
          too, or this only ever reports that it found no macro
          definitions to check against.
        type: boolean
        default: false
      report-cost:
        description: >-
          Post a follow-up PR comment with the review's dollar cost
          (total_cost_usd from claude-code-action's execution output, summed
          across the initial attempt and the gha#185 stub-review retry when
          one ran). Upstream computes this cost but never surfaces it in a PR
          comment (gha#219; see README.md's feature-parity table for the
          upstream source citation) — this surfaces it on the PR itself. On
          by default; set false to suppress it.
        type: boolean
        default: true
      model:
        description: >-
          Model for the reviewer to run on (passed through to the underlying
          Claude Code CLI's --model flag, e.g. claude-opus-4-8). Empty by
          default, which falls through to claude-code-action's own default.
          Unlike claude.yml, this workflow has no generic claude-args
          passthrough input (its claude_args is entirely computed inside the
          run-claude-review-attempt composite action), so this is the only
          way a caller can influence which model reviews its PRs (gha#186).
        type: string
        default: ''
      use-ai-config:
        description: >-
          Install the Morrison-Lab/ai-config plugin (ai-config@Morrison-Lab), so
          the reviewer applies the lab's shared review conventions -- the
          standing prose, math, and code-review rules the skills and shared
          fragments in that repo encode -- rather than only the calling
          repo's own CLAUDE.md. On by default; set false to opt out.
          Installed alongside, not instead of, the built-in
          code-review@claude-code-plugins.
        type: boolean
        default: true
      plugin-marketplaces:
        description: >-
          Extra newline-separated Claude Code plugin marketplace Git URLs,
          added on top of the two marketplaces this workflow already uses
          (anthropics/claude-code.git for the code-review plugin, and
          Morrison-Lab/ai-config.git unless use-ai-config is false). Pair with
          the plugins input below -- adding a marketplace alone installs
          nothing. Empty by default.
        type: string
        default: ''
      plugins:
        description: >-
          Extra newline-separated Claude Code plugin refs to install
          (<plugin>@<marketplace-name>), added on top of the built-in
          code-review@claude-code-plugins and ai-config@Morrison-Lab. Each
          marketplace name must match the name that marketplace declares in
          its own .claude-plugin/marketplace.json -- it is not derived from
          the URL written into plugin-marketplaces. Empty by default.
        type: string
        default: ''
      extra-secret-names:
        description: >-
          Space-, comma-, or newline-separated list of caller secret names to
          export into the reviewer environment (e.g. 'EPI202_TOKEN EPI204_TOKEN').
          Requires 'secrets: inherit' on the caller's 'uses:' call. Secret names
          must match [A-Z_][A-Z0-9_]* and cannot shadow protected workflow
          environment variables. Empty to skip.
        type: string
        default: ''
    secrets:
      # `required: false` so callers don't hard-fail at the call gate on
      # fork `pull_request` events, where secrets are unavailable: GitHub
      # evaluates required secrets before this workflow's job-level `if:`
      # (which already skips fork PRs) can run. With it optional, fork PRs
      # skip cleanly instead of red-X'ing. Same-repo runs still pass it.
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      SUBMODULES_TOKEN:
        required: false

jobs:
  # Fetch the last few claude[bot] review comments so the reviewer can skip
  # findings that were already raised, rebutted, and resolved in a prior round.
  # Runs under the same conditions as the review job so it skips together with
  # it (fork PRs, drafts, bot-triggered synchronize events).
  gather-context:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.sender.type != 'Bot'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: read
      pull-requests: read
    outputs:
      dispatch-guard-blocked: ${{ steps.dispatch-guard.outputs.blocked }}
      prior-context: ${{ steps.fetch.outputs.prior-context }}
    steps:
      # Defense-in-depth for the workflow_dispatch path (gha#235): the
      # automatic pull_request path already gates on same-repo/non-draft/
      # non-bot via the job `if:` below, using the event payload directly.
      # workflow_dispatch carries no such payload (only inputs.pr-number), so
      # a manual dispatch against a fork or Dependabot PR number would
      # otherwise run unconditionally. Both real dispatch entry points
      # (claude.yml's trusted-author gate, and the /review-comment path's
      # OWNER/MEMBER/COLLABORATOR check) are already trust-gated upstream of
      # this, and a dispatched run reads the PR's diff over the API rather
      # than executing checked-out fork code -- so this isn't closing an
      # active hole, just failing a mistaken manual dispatch fast with a
      # clear message instead of running a review against an unexpected PR.
      - name: Guard dispatched reviews against fork / Dependabot PRs
        id: dispatch-guard
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          # Explicit `+e`, not just omitting it: a run: step with no shell:
          # key defaults to `bash -e {0}` (GitHub's own default shell
          # invocation), so -e is already active before this script starts
          # and stays active unless a `set` call names it explicitly -- a
          # bare `set -uo pipefail` does NOT turn it off. With -e active,
          # PR_JSON=$(gh pr view ...) is a plain assignment statement (not
          # inside an if/while test or negated with !, the only -e
          # exemptions), so a failing `gh pr view` would abort the script
          # AT that line, before any following `if [[ $? -ne 0 ]]` check
          # ever runs -- reproducing the exact fail-open bug this is meant
          # to fix (gha#244 review, round 2; confirmed with a standalone
          # `bash -e {0}` repro before applying this fix).
          set +e -uo pipefail
          # Fail CLOSED, not open: if the `gh pr view` call itself fails
          # (rate limit, transient 5xx, bad pr-number), write blocked=true
          # before exiting non-zero. Without this, the step's failure would
          # leave `blocked` unset -- and claude-review's `if:` below only
          # excludes a `cancelled` gather-context result and an explicit
          # `blocked == 'true'`, so an empty output from a *failed* guard
          # would satisfy both and let the review run anyway, defeating the
          # guard's whole purpose on exactly the transient error it should
          # be most defensive about (gha#244 review).
          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json isCrossRepository,author)
          if [[ $? -ne 0 ]]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::error::Could not resolve PR #$PR_NUMBER's cross-repository/author status via gh pr view; failing closed (treating as blocked)."
            exit 1
          fi
          IS_CROSS_REPO=$(jq -r '.isCrossRepository' <<< "$PR_JSON")
          AUTHOR_LOGIN=$(jq -r '.author.login' <<< "$PR_JSON")
          if [[ "$IS_CROSS_REPO" == "true" || "$AUTHOR_LOGIN" == "dependabot[bot]" ]]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Dispatched review of PR #$PR_NUMBER skipped -- fork or Dependabot PR (isCrossRepository=$IS_CROSS_REPO, author=$AUTHOR_LOGIN)."
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch prior claude[bot] review comments
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          REPO: ${{ github.repository }}
        run: |
          # Issue comments hold the summary/tracking comment (verdict). The
          # review summary is posted by the workflow's own "Post review
          # comment" step in agent mode (author github-actions[bot]), and by
          # claude-code-action's tracking comment in tag mode (author
          # claude[bot]) -- so match either bot. The "### Verdict" body test
          # is what excludes non-review comments from either author: the cost
          # and quota comments (github-actions[bot]) and the @claude
          # task-handler responses (claude[bot], "Claude finished..." headers)
          # carry no verdict heading.
          SUMMARY=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select((.user.login == "github-actions[bot]" or .user.login == "claude[bot]") and (.body | test("### (Code Review|Verdict)")))] | .[-3:] |
                  map("=== Summary posted \(.created_at) ===\n\(.body)") | join("\n\n")' \
            2>/dev/null || true)
          # PR review comments hold the per-line inline findings — these are the
          # most important for deduplication since the prompt tells Claude not to
          # restate inline findings in the summary.
          INLINE=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.user.login == "claude[bot]")] | .[-30:] |
                  map("=== Inline finding on \(.path):\(.line // .original_line) ===\n\(.body)") | join("\n\n")' \
            2>/dev/null || true)
          REVIEWS=$(printf '%s\n\n%s' "$INLINE" "$SUMMARY" | head -c 12000)
          DELIMITER="eof_$(openssl rand -hex 8)"
          {
            echo "prior-context<<${DELIMITER}"
            if [[ -n "${REVIEWS//[$'\n ']/}" ]]; then
              printf '%s\n' \
                '## Prior review context' \
                '' \
                'The comments below are your inline findings and summary verdicts from prior review rounds.' \
                'Before posting findings, check whether each one was already raised in a prior round.' \
                'If it was, and the author replied with a rebuttal explaining why the code is correct' \
                'or the finding is a false positive, and that thread was resolved — do not re-raise it.' \
                'Only re-raise if the current diff introduces a new instance on a different line,' \
                'or if the fix the author claimed to make is absent from the current diff.' \
                '' \
                "$REVIEWS"
            fi
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

  claude-review:
    needs: gather-context
    # Serialize runs per PR. The stash/restore reviewer dance below assumes
    # only one run mutates the reviewer list at a time. `cancel-in-progress:
    # true` is safe because this workflow is read-only (it never pushes, so it
    # can't cancel its own triggered run).
    #
    # A single @claude push can land here twice — the `synchronize` auto-review
    # AND claude.yml's re-dispatched review, both keyed on the same PR number —
    # so the later run supersedes (cancels) the earlier one. That's the intended
    # dedupe: the survivor posts the current review and the collapse/cancel
    # steps fold the other as OUTDATED, leaving one visible review per push.
    #
    # require-review treats a cancelled claude-review run as a graceful skip
    # rather than a failure (gha#585). The survivor run's review is what to trust.
    # To avoid unnecessary cancellations, don't post `@claude review` immediately
    # after pushing — let the automatic review run alone, or wait for any
    # in-flight dispatched review to finish first.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || inputs.pr-number }}
      cancel-in-progress: true

    # Dispatched runs review unconditionally (so a review fires on the draft PR
    # claude.yml opens for an issue trigger), except when gather-context's
    # dispatch-guard step (gha#235) found the dispatched PR is a fork or
    # Dependabot PR. Otherwise skip — don't fail — drafts, Dependabot, fork
    # PRs (forks can't read the OAuth token), and bot-triggered `synchronize`
    # events (e.g. @claude pushing a commit), which would otherwise red-X an
    # automatic review of a bot-authored diff.
    if: >-
      always() &&
      needs.gather-context.result != 'cancelled' &&
      (
        (github.event_name == 'workflow_dispatch' && needs.gather-context.outputs.dispatch-guard-blocked != 'true') ||
        (
          github.event_name != 'workflow_dispatch' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.sender.type != 'Bot'
        )
      )

    outputs:
      quota_exhausted: ${{ steps.resolve-final.outputs.quota_exhausted }}
      # Surfaced so require-review (below) can tell "reviewed, no findings"
      # apart from "never reviewed" and report a gray skip for the latter
      # instead of the same green (gha#434).
      self_mod: ${{ steps.selfmod.outputs.self_mod }}
      cancelled: ${{ steps.resolve-final.outputs.cancelled }}

    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      # Let the action install its github_ci MCP server so the reviewer can
      # read CI/check-run status for the PR. Without actions: read it logs
      # "Skipping CI server installation" and reviews blind to CI state.
      actions: read

    steps:
      # The caller's review-workflow path still matters: it is what GitHub
      # executes on `pull_request`, and what `workflow_dispatch --ref $branch`
      # would execute. Derived from github.workflow_ref (owner/repo/.github/
      # workflows/<file>@ref -> .github/workflows/<file>): in a workflow_call
      # run the github context is the caller's, so workflow_ref is the
      # consumer's stub. (Ported from qwt — gha #45.)
      - name: Parse caller workflow ref
        id: caller-wf
        uses: Morrison-Lab/gha/.github/actions/parse-workflow-ref@v2
        with:
          workflow-ref: ${{ github.workflow_ref }}

      # A PR that edits `.github/workflows/*.yml` used to skip the review
      # outright (gha#386, gha#434): claude-code-action's App-token exchange
      # requires the running workflow to match the default branch. Skipping
      # left workflow-editing PRs unreviewed. Restore the default-branch
      # copies after checkout instead, pass github_token so the action does
      # not need that exchange, and (on dispatch) checkout the PR head so
      # the reviewer still sees the code. GitHub then executes trusted YAML;
      # the PR's workflow changes stay in the saved diff (gha#598).
      - name: Detect whether the PR edits workflow files
        id: wf-edits
        uses: Morrison-Lab/gha/.github/actions/detect-pr-workflow-edits@v2
        with:
          pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}
          caller-workflow-path: ${{ steps.caller-wf.outputs.path }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # workflow_dispatch with no --ref (the trusted-YAML fallback, or a fork)
      # checkouts the default branch. Pin to the PR head so the reviewer sees
      # the code under review. On pull_request the event checkout is already
      # the merge commit; this step is skipped and `ref:` stays empty.
      - name: Resolve PR head SHA
        id: prhead
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a 40-character head SHA for PR #$PR_NUMBER."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Post an early comment linking the run for dispatched reviews (gha#424).
      # On workflow_dispatch, from the PR there is otherwise no link to the run
      # and no sign a review is in progress if the job stalls during setup/model execution.
      - name: Post early review dispatch notice
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -z "$PR_NUMBER" ] && exit 0
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha' 2>/dev/null || true)
          if [ -n "$HEAD_SHA" ]; then
            SHA_SHORT="${HEAD_SHA:0:7}"
            BODY="👀 **Claude Review Dispatched** — [run]($RUN_URL) reviewing PR #$PR_NUMBER at \`$SHA_SHORT\`."
          else
            BODY="👀 **Claude Review Dispatched** — [run]($RUN_URL) reviewing PR #$PR_NUMBER."
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY" 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ steps.prhead.outputs.sha }}

      - name: Restore default-branch workflow files
        id: restore-wf
        if: success() && steps.wf-edits.outputs.workflow_edits == 'true'
        continue-on-error: true
        uses: Morrison-Lab/gha/.github/actions/restore-default-branch-workflows@v2
        with:
          default-branch: ${{ github.event.repository.default_branch }}

      # self_mod now means "the fallback could not restore trusted YAML",
      # not "the PR edits a workflow file". A successful restore continues
      # into the review. Keep the name: require-review and the skip-notice
      # path already key on it.
      - name: Record restore failure as a skip
        id: selfmod
        env:
          RESTORE_OUTCOME: ${{ steps.restore-wf.outcome }}
          WORKFLOW_EDITS: ${{ steps.wf-edits.outputs.workflow_edits }}
          EDITED_PATH: ${{ steps.wf-edits.outputs.edited_path }}
          CALLER_PATH: ${{ steps.caller-wf.outputs.path }}
          LIST_INCOMPLETE: ${{ steps.wf-edits.outputs.list_incomplete }}
        run: |
          set -euo pipefail
          # An incomplete file list must not fall back to the caller path:
          # that would claim the PR edited claude-review.yml when we do
          # not know which files changed.
          if [ "$LIST_INCOMPLETE" = "true" ]; then
            wf_path=""
          else
            wf_path="${EDITED_PATH:-$CALLER_PATH}"
          fi
          echo "wf_path=$wf_path" >> "$GITHUB_OUTPUT"
          if [ "$WORKFLOW_EDITS" = "true" ] && [ "$RESTORE_OUTCOME" = "failure" ]; then
            echo "self_mod=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Could not restore default-branch workflow files; skipping the review rather than executing PR-head YAML (gha#598)."
          else
            echo "self_mod=false" >> "$GITHUB_OUTPUT"
            if [ "$WORKFLOW_EDITS" = "true" ]; then
              echo "::notice::PR edits workflow files; restored .github/workflows/ from the default branch and passing github_token so the review can run without executing PR-head workflow YAML (gha#598)."
            fi
          fi

      - name: Build self-review skip notice body
        id: build-notice
        if: steps.selfmod.outputs.self_mod == 'true'
        uses: Morrison-Lab/gha/.github/actions/build-self-review-skip-notice@v2
        with:
          workflow-path: ${{ steps.selfmod.outputs.wf_path }}
          caller-workflow-path: ${{ steps.caller-wf.outputs.path }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Post a notice that self-review was skipped
        id: skip-notice
        if: steps.selfmod.outputs.self_mod == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          BODY_FILE: ${{ steps.build-notice.outputs.body-file }}
        run: |
          set -euo pipefail
          # Warn rather than fail: require-review is gray either way, so the gate
          # stays honest without this comment, and the next run posts again. A
          # red claude-review here would mislabel a comment-posting failure as a
          # review failure, on a PR where no review was ever attempted.
          #
          if gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$BODY_FILE"; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
          else
            echo "posted=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not post the self-review-skip notice on #$PR_NUMBER; require-review is still gray, but the PR carries no explanation."
          fi

      # Initialize submodules so the reviewer can read their contents — without
      # this, reviews of files that include or reference a submodule report it
      # as "not initialized". The shared composite action handles the
      # SUBMODULES_TOKEN insteadOf rewrite and the anonymous fallback; see
      # .github/actions/checkout-submodules.
      - name: Checkout submodules
        if: steps.selfmod.outputs.self_mod != 'true' && inputs.checkout-submodules
        uses: Morrison-Lab/gha/.github/actions/checkout-submodules@v2
        with:
          submodules-token: ${{ secrets.SUBMODULES_TOKEN }}

      # Optional system/pip packages the reviewer's Bash tool can use — e.g. a
      # computer-algebra system (`apt-packages: maxima`, `pip-packages: sympy`)
      # so a math-heavy repo's reviewer can symbolically check a derivation
      # instead of eyeballing it. Empty by default; most repos need neither.
      - name: Install packages
        if: steps.selfmod.outputs.self_mod != 'true'
        uses: Morrison-Lab/gha/.github/actions/install-packages@v2
        with:
          apt-packages: ${{ inputs.apt-packages }}
          pip-packages: ${{ inputs.pip-packages }}

      # Hand the reviewer the diff as a FILE, so it never has to build one.
      #
      # `Bash(gh pr diff:*)` is allowed, but a command chaining it with a
      # redirect or pipe is rejected as a whole, and the agent cannot write a
      # file itself -- /tmp and a mkdir-created directory are both hard blocks
      # in that sandbox, not permission prompts. So a reviewer that wants the
      # diff in a file to chunk or count it has no route to one, and what it
      # does instead is retry variants of the same redirect until the denial
      # count crosses the stub-retry threshold and the run ends with no
      # verdict. Measured three times: ucdavis/win#78 run 32415477507 (15+
      # variants, 33 denials, $2.29), gha#543's own reproduction (6 denials,
      # $3.42), and gha#555 run 32526051617 (8 denials, $4.95) -- the last of
      # these with the prompt paragraph forbidding exactly that construction
      # already live at @v2, which is why this is a step rather than another
      # rewording (gha#541, gha#543; CLAUDE.md's "A prompt instruction is a
      # request; a permission rule is a constraint").
      #
      # Written into the workspace rather than $RUNNER_TEMP because the agent
      # reads relative to its working directory, and dot-prefixed so it reads
      # as tooling rather than as repository content; the prompt tells the
      # reviewer to ignore it when listing changed files.
      #
      # A failure here is NOT fatal: the reviewer keeps the bare `gh pr diff`
      # route it has today, so the worst case is the behaviour that exists now
      # rather than a red check. The partial file is removed first, so a
      # truncated diff can never be read as a complete one, and `path` stays
      # empty so the prompt falls back instead of naming a file that is not
      # there.
      - name: Save the PR diff for the reviewer
        id: prdiff
        if: steps.selfmod.outputs.self_mod != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          DIFF_NAME: .claude-review-pr.diff
        run: |
          set -uo pipefail
          target="$GITHUB_WORKSPACE/$DIFF_NAME"
          if gh pr diff "$PR_NUMBER" --repo "$REPO" > "$target" && [ -s "$target" ]; then
            # ABSOLUTE, because Claude Code's Read tool requires an absolute
            # `file_path`. A workspace-relative path would cost the reviewer a
            # resolution step to reach the file this whole change exists to put
            # in front of it (gha#567 review).
            echo "path=$target" >> "$GITHUB_OUTPUT"
            echo "Saved the PR diff for the reviewer: $target ($(wc -c < "$target") bytes)."
          else
            rm -f "$target"
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not save the PR diff to $target; the reviewer will fall back to calling gh pr diff itself."
          fi

      # Clear the requested reviewers (human and AI, e.g. Copilot) before
      # Claude runs so they aren't notified mid-run, then re-add them when
      # Claude finishes so the re-add fires a fresh notification — letting a
      # reviewer see Claude's review before starting their own. Also snapshot
      # the PR head SHA for the post-step.
      - name: Stash and clear reviewers; record starting head SHA
        id: stash
        if: steps.selfmod.outputs.self_mod != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
        run: |
          retry_gh_api() {
            local desc="$1"
            shift
            local out=""
            for attempt in 1 2 3; do
              if out=$(gh api "$@") && [ -n "$out" ] && echo "$out" | jq empty 2>/dev/null; then
                echo "$out"
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::Failed to $desc (attempt $attempt/3); retrying in 2s..." >&2
                sleep 2
              else
                echo "::error::Failed to $desc after 3 attempts." >&2
                return 1
              fi
            done
          }

          PR_JSON=$(retry_gh_api "fetch PR details" "repos/$REPO/pulls/$PR_NUMBER")
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.head.sha')
          if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" = "null" ]; then
            echo "::error::Retrieved invalid or empty head SHA for PR #$PR_NUMBER." >&2
            exit 1
          fi
          # Surfaced to the reviewer prompt (run-claude-review-attempt's
          # pr-state/pr-merged inputs) as an authoritative fact, so it can't
          # mistake a commit message on the PR's own branch (e.g. a "Merge
          # origin/main into <branch>" conflict-resolution commit) for
          # evidence the PR itself was merged (gha#295).
          {
            echo "head_before=$HEAD_SHA"
            echo "pr_state=$(echo "$PR_JSON" | jq -r '.state')"
            echo "pr_merged=$(echo "$PR_JSON" | jq -r '.merged')"
          } >> "$GITHUB_OUTPUT"

          REVIEWERS_JSON=$(retry_gh_api "fetch requested reviewers" "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers")
          USERS=$(echo "$REVIEWERS_JSON" | jq -c '[.users[].login]')
          TEAMS=$(echo "$REVIEWERS_JSON" | jq -c '[.teams[].slug]')
          # Capture AI reviewers (bot-type users, e.g. Copilot) separately so
          # the commit path can restore them best-effort — a bad bot login
          # shouldn't drop human reviewer re-requests. Human reviewers are
          # derived from USERS_BEFORE minus AI_USERS_BEFORE.
          # (`user.type` is always present in the REST user object.)
          AI_USERS=$(echo "$REVIEWERS_JSON" | jq -c '[.users[] | select(.type == "Bot") | .login]')
          {
            echo "users=$USERS"
            echo "teams=$TEAMS"
            echo "ai_users=$AI_USERS"
          } >> "$GITHUB_OUTPUT"
          if [ "$USERS" != "[]" ] || [ "$TEAMS" != "[]" ]; then
            # `|| true` is intentional and asymmetric with the restore step: a
            # failed stash leaves reviewers in place (recoverable); a failed
            # restore would drop them entirely (not recoverable).
            jq -n --argjson users "$USERS" --argjson teams "$TEAMS" \
              '{reviewers: $users, team_reviewers: $teams}' \
              | gh api -X DELETE "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" --input - || true
          fi

      # Compose the SERG lab-manual review guidance, gated on the `lab-manual`
      # input. Empty when a caller opts out (e.g. a non-R/Quarto repo), so the
      # reviewer isn't handed R/tidyverse-specific instructions irrelevant to its
      # diff. Interpolated into the prompt below as
      # `steps.labmanual.outputs.guidance`. Kept as a here-doc (not an inline
      # `${{ ... && '...' || '' }}` ternary) because the guidance is multi-line.
      - name: Compose lab-manual review guidance
        id: labmanual
        if: steps.selfmod.outputs.self_mod != 'true'
        env:
          LAB_MANUAL: ${{ inputs.lab-manual }}
        run: |
          if [ "$LAB_MANUAL" != "true" ]; then
            printf 'guidance=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DELIM="labman_$(openssl rand -hex 8)"
          {
          printf '%s\n' "guidance<<$DELIM"
          cat <<'GUIDANCE'
          **Hold this PR to the SERG lab manual.** This repository is part
          of the `d-morrison` / `UCD-SERG` / `ucdavis` family of R-package
          and Quarto repositories, so evaluate the diff against the
          [UCD-SERG lab manual](https://ucd-serg.github.io/lab-manual/) —
          the lab's authority on coding, reproducibility, and collaboration
          conventions — in addition to correctness. Especially:

          - [Coding style](https://ucd-serg.github.io/lab-manual/coding-style.html) —
            object naming, line breaks/formatting, function documentation,
            comments, message/communication style, and Quarto code-reference
            conventions (backticked `pkg::fn()`, markdown package links, no
            raw HTML in `.qmd`).
          - [Coding practices](https://ucd-serg.github.io/lab-manual/coding-practices.html) —
            function decomposition and
            [length limits](https://ucd-serg.github.io/lab-manual/coding-practices.html#function-length-limits),
            testing requirements, the QA checklist, documentation, `{here}`
            for paths, and tidyverse idioms.
          - [Code repositories](https://ucd-serg.github.io/lab-manual/code-repositories.html) —
            repository organization and version-control practices.

          The manual defers to the [tidyverse style guide](https://style.tidyverse.org/)
          for R; prefer tidyverse idioms and the native `|>` pipe. Cite the
          relevant manual section when raising a point, and distinguish
          blocking issues from optional suggestions.
          GUIDANCE
          printf '%s\n' "$DELIM"
          } >> "$GITHUB_OUTPUT"

      # Compose the LaTeX-macro review guidance, gated on the
      # `check-latex-macros` input, mirroring the lab-manual step above.
      # Empty when a caller opts out (the default — most consumers have no
      # LaTeX math), so the reviewer isn't handed instructions irrelevant to
      # its diff. Interpolated into the prompt (via run-claude-review-attempt)
      # as `steps.latexmacros.outputs.guidance`.
      - name: Compose LaTeX-macro review guidance
        id: latexmacros
        if: steps.selfmod.outputs.self_mod != 'true'
        env:
          CHECK_LATEX_MACROS: ${{ inputs.check-latex-macros }}
        run: |
          if [ "$CHECK_LATEX_MACROS" != "true" ]; then
            printf 'guidance=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DELIM="latexmac_$(openssl rand -hex 8)"
          {
          printf '%s\n' "guidance<<$DELIM"
          cat <<'GUIDANCE'
          **Check for LaTeX macro opportunities.** This repository may vendor
          the shared [d-morrison/macros](https://github.com/d-morrison/macros)
          submodule (a `macros.qmd` of `\def`/`\providecommand`/`\renewcommand`
          definitions). First locate it: look for a submodule entry in
          `.gitmodules` referencing `d-morrison/macros`, or a
          `{{< include .../macros.qmd >}}` / `\input{macros}` reference in a
          changed file — the vendored path varies by repo (`macros/`,
          `latex-macros/`, `vignettes/macros/`, `inst/analyses/macros/` are
          all attested, so don't assume one). Read the local `macros.qmd` if
          you find it.

          Read macro definitions only from the local checkout — the repo's
          pinned submodule version is the authoritative one, so don't fetch
          the upstream macros repo from the web even though fetch tools are
          available. If you can't find a macros submodule or its
          `macros.qmd`, say so once in your review (e.g. "no
          d-morrison/macros submodule found — skipping the macro checks")
          and skip both checks below rather than guessing at definitions
          you can't read.

          When you do have `macros.qmd`, check the LaTeX math **added or
          changed in this PR's diff** for two things:

          1. **Simplification opportunities.** Does any added/changed math
             expression duplicate the expansion of a macro already defined in
             `macros.qmd` (allowing for equivalent spacing or argument
             order)? If so, show the current raw form and the macro-using
             replacement.
          2. **New-macro candidates.** Within the diff, is there a nontrivial
             math expression (rough heuristic: more than ~5 constituent
             parts — commands, braces, sub/superscripts) that recurs 3 or
             more times with no existing macro covering it? If so, suggest a
             macro name (follow `macros.qmd`'s naming conventions — e.g. an
             `h` prefix for a hat/estimator, an `f` suffix for "applied to an
             argument", a `v` prefix for a vector; see the macros repo's
             `CONTRIBUTING.md` for the full convention) and a
             `\providecommand` definition.

          Post these as ordinary review findings — suggestions the author can
          accept, rebut, or defer, like any other finding.
          GUIDANCE
          printf '%s\n' "$DELIM"
          } >> "$GITHUB_OUTPUT"

      # Pre-flight account status and quota check before starting the review
      # (gha#396). If no secret is configured or pre-check indicates quota
      # exhaustion, mark quota_exhausted=true early so the workflow can post
      # a graceful notice and skip without wasting runner time.
      - name: Pre-flight account status and quota check
        id: preflight-quota
        if: steps.selfmod.outputs.self_mod != 'true'
        env:
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_OAUTH" != "true" ] && [ "$HAS_API_KEY" != "true" ]; then
            echo "quota_exhausted=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret available for review execution (gha#396)."
          fi

      # Export requested consumer secrets into the reviewer environment (gha#618).
      # Validates secret names against naming conventions and protected environment
      # variables, registers masks for values, and appends them to $GITHUB_ENV.
      - name: Export extra secrets to environment
        if: steps.selfmod.outputs.self_mod != 'true' && steps.preflight-quota.outputs.quota_exhausted != 'true' && inputs.extra-secret-names != ''
        uses: Morrison-Lab/gha/.github/actions/export-extra-secrets@v2
        with:
          extra-secret-names: ${{ inputs.extra-secret-names }}
          secrets-json: ${{ toJson(secrets) }}

      # The actual claude-code-action call (allowedTools/disallowedTools,
      # system prompt, review prompt) lives in the run-claude-review-attempt
      # composite action so it can be invoked a second time, unchanged, as a
      # same-prompt retry below — without duplicating that ~100-line `with:`
      # block between two near-identical steps (gha#185; see the composite
      # action's own header comment for why a duplicated inline step would be
      # a DRY violation this repo's CLAUDE.md flags).
      - name: Run Claude Code Review
        id: claude-review
        if: steps.selfmod.outputs.self_mod != 'true' && steps.preflight-quota.outputs.quota_exhausted != 'true'
        # gha#520: the action exits 1 on any is_error result, including quota
        # exhaustion -- so without this, a failed step reddens the job no matter
        # what the guard below concludes, and the graceful-skip path is
        # unreachable for every exhaustion that gets past the pre-flight check.
        # gha#350 made the guard *run* in that case; the job still went red.
        # "Resolve final review outcome" is documented as the only step that
        # genuinely fails the job, and the retry attempt already carries this
        # flag -- attempt 1 was the odd one out.
        #
        # This does not weaken the guard. `outcome` is read BEFORE
        # continue-on-error is applied, so the retry's own
        # `steps.claude-review.outcome == 'success'` gate keeps its exact
        # meaning, and a genuine failure still reaches resolve-final through
        # fail-check (as action_short_circuit when no execution file was
        # written, or as a hard error otherwise).
        continue-on-error: true
        uses: Morrison-Lab/gha/.github/actions/run-claude-review-attempt@v2
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}
          prior-context: ${{ needs.gather-context.outputs.prior-context }}
          labmanual-guidance: ${{ steps.labmanual.outputs.guidance }}
          latexmacros-guidance: ${{ steps.latexmacros.outputs.guidance }}
          pr-state: ${{ steps.stash.outputs.pr_state }}
          pr-merged: ${{ steps.stash.outputs.pr_merged }}
          pr-diff-file: ${{ steps.prdiff.outputs.path }}
          prompt-addendum: ${{ inputs.prompt-addendum }}
          track-progress: ${{ inputs.track-progress && github.event_name == 'pull_request' && 'true' || 'false' }}
          show-full-output: ${{ inputs.show-full-output }}
          allowed-bots: ${{ inputs.allowed-bots }}
          model: ${{ inputs.model }}
          use-ai-config: ${{ inputs.use-ai-config }}
          extra-plugin-marketplaces: ${{ inputs.plugin-marketplaces }}
          extra-plugins: ${{ inputs.plugins }}
          github-token: ${{ steps.wf-edits.outputs.workflow_edits == 'true' && secrets.GITHUB_TOKEN || '' }}
          workflow-fallback: ${{ steps.wf-edits.outputs.workflow_edits }}

      # Guard: fail the check when the Claude run ended with is_error:true.
      # The action exits 0 even in that case (the result object's subtype is
      # "success" but is_error is true), so without this step a silently-failed
      # review looks green. Runs whenever claude-review was not skipped (gated on
      # outcome != 'skipped' rather than == 'success') so the guard script can
      # still evaluate execution output even when the action step failed with exit
      # code 1 (e.g. quota exhaustion or runtime errors, gha#350).
      # Falls back to the well-known temp path when the action doesn't expose
      # the execution_file output on the pinned version.
      #
      # Special case: when total_cost_usd==0 and num_turns==1, the API rejected
      # the request before Claude did any work (quota exhaustion, auth failure,
      # or similar pre-processing rejection). Failing the check in this case is
      # wrong — the PR hasn't been reviewed, but it also hasn't been found to
      # have problems. Skip gracefully instead and post a comment so the author
      # knows to re-trigger once the quota resets. The same applies when the
      # account runs out of quota PART-WAY through a review (gha#520): the
      # result then carries real turns and real cost alongside
      # api_error_status:429, so the zero-cost test cannot see it, but the
      # outcome for the PR is identical -- unreviewed for an account reason its
      # author cannot act on. The retry below is gated on this step FAILING, so
      # a graceful skip also avoids re-spending on an attempt the API will
      # reject again until the limit resets.
      #
      # Second special case (gha#391): is_error:true alongside subtype:"success"
      # is itself self-contradictory -- the turn loop believed it finished
      # normally, and the flag's cause is unestablished. When this happens and
      # a genuine, complete verdict was ALREADY posted, failing the check
      # anyway hides a finished review from every reader rather than merely
      # under-reviewing the PR (gha#391's #984/#985: both merged with the
      # verdict unread). The guard passes that specific combination through
      # instead; any other is_error/error-subtype shape still fails here
      # exactly as before.
      # The guard logic itself lives in scripts/check-review-execution.sh so
      # it can be exercised offline against canned fixtures (see
      # scripts/tests/), without a live Claude API call — see the
      # `review-fail-check` job in _selftest.yml (#174). That script lives in
      # THIS reusable workflow's own repo (Morrison-Lab/gha), not the caller's
      # — the "Checkout repository" step above checks out the CALLER, not
      # Morrison-Lab/gha. #191 tried resolving Morrison-Lab/gha's own ref via
      # github.job_workflow_ref and checking it out into a side directory, but
      # that context var came back EMPTY at this call site on real consumer
      # runs even though the calling step passed it correctly (gha#196) — the
      # #191 fix was only unit-tested via the sed-parsing logic in isolation,
      # never exercised end-to-end. Delegate to a composite action instead: a
      # composite action's own files are always reachable via
      # github.action_path regardless of how the calling reusable workflow was
      # invoked (workflow_call, a re-dispatched workflow_dispatch, automatic
      # pull_request, ...) — the same reasoning that made parse-workflow-ref
      # itself a composite action rather than a checked-out script.
      # Resolves execution_file (with its temp-path fallback) and uploads it
      # as a workflow artifact, in one composite action shared with the retry
      # block below — see the action's own header comment for why this is
      # extracted (gha#201 review: the same DRY rationale that motivated
      # extracting run-claude-review-attempt, just at a smaller scale).
      - name: Resolve and upload execution file path
        id: exec-file
        if: always() && steps.claude-review.outcome != 'skipped'
        uses: Morrison-Lab/gha/.github/actions/upload-review-execution@v2
        with:
          execution-file: ${{ steps.claude-review.outputs.execution_file }}
          attempt-label: attempt1

      # continue-on-error: true so a stub result (gha#185) doesn't red-X the
      # job outright — the retry block below gets a chance to recover it
      # first. "Resolve final review outcome" (below) is what actually fails
      # the job for real when neither attempt produces a usable review.
      - name: Fail the check if the review did not complete (attempt 1)
        id: fail-check
        if: always() && steps.exec-file.outcome == 'success'
        continue-on-error: true
        uses: Morrison-Lab/gha/.github/actions/run-review-guard@v2
        with:
          execution-file: ${{ steps.exec-file.outputs.path }}

      # Same-prompt retry for retryable signatures:
      # 1) Low-denial stub reviews (gha#185): the SDK call succeeded and
      #    produced real text without a verdict, with a low denial count.
      # 2) Action short-circuits (gha#368): missing execution file or missing
      #    result object (e.g. transient setup/runner crash).
      # A hard SDK error or high-denial stub (gha#198) is excluded.
      - name: Retry Claude Code Review after a stub result or action short-circuit
        id: claude-review-retry
        if: >-
          steps.claude-review.outcome == 'success' &&
          steps.fail-check.outcome == 'failure' &&
          (steps.fail-check.outputs.stub_review == 'true' || steps.fail-check.outputs.action_short_circuit == 'true')
        continue-on-error: true
        uses: Morrison-Lab/gha/.github/actions/run-claude-review-attempt@v2
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}
          prior-context: ${{ needs.gather-context.outputs.prior-context }}
          labmanual-guidance: ${{ steps.labmanual.outputs.guidance }}
          latexmacros-guidance: ${{ steps.latexmacros.outputs.guidance }}
          pr-state: ${{ steps.stash.outputs.pr_state }}
          pr-merged: ${{ steps.stash.outputs.pr_merged }}
          pr-diff-file: ${{ steps.prdiff.outputs.path }}
          prompt-addendum: ${{ inputs.prompt-addendum }}
          track-progress: ${{ inputs.track-progress && github.event_name == 'pull_request' && 'true' || 'false' }}
          show-full-output: ${{ inputs.show-full-output }}
          allowed-bots: ${{ inputs.allowed-bots }}
          model: ${{ inputs.model }}
          use-ai-config: ${{ inputs.use-ai-config }}
          extra-plugin-marketplaces: ${{ inputs.plugin-marketplaces }}
          extra-plugins: ${{ inputs.plugins }}
          github-token: ${{ steps.wf-edits.outputs.workflow_edits == 'true' && secrets.GITHUB_TOKEN || '' }}
          workflow-fallback: ${{ steps.wf-edits.outputs.workflow_edits }}
          is-retry: 'true'

      - name: Resolve and upload execution file path (retry)
        id: exec-file-retry
        if: always() && steps.claude-review-retry.outcome != 'skipped'
        continue-on-error: true
        uses: Morrison-Lab/gha/.github/actions/upload-review-execution@v2
        with:
          execution-file: ${{ steps.claude-review-retry.outputs.execution_file }}
          attempt-label: attempt2

      - name: Fail the check if the retry also did not complete
        id: fail-check-retry
        if: always() && steps.exec-file-retry.outcome == 'success'
        continue-on-error: true
        uses: Morrison-Lab/gha/.github/actions/run-review-guard@v2
        with:
          execution-file: ${{ steps.exec-file-retry.outputs.path }}

      # Both attempts, when they ran, incur real cost — sum them so a
      # gha#185 stub-retry's total reflects both API calls, not just the
      # winning one (gha#219). Extracted into its own composite-action step
      # (rather than an inline awk one-liner) so the arithmetic has offline
      # test coverage — see run-sum-costs-tests.sh and _selftest.yml's
      # `run-sum-costs-tests` and end-to-end `uses:` steps (gha#219 review
      # finding 5).
      - name: Sum attempt costs
        id: sum-cost
        if: always() && steps.selfmod.outputs.self_mod != 'true'
        uses: Morrison-Lab/gha/.github/actions/sum-costs@v2
        with:
          cost-a: ${{ steps.fail-check.outputs.total_cost_usd }}
          cost-b: ${{ steps.fail-check-retry.outputs.total_cost_usd }}

      # Single point that decides which attempt's outputs the rest of the job
      # uses, and the ONLY step that genuinely fails the job when neither
      # attempt produced a usable review (both "Fail the check" steps above
      # are continue-on-error so a recovered retry doesn't leave the job
      # red). Runs unconditionally (always()) so it can report cleanly even
      # if an earlier step in this chain errored outright.
      - name: Resolve final review outcome
        id: resolve-final
        if: always() && steps.selfmod.outputs.self_mod != 'true'
        shell: bash
        env:
          TOTAL_COST: ${{ steps.sum-cost.outputs.total }}
          # The guard's diagnostic outputs reach the script through `env:`,
          # NEVER through `${{ }}` interpolated into the run body beside the
          # `outcome`/`stub_review` reads below. Those two are constrained to
          # 'success'/'failure'/'true'/'' by the runner and by the guard, so
          # inlining them is safe. `denied_tools` is not: it is assembled from
          # the DENIED COMMANDS the reviewer attempted (`gh pr diff 1 > /tmp/d`
          # and the like), so it is agent-authored free text, and inlining it
          # would let a denied command carrying `"` or `$(...)` break or
          # execute inside a job that holds CLAUDE_CODE_OAUTH_TOKEN. An env
          # assignment is substituted by the runner rather than parsed by
          # bash, so the value cannot escape its variable.
          #
          # `denials`/`max_denials` are numeric and `failure_kind` is a fixed
          # vocabulary, so neither needs this; they ride along so that one rule
          # covers the whole group and nobody has to re-derive which member was
          # the dangerous one.
          FC_KIND: ${{ steps.fail-check.outputs.failure_kind }}
          FC_DENIALS: ${{ steps.fail-check.outputs.denials }}
          FC_DENIED_TOOLS: ${{ steps.fail-check.outputs.denied_tools }}
          FC_MAX_DENIALS: ${{ steps.fail-check.outputs.max_denials }}
          FCR_KIND: ${{ steps.fail-check-retry.outputs.failure_kind }}
          FCR_DENIALS: ${{ steps.fail-check-retry.outputs.denials }}
          FCR_DENIED_TOOLS: ${{ steps.fail-check-retry.outputs.denied_tools }}
          FCR_MAX_DENIALS: ${{ steps.fail-check-retry.outputs.max_denials }}
        run: |
          set -euo pipefail
          # Note: GitHub Actions status-check functions like `cancelled()` are
          # only permitted in `if:` keys, not inside `run:` blocks (actionlint
          # flags calling them in expressions). We check step outcomes and
          # job.status explicitly.
          if [[ "${{ steps.claude-review.outcome }}" == "cancelled" || "${{ steps.claude-review-retry.outcome }}" == "cancelled" || "${{ job.status }}" == "cancelled" ]]; then
            echo "cancelled=true" >> "$GITHUB_OUTPUT"
            echo "total_cost_usd=$TOTAL_COST" >> "$GITHUB_OUTPUT"
            echo "Review run was cancelled (e.g. superseded by a newer run or cancelled by user)."
            exit 0
          fi
          if [[ "${{ steps.preflight-quota.outputs.quota_exhausted }}" == "true" ]]; then
            echo "quota_exhausted=true" >> "$GITHUB_OUTPUT"
            echo "total_cost_usd=$TOTAL_COST" >> "$GITHUB_OUTPUT"
            echo "Pre-flight account status check detected missing/exhausted quota (gha#396)."
            exit 0
          fi
          if [[ "${{ steps.fail-check.outcome }}" == "success" ]]; then
            echo "review_text_file=${{ steps.fail-check.outputs.review_text_file }}" >> "$GITHUB_OUTPUT"
            echo "quota_exhausted=${{ steps.fail-check.outputs.quota_exhausted }}" >> "$GITHUB_OUTPUT"
            echo "total_cost_usd=$TOTAL_COST" >> "$GITHUB_OUTPUT"
            echo "Attempt 1 completed cleanly."
            exit 0
          fi
          if [[ "${{ steps.fail-check-retry.outcome }}" == "success" ]]; then
            echo "review_text_file=${{ steps.fail-check-retry.outputs.review_text_file }}" >> "$GITHUB_OUTPUT"
            echo "quota_exhausted=${{ steps.fail-check-retry.outputs.quota_exhausted }}" >> "$GITHUB_OUTPUT"
            echo "total_cost_usd=$TOTAL_COST" >> "$GITHUB_OUTPUT"
            echo "::notice::Attempt 1 produced a stub review or short-circuited; the retry recovered cleanly."
            exit 0
          fi
          # Both attempts failed to produce a usable review. Attribute the
          # failure to whichever attempt actually ran last, rather than
          # always citing attempt 1's stub_review flag — the retry can fail
          # for a DIFFERENT reason than attempt 1 did (a hard SDK error, an
          # empty result, or another stub that this time exceeded the
          # denial-count threshold), and misattributing that undercuts this
          # PR's own diagnosability goal (gha#201 review finding 2).
          #
          # Each branch also records which ATTEMPT's diagnosis stands, so the
          # review-failure comment below describes the same failure this
          # annotation does. The kind itself is never re-derived here: it comes
          # from check-review-execution.sh, which is the thing that actually
          # classified the run (gha#543). Attribution and classification are
          # separate questions, and only the first is this step's to answer.
          if [[ "${{ steps.fail-check-retry.outcome }}" == "failure" ]]; then
            attempt_kind="$FCR_KIND"
            # Fall back to attempt 1's figures when the retry has none of its
            # own -- it can short-circuit or error before the guard parses a
            # result, and dropping the data then loses a diagnostic that
            # exists, for the same reason as the branch below.
            attempt_denials="${FCR_DENIALS:-$FC_DENIALS}"
            attempt_denied_tools="${FCR_DENIED_TOOLS:-$FC_DENIED_TOOLS}"
            attempt_max_denials="${FCR_MAX_DENIALS:-$FC_MAX_DENIALS}"
            if [[ "${{ steps.fail-check-retry.outputs.stub_review }}" == "true" ]]; then
              echo "::error::Attempt 1 failed and the retry ALSO ended without a verdict with a low denial count — treating as a failed review."
            elif [[ "${{ steps.fail-check-retry.outputs.action_short_circuit }}" == "true" ]]; then
              echo "::error::Attempt 1 failed and the retry ALSO failed due to action short-circuit / missing execution file (gha#368) — treating as a failed review."
            else
              echo "::error::Attempt 1 failed but the retry failed for a different reason (hard SDK error, empty output, or a no-verdict result above the denial-count threshold) — treating as a failed review."
            fi
          elif [[ "${{ steps.claude-review-retry.outcome }}" == "success" || "${{ steps.exec-file-retry.outcome }}" == "failure" ]]; then
            # The retry ran but wrote no checkable execution file (or exec-file-retry failed),
            # so the guard never classified it and has no kind to offer. Name it here rather
            # than letting it normalize to `unknown`: "no execution file" IS
            # the short-circuit signature (gha#368), and this is the one branch
            # where the workflow knows that and the guard could not (gha#549).
            attempt_kind="short-circuit"
            # The KIND is the retry's; the denial data is not. Blanking these
            # threw away whatever attempt 1 actually recorded, so a run whose
            # first attempt reported `Taskx6 Bashx3 (sample: ...)` posted
            # "Denied tools: not recorded" instead -- a false statement about
            # the run, made because the LATER attempt is the one being blamed
            # (gha#548 review round 2). Attribution of the failure and
            # availability of the diagnostic are different questions.
            attempt_denials="$FC_DENIALS"
            attempt_denied_tools="$FC_DENIED_TOOLS"
            attempt_max_denials="$FC_MAX_DENIALS"
            echo "::error::Attempt 1 produced a stub review or short-circuited and the retry ran but never produced a checkable execution file — treating as a failed review."
          else
            attempt_kind="$FC_KIND"
            attempt_denials="$FC_DENIALS"
            attempt_denied_tools="$FC_DENIED_TOOLS"
            attempt_max_denials="$FC_MAX_DENIALS"
            if [[ "${{ steps.fail-check.outputs.stub_review }}" == "true" ]]; then
              echo "::error::Attempt 1 produced a stub review (gha#185's low-denial signature) but the retry itself did not run to completion — treating as a failed review."
            elif [[ "${{ steps.fail-check.outputs.action_short_circuit }}" == "true" ]]; then
              echo "::error::Attempt 1 failed due to action short-circuit / missing execution file (gha#368) but the retry itself did not run to completion — treating as a failed review."
            else
              echo "::error::Claude review did not complete successfully and was not eligible for a stub-review retry (either a hard SDK error, empty output, or a no-verdict result above the denial-count threshold — see gha#198)."
            fi
          fi
          {
            echo "failure_kind=$attempt_kind"
            echo "denials=$attempt_denials"
            echo "denied_tools=$attempt_denied_tools"
            echo "max_denials=$attempt_max_denials"
            # Cost is written on THIS path too, not only on the three success
            # paths above. A run that produced no review still spent the money,
            # and "Post cost comment" is gated on resolve-final succeeding, so
            # without this the spend on exactly the runs that wasted it is the
            # spend that goes unrecorded (gha#543).
            echo "total_cost_usd=$TOTAL_COST"
          } >> "$GITHUB_OUTPUT"
          exit 1

      # When the API rejected the request before Claude could review (quota
      # exhaustion, auth failure, etc.), post a notice so the PR author knows
      # why the review didn't run and how to re-trigger it.
      - name: Post quota-exhausted comment
        if: steps.resolve-final.outputs.quota_exhausted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "> [!WARNING]
          > **Claude review skipped — API credential or quota unavailable.** No \`CLAUDE_CODE_OAUTH_TOKEN\` or \`ANTHROPIC_API_KEY\` secret is configured, or account API quota is exhausted. Re-trigger the review by pushing a new commit or re-running the workflow once configured/reset. [View run]($RUN_URL)"

      # The mirror of the quota-exhausted notice above, for the case where the
      # review RAN and still produced nothing usable. Without it every posting
      # step downstream of "Resolve final review outcome" is gated on that step
      # having succeeded, so a no-verdict review left the PR thread completely
      # silent: no review, no cost record, and the previous round's review
      # comment still expanded and reading like a current verdict. From the PR
      # page that is indistinguishable from a reviewer that has not started yet
      # (gha#543, reproduced on Morrison-Lab/wai#83).
      #
      # A status-check function is what makes this reachable at all:
      # resolve-final exits 1, so an `if:` with none is implicitly ANDed with
      # `success()` and would be skipped along with the rest.
      #
      # `!cancelled()` rather than `always()`, which also fires on a cancelled
      # run. That case is the documented `cancel-in-progress` race, where a
      # newer commit superseded this review and its own run is already under
      # way -- so a "the review failed" comment there is noise about a run
      # nobody is waiting on, and this repo double-pushes often enough
      # (CLAUDE.md's own race section) that it would be frequent noise. Posting
      # nothing on a supersede is the pre-existing, correct behaviour; the
      # silence this action fixes is the one on a run that finished.
      #
      # This step never decides the job's outcome. resolve-final has already
      # emitted the `::error::` and already failed it, and `require-review`
      # stays red -- which is correct, and is the point. The comment explains
      # the red check rather than clearing it, the same split
      # report-gemini-failure documents for its own post.
      - name: Post review-failure comment
        id: failure-notice
        if: "!cancelled() && steps.resolve-final.outcome == 'failure'"
        uses: Morrison-Lab/gha/.github/actions/report-review-failure@v2
        with:
          failure-kind: ${{ steps.resolve-final.outputs.failure_kind }}
          pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}
          denials: ${{ steps.resolve-final.outputs.denials }}
          denied-tools: ${{ steps.resolve-final.outputs.denied_tools }}
          max-denials: ${{ steps.resolve-final.outputs.max_denials }}
          total-cost-usd: ${{ steps.resolve-final.outputs.total_cost_usd }}
          attempts: ${{ steps.claude-review-retry.outcome == 'skipped' && '1' || '2' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # In agent mode, display_report writes Claude's output to the step
      # summary, not to the PR. Post it manually here. Tag mode auto-posts
      # the tracking comment on pull_request events, so skip this step then
      # (it would duplicate the comment). Always run on workflow_dispatch
      # since the action rejects track_progress there regardless. Closes #87.
      - name: Post review comment
        id: post-comment
        if: >-
          steps.resolve-final.outcome == 'success' &&
          steps.resolve-final.outputs.quota_exhausted != 'true' &&
          steps.resolve-final.outputs.cancelled != 'true' &&
          !(inputs.track-progress && github.event_name == 'pull_request')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_TEXT_FILE: ${{ steps.resolve-final.outputs.review_text_file }}
          HEAD_SHA: ${{ steps.stash.outputs.head_before }}
        run: |
          # resolve-final already picked the winning attempt's extracted and
          # validated review text (and would have failed the job if neither
          # attempt produced one), so reuse its file instead of re-parsing
          # $EXECUTION_FILE here too.
          REVIEW="$(cat "$REVIEW_TEXT_FILE")"
          if [[ -z "$REVIEW" ]]; then
            echo "No review text found in execution output; skipping comment."
            exit 0
          fi
          COMMIT_SHA="${HEAD_SHA:-$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha' 2>/dev/null || true)}"
          # Include the run URL so the collapse step can match this comment by
          # run ID (same regex: `actions/runs/<id>` in the body).
          # Write the body to a file and post it with --body-file so the review
          # text — which can contain backticks, $(...), quotes, or a leading
          # `---` — is never re-parsed by the shell as it would be if inlined as
          # a --body argument. printf assembles the file at runtime, which also
          # keeps the `---` separator off column 0: a bare `---` on its own line
          # at column 0 in a YAML run block is read as a document separator by
          # both PyYAML and GitHub Actions' parser, truncating the script
          # mid-string and producing "unexpected EOF" on the runner.
          BODY_FILE="$(mktemp)"
          printf '%s\n\n---\n\n%s\n\nReviewed commit: %s' \
            "**Claude finished review** — [View run]($RUN_URL)" \
            "$REVIEW" \
            "$COMMIT_SHA" > "$BODY_FILE"
          # `gh pr comment` prints the new comment's URL to stdout; capture it
          # so the cost-comment step below can link back to it (gha#219).
          COMMENT_URL="$(gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$BODY_FILE")"
          echo "comment_url=$COMMENT_URL" >> "$GITHUB_OUTPUT"

      # Surfaces claude-code-action's total_cost_usd (summed across the
      # attempt-1 + gha#185 stub-retry attempts by resolve-final) in its own
      # follow-up comment. Upstream computes this cost but only writes it to
      # the job step summary, never the PR comment it posts (gha#219) — this
      # is a repo-local workaround, not a duplicate of the review comment's
      # content. Runs regardless of whether "Post review comment" ran (tag
      # mode skips that step but still incurs cost), just without a link back
      # to a comment that doesn't exist in that case.
      - name: Post cost comment
        if: >-
          inputs.report-cost &&
          steps.resolve-final.outcome == 'success' &&
          steps.resolve-final.outputs.quota_exhausted != 'true' &&
          steps.resolve-final.outputs.cancelled != 'true' &&
          steps.resolve-final.outputs.total_cost_usd != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TOTAL_COST: ${{ steps.resolve-final.outputs.total_cost_usd }}
          COMMENT_URL: ${{ steps.post-comment.outputs.comment_url }}
        run: |
          # Include the run URL (like "Post review comment" does) so the
          # collapse step below folds older cost comments the same way it
          # folds older review comments — without it, every push in an ARDI
          # loop would leave its own uncollapsed cost comment (gha#219).
          if [[ -n "$COMMENT_URL" ]]; then
            BODY="💰 **Cost:** \$${TOTAL_COST} ([review]($COMMENT_URL)) — [run]($RUN_URL)"
          else
            BODY="💰 **Cost:** \$${TOTAL_COST} — [run]($RUN_URL)"
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY"

      # With sticky disabled, every run leaves its own review comment (and,
      # when report-cost is on, its own cost comment). Collapse the older
      # ones (minimize as OUTDATED) so the PR shows one expanded, current
      # review (plus current cost comment) with history folded beneath it.
      # Only THIS workflow's comments are touched — identified by the run
      # each comment links to (its workflow `path` is this file) — so
      # `@claude` task comments from claude.yml are left alone (their run's
      # path is claude.yml, not this file). This matches on the run-URL link,
      # so it folds "Post review comment"'s and "Post cost comment"'s output
      # identically (gha#219) -- the cost comment includes its own
      # `actions/runs/<id>` link for exactly this reason.
      #
      # The author pre-filter must admit BOTH bots: the agent-mode review and
      # cost comments are github-actions[bot] (posted by this workflow's own
      # steps), while a tag-mode tracking comment is claude[bot] (posted by
      # claude-code-action). An earlier version filtered claude[bot] alone,
      # which silently folded nothing in agent mode -- the github-actions[bot]
      # review/cost comments never matched, so every round's comments stayed
      # expanded. The run->path check below is what actually scopes this to
      # this workflow, so admitting both bots cannot touch another workflow's
      # comments.
      #
      # Not gated to pull_request: a dispatched (workflow_dispatch / agent-mode)
      # review that wins the per-PR concurrency race must fold the earlier
      # pushes' review comments too, or they linger now that dispatched runs can
      # succeed (allowed_bots, above). The run_id→path match already scopes this
      # to this workflow's comments, so running it on dispatched reviews is safe.
      # The "Post review comment" step above ensures that dispatched and
      # pull_request runs always leave a comment with an `actions/runs/<id>` link,
      # so this collapse step can match and fold it in future rounds.
      #
      # Also runs on the self-review-skip path, where resolve-final never ran:
      # that path posts a notice comment per run (see above), and this step is
      # what keeps a PR from accumulating one per push. It needs nothing from the
      # skipped steps -- only `gh api` and caller-wf's already-parsed path.
      #
      # Gated on that notice having actually POSTED, not merely on self_mod: the
      # post is best-effort, so folding the previous run's notice after a failed
      # post would leave the PR gray with no explanation at all -- gha#434's own
      # symptom, reproduced in one run.
      #
      # `!cancelled()` is load-bearing rather than tidiness. An `if:` carrying
      # no status-check function is implicitly ANDed with `success()`, and the
      # failure-notice disjunct is by construction only true once
      # `Resolve final review outcome` has FAILED -- that step has no
      # `continue-on-error`, so the job is already failing whenever the notice
      # posts. Without a status function the new disjunct was therefore dead
      # code, and every failed round would have left its own permanent,
      # unfoldable comment beside the previous round's stale one: the exact
      # accumulation this step exists to prevent (gha#548 review, finding 1).
      #
      # `!cancelled()` rather than `always()`, because a cancelled run is the
      # documented `cancel-in-progress` race, not a failure worth folding
      # around -- a newer commit's review is already in flight, and the
      # "Explain and fold tracking comment when canceled" step below owns that
      # case.
      #
      # The relaxed check is scoped to the failure-notice disjunct ALONE, and
      # the other two keep an explicit `success()`. A first draft put
      # `!cancelled()` in front of the whole expression, which relaxed all
      # three -- and `steps.<id>.outcome` freezes when its step completes, so
      # `resolve-final.outcome == 'success'` stays true even after a LATER
      # step fails. "Post review comment" carries no `continue-on-error`, so a
      # 422 or a rate limit there would have left this step folding the
      # previous round's review while the current round posted nothing: zero
      # expanded review comments on the thread, which is the very
      # silent-thread class this PR exists to close, reopened on a different
      # step (gha#548 review round 2).
      #
      # An `if:` containing any status function suppresses the implicit
      # `success()`, so the explicit one is doing real work here rather than
      # restating a default.
      - name: Collapse previous Claude review comments
        if: >-
          (!cancelled() && steps.failure-notice.outputs.posted == 'true') ||
          (success() && (steps.skip-notice.outputs.posted == 'true' ||
          (steps.resolve-final.outcome == 'success' &&
          steps.resolve-final.outputs.quota_exhausted != 'true')))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          # The caller invokes this reusable workflow, so a comment "belongs"
          # to this review iff its linked run used the same workflow file the
          # current run did. Reuse the `caller-wf` step's already-parsed path
          # (from github.workflow_ref) instead of re-deriving it here.
          THIS_WF: ${{ steps.caller-wf.outputs.path }}
        run: |
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[]
                  | select(.user.login == "github-actions[bot]" or .user.login == "claude[bot]")
                  | "\(.node_id)\t\(((.body | capture("actions/runs/(?<r>[0-9]+)").r)?) // "")"' \
          | while IFS=$'\t' read -r NODE_ID RUN_ID; do
              [ -z "$RUN_ID" ] && continue
              [ "$RUN_ID" = "$CURRENT_RUN_ID" ] && continue
              WF_PATH=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.path' 2>/dev/null || true)
              [ "$WF_PATH" = "$THIS_WF" ] || continue
              echo "Collapsing review comment $NODE_ID (run $RUN_ID)"
              gh api graphql -f query='
                mutation($id: ID!) {
                  minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                    minimizedComment { isMinimized }
                  }
                }' -f id="$NODE_ID" || true
            done

      # When this run is canceled (e.g. cancel-in-progress fires because a newer
      # commit superseded it), any tracking comment left by a tag-mode run
      # (track-progress: true) would be stuck showing "review in progress".
      # In agent mode (the default), no tracking comment is created, so this
      # step is a no-op — kept as a safety net for tag-mode opt-in callers.
      # The comment is identified by its run ID link — the same matcher the
      # collapse step uses.
      - name: Explain and fold tracking comment when canceled
        if: cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          NOTE=$(printf '> [!WARNING]\n> **Review canceled.** This run was canceled before it finished — superseded by a newer review of the same PR (`cancel-in-progress`), e.g. a later commit or a re-dispatched review. A fresh review runs on the latest commit; see the [canceled run](%s).\n\n---\n\n' "$RUN_URL")
          # The paginated list already carries each comment's body, so capture it
          # here (base64-encoded so an embedded tab/newline can't break the
          # tab-delimited `read`) rather than making a second per-comment fetch.
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[]
                  | select(.user.login == "claude[bot]")
                  | "\(.node_id)\t\(.id)\t\(((.body | capture("actions/runs/(?<r>[0-9]+)").r)?) // "")\t\(.body | @base64)"' \
          | while IFS=$'\t' read -r NODE_ID COMMENT_ID RUN_ID B64_BODY; do
              [ "$RUN_ID" = "$CURRENT_RUN_ID" ] || continue
              echo "Annotating and folding canceled tracking comment $COMMENT_ID (run $RUN_ID)"
              BODY=$(printf '%s' "$B64_BODY" | base64 -d)
              gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -f body="${NOTE}${BODY}" \
                || echo "::warning::Could not update canceled tracking comment $COMMENT_ID."
              gh api graphql -f query='
                mutation($id: ID!) {
                  minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                    minimizedComment { isMinimized }
                  }
                }' -f id="$NODE_ID" || echo "::warning::Could not fold canceled tracking comment."
            done

      - name: Re-assign reviewers after Claude finishes
        if: always() && steps.stash.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          HEAD_BEFORE: ${{ steps.stash.outputs.head_before }}
          USERS_BEFORE: ${{ steps.stash.outputs.users }}
          TEAMS_BEFORE: ${{ steps.stash.outputs.teams }}
          AI_USERS_BEFORE: ${{ steps.stash.outputs.ai_users }}
        run: |
          retry_gh_api() {
            local desc="$1"
            shift
            local out=""
            for attempt in 1 2 3; do
              if out=$(gh api "$@") && [ -n "$out" ] && echo "$out" | jq empty 2>/dev/null; then
                echo "$out"
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::Failed to $desc (attempt $attempt/3); retrying in 2s..." >&2
                sleep 2
              else
                echo "::error::Failed to $desc after 3 attempts." >&2
                return 1
              fi
            done
          }

          PR_JSON=$(retry_gh_api "fetch PR details in restore step" "repos/$REPO/pulls/$PR_NUMBER")
          HEAD_AFTER=$(echo "$PR_JSON" | jq -r '.head.sha')

          if [ "$HEAD_AFTER" = "$HEAD_BEFORE" ]; then
            # No new commits — restore the original reviewer set.
            USERS=${USERS_BEFORE:-[]}
            TEAMS=${TEAMS_BEFORE:-[]}
            if [ "$USERS" = "[]" ] && [ "$TEAMS" = "[]" ]; then
              echo "No reviewers were originally requested."
              exit 0
            fi
            echo "Restoring original reviewers."
            # No `|| true`: a failed restore silently drops the reviewer, so
            # fail loudly instead of letting them vanish.
            jq -n --argjson users "$USERS" --argjson teams "$TEAMS" \
              '{reviewers: $users, team_reviewers: $teams}' \
              | gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" --input -
            exit 0
          fi

          # Claude pushed commits. Re-request the human reviewers that were
          # stashed before the run — anyone originally requested who isn't a
          # bot — AND put back any AI reviewers (e.g. Copilot) and team reviewers.
          # These are separate POSTs (POST adds to the requested set, it doesn't
          # replace it): the human re-request fails loudly if it errors; AI-user
          # and team restores are best-effort so a bad login/slug can't undo the
          # human re-request.
          #
          # Use USERS_BEFORE (minus AI_USERS_BEFORE) instead of the PR's
          # current assignee list: a human reviewer who isn't a PR assignee
          # would otherwise lose their review request on every commit push.
          AI_USERS=${AI_USERS_BEFORE:-[]}
          HUMAN_USERS=$(jq -cn \
            --argjson all "${USERS_BEFORE:-[]}" \
            --argjson bots "$AI_USERS" \
            '[($all[]) | select(. as $u | ($bots | index($u)) == null)]')
          if [ "$HUMAN_USERS" != "[]" ]; then
            echo "Re-requesting human reviewers: $HUMAN_USERS"
            jq -n --argjson users "$HUMAN_USERS" '{reviewers: $users}' \
              | gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" --input -
          else
            echo "No human reviewers to re-request."
          fi

          if [ "$AI_USERS" != "[]" ]; then
            echo "Restoring AI reviewers: $AI_USERS"
            jq -n --argjson users "$AI_USERS" '{reviewers: $users}' \
              | gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" --input - \
              || echo "::warning::Could not restore AI reviewers ($AI_USERS)."
          fi

          TEAMS=${TEAMS_BEFORE:-[]}
          if [ "$TEAMS" != "[]" ]; then
            echo "Restoring team reviewers: $TEAMS"
            jq -n --argjson teams "$TEAMS" '{team_reviewers: $teams}' \
              | gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" --input - \
              || echo "::warning::Could not restore team reviewers ($TEAMS)."
          fi

          if [ "$HUMAN_USERS" = "[]" ] && [ "$AI_USERS" = "[]" ] && [ "$TEAMS" = "[]" ]; then
            echo "No human reviewers, AI reviewers, or team reviewers to restore; leaving reviewers cleared."
          fi

  # Gate job: skipped (gray) when the claude-review job was itself skipped
  # (fork/draft/bot), when the API quota was exhausted, or when restoring
  # default-branch workflow YAML failed so the review was skipped rather than
  # executing PR-head workflow files (gha#598). Passes on a clean review, fails
  # when the review job failed for a real reason.
  #
  # GitHub Actions can only produce a "skipped" job conclusion via a false
  # `if:` — a running job can only conclude success or failure. This second
  # job is the mechanism: when quota_exhausted=true or self_mod=true the `if:`
  # is false and the job shows the gray skip icon instead of a misleading green
  # checkmark.
  #
  # What a green result attests to, and what it does not: a reviewer RAN and the
  # job did not fail. It does not attest that the reviewer APPROVED --- read the
  # posted verdict for that. A gray skip attests less still: no review ran.
  # Before gha#434 the self-review skip produced the same green as a clean
  # review, so an unreviewed PR was indistinguishable from a reviewed one.
  #
  # Consumers should use this job's name (e.g. `review / require-review`) in
  # branch protection required-checks instead of (or in addition to)
  # `review / claude-review`. A skipped result does not block merging; a
  # failing result does. Skipping rather than failing is deliberate for the
  # restore-failure case: the PR was not reviewed, and failing would look like
  # the reviewer found a defect. A later re-run can recover if fetching the
  # default branch was the problem. The gray icon plus the PR comment the
  # review job posts carry the signal instead.
  require-review:
    needs: claude-review
    # Run when the claude-review job ran and produced a real verdict.
    # Skip (gray) when:
    #   - claude-review was skipped, whatever made its own `if:` false --- a
    #     draft, fork, or bot-authored PR; a dispatch blocked by the
    #     fork/Dependabot guard; or gather-context having been cancelled
    #   - claude-review was cancelled (the cancel-in-progress race, gha#585)
    #   - quota_exhausted=true (the API rejected the request, either before
    #     any work or part-way through the review -- gha#520)
    #   - self_mod=true (restoring default-branch workflow YAML failed, so
    #     the review was skipped rather than executing PR-head YAML ---
    #     gha#598; before that change this also fired whenever the PR
    #     merely edited the caller workflow --- gha#434)
    #   - cancelled=true (the review run was cancelled mid-job and resolved as
    #     a graceful skip -- gha#585)
    #
    # The last three are conditioned on the review job having SUCCEEDED.
    # A deliberate no-verdict skip and a job that blew up are different states,
    # and only the first is safe to gray out: without the success test, a
    # genuine failure in any step that still runs on those paths would be
    # reported as "nothing to review" rather than red, which is the fail-open
    # direction this whole job exists to close.
    if: >-
      always() &&
      needs.claude-review.result != 'skipped' &&
      needs.claude-review.result != 'cancelled' &&
      !(needs.claude-review.result == 'success' &&
      (fromJSON(needs.claude-review.outputs.quota_exhausted || 'false') ||
      fromJSON(needs.claude-review.outputs.self_mod || 'false') ||
      fromJSON(needs.claude-review.outputs.cancelled || 'false')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Assert review succeeded
        run: |
          if [[ "${{ needs.claude-review.result }}" != "success" ]]; then
            echo "::error::Claude review job did not succeed (result: ${{ needs.claude-review.result }})."
            exit 1
          fi
          echo "Claude review completed."
