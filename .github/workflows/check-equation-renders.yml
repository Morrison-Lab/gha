name: Check Equation Renders (reusable)

# Fourth leg of the PR-preview family, alongside preview.yml (build) and
# preview-deploy.yml (deploy). The caller stub (see
# examples/check-equation-renders.yml) triggers this on `workflow_run`
# completion of the build workflow, same as preview-deploy.yml. It downloads
# the build artifact directly and crawls the extracted site with a headless
# browser -- no live preview URL or gh-pages write access needed, so it can
# run in parallel with the deploy half rather than depending on it.

on:
  workflow_call:
    inputs:
      fail:
        description: Fail the workflow run when equation render errors are found.
        type: boolean
        default: true

jobs:
  # Cheap gate: verify the build job actually ran (vs. being skipped due to an
  # unrecognized label), matching preview-deploy.yml's gate job. When all jobs
  # in a workflow are skipped GitHub still reports conclusion == 'success',
  # which would otherwise cause the check job to fire and fail on artifact
  # download.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      has-artifact: ${{ steps.check.outputs.found }}
    steps:
      - name: Check artifact exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          count=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.name == "pr-preview-site")] | length')
          echo "found=$([ "$count" -gt 0 ] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"

  check:
    needs: gate
    if: needs.gate.outputs.has-artifact == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # needed to download artifacts from the triggering run
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download preview artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-preview-site
          path: _preview_download/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read PR metadata
        # On a `closed` PR event, preview/action.yml skips staging the site
        # into the artifact (only meta/ is uploaded, no site/), so this check
        # has nothing to crawl. Matches preview-deploy.yml's own read of this
        # file, including its fail-loudly-on-missing guard (see
        # d-morrison/rme#913: a bare `$(cat missing)` inside `echo` yields
        # empty output and exit 0, silently no-opping instead of erroring).
        id: meta
        run: |
          set -euo pipefail
          action=$(cat _preview_download/meta/action.txt) || { echo "::error::Missing action.txt in preview artifact"; exit 1; }
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Check equation renders
        if: steps.meta.outputs.action == 'deploy'
        uses: d-morrison/gha/check-equation-renders@v2
        with:
          site-dir: _preview_download/site/
          fail: ${{ inputs.fail }}
