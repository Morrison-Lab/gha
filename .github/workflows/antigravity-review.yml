# Inactive caller for this repo's reusable Antigravity PR review workflow.
# Antigravity review is currently out of service (see ai-config#1776, gha#584);
# the job is gated with if: false so an inadvertent dispatch is a no-op.
name: Antigravity Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string
      mode:
        description: 'Operational mode: code-review, security-audit, or test-generation'
        required: false
        default: 'code-review'
        type: choice
        options:
          - code-review
          - security-audit
          - test-generation

jobs:
  review:
    if: false
    # timeout-minutes is defined in the reusable workflow
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/antigravity-code-review.yml
    with:
      mode: ${{ inputs.mode || 'code-review' }}
      pr-number: ${{ inputs.pr_number }}
      model: ''
      trigger-policy: 'on-request'
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
