name: Check Junk Files (reusable)

on:
  workflow_call:
    inputs:
      patterns:
        description: >-
          Comma- or newline-separated gitignore-style patterns naming what
          counts as junk. Defaults to the set `usethis::git_vaccinate()`
          writes, plus `._*`, `Thumbs.db`, and `desktop.ini`.
        type: string
        default: '.DS_Store, ._*, .Rproj.user, .Rhistory, .RData, .httr-oauth, .quarto, Thumbs.db, desktop.ini'
      paths-ignore:
        description: >-
          Comma- or newline-separated paths to exempt, applied as git pathspec
          exclusions. A trailing `/` exempts a whole directory.
        type: string
        default: ''
      fail:
        description: >-
          Fail the job when a tracked junk file is found (else warn only).
        type: string
        default: 'true'

jobs:
  check-junk-files:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for tracked junk files
        uses: Morrison-Lab/gha/check-junk-files@v2
        with:
          patterns: ${{ inputs.patterns }}
          paths-ignore: ${{ inputs.paths-ignore }}
          fail: ${{ inputs.fail }}
