name: Check Quarto Prose (reusable)

on:
  workflow_call:
    inputs:
      globs:
        description: Space-separated git pathspecs of tracked source files to scan.
        type: string
        default: '*.qmd *.md'
      paths-ignore:
        description: Comma- or newline-separated globs of source files to skip.
        type: string
        default: ''
      base-ref:
        description: >-
          Git ref/SHA to diff against; only findings on lines added since this
          ref are reported. Empty (the default) uses `HEAD^1`, the base tip
          GitHub built the merge ref on, on pull_request runs and skips on
          push. Pass `all` to scan every tracked file.
        type: string
        default: ''
      idioms-file:
        description: >-
          Path (relative to the repository root) to a phrase list that
          replaces the bundled one.
        type: string
        default: ''
      allow-file:
        description: >-
          Path (relative to the repository root) to a file of `path-glob:
          phrase` exemptions.
        type: string
        default: ''
      fail:
        description: Fail the job when a finding is reported (else warn only).
        type: boolean
        default: true

jobs:
  check-quarto-prose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so PR runs can diff added lines against the base.
          fetch-depth: 0

      - name: Check Quarto prose
        uses: Morrison-Lab/gha/check-quarto-prose@v3
        with:
          globs: ${{ inputs.globs }}
          paths-ignore: ${{ inputs.paths-ignore }}
          idioms-file: ${{ inputs.idioms-file }}
          allow-file: ${{ inputs.allow-file }}
          fail: ${{ inputs.fail }}
          # On PRs, check only lines added relative to the base; on a push
          # there is no base to diff against, so the check is skipped unless
          # the caller passed base-ref (including `all`).
          # On pull_request, HEAD is GitHub's merge ref and HEAD^1 is the base tip
          # it was built on. The payload's pull_request.base.sha can lag that tip,
          # counting the base's newer commits as added by the PR (gha#1007).
          base-ref: ${{ inputs.base-ref != '' && inputs.base-ref || (github.event_name == 'pull_request' && 'HEAD^1' || '') }}
