name: Update testthat Snapshots (reusable)

# Regenerate testthat snapshots, commit, and push. The snapshot
# test/accept/commit body lives here; callers pass only what differs between
# their triggers (ref, committer identity, PR vs. direct push mode).

on:
  workflow_call:
    inputs:
      ref:
        description: >
          Branch or SHA to check out. Defaults to the event ref when empty;
          pass a branch name for workflow_dispatch callers or github.head_ref
          for pull_request callers.
        type: string
        default: ''
      pr-mode:
        description: >
          Fetch the PR's head branch with r-lib/actions/pr-fetch and push
          back to it, instead of checking out and pushing ref directly. Set
          true for PR-comment (issue_comment) triggers.
        type: boolean
        default: false
      julia:
        description: Set up the Julia runtime before running tests.
        type: boolean
        default: false
      julia-version:
        description: Julia version to install. Only used when julia is true.
        type: string
        default: '1'
      julia-project:
        description: >
          Path to the Julia project to instantiate. Only used when julia
          is true.
        type: string
        default: 'inst/julia'
      extra-packages:
        description: Extra R packages forwarded to r-lib/actions/setup-r-dependencies.
        type: string
        default: 'any::testthat'
      needs:
        description: needs label forwarded to r-lib/actions/setup-r-dependencies.
        type: string
        default: 'check'
      apt-packages:
        description: >
          Space-separated apt packages to install before R setup. Defaults to
          the standard system libraries needed to build a typical R package's
          dependencies from source (Cairo, fonts, graphics, gettext, OpenMP).
          Pass your own list to override, or an empty string to skip the
          install step.
        type: string
        default: >-
          libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev
          libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev
          libtiff5-dev libjpeg-dev zlib1g-dev libomp-dev build-essential
          libcairo2-dev gettext
      commit-message:
        description: Commit message for the snapshot update commit.
        type: string
        default: 'Update testthat snapshots [auto]'
      committer-name:
        description: Git committer name.
        type: string
        default: 'github-actions[bot]'
      committer-email:
        description: Git committer email.
        type: string
        default: '41898282+github-actions[bot]@users.noreply.github.com'
    secrets:
      WORKFLOW_TOKEN:
        description: >
          Optional token (a fine-grained PAT or GitHub App token with
          Contents: Read and write on the branch's repository) used for the
          final push. GitHub starts no workflow runs for a push made with
          GITHUB_TOKEN, so without this secret the pushed snapshot commit
          becomes the branch head with no CI on it. A push made with this
          token triggers the caller's push and pull_request workflows as
          usual. Pass it explicitly from the caller's secrets.
        required: false

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          token: ${{ github.token }}

      - name: Fetch PR branch
        if: inputs.pr-mode
        uses: r-lib/actions/pr-fetch@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          repo-token: ${{ github.token }}

      - name: Set up Julia
        if: inputs.julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ inputs.julia-version }}

      - name: Cache Julia packages
        if: inputs.julia
        uses: julia-actions/cache@e32267b41e0fa7df82a3d53e8c7273620d52c586 # v3.4.0

      - name: Install apt packages
        if: inputs.apt-packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        shell: bash
        run: |
          sudo apt-get update
          # word-splitting on $APT_PACKAGES is intentional
          # shellcheck disable=SC2086
          sudo apt-get install -y $APT_PACKAGES

      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: ${{ inputs.extra-packages }}
          needs: ${{ inputs.needs }}

      - name: Instantiate Julia project
        if: inputs.julia
        env:
          JULIA_PROJECT_PATH: ${{ inputs.julia-project }}
        shell: bash
        run: |
          julia --startup-file=no --project="$JULIA_PROJECT_PATH" \
            -e "using Pkg; Pkg.instantiate(); Pkg.precompile()"

      - name: Run tests and accept snapshots
        # testthat's progress reporter quits after 10 failures by default, so
        # the first pass would never reach (or write pending files for) the
        # snapshots past that point, and the verification pass would then
        # fail on them with nothing committed. Lift the limit for both passes.
        env:
          TESTTHAT_MAX_FAILS: Inf
        shell: Rscript {0}
        run: |
          devtools::load_all()
          tryCatch(devtools::test(), error = function(e) {
            message("First test run: ", conditionMessage(e))
          })
          testthat::snapshot_accept()
          # devtools::test() defaults to stop_on_failure = FALSE, which would
          # let a still-failing suite exit 0 and push broken snapshots anyway.
          devtools::test(stop_on_failure = TRUE)

      - name: Commit snapshot changes
        id: commit
        env:
          COMMIT_MSG: ${{ inputs.commit-message }}
          COMMITTER_NAME: ${{ inputs.committer-name }}
          COMMITTER_EMAIL: ${{ inputs.committer-email }}
        shell: bash
        run: |
          git config --local user.name "$COMMITTER_NAME"
          git config --local user.email "$COMMITTER_EMAIL"
          git add tests/testthat/_snaps
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "$COMMIT_MSG"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # One push step for both modes, replacing r-lib/actions/pr-push: that
      # action also calls the pulls API with its token, which a token scoped
      # to Contents alone cannot do on a private repository.
      - name: Push snapshot commit
        if: steps.commit.outputs.committed == 'true'
        env:
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
          PR_MODE: ${{ inputs.pr-mode }}
        shell: bash
        run: |
          set -euo pipefail
          token="${WORKFLOW_TOKEN:-$FALLBACK_TOKEN}"
          if [ "$PR_MODE" = "true" ]; then
            # pr-fetch added the PR's head repository as remote `pr` and
            # checked out a local branch tracking pr/<head-branch>.
            remote=pr
            upstream=$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}')
            branch="${upstream#pr/}"
          else
            remote=origin
            branch=$(git rev-parse --abbrev-ref HEAD)
            if [ "$branch" = "HEAD" ]; then
              echo "::error title=update-snapshots::ref checked out a detached commit, so there is no branch to push to; pass a branch name as ref."
              exit 1
            fi
          fi
          url=$(git remote get-url "$remote" | sed -E 's#^https://[^@/]*@#https://#')
          # actions/checkout persisted GITHUB_TOKEN as an extraheader, which
          # git sends ahead of any URL credentials. An empty value resets that
          # multi-valued key, so the header set here is the only one sent. The
          # config travels in GIT_CONFIG_* variables to keep it off argv.
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "::add-mask::$header"
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0=
          export GIT_CONFIG_KEY_1="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_1="$header"
          git push "$url" "HEAD:refs/heads/$branch"

      - name: Warn that the pushed commit has no CI
        if: steps.commit.outputs.committed == 'true'
        env:
          HAS_WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN != '' }}
        shell: bash
        run: |
          if [ "$HAS_WORKFLOW_TOKEN" = "true" ]; then
            exit 0
          fi
          sha=$(git rev-parse HEAD)
          msg="Pushed snapshot commit $sha with GITHUB_TOKEN, so GitHub starts no workflow runs for it and the branch head has no CI. Pass a WORKFLOW_TOKEN secret (Contents: Read and write) to update-snapshots so its push triggers CI, or re-trigger the checks by hand."
          echo "::warning title=update-snapshots::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
