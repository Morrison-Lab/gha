name: Update testthat Snapshots (reusable)

# Regenerate testthat snapshots, commit, and push. The snapshot
# test/accept/commit body lives here; callers pass only what differs between
# their triggers (ref, committer identity, PR vs. direct push mode).

on:
  workflow_call:
    inputs:
      ref:
        description: >
          Branch or SHA to check out. Defaults to the event ref when empty;
          pass a branch name for workflow_dispatch callers or github.head_ref
          for pull_request callers.
        type: string
        default: ''
      pr-mode:
        description: >
          Use r-lib/actions/pr-fetch and pr-push instead of direct checkout
          and push. Set true for PR-comment (issue_comment) triggers.
        type: boolean
        default: false
      julia:
        description: Set up the Julia runtime before running tests.
        type: boolean
        default: false
      julia-version:
        description: Julia version to install. Only used when julia is true.
        type: string
        default: '1'
      julia-project:
        description: >
          Path to the Julia project to instantiate. Only used when julia
          is true.
        type: string
        default: 'inst/julia'
      extra-packages:
        description: Extra R packages forwarded to r-lib/actions/setup-r-dependencies.
        type: string
        default: 'any::testthat'
      needs:
        description: needs label forwarded to r-lib/actions/setup-r-dependencies.
        type: string
        default: 'check'
      apt-packages:
        description: >
          Space-separated apt packages to install before R setup. Defaults to
          the standard system libraries needed to build a typical R package's
          dependencies from source (Cairo, fonts, graphics, gettext, OpenMP).
          Pass your own list to override, or an empty string to skip the
          install step.
        type: string
        default: >-
          libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev
          libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev
          libtiff5-dev libjpeg-dev zlib1g-dev libomp-dev build-essential
          libcairo2-dev gettext
      commit-message:
        description: Commit message for the snapshot update commit.
        type: string
        default: 'Update testthat snapshots [auto]'
      committer-name:
        description: Git committer name.
        type: string
        default: 'github-actions[bot]'
      committer-email:
        description: Git committer email.
        type: string
        default: '41898282+github-actions[bot]@users.noreply.github.com'

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          token: ${{ github.token }}

      - name: Fetch PR branch
        if: inputs.pr-mode
        uses: r-lib/actions/pr-fetch@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          repo-token: ${{ github.token }}

      - name: Set up Julia
        if: inputs.julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ inputs.julia-version }}

      - name: Cache Julia packages
        if: inputs.julia
        uses: julia-actions/cache@b7788abd52452d5bc033d69796e110d9906af4ab # v3.2.0

      - name: Install apt packages
        if: inputs.apt-packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        shell: bash
        run: |
          sudo apt-get update
          # word-splitting on $APT_PACKAGES is intentional
          # shellcheck disable=SC2086
          sudo apt-get install -y $APT_PACKAGES

      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          use-public-rspm: true

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          extra-packages: ${{ inputs.extra-packages }}
          needs: ${{ inputs.needs }}

      - name: Instantiate Julia project
        if: inputs.julia
        env:
          JULIA_PROJECT_PATH: ${{ inputs.julia-project }}
        shell: bash
        run: |
          julia --startup-file=no --project="$JULIA_PROJECT_PATH" \
            -e "using Pkg; Pkg.instantiate(); Pkg.precompile()"

      - name: Run tests and accept snapshots
        shell: Rscript {0}
        run: |
          devtools::load_all()
          tryCatch(devtools::test(), error = function(e) {
            message("First test run: ", conditionMessage(e))
          })
          testthat::snapshot_accept()
          # devtools::test() defaults to stop_on_failure = FALSE, which would
          # let a still-failing suite exit 0 and push broken snapshots anyway.
          devtools::test(stop_on_failure = TRUE)

      - name: Commit snapshot changes
        env:
          COMMIT_MSG: ${{ inputs.commit-message }}
          COMMITTER_NAME: ${{ inputs.committer-name }}
          COMMITTER_EMAIL: ${{ inputs.committer-email }}
        shell: bash
        run: |
          git config --local user.name "$COMMITTER_NAME"
          git config --local user.email "$COMMITTER_EMAIL"
          git add tests/testthat/_snaps
          git diff --cached --quiet || git commit -m "$COMMIT_MSG"

      - name: Push (direct)
        if: ${{ !inputs.pr-mode }}
        shell: bash
        run: git push

      - name: Push (PR mode)
        if: inputs.pr-mode
        uses: r-lib/actions/pr-push@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          repo-token: ${{ github.token }}
