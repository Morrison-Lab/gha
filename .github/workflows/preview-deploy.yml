name: Quarto Preview Deploy (reusable)

# Deploy half of the PR-preview family. The caller stub (see
# examples/preview-deploy.yml) triggers this on `workflow_run` completion of
# the build workflow; this reusable workflow inherits the caller's
# `github.event.workflow_run.*` context. It runs in the BASE-repo context (not
# the fork), so its GITHUB_TOKEN can push to gh-pages and comment on the PR.
# Never merge this into the build half — that split is the trust boundary.

on:
  workflow_call:
    inputs:
      pages-base-url:
        description: >-
          Custom Pages base URL (e.g. 'org.github.io' or a custom domain) to
          override automatic URL guessing by pr-preview-action.
        type: string
        default: ''
      pages-base-path:
        description: >-
          Custom Pages base path prefix to override automatic path guessing by
          pr-preview-action.
        type: string
        default: ''

jobs:
  # Cheap gate: verify the build job actually ran (vs. being skipped due to an
  # unrecognized label). When all jobs in a workflow are skipped GitHub still
  # reports conclusion == 'success', which would otherwise cause the deploy job
  # to fire and fail on artifact download.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      has-artifact: ${{ steps.check.outputs.found }}
    steps:
      - name: Check artifact exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          count=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.name == "pr-preview-site")] | length')
          echo "found=$([ "$count" -gt 0 ] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.has-artifact == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Serialize deploys to gh-pages so main-site publishes, PR previews, and
    # preview cleanups queue rather than race or clobber each other's commits.
    # Note: GitHub Actions only retains *one* pending run per concurrency group
    # (superseding older pending runs in the queue), rather than buffering
    # unbounded pending runs. cancel-in-progress: false queues rather than kills.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    # This job runs in the base-repo context (not the fork), so the
    # GITHUB_TOKEN has write access to push to gh-pages and comment on PRs.
    permissions:
      contents: write
      pull-requests: write
      actions: read  # needed to download artifacts from the triggering run

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download preview artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-preview-site
          path: _preview_download/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read PR metadata
        id: meta
        # Fail loudly if the metadata is missing. A bare `$(cat missing)` inside
        # `echo` yields empty output and exit 0, so the step would "pass" with
        # empty pr-number/action and the deploy would silently skip (the
        # regression d-morrison/rme#913 recovered from).
        run: |
          set -euo pipefail
          pr_number=$(cat _preview_download/meta/pr-number.txt) || { echo "::error::Missing pr-number.txt in preview artifact"; exit 1; }
          action=$(cat _preview_download/meta/action.txt) || { echo "::error::Missing action.txt in preview artifact"; exit 1; }
          echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Deploy PR Preview
        if: steps.meta.outputs.action == 'deploy'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        id: preview
        with:
          source-dir: _preview_download/site/
          pr-number: ${{ steps.meta.outputs.pr-number }}
          comment: false
          action: deploy
          pages-base-url: ${{ inputs.pages-base-url }}
          pages-base-path: ${{ inputs.pages-base-path }}

      - name: Remove PR Preview
        if: steps.meta.outputs.action == 'remove'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        id: preview-remove
        with:
          pr-number: ${{ steps.meta.outputs.pr-number }}
          comment: false
          action: remove

      # Delete any existing pr-preview sticky comment(s) so the fresh comment
      # posted below lands at the BOTTOM of the conversation instead of being
      # edited in place (where later review/CI comments bury it mid-thread).
      # marocchino's own `recreate: true` is unreliable here: this job runs on
      # `workflow_run`, and on long threads its "find previous comment" step
      # misses the comment, so it edits in place (no bump) or leaves duplicates.
      # Deleting explicitly via the API (paginated, keyed on the PR number) is
      # deterministic regardless of thread length.
      - name: Bump preview comment to the bottom (remove stale copies)
        if: steps.meta.outputs.action == 'deploy' && steps.preview.outputs.deployment-action != 'none'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.meta.outputs.pr-number }}
        run: |
          set -euo pipefail
          # marocchino tags its sticky comment with the hidden marker
          # `<!-- Sticky Pull Request Comment<header> -->` (header: pr-preview).
          # Anchor on the comment opener so a normal user comment that merely
          # quotes this text can't match; allow an optional space before the
          # header, since marocchino's marker has had it both ways.
          gh api --paginate "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body != null and (.body | test("<!-- Sticky Pull Request Comment ?pr-preview"))) | .id' \
          | while read -r id; do
              # best-effort: a 404 (comment already gone) or transient error on
              # one delete must not abort the loop under `set -e`
              [ -n "$id" ] && gh api -X DELETE "repos/${GH_REPO}/issues/comments/${id}" || true
            done

      - name: Comment with preview link
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.meta.outputs.action == 'deploy' && steps.preview.outputs.deployment-action != 'none'
        continue-on-error: true
        with:
          header: pr-preview
          number: ${{ steps.meta.outputs.pr-number }}
          # defense-in-depth: the delete step above normally removes the old
          # comment so this creates a fresh one at the bottom; if that step was
          # skipped or errored (continue-on-error), recreate still avoids
          # silently editing a buried comment in place.
          recreate: true
          message: |
            [PR Preview Action](https://github.com/rossjrw/pr-preview-action) ${{ steps.preview.outputs.action-version }}
            :---:
            :rocket: **Preview available at:** ${{ steps.preview.outputs.preview-url }}

            <sub>Built to branch [`gh-pages`](${{ github.server_url }}/${{ github.repository }}/tree/gh-pages) at ${{ steps.preview.outputs.action-start-time }}.</sub>

      - name: Remove preview comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.meta.outputs.action == 'remove' && steps.preview-remove.outputs.deployment-action == 'remove'
        continue-on-error: true
        with:
          header: pr-preview
          number: ${{ steps.meta.outputs.pr-number }}
          message: |
            [PR Preview Action](https://github.com/rossjrw/pr-preview-action) ${{ steps.preview-remove.outputs.action-version }}
            :---:
            Preview removed because the pull request was closed.

            <sub>${{ steps.preview-remove.outputs.action-start-time }}</sub>
