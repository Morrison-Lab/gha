name: selftest
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  links:
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/check-links.yml
    with:
      create-issue-on-main: false
  chars:
    uses: ./.github/workflows/check-non-standard-chars.yml
  # lint-yaml/lint-markdown are brand new, so (like check-phi below) they
  # aren't at the released `@v2` tag their reusable workflows' internal
  # `uses: Morrison-Lab/gha/lint-*@v2` step resolves against yet. Exercise the
  # local composites directly against this repo's own tracked YAML/Markdown,
  # bypassing the wrapper the way check-phi/quarto-publish/test-coverage do.
  lint-yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint YAML
        uses: ./lint-yaml
  lint-markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Markdown
        uses: ./lint-markdown
  lint-qmd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint QMD prose
        uses: ./lint-qmd
        with:
          globs: '*.qmd'
          fail: true
  # lint-changed-lines' composite can't be exercised end-to-end here: it needs
  # a live pull_request event plus an installable R package to lint against
  # (this repo is neither). Run the offline unit test for its diff-hunk parser
  # instead; the composite itself is validated by real PR usage once released
  # (the same rationale as run-claude-review-attempt).
  lint-changed-lines-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          use-public-rspm: true
      - name: Run added-lines parser tests
        run: Rscript lint-changed-lines/tests/test-added-lines.R
  bib:
    permissions:
      contents: read
    uses: ./.github/workflows/check-bibliography-dois.yml
    with:
      no-metadata-check: true
  # check-phi is brand new, so it doesn't exist at the released `@v1` tag the
  # reusable workflow pins yet. Exercise the local composite directly so the
  # selftest covers the actual PR code (and stays green pre-release); consumers
  # use the reusable workflow once `@v1` includes the action.
  phi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for PHI
        uses: ./check-phi
        with:
          # Run every detector (incl. the off-by-default phone/email) so CI
          # exercises them all; this repo's tree is identifier-free apart from
          # test fixtures that carry synthetic PHI-shaped strings by design (the
          # detector unit tests, the coverage fixture generator's synthetic
          # maintainer email, and check-new-line-breaks' throwaway git-repo
          # test fixtures' placeholder git config email), which are skipped
          # via paths-ignore below.
          detectors: 'ssn,mrn,dob,csv_phi_header,phone,email'
          paths-ignore: |
            check-phi/tests/**
            test-coverage/tests/**
            check-new-line-breaks/tests/**
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
  # The phi job above proves the action runs clean on an identifier-free tree;
  # this job unit-tests the detector functions directly (positive + negative
  # fixtures per detector, incl. the csv_phi_header line-1/suffix edge cases), so
  # a regression in the regexes/heuristics is caught even when this repo's own
  # tree wouldn't trip it.
  phi-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Run the suite under actions/setup-python (pinned SHA, so Dependabot
      # tracks the action), matching the check-phi composite's '3.x' default.
      # Its env isn't externally-managed, so pip needs no --break-system-packages.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Run check-phi detector unit tests
        shell: bash
        run: |
          set -euo pipefail
          # Pin pytest for reproducible runs (bump deliberately, not implicitly).
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest check-phi/tests/ -q
  # check-new-line-breaks is brand new, so (like check-phi/lint-yaml/lint-markdown
  # above) it doesn't exist at the released `@v2` tag its reusable workflow's
  # internal `uses: Morrison-Lab/gha/check-new-line-breaks@v2` step resolves
  # against yet. Exercise the local composite directly so the selftest covers
  # the actual PR code; consumers use the reusable workflow once `@v2` includes
  # the action. base-ref makes this a real diff-scoped run against whatever
  # this PR itself adds, the same pattern the phi job above uses.
  new-line-breaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check new markdown lines for missing semantic breaks
        uses: ./check-new-line-breaks
        with:
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      # The clause check (#336) is on by default, so the step above already
      # covers it. This one covers the opt-out, and covers exactly two things:
      # that `action.yml` parses with the input declared, and that the
      # clause_breaks=False path runs to completion. It cannot FAIL on
      # findings -- neither step sets `fail:`, and main() returns 0 on every
      # path unless NLB_FAIL is set -- so it says nothing about whether the
      # value reaches the script. That is pinned instead by the env-var ->
      # main() -> exit-code cases in check-new-line-breaks/tests/, which make
      # the exit code depend on it (gha#337 review).
      - name: Check again with the clause check opted out
        uses: ./check-new-line-breaks
        with:
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          clause-breaks: 'false'
  # The new-line-breaks job above proves the action runs against this repo's
  # own tree; this job unit-tests the sentence-splitter/block-detector
  # functions and the diff-scoping behavior directly (small throwaway git
  # repos), so a regression in either is caught even when this repo's own
  # tree wouldn't trip it.
  new-line-breaks-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Run check-new-line-breaks unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest check-new-line-breaks/tests/ -q
  # claude-code-review.yml's fail-check step (its stub/placeholder-review
  # guard, #172) had no automated coverage — it was only verified by manual
  # trace against known stub texts, since a live Claude API call isn't
  # something a selftest job can exercise. The guard logic itself is pure,
  # offline shell (scripts/check-review-execution.sh), so run it directly
  # against canned execution-output fixtures instead (#174).
  review-fail-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run fail-check fixture tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-fixture-tests.sh
      - name: Run parse-workflow-ref fixture tests
        shell: bash
        run: bash .github/actions/parse-workflow-ref/tests/run-tests.sh
      - name: Run sum-costs arithmetic tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-sum-costs-tests.sh
      - name: Run detect-review-request matcher tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-detect-review-request-tests.sh
      # Exercises the run-review-guard composite action itself (not just the
      # check-review-execution.sh script it wraps) via a real `uses:` step, so
      # its github.action_path-relative resolution of the script is actually
      # proven to work end-to-end — a unit test of the script alone would not
      # have caught #191's job_workflow_ref regression (gha#196).
      - name: Exercise run-review-guard composite action end-to-end
        id: guard-e2e
        uses: ./.github/actions/run-review-guard
        with:
          execution-file: .github/workflows/scripts/tests/fixtures/genuine-finished-review.json
      - name: Assert run-review-guard produced review text
        shell: bash
        env:
          REVIEW_TEXT_FILE: ${{ steps.guard-e2e.outputs.review_text_file }}
        run: |
          set -euo pipefail
          if [[ -z "$REVIEW_TEXT_FILE" || ! -s "$REVIEW_TEXT_FILE" ]]; then
            echo "::error::run-review-guard did not produce a non-empty review_text_file output"
            exit 1
          fi
          echo "run-review-guard produced review_text_file=$REVIEW_TEXT_FILE"
      # Proves the composite action's total_cost_usd passthrough works
      # end-to-end (gha#219) — the fixture tests above already cover
      # check-review-execution.sh's own output; this is the same
      # real-`uses:` reasoning that motivated the stub_review e2e check below.
      - name: Assert run-review-guard surfaced total_cost_usd
        shell: bash
        env:
          TOTAL_COST_USD: ${{ steps.guard-e2e.outputs.total_cost_usd }}
        run: |
          set -euo pipefail
          if [[ "$TOTAL_COST_USD" != "0.42" ]]; then
            echo "::error::run-review-guard did not surface total_cost_usd=0.42 for genuine-finished-review.json (got '$TOTAL_COST_USD')"
            exit 1
          fi
          echo "run-review-guard correctly surfaced total_cost_usd=$TOTAL_COST_USD"
      # A second real `uses:` call, against a stub fixture, proving the
      # composite action's stub_review output passthrough works end-to-end —
      # not just check-review-execution.sh's own output (already covered by
      # the fixture tests above). claude-code-review.yml's retry (gha#185)
      # gates entirely on this composite output, so a passthrough wiring bug
      # here would silently disable the retry without any fixture test
      # catching it.
      - name: Exercise run-review-guard composite action end-to-end (stub fixture)
        id: guard-e2e-stub
        continue-on-error: true
        uses: ./.github/actions/run-review-guard
        with:
          execution-file: .github/workflows/scripts/tests/fixtures/stub-pr171-waiting-background-agents.json
      - name: Assert run-review-guard surfaced stub_review=true
        shell: bash
        env:
          STUB_REVIEW: ${{ steps.guard-e2e-stub.outputs.stub_review }}
        run: |
          set -euo pipefail
          if [[ "$STUB_REVIEW" != "true" ]]; then
            echo "::error::run-review-guard did not surface stub_review=true for a known stub fixture"
            exit 1
          fi
          echo "run-review-guard correctly surfaced stub_review=true"
      # total_cost_usd is written regardless of outcome (gha#219), so a stub
      # result must surface it too — not just the passing case above.
      - name: Assert run-review-guard surfaced total_cost_usd (stub fixture)
        shell: bash
        env:
          TOTAL_COST_USD: ${{ steps.guard-e2e-stub.outputs.total_cost_usd }}
        run: |
          set -euo pipefail
          if [[ "$TOTAL_COST_USD" != "0.05" ]]; then
            echo "::error::run-review-guard did not surface total_cost_usd=0.05 for stub-pr171-waiting-background-agents.json (got '$TOTAL_COST_USD')"
            exit 1
          fi
          echo "run-review-guard correctly surfaced total_cost_usd=$TOTAL_COST_USD for a stub result"
      # Proves claude.yml's extract-total-cost composite action end-to-end
      # (gha#219 review finding 1) -- the same real-`uses:` reasoning as
      # run-review-guard above, since a unit test of the underlying script
      # alone would not catch a github.action_path resolution regression.
      - name: Exercise extract-total-cost composite action end-to-end
        id: cost-e2e
        uses: ./.github/actions/extract-total-cost
        with:
          execution-file: .github/workflows/scripts/tests/fixtures/genuine-finished-review.json
      - name: Assert extract-total-cost surfaced the fixture's cost
        shell: bash
        env:
          COST: ${{ steps.cost-e2e.outputs.cost }}
        run: |
          set -euo pipefail
          if [[ "$COST" != "0.42" ]]; then
            echo "::error::extract-total-cost did not surface cost=0.42 for genuine-finished-review.json (got '$COST')"
            exit 1
          fi
          echo "extract-total-cost correctly surfaced cost=$COST"
      - name: Exercise extract-total-cost composite action end-to-end (missing file)
        id: cost-e2e-missing
        uses: ./.github/actions/extract-total-cost
        with:
          execution-file: .github/workflows/scripts/tests/fixtures/does-not-exist.json
      - name: Assert extract-total-cost is silent for a missing file
        shell: bash
        env:
          COST: ${{ steps.cost-e2e-missing.outputs.cost }}
        run: |
          set -euo pipefail
          if [[ -n "$COST" ]]; then
            echo "::error::extract-total-cost should surface no cost output for a missing execution file (got '$COST')"
            exit 1
          fi
          echo "extract-total-cost correctly surfaced no cost for a missing file"
      # Proves claude-code-review.yml's sum-costs composite action end-to-end
      # (gha#219 review finding 5) -- the arithmetic itself is unit-tested
      # above; this proves the github.action_path resolution and output
      # passthrough actually work, the same reasoning as the run-review-guard
      # and extract-total-cost e2e steps above.
      - name: Exercise sum-costs composite action end-to-end
        id: sum-costs-e2e
        uses: ./.github/actions/sum-costs
        with:
          cost-a: '0.30'
          cost-b: '0.12'
      - name: Assert sum-costs surfaced the correct total
        shell: bash
        env:
          TOTAL: ${{ steps.sum-costs-e2e.outputs.total }}
        run: |
          set -euo pipefail
          if [[ "$TOTAL" != "0.4200" ]]; then
            echo "::error::sum-costs did not surface total=0.4200 for 0.30 + 0.12 (got '$TOTAL')"
            exit 1
          fi
          echo "sum-costs correctly surfaced total=$TOTAL"
      # Proves claude.yml's detect-review-request composite action end-to-end.
      # The pattern itself is unit-tested above; what only a real `uses:` step
      # can prove is the github.action_path resolution, the output
      # passthrough, and -- the part no unit test reaches -- the base64
      # round-trip on the bodies-file path, which is how the late-comment
      # rescue scan feeds multi-line comment bodies through the same matcher.
      - name: Build a bodies-file for detect-review-request
        shell: bash
        run: |
          set -euo pipefail
          # Two multi-line bodies, only the second a review request, encoded
          # exactly as claude.yml's "Collect comments posted after the
          # trigger" step encodes them.
          printf '%s\n' \
            '{"body":"looks good to me\nshipping it"}' \
            '{"body":"@claude, please review\n\nthanks!"}' \
            | jq -r '.body | @base64' > "$RUNNER_TEMP/late-bodies.b64"
      - name: Exercise detect-review-request composite action end-to-end
        id: detect-e2e
        uses: ./.github/actions/detect-review-request
        with:
          bodies-file: ${{ runner.temp }}/late-bodies.b64
      - name: Exercise detect-review-request on a non-request comment
        id: detect-e2e-negative
        uses: ./.github/actions/detect-review-request
        with:
          comment-body: "@claude the review workflow is broken, can you fix it?"
      - name: Assert detect-review-request surfaced the correct matches
        shell: bash
        env:
          MATCH: ${{ steps.detect-e2e.outputs.match }}
          MATCH_NEGATIVE: ${{ steps.detect-e2e-negative.outputs.match }}
        run: |
          set -euo pipefail
          if [[ "$MATCH" != "true" ]]; then
            echo "::error::detect-review-request did not match the base64-encoded '@claude, please review' body (got '$MATCH')"
            exit 1
          fi
          if [[ "$MATCH_NEGATIVE" != "false" ]]; then
            echo "::error::detect-review-request matched a comment that only mentions the word review (got '$MATCH_NEGATIVE')"
            exit 1
          fi
          echo "detect-review-request correctly surfaced match=true / match=false"
  # request-dependabot-review is brand new, so (like the internal composites
  # tested above) its own reusable-workflow layer isn't exercisable end-to-end
  # yet: it calls build-reviewer-args via `d-morrison/gha/...@v2`, which won't
  # resolve until @v2 is advanced past this PR's merge. Test the local
  # build-reviewer-args composite directly instead -- the same "test-coverage"
  # precedent used below, and the same offline-unit-test-plus-real-`uses:`-e2e
  # pattern used for run-review-guard/extract-total-cost/sum-costs above
  # (gha#253 review: missing selftest coverage for a new workflow with real
  # side effects, precedented by the sync-pr job's open-sync-pr no-op test).
  dependabot-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run build-reviewer-args split/trim tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-build-reviewer-args-tests.sh
      - name: Exercise build-reviewer-args composite action end-to-end
        id: args-e2e
        uses: ./.github/actions/build-reviewer-args
        with:
          reviewers: 'alice, bob'
      - name: Assert build-reviewer-args trimmed and split correctly
        shell: bash
        env:
          REVIEWERS_JSON: ${{ steps.args-e2e.outputs.reviewers-json }}
        run: |
          set -euo pipefail
          if [[ "$REVIEWERS_JSON" != '["alice","bob"]' ]]; then
            echo "::error::build-reviewer-args did not surface [\"alice\",\"bob\"] for 'alice, bob' (got '$REVIEWERS_JSON')"
            exit 1
          fi
          echo "build-reviewer-args correctly surfaced reviewers-json=$REVIEWERS_JSON"
  # altdoc-multiversion-docs is brand new, so its internal composites aren't at
  # a released tag yet either. Exercise all three directly against a throwaway
  # fixture repo -- a separate git init, not this checkout -- which is also why
  # generate_version_dropdown.py's git calls need an explicit cwd (see that
  # script's _run_git docstring); without it they'd silently read this repo's
  # own tags instead of the fixture's. The full reusable workflow's render +
  # multi-target deploy sequence isn't exercised here (it pushes to gh-pages,
  # a write side effect selftest can't run); it's validated by real consumer
  # usage once merged and released, the same precedent `dependabot-review`'s
  # reusable-workflow layer follows above (see this repo's own CLAUDE.md).
  altdoc-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create a minimal altdoc fixture (separate git repo, two tags)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-altdoc-pkg/altdoc
          cat > _ci-altdoc-pkg/DESCRIPTION <<'EOF'
          Package: cifixturepkg
          Version: 0.1.0.9000
          EOF
          cat > _ci-altdoc-pkg/altdoc/quarto_website.yml <<'EOF'
          website:
            title: "cifixturepkg"
            navbar:
              right:
                - text: Versions
                  menu:
                    - text: placeholder
                      href: placeholder
          EOF
          git -C _ci-altdoc-pkg init -q
          git -C _ci-altdoc-pkg config user.email "ci@example.com" # phi-allow (synthetic fixture address, not real PHI)
          git -C _ci-altdoc-pkg config user.name "CI"
          git -C _ci-altdoc-pkg add -A
          git -C _ci-altdoc-pkg commit -q -m "fixture"
          git -C _ci-altdoc-pkg tag v0.0.9
          git -C _ci-altdoc-pkg tag v0.1.0
      - name: Exercise resolve-altdoc-base-url composite end-to-end (derived)
        id: base-url-derived
        uses: ./.github/actions/resolve-altdoc-base-url
      - name: Assert resolve-altdoc-base-url derived the expected URL
        shell: bash
        env:
          BASE_URL: ${{ steps.base-url-derived.outputs.base-url }}
        run: |
          set -euo pipefail
          expected="https://${GITHUB_REPOSITORY_OWNER}.github.io/$(basename "$GITHUB_REPOSITORY")/"
          if [[ "$BASE_URL" != "$expected" ]]; then
            echo "::error::expected base-url='$expected', got '$BASE_URL'"; exit 1
          fi
      - name: Exercise resolve-altdoc-base-url composite end-to-end (override)
        id: base-url-override
        uses: ./.github/actions/resolve-altdoc-base-url
        with:
          override: 'https://example.com/docs'
      - name: Assert resolve-altdoc-base-url normalized the override's trailing slash
        shell: bash
        env:
          BASE_URL: ${{ steps.base-url-override.outputs.base-url }}
        run: |
          set -euo pipefail
          if [[ "$BASE_URL" != "https://example.com/docs/" ]]; then
            echo "::error::expected base-url='https://example.com/docs/', got '$BASE_URL'"; exit 1
          fi
      - name: Exercise generate-altdoc-version-dropdown composite end-to-end
        id: dropdown
        uses: ./.github/actions/generate-altdoc-version-dropdown
        with:
          docs-source-dir: _ci-altdoc-pkg
      - name: Assert version dropdown was rewritten correctly
        shell: bash
        env:
          LATEST_TAG: ${{ steps.dropdown.outputs.latest-tag }}
          DEV_VERSION: ${{ steps.dropdown.outputs.dev-version }}
        run: |
          set -euo pipefail
          if [[ "$LATEST_TAG" != "v0.1.0" ]]; then
            echo "::error::expected latest-tag=v0.1.0, got '$LATEST_TAG'"; exit 1
          fi
          if [[ "$DEV_VERSION" != "0.1.0.9000" ]]; then
            echo "::error::expected dev-version=0.1.0.9000, got '$DEV_VERSION'"; exit 1
          fi
          if ! grep -q 'v0.1.0 (stable)' _ci-altdoc-pkg/altdoc/quarto_website.yml; then
            echo "::error::rewritten quarto_website.yml missing the stable entry"
            cat _ci-altdoc-pkg/altdoc/quarto_website.yml
            exit 1
          fi
          if ! grep -q 'v0.0.9' _ci-altdoc-pkg/altdoc/quarto_website.yml; then
            echo "::error::rewritten quarto_website.yml missing the previous-version entry"
            cat _ci-altdoc-pkg/altdoc/quarto_website.yml
            exit 1
          fi
      - name: Assert the dev build labels the menu and navbar with its own version
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.dropdown.outputs.current-version }}
        run: |
          set -euo pipefail
          # No current-version was passed above, so this also covers the
          # composite inferring "dev" from a DESCRIPTION no tag matches.
          if [[ "$CURRENT_VERSION" != "0.1.0.9000 (dev)" ]]; then
            echo "::error::expected current-version='0.1.0.9000 (dev)', got '$CURRENT_VERSION'"; exit 1
          fi
          if ! grep -q '^      - text: "0.1.0.9000 (dev)"$' _ci-altdoc-pkg/altdoc/quarto_website.yml; then
            echo "::error::Versions menu is not labeled with the current version"
            cat _ci-altdoc-pkg/altdoc/quarto_website.yml
            exit 1
          fi
          # pkgdown-style badge, on the navbar title rather than the site
          # title, and red because this is a development build.
          if ! grep -q '^    title: "cifixturepkg <small .*text-danger.*>0.1.0.9000</small>"$' _ci-altdoc-pkg/altdoc/quarto_website.yml; then
            echo "::error::navbar title is missing the dev version badge"
            cat _ci-altdoc-pkg/altdoc/quarto_website.yml
            exit 1
          fi
          if ! grep -q '^  title: "cifixturepkg"$' _ci-altdoc-pkg/altdoc/quarto_website.yml; then
            echo "::error::website.title should be untouched, so the page <title> stays clean"
            cat _ci-altdoc-pkg/altdoc/quarto_website.yml
            exit 1
          fi
      # Re-run over the file the previous run rewrote: the "- text: Versions"
      # anchor is gone by now, so this proves the generated marker keeps the
      # block findable, and that a second badge is not stacked onto the first.
      - name: Exercise generate-altdoc-version-dropdown again, as a release build
        id: dropdown-stable
        uses: ./.github/actions/generate-altdoc-version-dropdown
        with:
          docs-source-dir: _ci-altdoc-pkg
          current-version: v0.1.0
          dropdown-title-template: 'Version: {version}'
      - name: Assert the release build relabels rather than duplicating
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.dropdown-stable.outputs.current-version }}
        run: |
          set -euo pipefail
          if [[ "$CURRENT_VERSION" != "v0.1.0 (stable)" ]]; then
            echo "::error::expected current-version='v0.1.0 (stable)', got '$CURRENT_VERSION'"; exit 1
          fi
          if ! grep -q '^      - text: "Version: v0.1.0 (stable)"$' _ci-altdoc-pkg/altdoc/quarto_website.yml; then
            echo "::error::dropdown-title-template was not applied"
            cat _ci-altdoc-pkg/altdoc/quarto_website.yml
            exit 1
          fi
          badges=$(grep -c 'navbar-version' _ci-altdoc-pkg/altdoc/quarto_website.yml)
          if [[ "$badges" != 1 ]]; then
            echo "::error::expected exactly 1 navbar version badge, found $badges"
            cat _ci-altdoc-pkg/altdoc/quarto_website.yml
            exit 1
          fi
          if ! grep -q 'text-muted.*>v0.1.0</small>' _ci-altdoc-pkg/altdoc/quarto_website.yml; then
            echo "::error::a release build's badge should be muted, not red"
            cat _ci-altdoc-pkg/altdoc/quarto_website.yml
            exit 1
          fi
      - name: Test navbar_version.py version labeling and YAML rewriting
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest
          python3 -m pytest .github/actions/generate-altdoc-version-dropdown/tests -q
      # A PR preview renders a branch whose DESCRIPTION has moved ahead of the
      # default branch's, so the navbar badge and the /dev/ menu entry name
      # DIFFERENT versions -- the branch's and what is actually deployed at
      # /dev/. That split lives in generate_version_dropdown.py (local
      # DESCRIPTION vs `git show origin/<default-branch>:DESCRIPTION`), not in
      # resolve_current_version(), so only a real two-version fixture pins it.
      - name: Create a PR-preview fixture whose branch version differs from main's
        shell: bash
        run: |
          set -euo pipefail
          git -C _ci-altdoc-pkg branch -M main
          git clone -q _ci-altdoc-pkg _ci-altdoc-pkg-pr
          git -C _ci-altdoc-pkg-pr config user.email "ci@example.com" # phi-allow (synthetic fixture address, not real PHI)
          git -C _ci-altdoc-pkg-pr config user.name "CI"
          sed -i 's/^Version: .*/Version: 0.2.0.9000/' _ci-altdoc-pkg-pr/DESCRIPTION
          git -C _ci-altdoc-pkg-pr commit -aqm "bump the branch version"
      - name: Exercise generate-altdoc-version-dropdown on the PR-preview fixture
        id: dropdown-pr
        uses: ./.github/actions/generate-altdoc-version-dropdown
        with:
          docs-source-dir: _ci-altdoc-pkg-pr
          current-version: dev
      - name: Assert the badge names the branch version, the menu entry main's
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.dropdown-pr.outputs.current-version }}
          DEV_VERSION: ${{ steps.dropdown-pr.outputs.dev-version }}
        run: |
          set -euo pipefail
          config=_ci-altdoc-pkg-pr/altdoc/quarto_website.yml
          if [[ "$CURRENT_VERSION" != "0.2.0.9000 (dev)" ]]; then
            echo "::error::expected current-version='0.2.0.9000 (dev)', got '$CURRENT_VERSION'"; exit 1
          fi
          if [[ "$DEV_VERSION" != "0.1.0.9000" ]]; then
            echo "::error::expected dev-version='0.1.0.9000' (from origin/main), got '$DEV_VERSION'"; exit 1
          fi
          # The menu's own label: the branch's version.
          if ! grep -q '^      - text: "0.2.0.9000 (dev)"$' "$config"; then
            echo "::error::menu label should name the branch version"; cat "$config"; exit 1
          fi
          # The /dev/ entry inside it: what is actually deployed there.
          if ! grep -q '^          - text: "0.1.0.9000 (dev)"$' "$config"; then
            echo "::error::/dev/ entry should name the default branch's version"; cat "$config"; exit 1
          fi
          if ! grep -q 'navbar-version.*>0.2.0.9000</small>' "$config"; then
            echo "::error::navbar badge should name the branch version"; cat "$config"; exit 1
          fi
      - name: Exercise generate-altdoc-landing-page composite end-to-end
        uses: ./.github/actions/generate-altdoc-landing-page
        with:
          target: dev
          output-dir: _ci-landing-page
      - name: Assert landing page redirect was generated correctly
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f _ci-landing-page/index.html ]; then
            echo "::error::generate-altdoc-landing-page did not produce index.html"; exit 1
          fi
          if [ ! -f _ci-landing-page/.nojekyll ]; then
            echo "::error::generate-altdoc-landing-page did not produce .nojekyll"; exit 1
          fi
          if ! grep -q '/dev/' _ci-landing-page/index.html; then
            echo "::error::landing page redirect did not target /dev/"
            cat _ci-landing-page/index.html
            exit 1
          fi
          if [ -f _ci-landing-page/404.html ]; then
            echo "::error::generate-altdoc-landing-page produced 404.html with no legacy-paths input"
            exit 1
          fi
      - name: Test generate_legacy_redirects.py parsing and validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest
          python3 -m pytest .github/actions/generate-altdoc-landing-page/tests -q
      - name: Exercise generate-altdoc-landing-page composite with legacy paths
        uses: ./.github/actions/generate-altdoc-landing-page
        with:
          target: dev
          output-dir: _ci-landing-page-legacy
          base-url: 'https://ucd-serg.github.io/serocalculator/'
          legacy-paths: 'main=dev,master=dev'
      - name: Assert the legacy-path 404 page redirects where it should
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f _ci-landing-page-legacy/404.html ]; then
            echo "::error::generate-altdoc-landing-page did not produce 404.html"; exit 1
          fi
          # Runs the page's real redirect script against a table of request
          # paths -- deep links, query/fragment preservation, and the paths
          # that must NOT redirect (a missing page under /dev/ would otherwise
          # bounce forever).
          node .github/actions/generate-altdoc-landing-page/tests/run-redirect-js-tests.mjs \
            _ci-landing-page-legacy/404.html
      - name: Assert an invalid legacy-paths value fails the step
        shell: bash
        env:
          LEGACY_PATHS: 'dev=dev'
          OUTPUT_DIR: _ci-landing-page-invalid
          DOCS_BASE_URL: 'https://ucd-serg.github.io/serocalculator/'
        run: |
          set -euo pipefail
          if python3 .github/actions/generate-altdoc-landing-page/generate_legacy_redirects.py; then
            echo "::error::a self-redirecting legacy path should have failed the step"; exit 1
          fi
  # quarto-publish is brand new, so (like check-phi above) it isn't at the
  # released `@v1` tag the reusable workflow pins yet. Exercise the local
  # composite directly against a throwaway fixture, render-only, so the selftest
  # covers the PR code without touching this repo's gh-pages branch.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create a minimal Quarto fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-quarto-site
          # _quarto.yml declares a different output-dir than the composite is
          # given below, so a green build proves the `output-dir` input is
          # authoritative (forwarded to `quarto render --output-dir`, overriding
          # _quarto.yml) rather than merely matching it.
          printf 'project:\n  type: website\n  output-dir: _from_quarto_yml\n' > _ci-quarto-site/_quarto.yml
          printf -- '---\ntitle: Selftest\n---\n\nBuild check for the quarto-publish composite.\n' \
            > _ci-quarto-site/index.qmd
      - name: Build the fixture site (non-default output-dir overrides _quarto.yml)
        uses: ./quarto-publish
        with:
          path: _ci-quarto-site
          output-dir: docs
  # Smoke-test the quarto-publish reusable workflow wrapper (not just the
  # composite): render this repo's own website with deploy: false, so the
  # gh-pages push — a write side effect we can't run in CI — is skipped. This
  # catches wrapper-level breakage (input plumbing, the render step) that the
  # composite-only job above wouldn't. The deploy path is validated by
  # dogfooding (website-publish.yml) at release. Local ./ ref since the
  # branch-deploy change isn't at `@v1` yet.
  #
  # Grant contents: write even though deploy: false: a reusable workflow's job
  # permissions are checked against the caller's grant at graph-build time
  # regardless of `if:`, so the wrapper's contents:write deploy job requires the
  # caller to grant write even when that job is skipped. The build job
  # downscopes its own token to contents:read.
  publish-workflow:
    permissions:
      contents: write
    uses: ./.github/workflows/quarto-publish.yml
    with:
      path: website
      deploy: false
  # check-equation-renders is brand new, so (like check-phi/quarto-publish above)
  # it isn't at the released tag the reusable workflow pins yet. Exercise the
  # local composite against a fixture with one good page and one page with two
  # kinds of deliberately broken equation -- a hard parse error (missing
  # `\frac` argument, surfaces as a `[data-mjx-error]` node) and an undefined
  # macro (surfaces as MathJax's literal-text fallback, the realistic failure
  # mode for a repo like rme that leans on custom TeX macros) -- proving the
  # composite catches both, not just running clean. A separate fixture below
  # exercises a third failure mode -- MathJax itself never loading (gha#230) --
  # which has nothing to do with any individual equation's TeX.
  equation-renders:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Loads MathJax from cdn.jsdelivr.net rather than vendoring it: this runs
      # on a GitHub-hosted runner, which has outbound internet by default,
      # unlike the sandboxed environment used to validate the detection logic
      # during development (which vendored a local copy of the bundle instead).
      - name: Generate a fixture site with one good and one broken page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-equation-fixture
          cat > _ci-equation-fixture/good.html <<'EOF'
          <!doctype html>
          <html><head><script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script></head>
          <body><p id="eq-good">\(a + b = c\)</p></body></html>
          EOF
          cat > _ci-equation-fixture/bad.html <<'EOF'
          <!doctype html>
          <html><head><script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script></head>
          <body>
          <p id="eq-bad-brace">\(\frac{1}\)</p>
          <p id="eq-bad-macro">\(\undefinedmacroxyz{1}\)</p>
          </body></html>
          EOF
      - name: Check equation renders (expect failure)
        id: check
        continue-on-error: true
        uses: ./check-equation-renders
        with:
          site-dir: _ci-equation-fixture
      - name: Assert the broken equation was caught
        shell: bash
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::check-equation-renders should have failed on the fixture's broken equation (outcome=$OUTCOME)"
            exit 1
          fi
          echo "check-equation-renders correctly failed on the broken equation."
      # gha#230: a page whose MathJax script can never load (a guaranteed-
      # unresolvable ".invalid" host, per RFC 2606) must also fail the check --
      # previously this silently reported success, since the DOM scan found no
      # error nodes for the simple reason that MathJax never ran at all. The
      # equation on this page is otherwise valid TeX; only the script load
      # fails, isolating this failure mode from the hard-error and
      # undefined-macro cases above.
      - name: Generate a fixture page whose MathJax script never loads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-equation-fixture-unreachable
          cat > _ci-equation-fixture-unreachable/unreachable.html <<'EOF'
          <!doctype html>
          <html><head><script src="https://mathjax.invalid/es5/tex-mml-chtml.js"></script></head>
          <body><p id="eq-unreachable">\(a + b = c\)</p></body></html>
          EOF
      - name: Check equation renders on the unreachable-script fixture (expect failure)
        id: check-unreachable
        continue-on-error: true
        uses: ./check-equation-renders
        with:
          site-dir: _ci-equation-fixture-unreachable
      - name: Assert the MathJax load failure was caught
        shell: bash
        env:
          OUTCOME: ${{ steps.check-unreachable.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::check-equation-renders should have failed when MathJax's script never loads (outcome=$OUTCOME)"
            exit 1
          fi
          echo "check-equation-renders correctly failed when MathJax never initialized."
  # bump-submodule / sync-shared-fragments open PRs (write side effects), so the
  # selftest can't run them end-to-end. Exercise the shared open-sync-pr
  # composite's no-op path instead: on a clean tree it must report no change and
  # neither push nor open a PR. Like check-phi/quarto-publish above, use the
  # local `./` ref since the action isn't at `@v1` until release.
  sync-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: open-sync-pr no-ops on a clean tree
        id: nochange
        uses: ./open-sync-pr
        with:
          branch: ci-selftest-open-sync-pr
          commit-message: 'selftest: must not be committed'
          token: ${{ github.token }}
      - name: Assert nothing was committed or opened
        shell: bash
        env:
          CHANGED: ${{ steps.nochange.outputs.changed }}
          PR_URL: ${{ steps.nochange.outputs.pr-url }}
        run: |
          set -euo pipefail
          if [ "$CHANGED" != "false" ] || [ -n "$PR_URL" ]; then
            echo "::error::open-sync-pr should no-op on a clean tree (changed=${CHANGED}, pr-url=${PR_URL})."
            exit 1
          fi
          echo "open-sync-pr correctly no-opped on a clean tree."
  # test-coverage is brand new, so (like check-phi/quarto-publish above) it isn't
  # at the released tag the reusable workflow pins yet. Exercise the local
  # composite against a minimal R-package fixture, with no Codecov token and
  # fail-ci-if-error off, so the upload step is a harmless no-op and the job
  # proves the covr -> Cobertura path works. The fixture is generated at run time
  # (not committed) so its DESCRIPTION/R sources aren't discovered by the other
  # jobs' repo-wide R dependency scanning (which can't resolve `covfixture`).
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate the R package fixture
        shell: bash
        run: bash test-coverage/tests/make-fixture.sh _ci-rpkg
      - name: Measure coverage on the fixture package
        uses: ./test-coverage
        with:
          path: _ci-rpkg
          fail-ci-if-error: 'false'
      - name: Assert the Cobertura report was produced
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s cobertura.xml ]; then
            echo "::error::test-coverage did not produce cobertura.xml"
            exit 1
          fi
          echo "cobertura.xml produced ($(wc -l < cobertura.xml) lines):"
          head -n 20 cobertura.xml
      - name: Assert the JUnit test-results report was produced
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "${RUNNER_TEMP}/junit.xml" ]; then
            echo "::error::test-coverage did not produce junit.xml (upload-test-results, gha#234)"
            exit 1
          fi
          echo "junit.xml produced ($(wc -l < "${RUNNER_TEMP}/junit.xml") lines):"
          head -n 20 "${RUNNER_TEMP}/junit.xml"
  # claude.yml hardcodes a mirror of claude-code-action's SENSITIVE_PATHS list
  # (from src/github/operations/restore-config.ts) so its auto-commit step
  # never reverts a PR's own edits to those files (#39). That mirror can't
  # detect upstream drift on its own, so diff the pinned SHA's actual copy of
  # SENSITIVE_PATHS against the local list here on every PR (gha#152).
  sensitive-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Diff claude.yml's SENSITIVE_PATHS mirror against the pinned claude-code-action SHA
        shell: bash
        run: |
          set -euo pipefail
          sha=$(grep -oP 'anthropics/claude-code-action@\K[0-9a-f]{40}' .github/workflows/claude.yml | head -n1)
          url="https://raw.githubusercontent.com/anthropics/claude-code-action/${sha}/src/github/operations/restore-config.ts"
          # Assumes upstream keeps SENSITIVE_PATHS as a single block that ends
          # with a bare `];` on its own line (the sed range terminator below).
          # A reformat there (e.g. `] as const;`, a trailing comment on the
          # closing line) would make the range run past the intended block.
          # That can only produce a false *failure* here, never a false pass,
          # so a red run from this cause is debuggable by fetching $url by hand.
          upstream=$(curl -fsSL "$url" | sed -n '/const SENSITIVE_PATHS/,/];/p' | grep -oP '"\K[^"]+(?=")' | sort)
          local=$(grep -oP 'for cfg in \K.*(?=; do)' .github/workflows/claude.yml | tr ' ' '\n' | sort)
          if [ "$upstream" != "$local" ]; then
            echo "::error::claude.yml's SENSITIVE_PATHS mirror is out of sync with claude-code-action@${sha}."
            diff <(echo "$upstream") <(echo "$local") || true
            exit 1
          fi
          echo "claude.yml's SENSITIVE_PATHS mirror matches claude-code-action@${sha}."

  # Covers the open-failure-issue action. report-failure.yml is its only
  # caller so far; check-links.yml's migration onto it is deferred to gha#327,
  # since a @v2 reference to a not-yet-released action fails at job-prepare
  # time and check-links runs on every PR here.
  # The unit tests pin the matching and splitting rules; the end-to-end step
  # proves the composite resolves select-existing-issue.sh through
  # github.action_path, the wiring gha#196 showed a unit test alone does not
  # cover. It runs with dry-run: true so a selftest run never files an issue,
  # and consequently needs only `issues: read`.
  failure-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run select-existing-issue matching tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-select-existing-issue-tests.sh

      - name: Run split-csv-list tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-split-csv-list-tests.sh

      # A title no issue in this repository carries, so the lookup runs for
      # real against the live issue list and finds nothing.
      - name: Exercise open-failure-issue end-to-end (no match)
        id: no-match
        uses: ./.github/actions/open-failure-issue
        with:
          title: 'selftest placeholder title that matches no open issue'
          body: 'Selftest dry run; nothing is filed.'
          dry-run: 'true'

      - name: Assert the no-match case would file a new issue
        shell: bash
        env:
          OUTCOME: ${{ steps.no-match.outputs.outcome }}
          NUMBER: ${{ steps.no-match.outputs.issue-number }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "created" || -n "$NUMBER" ]]; then
            echo "::error::expected outcome=created with no issue number, got outcome='$OUTCOME' number='$NUMBER'"
            exit 1
          fi
          echo "open-failure-issue correctly reported it would file a new issue."
