name: selftest
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  links:
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/check-links.yml
    with:
      create-issue-on-main: false
  # check-non-standard-chars's extensions input is brand new, so (like
  # lint-yaml/lint-markdown below) it isn't at the released `@v2` tag its
  # reusable workflow's internal `uses: Morrison-Lab/gha/check-non-standard-chars@v2`
  # step resolves against yet. Exercise the local composite directly.
  chars:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run check-non-standard-chars unit tests
        shell: bash
        run: python3 check-non-standard-chars/tests/test_check_non_standard_chars.py

      - name: Check for non-standard characters
        uses: ./check-non-standard-chars
        with:
          python-version: '3.x'
          extensions: '.qmd, .R, .md'
  # lint-yaml/lint-markdown are brand new, so (like check-phi below) they
  # aren't at the released `@v2` tag their reusable workflows' internal
  # `uses: Morrison-Lab/gha/lint-*@v2` step resolves against yet. Exercise the
  # local composites directly against this repo's own tracked YAML/Markdown,
  # bypassing the wrapper the way check-phi/quarto-publish/test-coverage do.
  lint-yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint YAML
        uses: ./lint-yaml
  lint-markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Lint Markdown
        uses: ./lint-markdown
        with:
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      - name: Run list-item merge splice detector unit tests
        run: node lint-markdown/tests/test_list_item_splices.mjs
      - name: Run split-table detector unit tests
        run: node lint-markdown/tests/test_table_splits.mjs
      - name: Run check-node-version unit tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-check-node-version-tests.sh

  lint-qmd:

    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint QMD prose
        uses: ./lint-qmd
        with:
          globs: '*.qmd'
          fail: true
      - name: Run website reference sidebar guard unit tests and repo verification
        shell: bash
        run: |
          bash .github/workflows/scripts/tests/run-website-reference-sidebar-tests.sh --self-test
          bash .github/workflows/scripts/tests/run-website-reference-sidebar-tests.sh
      - name: Run permissions-docs guard unit tests and repo verification
        shell: bash
        run: |
          python3 .github/workflows/scripts/tests/run-permissions-docs-tests.py --self-test
          python3 .github/workflows/scripts/tests/run-permissions-docs-tests.py
      - name: Run assemble-news unit tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-assemble-news-tests.sh
      - name: Prepare assemble-news fixture
        shell: bash
        run: |
          mkdir -p fixture_news.d
          printf -- '- Test feature ([#1](https://github.com/foo/bar/issues/1)).\n' > fixture_news.d/test.added.md
          printf '# pkg (dev)\n' > fixture_NEWS.md
      - name: Exercise assemble-news composite action
        uses: ./.github/actions/assemble-news
        with:
          fragments-dir: fixture_news.d
          news-file: fixture_NEWS.md
      - name: Verify assembled fixture output
        shell: bash
        run: |
          grep -q '## New features' fixture_NEWS.md
          rm -rf fixture_news.d fixture_NEWS.md
      # The unit tests above cover the script; this covers the composite's own
      # plumbing of the `headings` input through to it, which they cannot see.
      - name: Prepare assemble-news custom-headings fixture
        shell: bash
        run: |
          mkdir -p fixture_news.d
          printf -- '- Test infra change.\n' > fixture_news.d/test.infrastructure.md
          printf '# pkg (dev)\n' > fixture_NEWS.md
      - name: Exercise assemble-news composite action with custom headings
        uses: ./.github/actions/assemble-news
        with:
          fragments-dir: fixture_news.d
          news-file: fixture_NEWS.md
          headings: |
            infrastructure = Infrastructure
      - name: Verify custom-headings fixture output
        shell: bash
        run: |
          grep -q '^## Infrastructure$' fixture_NEWS.md
          rm -rf fixture_news.d fixture_NEWS.md
  # Throwaway fixture, generated at runtime rather than committed (per
  # CLAUDE.md's "Generate selftest fixtures at runtime" rule): a deliberately
  # flawed workflow (unpinned third-party action, untrusted-input template
  # injection) that both actionlint and zizmor should flag, plus a clean one
  # as the negative control -- a sweep with no negative control can't tell a
  # working detector from one that never ran.
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create flawed and clean fixture repos
        shell: bash
        run: |
          set -euo pipefail
          # The fixture files below need a literal, un-evaluated GitHub
          # Actions expression sequence on disk (that's the untrusted-input
          # pattern zizmor and actionlint are meant to catch) -- but this
          # step's OWN run: block is itself scanned for that same sequence by
          # the Actions runner before bash ever sees it, so writing it
          # directly here would make THIS workflow evaluate it instead of the
          # fixture (even inside a comment -- the scanner doesn't know what a
          # shell comment is). D/OPEN/CLOSE split the trigger sequence across
          # two shell variables so it never appears contiguously in this
          # file's source, including in this comment.
          D='$'
          OPEN="${D}{{"
          CLOSE='}}'

          mkdir -p _ci-lint-workflows-flawed/.github/workflows
          cat > _ci-lint-workflows-flawed/.github/workflows/bad.yml <<EOF
          name: Bad Workflow
          on:
            push:
              branches: [main]
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - run: echo "Building ${OPEN} github.event.head_commit.message ${CLOSE}"
          EOF
          git -C _ci-lint-workflows-flawed init -q
          git -C _ci-lint-workflows-flawed config user.email "ci@example.com" # phi-allow (synthetic fixture address, not real PHI)
          git -C _ci-lint-workflows-flawed config user.name "CI"
          git -C _ci-lint-workflows-flawed add -A
          git -C _ci-lint-workflows-flawed commit -q -m fixture

          mkdir -p _ci-lint-workflows-clean/.github/workflows
          cat > _ci-lint-workflows-clean/.github/workflows/good.yml <<EOF
          name: Good Workflow
          on:
            push:
              branches: [main]
          permissions:
            contents: read
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    persist-credentials: false
                - env:
                    COMMIT_MESSAGE: ${OPEN} github.event.head_commit.message ${CLOSE}
                  run: echo "Building \$COMMIT_MESSAGE"
          EOF
          git -C _ci-lint-workflows-clean init -q
          git -C _ci-lint-workflows-clean config user.email "ci@example.com" # phi-allow (synthetic fixture address, not real PHI)
          git -C _ci-lint-workflows-clean config user.name "CI"
          git -C _ci-lint-workflows-clean add -A
          git -C _ci-lint-workflows-clean commit -q -m fixture
      - name: Exercise lint-workflows on the flawed fixture (fail=false)
        id: flawed-warn
        uses: ./lint-workflows
        with:
          path: _ci-lint-workflows-flawed
          fail: 'false'
      - name: Assert both tools flagged the flawed fixture
        shell: bash
        env:
          ACTIONLINT_FOUND: ${{ steps.flawed-warn.outputs.actionlint-found }}
          ZIZMOR_FOUND: ${{ steps.flawed-warn.outputs.zizmor-found }}
        run: |
          set -euo pipefail
          if [[ "$ACTIONLINT_FOUND" != "true" ]]; then
            echo "::error::expected actionlint-found=true on the flawed fixture, got '$ACTIONLINT_FOUND'"
            exit 1
          fi
          if [[ "$ZIZMOR_FOUND" != "true" ]]; then
            echo "::error::expected zizmor-found=true on the flawed fixture, got '$ZIZMOR_FOUND'"
            exit 1
          fi
      - name: Exercise lint-workflows on the flawed fixture (fail=true, the default)
        id: flawed-fail
        continue-on-error: true
        uses: ./lint-workflows
        with:
          path: _ci-lint-workflows-flawed
      - name: Assert fail=true actually fails the action
        shell: bash
        env:
          OUTCOME: ${{ steps.flawed-fail.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "::error::expected the fail=true (default) exercise to fail, got outcome='$OUTCOME'"
            exit 1
          fi
      - name: Exercise lint-workflows on the clean fixture (negative control)
        id: clean
        uses: ./lint-workflows
        with:
          path: _ci-lint-workflows-clean
      - name: Assert the clean fixture reports no findings
        shell: bash
        env:
          ACTIONLINT_FOUND: ${{ steps.clean.outputs.actionlint-found }}
          ZIZMOR_FOUND: ${{ steps.clean.outputs.zizmor-found }}
        run: |
          set -euo pipefail
          if [[ "$ACTIONLINT_FOUND" != "false" ]]; then
            echo "::error::expected actionlint-found=false on the clean fixture, got '$ACTIONLINT_FOUND'"
            exit 1
          fi
          if [[ "$ZIZMOR_FOUND" != "false" ]]; then
            echo "::error::expected zizmor-found=false on the clean fixture, got '$ZIZMOR_FOUND'"
            exit 1
          fi
      - name: Audit repository workflows with actionlint
        shell: bash
        run: |
          set -euo pipefail
          # Audits this repo's own .github/workflows/*.yml using actionlint
          # (gha#582, gha#591). Shellcheck is disabled here because inline
          # script style checks are covered by the dedicated shellcheck passes;
          # actionlint here enforces GitHub Actions schema, syntax, expression,
          # and reusable workflow caller rules across all workflows.
          actionlint -shellcheck ""
  # lint-changed-lines' composite can't be exercised end-to-end here: it needs
  # a live pull_request event plus an installable R package to lint against
  # (this repo is neither). Run the offline unit test for its diff-hunk parser
  # instead; the composite itself is validated by real PR usage once released
  # (the same rationale as run-claude-review-attempt).
  lint-changed-lines-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          use-public-rspm: true
      - name: Set up R dependencies for ghatools
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          working-directory: ghatools
      - name: Run added-lines parser tests
        run: Rscript lint-changed-lines/tests/test-added-lines.R
      - name: Run ghatools package unit tests
        run: bash .github/workflows/scripts/tests/run-ghatools-tests.sh
      - name: Run check-ai-tells offline tests
        run: bash .github/workflows/scripts/tests/run-check-ai-tells-tests.sh
  ai-tells:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan repository for AI tells
        uses: ./check-ai-tells
        with:
          paths-ignore: 'check-ai-tells/tests/positive-control.md'
          fail: false
      - name: Create AI tells ignore test fixture
        shell: bash
        run: |
          set -euo pipefail
          echo "This robust guide explores the statistical landscape." > _ci-aitells-fixture.md
      - name: Test ignore-tells suppresses specified tells
        uses: ./check-ai-tells
        with:
          paths: '_ci-aitells-fixture.md'
          ignore-tells: 'robust, landscape'
          fail: true
          threshold: 0
  bib:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check bibliography DOIs
        uses: ./check-bibliography-dois
        with:
          no-metadata-check: true
  # check-phi is brand new, so it doesn't exist at the released `@v1` tag the
  # reusable workflow pins yet. Exercise the local composite directly so the
  # selftest covers the actual PR code (and stays green pre-release); consumers
  # use the reusable workflow once `@v1` includes the action.
  phi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for PHI
        uses: ./check-phi
        with:
          # Run every detector (incl. the off-by-default phone/email) so CI
          # exercises them all; this repo's tree is identifier-free apart from
          # test fixtures that carry synthetic PHI-shaped strings by design (the
          # detector unit tests, the coverage, spellcheck, and check-typos
          # fixture generators' synthetic maintainer emails, and
          # check-new-line-breaks'
          # throwaway git-repo test fixtures' placeholder git config email),
          # which are skipped via paths-ignore below.
          # This input REPLACES the default set rather than extending it, so a
          # detector added to DEFAULT_DETECTORS and not added here gets no
          # end-to-end coverage at all and the comment above quietly stops
          # being true.
          detectors: 'ssn,mrn,dob,csv_phi_header,study_id,phone,email'
          paths-ignore: |
            check-phi/tests/**
            test-coverage/tests/**
            check-new-line-breaks/tests/**
            spellcheck/tests/**
            check-typos/tests/**
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
  # The phi job above proves the action runs clean on an identifier-free tree;
  # this job unit-tests the detector functions directly (positive + negative
  # fixtures per detector, incl. the csv_phi_header line-1/suffix edge cases), so
  # a regression in the regexes/heuristics is caught even when this repo's own
  # tree wouldn't trip it.
  phi-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Run check-phi detector unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest check-phi/tests/ -q
  antigravity-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'
      - name: Run Antigravity runner unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s antigravity-review/tests
      - name: Run Antigravity preflight audit
        shell: bash
        run: |
          set -euo pipefail
          python3 antigravity-review/scripts/preflight_check.py
      - name: Test Antigravity composite action
        uses: ./antigravity-review
        with:
          mode: 'code-review'
          dry-run: 'true'
          post-comment: 'false'
  # check-new-line-breaks is brand new, so (like check-phi/lint-yaml/lint-markdown
  # above) it doesn't exist at the released `@v2` tag its reusable workflow's
  # internal `uses: Morrison-Lab/gha/check-new-line-breaks@v2` step resolves
  # against yet. Exercise the local composite directly so the selftest covers
  # the actual PR code; consumers use the reusable workflow once `@v2` includes
  # the action. base-ref makes this a real diff-scoped run against whatever
  # this PR itself adds, the same pattern the phi job above uses.
  new-line-breaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check new markdown lines for missing semantic breaks
        uses: ./check-new-line-breaks
        with:
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      # The clause check (#336) is on by default, so the step above already
      # covers it. This one covers the opt-out, and covers that `action.yml`
      # parses and that the clause_breaks=False path runs to completion.
      # Declaration is pinned by the defaults-agreement test, which fails
      # outright when the input has no `default:`.
      - name: Check again with the clause check opted out
        uses: ./check-new-line-breaks
        with:
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          clause-breaks: 'false'
  # The new-line-breaks job above proves the action runs against this repo's
  # own tree; this job unit-tests the sentence-splitter/block-detector
  # functions and the diff-scoping behavior directly (small throwaway git
  # repos), so a regression in either is caught even when this repo's own
  # tree wouldn't trip it.
  new-line-breaks-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Run check-new-line-breaks unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest check-new-line-breaks/tests/ -q
  # check-secrets is brand new, so (like check-phi/check-new-line-breaks above)
  # it doesn't exist at the released `@v2` tag its reusable workflow's internal
  # `uses: Morrison-Lab/gha/check-secrets@v2` step resolves against yet.
  # Exercise the local composite directly so the selftest covers the actual PR
  # code. Unlike the phi job this is deliberately NOT diff-scoped: the whole
  # point is that a secret committed and later removed is still exposed, so the
  # scan runs over this repo's full history, which needs fetch-depth: 0.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Deliberately passes no paths-ignore and no allowlist, unlike the phi
      # job: this repo's whole history scans clean under the default ruleset,
      # and an allowlist entry that has never suppressed anything is an
      # entry nobody rechecks. Measured against gitleaks 8.30.1 over all 382
      # commits reachable from this branch: zero findings. Add an exclusion
      # when a real false positive appears, not in advance of one.
      - name: Check for secrets
        uses: ./check-secrets
  # The secrets job above proves the composite runs clean against this repo's
  # real history -- which means it always takes the zero-findings early return,
  # so it exercises none of the blocking logic. These offline suites cover what
  # it structurally cannot: a config regression that silently widens an
  # allowlist, and the fail/annotate/exit branches that only run when a finding
  # exists. Kept separate from that job because they need no network -- a flaky
  # gitleaks download shouldn't take their signal down with it.
  secrets-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run build-gitleaks-config tests
        shell: bash
        run: bash check-secrets/tests/test-build-config.sh
      # Drives scan-secrets.sh against a stub gitleaks that writes a canned
      # report, so the `fail`-keyed branches, the annotation loop, and the exit
      # code run for real. Round 1 of gha#385's review found a fail-open `fail`
      # bug in exactly this region while both selftest jobs stayed green;
      # reintroducing it now turns two assertions red.
      - name: Run scan-secrets tests
        shell: bash
        run: bash check-secrets/tests/test-scan-secrets.sh
  # claude-code-review.yml's fail-check step (its stub/placeholder-review
  # guard, #172) had no automated coverage — it was only verified by manual
  # trace against known stub texts, since a live Claude API call isn't
  # something a selftest job can exercise. The guard logic itself is pure,
  # offline shell (scripts/check-review-execution.sh), so run it directly
  # against canned execution-output fixtures instead (#174).
  review-fail-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run fail-check fixture tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-fixture-tests.sh
      - name: Run parse-workflow-ref fixture tests
        shell: bash
        run: bash .github/actions/parse-workflow-ref/tests/run-tests.sh
      - name: Run sum-costs arithmetic tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-sum-costs-tests.sh
      - name: Run detect-review-request matcher tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-detect-review-request-tests.sh
      # Separate from the matcher tests above because the stripper has its own
      # consumer coming (claude.yml's mention gate, gha#342) and its failure
      # modes run in both directions -- under-stripping dispatches on quoted
      # text, over-stripping swallows a real request.
      - name: Run strip-non-invoking-markup tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-strip-non-invoking-markup-tests.sh
      - name: Run reviewer allowlist guard
        shell: bash
        run: python3 .github/workflows/scripts/tests/run-reviewer-allowlist-tests.py
      - name: Run export-extra-secrets unit tests
        shell: bash
        run: python3 .github/workflows/scripts/tests/test_export_extra_secrets.py
      - name: Run detect-bot-mention tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-detect-bot-mention-tests.sh
      - name: Run classify-push-failure tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-classify-push-failure-tests.sh
      - name: Run build-self-review-skip-notice tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-build-self-review-skip-notice-tests.sh
      - name: Run dispatch-review tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-dispatch-review-tests.sh
      - name: Run resolve-pr-info tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-resolve-pr-info-tests.sh
      - name: Exercise dispatch-review composite action end-to-end
        uses: ./.github/actions/dispatch-review
        with:
          pr-number: '123'
          pr-branch: 'main'
          pr-head-repo: 'Morrison-Lab/gha'
          dry-run: 'true'
      - name: Exercise resolve-pr-info composite action end-to-end
        uses: ./.github/actions/resolve-pr-info
        with:
          pr-number: '123'
      - name: Exercise build-self-review-skip-notice composite action end-to-end
        id: skip-notice-e2e
        uses: ./.github/actions/build-self-review-skip-notice
        with:
          workflow-path: .github/workflows/claude-code-review.yml
          run-url: https://github.com/Morrison-Lab/gha/actions/runs/12345
      - name: Exercise export-extra-secrets composite action end-to-end
        uses: ./.github/actions/export-extra-secrets
        with:
          extra-secret-names: TEST_SECRET
          secrets-json: '{"TEST_SECRET": "test_val"}'
      - name: Assert export-extra-secrets exported environment variable
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${TEST_SECRET:-}" != "test_val" ]]; then
            echo "::error::export-extra-secrets did not export TEST_SECRET=test_val to environment"
            exit 1
          fi
          echo "export-extra-secrets correctly exported TEST_SECRET to environment"
      - name: Assert build-self-review-skip-notice generated body file
        shell: bash
        env:
          BODY_FILE: ${{ steps.skip-notice-e2e.outputs.body-file }}
        run: |
          set -euo pipefail
          if [[ ! -s "$BODY_FILE" ]]; then
            echo "::error::build-self-review-skip-notice did not generate a non-empty body file"
            exit 1
          fi
          echo "build-self-review-skip-notice correctly generated body file at $BODY_FILE"
      # Exercises the run-review-guard composite action itself (not just the
      # check-review-execution.sh script it wraps) via a real `uses:` step, so
      # its github.action_path-relative resolution of the script is actually
      # proven to work end-to-end — a unit test of the script alone would not
      # have caught #191's job_workflow_ref regression (gha#196).
      - name: Exercise run-review-guard composite action end-to-end
        id: guard-e2e
        uses: ./.github/actions/run-review-guard
        with:
          execution-file: .github/workflows/scripts/tests/fixtures/genuine-finished-review.json
      - name: Assert run-review-guard produced review text
        shell: bash
        env:
          REVIEW_TEXT_FILE: ${{ steps.guard-e2e.outputs.review_text_file }}
        run: |
          set -euo pipefail
          if [[ -z "$REVIEW_TEXT_FILE" || ! -s "$REVIEW_TEXT_FILE" ]]; then
            echo "::error::run-review-guard did not produce a non-empty review_text_file output"
            exit 1
          fi
          echo "run-review-guard produced review_text_file=$REVIEW_TEXT_FILE"
      # Proves the composite action's total_cost_usd passthrough works
      # end-to-end (gha#219) — the fixture tests above already cover
      # check-review-execution.sh's own output; this is the same
      # real-`uses:` reasoning that motivated the stub_review e2e check below.
      - name: Assert run-review-guard surfaced total_cost_usd
        shell: bash
        env:
          TOTAL_COST_USD: ${{ steps.guard-e2e.outputs.total_cost_usd }}
        run: |
          set -euo pipefail
          if [[ "$TOTAL_COST_USD" != "0.42" ]]; then
            echo "::error::run-review-guard did not surface total_cost_usd=0.42 for genuine-finished-review.json (got '$TOTAL_COST_USD')"
            exit 1
          fi
          echo "run-review-guard correctly surfaced total_cost_usd=$TOTAL_COST_USD"
      # A second real `uses:` call, against a stub fixture, proving the
      # composite action's stub_review output passthrough works end-to-end —
      # not just check-review-execution.sh's own output (already covered by
      # the fixture tests above). claude-code-review.yml's retry (gha#185)
      # gates entirely on this composite output, so a passthrough wiring bug
      # here would silently disable the retry without any fixture test
      # catching it.
      - name: Exercise run-review-guard composite action end-to-end (stub fixture)
        id: guard-e2e-stub
        continue-on-error: true
        uses: ./.github/actions/run-review-guard
        with:
          execution-file: .github/workflows/scripts/tests/fixtures/stub-pr171-waiting-background-agents.json
      - name: Assert run-review-guard surfaced stub_review=true
        shell: bash
        env:
          STUB_REVIEW: ${{ steps.guard-e2e-stub.outputs.stub_review }}
        run: |
          set -euo pipefail
          if [[ "$STUB_REVIEW" != "true" ]]; then
            echo "::error::run-review-guard did not surface stub_review=true for a known stub fixture"
            exit 1
          fi
          echo "run-review-guard correctly surfaced stub_review=true"
      # total_cost_usd is written regardless of outcome (gha#219), so a stub
      # result must surface it too — not just the passing case above.
      # gha#548 added three outputs to this composite (max_denials,
      # failure_kind, denied_tools), each a `value: ${{ steps.run.outputs.X }}`
      # mapping. run-fixture-tests.sh covers them, but it calls
      # check-review-execution.sh DIRECTLY and so never touches action.yml --
      # a typo in one of those three expressions would silently yield an empty
      # output and no test would notice. That is precisely the gap this
      # composite's e2e steps were added for after gha#191/#196: the sed logic
      # was unit-tested while nothing exercised the real `uses:` call
      # (gha#548 review round 2).
      - name: Assert run-review-guard surfaced the gha#543 diagnostic outputs
        shell: bash
        env:
          FAILURE_KIND: ${{ steps.guard-e2e-stub.outputs.failure_kind }}
          MAX_DENIALS: ${{ steps.guard-e2e-stub.outputs.max_denials }}
          DENIED_TOOLS: ${{ steps.guard-e2e-stub.outputs.denied_tools }}
        run: |
          set -euo pipefail
          if [[ "$FAILURE_KIND" != "stub" ]]; then
            echo "::error::expected failure_kind=stub from the composite, got '$FAILURE_KIND'"
            exit 1
          fi
          if [[ "$MAX_DENIALS" != "5" ]]; then
            echo "::error::expected max_denials=5 from the composite, got '$MAX_DENIALS'"
            exit 1
          fi
          # denied_tools is legitimately EMPTY on this fixture (it has no
          # denials), so its value is not the assertion -- the two above are
          # what prove the passthrough wiring. Asserting emptiness here would
          # pass just as well with the output mapping deleted, which is the
          # vacuous shape this suite has already been caught by.
          echo "run-review-guard passed through failure_kind and max_denials correctly"

      - name: Assert run-review-guard surfaced total_cost_usd (stub fixture)
        shell: bash
        env:
          TOTAL_COST_USD: ${{ steps.guard-e2e-stub.outputs.total_cost_usd }}
        run: |
          set -euo pipefail
          if [[ "$TOTAL_COST_USD" != "0.05" ]]; then
            echo "::error::run-review-guard did not surface total_cost_usd=0.05 for stub-pr171-waiting-background-agents.json (got '$TOTAL_COST_USD')"
            exit 1
          fi
          echo "run-review-guard correctly surfaced total_cost_usd=$TOTAL_COST_USD for a stub result"
      # A third real `uses:` call, against a short-circuit fixture, proving
      # the composite action's action_short_circuit output passthrough works
      # end-to-end (gha#368) — claude-code-review.yml's retry gates on this
      # composite output.
      - name: Exercise run-review-guard composite action end-to-end (short-circuit fixture)
        id: guard-e2e-short-circuit
        continue-on-error: true
        uses: ./.github/actions/run-review-guard
        with:
          execution-file: .github/workflows/scripts/tests/fixtures/short-circuit-no-result.json
      - name: Assert run-review-guard surfaced action_short_circuit=true
        shell: bash
        env:
          SHORT_CIRCUIT: ${{ steps.guard-e2e-short-circuit.outputs.action_short_circuit }}
          NO_RESULT: ${{ steps.guard-e2e-short-circuit.outputs.no_result }}
        run: |
          set -euo pipefail
          if [[ "$SHORT_CIRCUIT" != "true" || "$NO_RESULT" != "true" ]]; then
            echo "::error::run-review-guard did not surface action_short_circuit=true and no_result=true for a short-circuit fixture"
            exit 1
          fi
          echo "run-review-guard correctly surfaced action_short_circuit=true and no_result=true"
      # Proves claude.yml's extract-total-cost composite action end-to-end
      # (gha#219 review finding 1) -- the same real-`uses:` reasoning as
      # run-review-guard above, since a unit test of the underlying script
      # alone would not catch a github.action_path resolution regression.
      - name: Exercise extract-total-cost composite action end-to-end
        id: cost-e2e
        uses: ./.github/actions/extract-total-cost
        with:
          execution-file: .github/workflows/scripts/tests/fixtures/genuine-finished-review.json
      - name: Assert extract-total-cost surfaced the fixture's cost
        shell: bash
        env:
          COST: ${{ steps.cost-e2e.outputs.cost }}
        run: |
          set -euo pipefail
          if [[ "$COST" != "0.42" ]]; then
            echo "::error::extract-total-cost did not surface cost=0.42 for genuine-finished-review.json (got '$COST')"
            exit 1
          fi
          echo "extract-total-cost correctly surfaced cost=$COST"
      - name: Exercise extract-total-cost composite action end-to-end (missing file)
        id: cost-e2e-missing
        uses: ./.github/actions/extract-total-cost
        with:
          execution-file: .github/workflows/scripts/tests/fixtures/does-not-exist.json
      - name: Assert extract-total-cost is silent for a missing file
        shell: bash
        env:
          COST: ${{ steps.cost-e2e-missing.outputs.cost }}
        run: |
          set -euo pipefail
          if [[ -n "$COST" ]]; then
            echo "::error::extract-total-cost should surface no cost output for a missing execution file (got '$COST')"
            exit 1
          fi
          echo "extract-total-cost correctly surfaced no cost for a missing file"
      # Proves claude-code-review.yml's sum-costs composite action end-to-end
      # (gha#219 review finding 5) -- the arithmetic itself is unit-tested
      # above; this proves the github.action_path resolution and output
      # passthrough actually work, the same reasoning as the run-review-guard
      # and extract-total-cost e2e steps above.
      - name: Exercise sum-costs composite action end-to-end
        id: sum-costs-e2e
        uses: ./.github/actions/sum-costs
        with:
          cost-a: '0.30'
          cost-b: '0.12'
      - name: Assert sum-costs surfaced the correct total
        shell: bash
        env:
          TOTAL: ${{ steps.sum-costs-e2e.outputs.total }}
        run: |
          set -euo pipefail
          if [[ "$TOTAL" != "0.4200" ]]; then
            echo "::error::sum-costs did not surface total=0.4200 for 0.30 + 0.12 (got '$TOTAL')"
            exit 1
          fi
          echo "sum-costs correctly surfaced total=$TOTAL"
      # Proves claude.yml's detect-review-request composite action end-to-end.
      # The pattern itself is unit-tested above; what only a real `uses:` step
      # can prove is the github.action_path resolution, the output
      # passthrough, and -- the part no unit test reaches -- the base64
      # round-trip on the bodies-file path, which is how the late-comment
      # rescue scan feeds multi-line comment bodies through the same matcher.
      - name: Build a bodies-file for detect-review-request
        shell: bash
        run: |
          set -euo pipefail
          # Two multi-line bodies, only the second a review request, encoded
          # exactly as claude.yml's "Collect comments posted after the
          # trigger" step encodes them.
          printf '%s\n' \
            '{"body":"looks good to me\nshipping it"}' \
            '{"body":"@claude, please review\n\nthanks!"}' \
            | jq -r '.body | @base64' > "$RUNNER_TEMP/late-bodies.b64"
      - name: Exercise detect-review-request composite action end-to-end
        id: detect-e2e
        uses: ./.github/actions/detect-review-request
        with:
          bodies-file: ${{ runner.temp }}/late-bodies.b64
      - name: Exercise detect-review-request on a non-request comment
        id: detect-e2e-negative
        uses: ./.github/actions/detect-review-request
        with:
          comment-body: "@claude the review workflow is broken, can you fix it?"
      - name: Assert detect-review-request surfaced the correct matches
        shell: bash
        env:
          MATCH: ${{ steps.detect-e2e.outputs.match }}
          MATCH_NEGATIVE: ${{ steps.detect-e2e-negative.outputs.match }}
        run: |
          set -euo pipefail
          if [[ "$MATCH" != "true" ]]; then
            echo "::error::detect-review-request did not match the base64-encoded '@claude, please review' body (got '$MATCH')"
            exit 1
          fi
          if [[ "$MATCH_NEGATIVE" != "false" ]]; then
            echo "::error::detect-review-request matched a comment that only mentions the word review (got '$MATCH_NEGATIVE')"
            exit 1
          fi
          echo "detect-review-request correctly surfaced match=true / match=false"
      # Proves claude.yml's detect-bot-mention composite action end-to-end
      # (gha#342) -- the same github.action_path-resolution proof the steps
      # above give, which is the one thing the offline table cannot reach.
      # Both directions are asserted, because the only behaviour this gate can
      # cause is a skip: the negative case is the bug being fixed, and the
      # positive case is what stops the fix from silencing real requests.
      - name: Exercise detect-bot-mention on a quoted mention
        id: mention-e2e-quoted
        uses: ./.github/actions/detect-bot-mention
        with:
          comment-body: "the trigger is `@claude` and it has no notion of Markdown"
      - name: Exercise detect-bot-mention on a genuine mention
        id: mention-e2e-genuine
        uses: ./.github/actions/detect-bot-mention
        with:
          issue-title: "@claude fix the failing test"
      - name: Assert detect-bot-mention surfaced the correct matches
        shell: bash
        env:
          MATCH_QUOTED: ${{ steps.mention-e2e-quoted.outputs.match }}
          MATCH_GENUINE: ${{ steps.mention-e2e-genuine.outputs.match }}
        run: |
          set -euo pipefail
          if [[ "$MATCH_QUOTED" != "false" ]]; then
            echo "::error::detect-bot-mention treated a code-span mention as an invocation (got '$MATCH_QUOTED')"
            exit 1
          fi
          if [[ "$MATCH_GENUINE" != "true" ]]; then
            echo "::error::detect-bot-mention missed a genuine mention in an issue title (got '$MATCH_GENUINE')"
            exit 1
          fi
          echo "detect-bot-mention correctly surfaced match=false / match=true"
      # Proves claude.yml's report-push-failure composite action end-to-end
      # (gha#360). Three things no offline table can reach: the
      # github.action_path resolution of classify-push-failure.sh, the patch
      # generated from a live checkout, and the credential redaction. That
      # last one is the reason `dry-run` exists here -- the body is destined
      # for a PR comment, where Actions' own secret masking does not apply, so
      # a leak would be published rather than starred out.
      #
      # These steps run LAST in this job because they commit to the checkout.
      - name: Stage a throwaway commit and a rejected-push log
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "selftest@example.invalid"  # phi-allow
          git config user.name "selftest"
          git switch -c selftest-report-push-failure
          echo "baseline_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'throwaway\n' > push-failure-fixture.txt
          git add push-failure-fixture.txt
          git commit -qm 'selftest: throwaway commit for report-push-failure'
          # The rejection gha#360 was filed over, with a credential in the
          # remote URL exactly as git echoes one back on a failed push. The
          # credential is interpolated rather than written inline so the
          # source line does not itself look like an email address to the
          # `phi` job's scanner.
          FAKE_CRED='notarealtoken'
          printf '%s\n' \
            "To https://x-access-token:${FAKE_CRED}@github.com/o/r.git" \
            ' ! [remote rejected] HEAD -> topic (refusing to allow a GitHub App to create or update workflow `.github/workflows/validate.yml` without `workflows` permission)' \
            > "$RUNNER_TEMP/push-failure.log"
      - name: Exercise report-push-failure composite action end-to-end
        id: push-failure-e2e
        uses: ./.github/actions/report-push-failure
        with:
          push-log: ${{ runner.temp }}/push-failure.log
          baseline-sha: ${{ env.baseline_sha }}
          ref: HEAD
          run-url: https://example.invalid/run
          dry-run: 'true'
      - name: Assert report-push-failure classified, explained, and redacted
        shell: bash
        env:
          KIND: ${{ steps.push-failure-e2e.outputs.kind }}
          BODY_FILE: ${{ steps.push-failure-e2e.outputs.body-file }}
        run: |
          set -euo pipefail
          if [[ "$KIND" != "workflows-permission" ]]; then
            echo "::error::report-push-failure classified the gha#360 rejection as '$KIND'"
            exit 1
          fi
          if [[ -z "$BODY_FILE" || ! -s "$BODY_FILE" ]]; then
            echo "::error::report-push-failure produced no comment body"
            exit 1
          fi
          if ! grep -q 'WORKFLOW_TOKEN' "$BODY_FILE"; then
            echo "::error::the report does not name the secret that is missing"
            exit 1
          fi
          # The whole point of preserving the work: without a patch the
          # commits are gone when the runner is reclaimed.
          if ! grep -q '^diff --git' "$BODY_FILE"; then
            echo "::error::the report carries no patch of the unpushed commits"
            exit 1
          fi
          if grep -q 'notarealtoken' "$BODY_FILE"; then
            echo "::error::the report would have published the push credential"
            exit 1
          fi
          echo "report-push-failure classified, explained, patched, and redacted correctly"
      # A second real call, on a log holding no backticks at all -- the
      # ordinary shape of a network or auth failure, and the one that falls
      # through to `other`. It is here because the body builder counts
      # backtick runs to size its fences, and `grep` exits non-zero when there
      # are none: under the composite's own `pipefail` that can abort the
      # whole report. The first fixture cannot catch it, since a
      # workflows-permission rejection always carries backticks.
      - name: Write a backtick-free push log
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'fatal: unable to access https://github.com/o/r.git/: Could not resolve host' \
            > "$RUNNER_TEMP/push-failure-plain.log"
      - name: Exercise report-push-failure on a backtick-free log
        id: push-failure-plain
        uses: ./.github/actions/report-push-failure
        with:
          push-log: ${{ runner.temp }}/push-failure-plain.log
          baseline-sha: ${{ env.baseline_sha }}
          ref: HEAD
          dry-run: 'true'
      - name: Assert the backtick-free log still produced a report
        shell: bash
        env:
          KIND: ${{ steps.push-failure-plain.outputs.kind }}
          BODY_FILE: ${{ steps.push-failure-plain.outputs.body-file }}
        run: |
          set -euo pipefail
          if [[ "$KIND" != "other" ]]; then
            echo "::error::an unrecognized failure classified as '$KIND', expected 'other'"
            exit 1
          fi
          if [[ -z "$BODY_FILE" || ! -s "$BODY_FILE" ]]; then
            echo "::error::a backtick-free push log produced no report body"
            exit 1
          fi
          echo "report-push-failure handled a backtick-free log correctly"
      # A third call, with no push log at all -- the calling step failed
      # before it pushed. This must still post, because the caller's
      # response-post step is gated off on the same failure, so standing down
      # here would leave the thread with no comment at all (gha#361 review).
      - name: Exercise report-push-failure with no push log
        id: push-failure-none
        uses: ./.github/actions/report-push-failure
        with:
          push-log: ${{ runner.temp }}/no-such-push-log.log
          baseline-sha: ${{ env.baseline_sha }}
          ref: HEAD
          dry-run: 'true'
      - name: Assert the missing-log case still reports
        shell: bash
        env:
          KIND: ${{ steps.push-failure-none.outputs.kind }}
          BODY_FILE: ${{ steps.push-failure-none.outputs.body-file }}
        run: |
          set -euo pipefail
          if [[ "$KIND" != "no-push-attempt" ]]; then
            echo "::error::a missing push log classified as '$KIND', expected 'no-push-attempt'"
            exit 1
          fi
          if [[ -z "$BODY_FILE" || ! -s "$BODY_FILE" ]]; then
            echo "::error::a missing push log produced no report -- the thread would go silent"
            exit 1
          fi
          # The commits are still stranded, so the patch is the point.
          if ! grep -q '^diff --git' "$BODY_FILE"; then
            echo "::error::the missing-log report carries no patch of the unpushed commits"
            exit 1
          fi
          echo "report-push-failure reported the no-push-attempt case correctly"
      # A fourth call, on a secret-scanning rejection. This is the one kind
      # that must NOT render the patch: those commits carry the secret the
      # push was blocked to contain, so publishing them would undo the block
      # (gha#361 review). The throwaway commit staged above is the payload.
      - name: Write a push-protection rejection log
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'remote: error: GH013: Repository rule violations found for refs/heads/topic.' \
            'remote: - GITHUB PUSH PROTECTION' \
            'remote:   Resolve the following secrets before pushing again.' \
            > "$RUNNER_TEMP/push-failure-secret.log"
      - name: Exercise report-push-failure on a secret-scanning rejection
        id: push-failure-secret
        uses: ./.github/actions/report-push-failure
        with:
          push-log: ${{ runner.temp }}/push-failure-secret.log
          baseline-sha: ${{ env.baseline_sha }}
          ref: HEAD
          # Passed deliberately, matching both production call sites. Omitting
          # it here hid a real contradiction: the no-patch fallback fires on an
          # empty patch, so a withheld patch used to append "see the workflow
          # run for the full log" directly under advice saying the run log
          # omits it too (round 5). Without this input that branch is
          # unreachable and the assertion below cannot see it.
          run-url: https://example.invalid/run
          dry-run: 'true'
      - name: Assert the secret-scanning case withholds the patch
        shell: bash
        env:
          KIND: ${{ steps.push-failure-secret.outputs.kind }}
          BODY_FILE: ${{ steps.push-failure-secret.outputs.body-file }}
        run: |
          set -euo pipefail
          if [[ "$KIND" != "push-protection" ]]; then
            echo "::error::a GH013 secret-scanning rejection classified as '$KIND'"
            exit 1
          fi
          # The assertion that matters: no patch, because a patch here would
          # republish whatever push protection caught.
          if grep -q '^diff --git' "$BODY_FILE"; then
            echo "::error::the report rendered a patch for a secret-scanning rejection"
            exit 1
          fi
          if ! grep -q 'No patch is included' "$BODY_FILE"; then
            echo "::error::the report does not tell the reader why the patch is missing"
            exit 1
          fi
          # ... and does not then send the reader to the run log for it, which
          # the advice two paragraphs up has just said omits it as well.
          if grep -q 'No patch could be generated' "$BODY_FILE"; then
            echo "::error::the report contradicts itself: patch withheld on purpose, then points at the run log for it"
            exit 1
          fi
          echo "report-push-failure withheld the patch for a secret-scanning rejection"

  # gha#580: the model job must not hold forge-write. Kept as its own job
  # rather than folded into review-fail-check, so a failure here is
  # attributable at a glance -- the same one-capability-per-job split
  # phi-tests / review-failure-report already use.
  review-job-split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run pack-review-payload tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-pack-review-payload-tests.sh
      - name: Run review-job-split self-tests
        shell: bash
        run: python3 .github/workflows/scripts/tests/run-review-job-split-tests.py --self-test
      - name: Run review-job-split assertions against this checkout
        shell: bash
        run: python3 .github/workflows/scripts/tests/run-review-job-split-tests.py
      # Real `uses:` call, proving pack-review-payload's github.action_path
      # resolution of pack-review-payload.sh works end-to-end. The offline
      # table above calls the script directly, so it cannot see whether
      # action.yml wires its inputs through at all.
      #
      # upload: false so this neither uploads an artifact nor depends on
      # actions: write. claude-code-review.yml's own consumption via @v2
      # is the documented bootstrap gap until the tag slides.
      - name: Exercise pack-review-payload composite action end-to-end
        id: pack-e2e
        uses: ./.github/actions/pack-review-payload
        with:
          pr-number: '12'
          upload: 'false'
          payload-dir: ${{ runner.temp }}/pack-e2e
          repo: Morrison-Lab/gha
          run-url: https://example.invalid/run
          run-id: '99'
          event-name: pull_request
          caller-wf-path: .github/workflows/claude-review.yml
          self-mod: 'false'
          quota-exhausted: 'false'
          cancelled: 'false'
          resolve-outcome: success
          head-sha: abc123
          total-cost-usd: '1.25'
          denials: '0'
          denied-tools: 'Bash(echo "$(gh pr merge)")'
          max-denials: '5'
          attempts: '1'
          track-progress: 'false'
          report-cost: 'true'
      - name: Assert pack-review-payload wrote payload.json and sidecars
        shell: bash
        env:
          DIR: ${{ steps.pack-e2e.outputs.dir }}
        run: |
          set -euo pipefail
          if [[ ! -f "$DIR/payload.json" ]]; then
            echo "::error::pack-review-payload did not write payload.json"
            exit 1
          fi
          if [[ "$(jq -r .pr_number "$DIR/payload.json")" != "12" ]]; then
            echo "::error::pack-review-payload did not wire pr-number through (got $(jq -r .pr_number "$DIR/payload.json"))"
            exit 1
          fi
          if [[ "$(jq -r .review_present "$DIR/payload.json")" != "false" ]]; then
            echo "::error::pack-review-payload treated a missing review as present"
            exit 1
          fi
          if [[ ! -f "$DIR/denied_tools.txt" ]]; then
            echo "::error::pack-review-payload dropped denied-tools"
            exit 1
          fi
          if [[ -f "$DIR/review.txt" ]]; then
            echo "::error::pack-review-payload wrote review.txt with no review-text-file"
            exit 1
          fi
          echo "pack-review-payload wrote payload.json and the denied_tools sidecar"

  # gha#543: the review-failure comment claude-code-review.yml posts when a
  # review run finishes without a usable verdict. Kept as its own job rather
  # than folded into review-fail-check, so a failure here is attributable at a
  # glance -- the same one-capability-per-job split phi-tests /
  # new-line-breaks-tests / gemini-review-fail-check already use.
  review-failure-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run compose-review-failure-report tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-compose-review-failure-report-tests.sh
      # Two real `uses:` calls, proving report-review-failure's own
      # github.action_path resolution of compose-review-failure-report.sh works
      # end-to-end. The offline table above calls the script directly, so it
      # cannot see whether action.yml wires its inputs through at all -- the
      # gap that let #191's job_workflow_ref regression through fixture tests
      # (gha#196), and the reason every sibling composite here has an e2e step
      # beside its unit tests.
      #
      # dry-run: true so this neither comments on a real PR nor stamps an
      # annotation onto a passing selftest job, the same reasoning
      # report-push-failure's and report-gemini-failure's e2e steps give.
      #
      # claude-code-review.yml's own consumption of this action via @v2 is not
      # exercised here -- the documented, accepted bootstrap gap
      # run-claude-review-attempt and request-dependabot-review also have
      # (CLAUDE.md): @v2 does not resolve until advanced past this PR's merge.
      - name: Exercise report-review-failure on a high-denial failure
        id: failure-high-denial
        uses: ./.github/actions/report-review-failure
        with:
          failure-kind: high-denial
          pr-number: '1'
          denials: '12'
          denied-tools: 'Taskx6 Bashx3 WebFetchx3 (sample: Task: review one file)'
          max-denials: '5'
          total-cost-usd: '1.77551245'
          attempts: '1'
          run-url: https://example.invalid/run
          dry-run: 'true'
      - name: Assert the high-denial report named its tools and its cost
        shell: bash
        env:
          KIND: ${{ steps.failure-high-denial.outputs.kind }}
          BODY_FILE: ${{ steps.failure-high-denial.outputs.body-file }}
          POSTED: ${{ steps.failure-high-denial.outputs.posted }}
        run: |
          set -euo pipefail
          if [[ "$KIND" != "high-denial" ]]; then
            echo "::error::expected kind=high-denial, got '$KIND'"
            exit 1
          fi
          if [[ "$POSTED" != "false" ]]; then
            echo "::error::a dry run must report posted=false, got '$POSTED'"
            exit 1
          fi
          if [[ -z "$BODY_FILE" || ! -s "$BODY_FILE" ]]; then
            echo "::error::report-review-failure produced no comment body"
            exit 1
          fi
          # The three things the comment exists to carry, checked on the real
          # composed body rather than on the script's stdout: the CAUTION alert
          # the caller renders, the denied tool names (gha#540's payload, and
          # the reason carrying this to the PR is worth the plumbing), and the
          # run link -- which is not decoration, since claude-code-review.yml's
          # collapse step matches comments by their `actions/runs/<id>` link
          # and would otherwise never fold this one.
          for needle in '> [!CAUTION]' 'Taskx6 Bashx3 WebFetchx3' '1.77551245' 'https://example.invalid/run'; do
            if ! grep -qF "$needle" "$BODY_FILE"; then
              echo "::error::composed body is missing: $needle"
              cat "$BODY_FILE"
              exit 1
            fi
          done
          echo "report-review-failure composed the high-denial report correctly"
      # The second call is not a duplicate of the first: it pins the
      # normalization path, which is the only judgment the composite makes for
      # itself. An unrecognized kind must come back as `unknown` and get
      # generic advice, rather than being echoed into a headline that
      # confidently misdescribes the failure.
      - name: Exercise report-review-failure on an unrecognized kind
        id: failure-unknown
        uses: ./.github/actions/report-review-failure
        with:
          failure-kind: not-a-real-kind
          pr-number: '1'
          run-url: https://example.invalid/run
          dry-run: 'true'
      - name: Assert an unrecognized kind normalizes rather than being echoed
        shell: bash
        env:
          KIND: ${{ steps.failure-unknown.outputs.kind }}
          BODY_FILE: ${{ steps.failure-unknown.outputs.body-file }}
        run: |
          set -euo pipefail
          if [[ "$KIND" != "unknown" ]]; then
            echo "::error::expected an unrecognized kind to normalize to 'unknown', got '$KIND'"
            exit 1
          fi
          if grep -qF 'not-a-real-kind' "$BODY_FILE"; then
            echo "::error::the unrecognized kind was echoed into the comment body"
            cat "$BODY_FILE"
            exit 1
          fi
          # No denial data was passed, so the report must not claim there were
          # none -- that would assert the reviewer was not blocked by tool
          # permissions on a run that never measured them.
          if ! grep -qF '**Denied tools:** not recorded.' "$BODY_FILE"; then
            echo "::error::absent denial data must be reported as unrecorded, not as none"
            cat "$BODY_FILE"
            exit 1
          fi
          echo "report-review-failure normalized the unrecognized kind correctly"

  # gemini.yml/gemini-code-review.yml had no error handling at all before
  # this: a run-gemini-cli failure (quota exhaustion, an auth rejection, a
  # suspended project) just red-X'd the job with the raw error in the log --
  # no PR-visible explanation, indistinguishable from a genuine bug, and
  # nothing stopping a reflexive re-run against a key that cannot currently
  # be used. Separate job (not folded into review-fail-check above) so a
  # failure here is attributable at a glance, matching this file's existing
  # one-capability-per-job granularity (phi-tests/new-line-breaks-tests are
  # already split from their parent jobs the same way).
  gemini-review-fail-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run classify-gemini-failure tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-classify-gemini-failure-tests.sh
      # Two real `uses:` calls, proving report-gemini-failure's own
      # github.action_path resolution of classify-gemini-failure.sh actually
      # works end-to-end -- a unit test of the script alone would not catch a
      # wiring regression the way #191's job_workflow_ref bug went undetected
      # by fixture tests alone (gha#196). dry-run: true so this doesn't
      # comment on a real thread or stamp a red/yellow annotation onto a
      # passing selftest job (same reasoning as report-push-failure's e2e
      # steps above).
      #
      # gemini.yml's/gemini-code-review.yml's own consumption of this action
      # via @v2 isn't exercised end-to-end here -- the same documented,
      # accepted bootstrap gap run-claude-review-attempt and
      # request-dependabot-review have (CLAUDE.md): @v2 doesn't resolve until
      # advanced past this PR's merge.
      - name: Exercise report-gemini-failure on a quota-or-auth fixture
        id: gemini-failure-quota
        uses: ./.github/actions/report-gemini-failure
        with:
          error-output: '{"error":{"code":429,"message":"Resource has been exhausted (e.g. check quota).","status":"RESOURCE_EXHAUSTED"}}'
          entity-number: '1'
          run-url: https://example.invalid/run
          dry-run: 'true'
      - name: Assert the quota-or-auth fixture classified and reported gracefully
        shell: bash
        env:
          KIND: ${{ steps.gemini-failure-quota.outputs.kind }}
          BODY_FILE: ${{ steps.gemini-failure-quota.outputs.body-file }}
        run: |
          set -euo pipefail
          if [[ "$KIND" != "quota-or-auth" ]]; then
            echo "::error::a RESOURCE_EXHAUSTED error classified as '$KIND', expected 'quota-or-auth'"
            exit 1
          fi
          if [[ -z "$BODY_FILE" || ! -s "$BODY_FILE" ]]; then
            echo "::error::report-gemini-failure produced no comment body for the quota-or-auth fixture"
            exit 1
          fi
          if ! grep -q 'not retried' "$BODY_FILE"; then
            echo "::error::the graceful-skip report does not say the failure is not retried"
            exit 1
          fi
          if ! grep -qF 'RESOURCE_EXHAUSTED' "$BODY_FILE"; then
            echo "::error::the report does not include the raw error output"
            exit 1
          fi
          echo "report-gemini-failure handled the quota-or-auth fixture correctly"
      - name: Exercise report-gemini-failure on a genuine (other) failure
        id: gemini-failure-other
        uses: ./.github/actions/report-gemini-failure
        with:
          error-output: 'Error: connect ETIMEDOUT 142.250.80.95:443'
          entity-number: '1'
          dry-run: 'true'
      - name: Assert the genuine-failure fixture classified as other
        shell: bash
        env:
          KIND: ${{ steps.gemini-failure-other.outputs.kind }}
          BODY_FILE: ${{ steps.gemini-failure-other.outputs.body-file }}
        run: |
          set -euo pipefail
          if [[ "$KIND" != "other" ]]; then
            echo "::error::a network-timeout error classified as '$KIND', expected 'other'"
            exit 1
          fi
          if [[ -z "$BODY_FILE" || ! -s "$BODY_FILE" ]]; then
            echo "::error::report-gemini-failure produced no comment body for the 'other' fixture"
            exit 1
          fi
          # A genuine failure must NOT be told "not retried" -- that framing
          # is specific to the quota/auth graceful-skip class.
          if grep -q 'not retried' "$BODY_FILE"; then
            echo "::error::a genuine failure was reported with the quota/auth 'not retried' framing"
            exit 1
          fi
          echo "report-gemini-failure handled the genuine-failure fixture correctly"

  # opencode-code-review's reusable workflow calls report-opencode-run via
  # @v2, which does not resolve until the tag slides past this merge. Test
  # the classifier offline and the local composite via ./ so the PR covers
  # the actual code (same bootstrap gap as report-gemini-failure /
  # trigger-bugbot-review).
  opencode-review-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run classify-opencode-run tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-classify-opencode-run-tests.sh
      - name: Run run-step retry tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-opencode-run-step-tests.sh
      - name: Prepare run fixtures
        shell: bash
        run: |
          set -euo pipefail
          printf '## Findings\n\n- The loop bound is off by one.\n' > review-ok.md
          printf 'opencode: error: model "opencode/nope" not found\n' > review-error.log
      # Two real `uses:` calls, proving report-opencode-run's own
      # github.action_path resolution of classify-opencode-run.sh and
      # fence-and-truncate.sh actually works end-to-end -- a unit test of
      # the classifier alone would not catch a wiring regression the way
      # gha#191's went undetected by fixture tests alone (gha#196).
      # dry-run: true so this doesn't comment on a real thread or stamp a
      # red/yellow annotation onto a passing selftest job (same reasoning as
      # report-gemini-failure's e2e steps above).
      #
      # opencode-code-review.yml's own consumption of this action via @v2
      # isn't exercised end-to-end here -- the same documented, accepted
      # bootstrap gap run-claude-review-attempt and request-dependabot-review
      # have (CLAUDE.md): @v2 doesn't resolve until advanced past this PR's
      # merge.
      - name: Exercise report-opencode-run on a failed run
        id: opencode-failed
        uses: ./.github/actions/report-opencode-run
        with:
          exit-code: '1'
          review-file: review-missing.md
          error-file: review-error.log
          entity-number: '1'
          run-url: https://example.invalid/run
          dry-run: 'true'
      - name: Assert the failed run classified and reported
        shell: bash
        env:
          KIND: ${{ steps.opencode-failed.outputs.kind }}
          BODY_FILE: ${{ steps.opencode-failed.outputs.body-file }}
        run: |
          set -euo pipefail
          if [[ "$KIND" != "failed" ]]; then
            echo "::error::a non-zero exit classified as '$KIND', expected 'failed'"
            exit 1
          fi
          if [[ -z "$BODY_FILE" || ! -s "$BODY_FILE" ]]; then
            echo "::error::report-opencode-run produced no comment body for the failed fixture"
            exit 1
          fi
          # The marker phrase is load-bearing: classify-review-delivery.sh
          # keys on it to recognize the run as not delivered.
          if ! grep -qF 'OpenCode review failed:' "$BODY_FILE"; then
            echo "::error::the failure report lacks the 'OpenCode review failed:' marker"
            exit 1
          fi
          if ! grep -qF 'model "opencode/nope"' "$BODY_FILE"; then
            echo "::error::the failure report does not include the raw CLI output"
            exit 1
          fi
          echo "report-opencode-run handled the failed fixture correctly"
      - name: Exercise report-opencode-run on a completed review
        id: opencode-review
        uses: ./.github/actions/report-opencode-run
        with:
          exit-code: '0'
          review-file: review-ok.md
          error-file: ''
          model: opencode/big-pickle
          entity-number: '1'
          run-url: https://example.invalid/run
          dry-run: 'true'
      - name: Assert the completed review classified as review
        shell: bash
        env:
          KIND: ${{ steps.opencode-review.outputs.kind }}
          BODY_FILE: ${{ steps.opencode-review.outputs.body-file }}
        run: |
          set -euo pipefail
          if [[ "$KIND" != "review" ]]; then
            echo "::error::a completed run with output classified as '$KIND', expected 'review'"
            exit 1
          fi
          if [[ -z "$BODY_FILE" || ! -s "$BODY_FILE" ]]; then
            echo "::error::report-opencode-run produced no comment body for the success fixture"
            exit 1
          fi
          if ! grep -qF 'The loop bound is off by one.' "$BODY_FILE"; then
            echo "::error::the review body does not include the agent's review text verbatim"
            exit 1
          fi
          if grep -qE 'OpenCode review (failed|skipped)' "$BODY_FILE"; then
            echo "::error::a successful review was reported with a failure/skip framing"
            exit 1
          fi
          echo "report-opencode-run handled the success fixture correctly"

  # cursor-code-review's reusable workflow calls trigger-bugbot-review via
  # @v2, which does not resolve until the tag slides past this merge. Test
  # the script offline and the local composite via ./ so the PR covers the
  # actual code (same bootstrap gap as report-gemini-failure / dependabot).
  cursor-review-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run trigger-bugbot-review tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-trigger-bugbot-review-tests.sh
      - name: Exercise trigger-bugbot-review composite action
        id: bugbot-e2e
        env:
          CURL_BIN: ${{ github.workspace }}/.github/workflows/scripts/tests/stubs/curl-bugbot-success.sh
        uses: ./.github/actions/trigger-bugbot-review
        with:
          pr-url: https://github.com/Morrison-Lab/gha/pull/1
          api-key: test-key
      - name: Assert the composite surfaced request-id
        shell: bash
        env:
          REQUEST_ID: ${{ steps.bugbot-e2e.outputs.request-id }}
        run: |
          set -euo pipefail
          if [[ "$REQUEST_ID" != "selftest-request-id" ]]; then
            echo "::error::trigger-bugbot-review request-id was '$REQUEST_ID', expected selftest-request-id"
            exit 1
          fi
          echo "trigger-bugbot-review composite resolved github.action_path and returned request-id"

  # check-tag-drift is an internal-only capability (like open-sync-pr) with no
  # wrapping reusable workflow or example stub. Test the script offline and
  # exercise the local composite directly.
  tag-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run resolve-major-tag offline tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-resolve-major-tag-tests.sh
      - name: Run check-tag-drift offline tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-check-tag-drift-tests.sh
      - name: Exercise check-tag-drift composite action end-to-end
        id: drift-e2e
        uses: ./.github/actions/check-tag-drift
      - name: Assert check-tag-drift composite returned outputs
        shell: bash
        env:
          DRIFT: ${{ steps.drift-e2e.outputs.drift }}
          MAJOR: ${{ steps.drift-e2e.outputs.major }}
        run: |
          set -euo pipefail
          if [[ -z "$MAJOR" ]]; then
            echo "::error::check-tag-drift composite action did not return a major tag"
            exit 1
          fi
          echo "check-tag-drift composite resolved major=$MAJOR drift=$DRIFT"

  # Kept as its own job (not folded into review-fail-check) so a failure here is
  # attributable at a glance (gha#436, gha#415, CLAUDE.md convention).
  small-model-agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run small-model-agent tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-small-model-agent-tests.sh
      - name: Exercise run-small-model-agent composite action end-to-end
        id: agent-e2e
        uses: ./.github/actions/run-small-model-agent
        with:
          model: test-model
          dry-run: 'true'
      - name: Assert run-small-model-agent returned result json
        shell: bash
        env:
          RESULT_JSON: ${{ steps.agent-e2e.outputs.result-json }}
        run: |
          set -euo pipefail
          if ! echo "$RESULT_JSON" | grep -q '"status": "success"'; then
            echo "::error::run-small-model-agent composite action did not return success json"
            exit 1
          fi
          echo "run-small-model-agent correctly returned result-json"
      - name: Exercise run-small-model-agent composite action on gate failure
        id: agent-e2e-failure
        uses: ./.github/actions/run-small-model-agent
        continue-on-error: true
        with:
          model: test-model
          endpoint-url: http://localhost:9999/v1
          max-iterations: '1'
          gate-yaml-outcome: failure
      - name: Assert run-small-model-agent failure returned valid result json
        shell: bash
        env:
          RESULT_JSON: ${{ steps.agent-e2e-failure.outputs.result-json }}
        run: |
          set -euo pipefail
          if ! echo "$RESULT_JSON" | grep -q '"status": "failed"'; then
            echo "::error::run-small-model-agent composite action did not return failed status in result-json: '$RESULT_JSON'"
            exit 1
          fi
          echo "run-small-model-agent correctly returned status=failed in result-json on gate failure"
  # request-dependabot-review is brand new, so (like the internal composites
  # tested above) its own reusable-workflow layer isn't exercisable end-to-end
  # yet: it calls build-reviewer-args via `Morrison-Lab/gha/...@v2`, which won't
  # resolve until @v2 is advanced past this PR's merge. Test the local
  # build-reviewer-args composite directly instead -- the same "test-coverage"
  # precedent used below, and the same offline-unit-test-plus-real-`uses:`-e2e
  # pattern used for run-review-guard/extract-total-cost/sum-costs above
  # (gha#253 review: missing selftest coverage for a new workflow with real
  # side effects, precedented by the sync-pr job's open-sync-pr no-op test).
  dependabot-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run build-reviewer-args split/trim tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-build-reviewer-args-tests.sh
      - name: Exercise build-reviewer-args composite action end-to-end
        id: args-e2e
        uses: ./.github/actions/build-reviewer-args
        with:
          reviewers: 'alice, bob'
      - name: Assert build-reviewer-args trimmed and split correctly
        shell: bash
        env:
          REVIEWERS_JSON: ${{ steps.args-e2e.outputs.reviewers-json }}
        run: |
          set -euo pipefail
          if [[ "$REVIEWERS_JSON" != '["alice","bob"]' ]]; then
            echo "::error::build-reviewer-args did not surface [\"alice\",\"bob\"] for 'alice, bob' (got '$REVIEWERS_JSON')"
            exit 1
          fi
          echo "build-reviewer-args correctly surfaced reviewers-json=$REVIEWERS_JSON"
  # altdoc-multiversion-docs is brand new, so its internal composites aren't at
  # a released tag yet either. Exercise all three directly against a throwaway
  # fixture repo -- a separate git init, not this checkout -- which is also why
  # generate_version_dropdown.py's git calls need an explicit cwd (see that
  # script's _run_git docstring); without it they'd silently read this repo's
  # own tags instead of the fixture's. The full reusable workflow's render +
  # multi-target deploy sequence isn't exercised here (it pushes to gh-pages,
  # a write side effect selftest can't run); it's validated by real consumer
  # usage once merged and released, the same precedent `dependabot-review`'s
  # reusable-workflow layer follows above (see this repo's own CLAUDE.md).
  # gha#332. Kept as its own job rather than folded into altdoc-docs below, so
  # a failure here is attributable at a glance -- the same one-capability-per-job
  # split phi-tests / new-line-breaks-tests already use.
  canonical-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Run inject-canonical-urls unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest .github/actions/inject-canonical-urls/tests/ -q

      # The unit tests call the script directly, so they cannot see whether
      # action.yml resolves it via github.action_path or wires its inputs
      # through correctly -- the gap that let gha#191's job_workflow_ref
      # regression (gha#196) reach production with its logic unit-tested. These
      # two steps close it with real `uses:` calls, the same proof
      # run-review-guard's own e2e steps give.
      #
      # The fixture is generated here rather than committed, per CLAUDE.md's
      # "Generate selftest fixtures at runtime" rule: committed HTML under a
      # tests/ dir gets swept into the bib and phi jobs' repo-wide scans.
      - name: Build a throwaway rendered-docs fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixture-docs/ref
          printf '%s\n' '<html><head><title>Home</title></head><body>x</body></html>' \
            > fixture-docs/index.html
          printf '%s\n' '<html><head><title>API</title></head><body>x</body></html>' \
            > fixture-docs/ref/api.html
          printf '%s\n' '<html><head><title>Gone</title></head><body>x</body></html>' \
            > fixture-docs/404.html

      - name: Inject canonical URLs (release-style build)
        uses: ./.github/actions/inject-canonical-urls
        with:
          docs-dir: fixture-docs
          deploy-kind: release
          deploy-subdir: v9.9.9
          base-url: https://example.invalid/repo/

      - name: Assert the release build tagged every indexable page
        shell: bash
        run: |
          set -euo pipefail
          # No /latest-tag/ exists on this repo's gh-pages, so every page must
          # SELF-canonicalize rather than point at a URL that would 404 -- the
          # gha#332 decision point, asserted end to end rather than only in the
          # unit tests.
          grep -q 'rel="canonical" href="https://example.invalid/repo/v9.9.9/index.html"' \
            fixture-docs/index.html
          grep -q 'rel="canonical" href="https://example.invalid/repo/v9.9.9/ref/api.html"' \
            fixture-docs/ref/api.html
          if grep -q canonical fixture-docs/404.html; then
            echo "::error::404.html must stay untagged; canonicalizing it would point every miss at a real page."
            exit 1
          fi
          echo "Release-style canonical injection verified."

      - name: Build a throwaway preview fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixture-preview
          printf '%s\n' '<html><head><title>Home</title></head><body>x</body></html>' \
            > fixture-preview/index.html

      - name: Inject noindex (PR-preview-style build)
        uses: ./.github/actions/inject-canonical-urls
        with:
          docs-dir: fixture-preview
          deploy-kind: preview
          deploy-subdir: pr-preview/pr-1
          base-url: https://example.invalid/repo/

      - name: Assert the preview build is noindex and carries no canonical
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name="robots" content="noindex"' fixture-preview/index.html
          if grep -q 'rel="canonical"' fixture-preview/index.html; then
            echo "::error::a PR preview must be noindex, not canonicalized to another page."
            exit 1
          fi
          echo "Preview noindex injection verified."

  altdoc-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create a minimal altdoc fixture (separate git repo, two tags)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-altdoc-pkg/altdoc
          cat > _ci-altdoc-pkg/DESCRIPTION <<'EOF'
          Package: cifixturepkg
          Version: 0.1.0.9000
          EOF
          cat > _ci-altdoc-pkg/altdoc/quarto_website.yml <<'EOF'
          website:
            title: "cifixturepkg"
            navbar:
              right:
                - text: Versions
                  menu:
                    - text: placeholder
                      href: placeholder
          EOF
          git -C _ci-altdoc-pkg init -q
          git -C _ci-altdoc-pkg config user.email "ci@example.com" # phi-allow (synthetic fixture address, not real PHI)
          git -C _ci-altdoc-pkg config user.name "CI"
          git -C _ci-altdoc-pkg add -A
          git -C _ci-altdoc-pkg commit -q -m "fixture"
          git -C _ci-altdoc-pkg tag v0.0.9
          git -C _ci-altdoc-pkg tag v0.1.0
      - name: Exercise resolve-altdoc-base-url composite end-to-end (derived)
        id: base-url-derived
        uses: ./.github/actions/resolve-altdoc-base-url
      - name: Assert resolve-altdoc-base-url derived the expected URL
        shell: bash
        env:
          BASE_URL: ${{ steps.base-url-derived.outputs.base-url }}
        run: |
          set -euo pipefail
          expected="https://${GITHUB_REPOSITORY_OWNER}.github.io/$(basename "$GITHUB_REPOSITORY")/"
          if [[ "$BASE_URL" != "$expected" ]]; then
            echo "::error::expected base-url='$expected', got '$BASE_URL'"; exit 1
          fi
      - name: Exercise resolve-altdoc-base-url composite end-to-end (override)
        id: base-url-override
        uses: ./.github/actions/resolve-altdoc-base-url
        with:
          override: 'https://example.com/docs'
      - name: Assert resolve-altdoc-base-url normalized the override's trailing slash
        shell: bash
        env:
          BASE_URL: ${{ steps.base-url-override.outputs.base-url }}
        run: |
          set -euo pipefail
          if [[ "$BASE_URL" != "https://example.com/docs/" ]]; then
            echo "::error::expected base-url='https://example.com/docs/', got '$BASE_URL'"; exit 1
          fi
      - name: Exercise generate-altdoc-version-dropdown composite end-to-end
        id: dropdown
        uses: ./.github/actions/generate-altdoc-version-dropdown
        with:
          docs-source-dir: _ci-altdoc-pkg
      - name: Assert version dropdown was rewritten correctly
        shell: bash
        env:
          LATEST_TAG: ${{ steps.dropdown.outputs.latest-tag }}
          DEV_VERSION: ${{ steps.dropdown.outputs.dev-version }}
        run: |
          set -euo pipefail
          if [[ "$LATEST_TAG" != "v0.1.0" ]]; then
            echo "::error::expected latest-tag=v0.1.0, got '$LATEST_TAG'"; exit 1
          fi
          if [[ "$DEV_VERSION" != "0.1.0.9000" ]]; then
            echo "::error::expected dev-version=0.1.0.9000, got '$DEV_VERSION'"; exit 1
          fi
          if ! grep -q 'v0.1.0 (stable)' _ci-altdoc-pkg/altdoc/quarto_website.yml; then
            echo "::error::rewritten quarto_website.yml missing the stable entry"
            cat _ci-altdoc-pkg/altdoc/quarto_website.yml
            exit 1
          fi
          if ! grep -q 'v0.0.9' _ci-altdoc-pkg/altdoc/quarto_website.yml; then
            echo "::error::rewritten quarto_website.yml missing the previous-version entry"
            cat _ci-altdoc-pkg/altdoc/quarto_website.yml
            exit 1
          fi
      - name: Assert the dev build labels the menu and navbar with its own version
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.dropdown.outputs.current-version }}
        run: |
          set -euo pipefail
          # No current-version was passed above, so this also covers the
          # composite inferring "dev" from a DESCRIPTION no tag matches.
          if [[ "$CURRENT_VERSION" != "0.1.0.9000 (dev)" ]]; then
            echo "::error::expected current-version='0.1.0.9000 (dev)', got '$CURRENT_VERSION'"; exit 1
          fi
          if ! grep -q '^      - text: "0.1.0.9000 (dev)"$' _ci-altdoc-pkg/altdoc/quarto_website.yml; then
            echo "::error::Versions menu is not labeled with the current version"
            cat _ci-altdoc-pkg/altdoc/quarto_website.yml
            exit 1
          fi
          # pkgdown-style badge, on the navbar title rather than the site
          # title, and red because this is a development build.
          if ! grep -q '^    title: "cifixturepkg <small .*text-danger.*>0.1.0.9000</small>"$' _ci-altdoc-pkg/altdoc/quarto_website.yml; then
            echo "::error::navbar title is missing the dev version badge"
            cat _ci-altdoc-pkg/altdoc/quarto_website.yml
            exit 1
          fi
          if ! grep -q '^  title: "cifixturepkg"$' _ci-altdoc-pkg/altdoc/quarto_website.yml; then
            echo "::error::website.title should be untouched, so the page <title> stays clean"
            cat _ci-altdoc-pkg/altdoc/quarto_website.yml
            exit 1
          fi
      # Re-run over the file the previous run rewrote: the "- text: Versions"
      # anchor is gone by now, so this proves the generated marker keeps the
      # block findable, and that a second badge is not stacked onto the first.
      - name: Exercise generate-altdoc-version-dropdown again, as a release build
        id: dropdown-stable
        uses: ./.github/actions/generate-altdoc-version-dropdown
        with:
          docs-source-dir: _ci-altdoc-pkg
          current-version: v0.1.0
          dropdown-title-template: 'Version: {version}'
      - name: Assert the release build relabels rather than duplicating
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.dropdown-stable.outputs.current-version }}
        run: |
          set -euo pipefail
          if [[ "$CURRENT_VERSION" != "v0.1.0 (stable)" ]]; then
            echo "::error::expected current-version='v0.1.0 (stable)', got '$CURRENT_VERSION'"; exit 1
          fi
          if ! grep -q '^      - text: "Version: v0.1.0 (stable)"$' _ci-altdoc-pkg/altdoc/quarto_website.yml; then
            echo "::error::dropdown-title-template was not applied"
            cat _ci-altdoc-pkg/altdoc/quarto_website.yml
            exit 1
          fi
          badges=$(grep -c 'navbar-version' _ci-altdoc-pkg/altdoc/quarto_website.yml)
          if [[ "$badges" != 1 ]]; then
            echo "::error::expected exactly 1 navbar version badge, found $badges"
            cat _ci-altdoc-pkg/altdoc/quarto_website.yml
            exit 1
          fi
          if ! grep -q 'text-muted.*>v0.1.0</small>' _ci-altdoc-pkg/altdoc/quarto_website.yml; then
            echo "::error::a release build's badge should be muted, not red"
            cat _ci-altdoc-pkg/altdoc/quarto_website.yml
            exit 1
          fi
      - name: Test navbar_version.py version labeling and YAML rewriting
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest
          python3 -m pytest .github/actions/generate-altdoc-version-dropdown/tests -q
      # A PR preview renders a branch whose DESCRIPTION has moved ahead of the
      # default branch's, so the navbar badge and the /dev/ menu entry name
      # DIFFERENT versions -- the branch's and what is actually deployed at
      # /dev/. That split lives in generate_version_dropdown.py (local
      # DESCRIPTION vs `git show origin/<default-branch>:DESCRIPTION`), not in
      # resolve_current_version(), so only a real two-version fixture pins it.
      - name: Create a PR-preview fixture whose branch version differs from main's
        shell: bash
        run: |
          set -euo pipefail
          git -C _ci-altdoc-pkg branch -M main
          git clone -q _ci-altdoc-pkg _ci-altdoc-pkg-pr
          git -C _ci-altdoc-pkg-pr config user.email "ci@example.com" # phi-allow (synthetic fixture address, not real PHI)
          git -C _ci-altdoc-pkg-pr config user.name "CI"
          sed -i 's/^Version: .*/Version: 0.2.0.9000/' _ci-altdoc-pkg-pr/DESCRIPTION
          git -C _ci-altdoc-pkg-pr commit -aqm "bump the branch version"
      - name: Exercise generate-altdoc-version-dropdown on the PR-preview fixture
        id: dropdown-pr
        uses: ./.github/actions/generate-altdoc-version-dropdown
        with:
          docs-source-dir: _ci-altdoc-pkg-pr
          current-version: dev
      - name: Assert the badge names the branch version, the menu entry main's
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.dropdown-pr.outputs.current-version }}
          DEV_VERSION: ${{ steps.dropdown-pr.outputs.dev-version }}
        run: |
          set -euo pipefail
          config=_ci-altdoc-pkg-pr/altdoc/quarto_website.yml
          if [[ "$CURRENT_VERSION" != "0.2.0.9000 (dev)" ]]; then
            echo "::error::expected current-version='0.2.0.9000 (dev)', got '$CURRENT_VERSION'"; exit 1
          fi
          if [[ "$DEV_VERSION" != "0.1.0.9000" ]]; then
            echo "::error::expected dev-version='0.1.0.9000' (from origin/main), got '$DEV_VERSION'"; exit 1
          fi
          # The menu's own label: the branch's version.
          if ! grep -q '^      - text: "0.2.0.9000 (dev)"$' "$config"; then
            echo "::error::menu label should name the branch version"; cat "$config"; exit 1
          fi
          # The /dev/ entry inside it: what is actually deployed there.
          if ! grep -q '^          - text: "0.1.0.9000 (dev)"$' "$config"; then
            echo "::error::/dev/ entry should name the default branch's version"; cat "$config"; exit 1
          fi
          if ! grep -q 'navbar-version.*>0.2.0.9000</small>' "$config"; then
            echo "::error::navbar badge should name the branch version"; cat "$config"; exit 1
          fi
      # gha#287: when release-tags is passed, the composite must use that
      # list as-is rather than deriving its own from gh api/git tag -- proven
      # here by passing a tag (v9.9.9) the fixture repo was never actually
      # tagged with (it only has v0.0.9/v0.1.0) and asserting it wins.
      - name: Create a fresh fixture copy for the release-tags passthrough
        shell: bash
        run: git clone -q _ci-altdoc-pkg _ci-altdoc-pkg-release-tags
      - name: Exercise generate-altdoc-version-dropdown with release-tags set
        id: dropdown-release-tags
        uses: ./.github/actions/generate-altdoc-version-dropdown
        with:
          docs-source-dir: _ci-altdoc-pkg-release-tags
          release-tags: |
            v9.9.9
            v0.1.0
      - name: Assert release-tags won over the fixture's own git tags
        shell: bash
        env:
          LATEST_TAG: ${{ steps.dropdown-release-tags.outputs.latest-tag }}
        run: |
          set -euo pipefail
          if [[ "$LATEST_TAG" != "v9.9.9" ]]; then
            echo "::error::expected latest-tag=v9.9.9 (from release-tags input, not the fixture's own v0.1.0 git tag), got '$LATEST_TAG'"
            exit 1
          fi
          config=_ci-altdoc-pkg-release-tags/altdoc/quarto_website.yml
          if ! grep -q 'v9.9.9 (stable)' "$config"; then
            echo "::error::rewritten quarto_website.yml missing the release-tags-supplied stable entry"
            cat "$config"
            exit 1
          fi
      - name: Exercise generate-altdoc-landing-page composite end-to-end
        uses: ./.github/actions/generate-altdoc-landing-page
        with:
          target: dev
          output-dir: _ci-landing-page
      - name: Assert landing page redirect was generated correctly
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f _ci-landing-page/index.html ]; then
            echo "::error::generate-altdoc-landing-page did not produce index.html"; exit 1
          fi
          if [ ! -f _ci-landing-page/.nojekyll ]; then
            echo "::error::generate-altdoc-landing-page did not produce .nojekyll"; exit 1
          fi
          if ! grep -q '/dev/' _ci-landing-page/index.html; then
            echo "::error::landing page redirect did not target /dev/"
            cat _ci-landing-page/index.html
            exit 1
          fi
          if [ -f _ci-landing-page/404.html ]; then
            echo "::error::generate-altdoc-landing-page produced 404.html with no legacy-paths input"
            exit 1
          fi
      - name: Test generate_legacy_redirects.py parsing and validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest
          python3 -m pytest .github/actions/generate-altdoc-landing-page/tests -q
      - name: Exercise generate-altdoc-landing-page composite with legacy paths
        uses: ./.github/actions/generate-altdoc-landing-page
        with:
          target: dev
          output-dir: _ci-landing-page-legacy
          base-url: 'https://ucd-serg.github.io/serocalculator/'
          legacy-paths: 'main=dev,master=dev'
      - name: Assert the legacy-path 404 page redirects where it should
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f _ci-landing-page-legacy/404.html ]; then
            echo "::error::generate-altdoc-landing-page did not produce 404.html"; exit 1
          fi
          # Runs the page's real redirect script against a table of request
          # paths -- deep links, query/fragment preservation, and the paths
          # that must NOT redirect (a missing page under /dev/ would otherwise
          # bounce forever).
          node .github/actions/generate-altdoc-landing-page/tests/run-redirect-js-tests.mjs \
            _ci-landing-page-legacy/404.html
      - name: Assert an invalid legacy-paths value fails the step
        shell: bash
        env:
          LEGACY_PATHS: 'dev=dev'
          OUTPUT_DIR: _ci-landing-page-invalid
          DOCS_BASE_URL: 'https://ucd-serg.github.io/serocalculator/'
        run: |
          set -euo pipefail
          if python3 .github/actions/generate-altdoc-landing-page/generate_legacy_redirects.py; then
            echo "::error::a self-redirecting legacy path should have failed the step"; exit 1
          fi
  # quarto-publish is brand new, so (like check-phi above) it isn't at the
  # released `@v1` tag the reusable workflow pins yet. Exercise the local
  # composite directly against a throwaway fixture, render-only, so the selftest
  # covers the PR code without touching this repo's gh-pages branch.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create a minimal Quarto fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-quarto-site
          # _quarto.yml declares a different output-dir than the composite is
          # given below, so a green build proves the `output-dir` input is
          # authoritative (forwarded to `quarto render --output-dir`, overriding
          # _quarto.yml) rather than merely matching it.
          printf 'project:\n  type: website\n  output-dir: _from_quarto_yml\n' > _ci-quarto-site/_quarto.yml
          printf -- '---\ntitle: Selftest\n---\n\nBuild check for the quarto-publish composite.\n' \
            > _ci-quarto-site/index.qmd
      - name: Build the fixture site (non-default output-dir overrides _quarto.yml)
        uses: ./quarto-publish
        with:
          path: _ci-quarto-site
          output-dir: docs
  # Smoke-test the quarto-publish reusable workflow wrapper (not just the
  # composite): render this repo's own website with deploy: false, so the
  # gh-pages push — a write side effect we can't run in CI — is skipped. This
  # catches wrapper-level breakage (input plumbing, the render step) that the
  # composite-only job above wouldn't. The deploy path is validated by
  # dogfooding (website-publish.yml) at release. Local ./ ref since the
  # branch-deploy change isn't at `@v1` yet.
  #
  # Grant contents: write even though deploy: false: a reusable workflow's job
  # permissions are checked against the caller's grant at graph-build time
  # regardless of `if:`, so the wrapper's contents:write deploy job requires the
  # caller to grant write even when that job is skipped. The build job
  # downscopes its own token to contents:read.
  publish-workflow:
    permissions:
      contents: write
    uses: ./.github/workflows/quarto-publish.yml
    with:
      path: website
      deploy: false
  # check-equation-renders is brand new, so (like check-phi/quarto-publish above)
  # it isn't at the released tag the reusable workflow pins yet. Exercise the
  # local composite against a fixture with one good page and one page with two
  # kinds of deliberately broken equation -- a hard parse error (missing
  # `\frac` argument, surfaces as a `[data-mjx-error]` node) and an undefined
  # macro (surfaces as MathJax's literal-text fallback, the realistic failure
  # mode for a repo like rme that leans on custom TeX macros) -- proving the
  # composite catches both, not just running clean. A separate fixture below
  # exercises a third failure mode -- MathJax itself never loading (gha#230) --
  # which has nothing to do with any individual equation's TeX.
  equation-renders:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Loads MathJax from cdn.jsdelivr.net rather than vendoring it: this runs
      # on a GitHub-hosted runner, which has outbound internet by default,
      # unlike the sandboxed environment used to validate the detection logic
      # during development (which vendored a local copy of the bundle instead).
      - name: Generate a fixture site with one good and one broken page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-equation-fixture
          cat > _ci-equation-fixture/good.html <<'EOF'
          <!doctype html>
          <html><head><script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script></head>
          <body><p id="eq-good">\(a + b = c\)</p></body></html>
          EOF
          cat > _ci-equation-fixture/bad.html <<'EOF'
          <!doctype html>
          <html><head><script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script></head>
          <body>
          <p id="eq-bad-brace">\(\frac{1}\)</p>
          <p id="eq-bad-macro">\(\undefinedmacroxyz{1}\)</p>
          </body></html>
          EOF
      - name: Check equation renders (expect failure)
        id: check
        continue-on-error: true
        uses: ./check-equation-renders
        with:
          site-dir: _ci-equation-fixture
      - name: Assert the broken equation was caught
        shell: bash
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::check-equation-renders should have failed on the fixture's broken equation (outcome=$OUTCOME)"
            exit 1
          fi
          echo "check-equation-renders correctly failed on the broken equation."
      # gha#230: a page whose MathJax script can never load (a guaranteed-
      # unresolvable ".invalid" host, per RFC 2606) must also fail the check --
      # previously this silently reported success, since the DOM scan found no
      # error nodes for the simple reason that MathJax never ran at all. The
      # equation on this page is otherwise valid TeX; only the script load
      # fails, isolating this failure mode from the hard-error and
      # undefined-macro cases above.
      - name: Generate a fixture page whose MathJax script never loads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-equation-fixture-unreachable
          cat > _ci-equation-fixture-unreachable/unreachable.html <<'EOF'
          <!doctype html>
          <html><head><script src="https://mathjax.invalid/es5/tex-mml-chtml.js"></script></head>
          <body><p id="eq-unreachable">\(a + b = c\)</p></body></html>
          EOF
      - name: Check equation renders on the unreachable-script fixture (expect failure)
        id: check-unreachable
        continue-on-error: true
        uses: ./check-equation-renders
        with:
          site-dir: _ci-equation-fixture-unreachable
      - name: Assert the MathJax load failure was caught
        shell: bash
        env:
          OUTCOME: ${{ steps.check-unreachable.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::check-equation-renders should have failed when MathJax's script never loads (outcome=$OUTCOME)"
            exit 1
          fi
          echo "check-equation-renders correctly failed when MathJax never initialized."
  # bump-submodule / sync-shared-fragments open PRs (write side effects), so the
  # selftest can't run them end-to-end. Exercise the shared open-sync-pr
  # composite's no-op path instead: on a clean tree it must report no change and
  # neither push nor open a PR. Like check-phi/quarto-publish above, use the
  # local `./` ref since the action isn't at `@v1` until release.
  sync-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: open-sync-pr no-ops on a clean tree
        id: nochange
        uses: ./open-sync-pr
        with:
          branch: ci-selftest-open-sync-pr
          commit-message: 'selftest: must not be committed'
          token: ${{ github.token }}
      - name: Assert nothing was committed or opened
        shell: bash
        env:
          CHANGED: ${{ steps.nochange.outputs.changed }}
          PR_URL: ${{ steps.nochange.outputs.pr-url }}
        run: |
          set -euo pipefail
          if [ "$CHANGED" != "false" ] || [ -n "$PR_URL" ]; then
            echo "::error::open-sync-pr should no-op on a clean tree (changed=${CHANGED}, pr-url=${PR_URL})."
            exit 1
          fi
          echo "open-sync-pr correctly no-opped on a clean tree."
  # bump-dev-version / version-check are brand new. Their reusable workflows'
  # own internal `uses: Morrison-Lab/gha/.github/actions/...@v2` steps can't
  # resolve until `@v2` is slid past this merge (the lint-yaml/lint-markdown
  # precedent above), and bump-dev-version.yml also pushes a real branch/PR --
  # a write side effect, like bump-submodule/sync-shared-fragments above. So
  # this job exercises the two composites directly (offline unit tests cover
  # the pure description-version.R logic; run
  # `Rscript .github/workflows/scripts/tests/test-description-version.R`
  # locally). The full reusable-workflow layer is validated by real consumer
  # usage once merged and released, the same precedent altdoc-multiversion-docs
  # and dependabot-review's own reusable-workflow layers follow.
  dev-version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          use-public-rspm: true
      - name: Run description-version.R offline tests
        shell: bash
        run: Rscript .github/workflows/scripts/tests/test-description-version.R
      - name: Generate DESCRIPTION fixtures, stdout-polluting Rscript wrapper, and poisonous .Rprofile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-dev-version-fixture _ci-dev-version-bin
          printf 'Package: fixture\nVersion: 0.1.0.9057\nTitle: A test fixture\n' \
            > _ci-dev-version-fixture/DESCRIPTION
          # 1. Create a poisonous .Rprofile in the workspace root that touches a sentinel file
          # and throws an error if sourced. Because composite action Rscript calls run in the
          # workspace root, omitting --vanilla in bump-dev-version or check-dev-version will
          # source this file, create the sentinel file, and fail the step.
          cat << 'EOF' > .Rprofile
          writeLines("sourced", "_ci-rprofile-sourced.txt")
          stop("ERROR: .Rprofile was sourced because Rscript --vanilla was omitted!")
          EOF
          # 2. Create a PATH wrapper around Rscript that prepends a fake renv bootstrap banner
          # to stdout on every invocation, directly testing bump-dev-version's pipeline filter.
          REAL_RSCRIPT=$(which Rscript)
          cat << EOF > _ci-dev-version-bin/Rscript
          #!/usr/bin/env bash
          echo "# Bootstrapping renv 1.2.3 ---------------------------------------------------"
          exec "$REAL_RSCRIPT" "\$@"
          EOF
          chmod +x _ci-dev-version-bin/Rscript
          echo "${GITHUB_WORKSPACE}/_ci-dev-version-bin" >> "$GITHUB_PATH"
      - name: Bump the dev version
        id: bump
        continue-on-error: true
        uses: ./.github/actions/bump-dev-version
        with:
          description-path: _ci-dev-version-fixture/DESCRIPTION
      - name: Generate matching and mismatched compare-branch fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-dev-version-compare-match _ci-dev-version-compare-mismatch
          cp _ci-dev-version-fixture/DESCRIPTION _ci-dev-version-compare-match/DESCRIPTION
          printf 'Package: fixture\nVersion: 0.1.0.9057\nTitle: A test fixture\n' \
            > _ci-dev-version-compare-mismatch/DESCRIPTION
      - name: Check dev version on a match (expect success)
        id: check-match
        continue-on-error: true
        uses: ./.github/actions/check-dev-version
        with:
          working-description: _ci-dev-version-compare-match/DESCRIPTION
          compare-description: _ci-dev-version-compare-match/DESCRIPTION
      - name: Check dev version on a mismatch (expect failure)
        id: check-mismatch
        continue-on-error: true
        uses: ./.github/actions/check-dev-version
        with:
          working-description: _ci-dev-version-fixture/DESCRIPTION
          compare-description: _ci-dev-version-compare-mismatch/DESCRIPTION
      - name: Assert .Rprofile was never sourced during composite calls
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f _ci-rprofile-sourced.txt ]; then
            echo "::error::.Rprofile was sourced by a composite action; --vanilla flag is missing."
            exit 1
          fi
          echo ".Rprofile sentinel file was not created; Rscript --vanilla suppressed startup profiles across all composite calls."
      - name: Assert the bump composite incremented dev counter and filtered stdout pollution
        shell: bash
        env:
          OUTCOME: ${{ steps.bump.outcome }}
          OLD_VERSION: ${{ steps.bump.outputs.old-version }}
          NEW_VERSION: ${{ steps.bump.outputs.new-version }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "success" ]; then
            echo "::error::bump-dev-version composite step failed (outcome=$OUTCOME)"
            exit 1
          fi
          if [ "$OLD_VERSION" != "0.1.0.9057" ] || [ "$NEW_VERSION" != "0.1.0.9058" ]; then
            echo "::error::bump-dev-version composite gave old=${OLD_VERSION} new=${NEW_VERSION}, expected 0.1.0.9057 -> 0.1.0.9058"
            exit 1
          fi
          ON_DISK=$(grep '^Version:' _ci-dev-version-fixture/DESCRIPTION | sed 's/^Version:[[:space:]]*//')
          if [ "$ON_DISK" != "0.1.0.9058" ]; then
            echo "::error::bump-dev-version composite's outputs and the file on disk disagree (disk=${ON_DISK})"
            exit 1
          fi
          echo "bump-dev-version correctly bumped 0.1.0.9057 -> 0.1.0.9058 through stdout pollution filter."
      - name: Assert check-dev-version on a match succeeded
        shell: bash
        env:
          OUTCOME: ${{ steps.check-match.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "success" ]; then
            echo "::error::check-dev-version on a match failed (outcome=$OUTCOME)"
            exit 1
          fi
          echo "check-dev-version on a match correctly succeeded."
      - name: Assert the version mismatch was caught
        shell: bash
        env:
          OUTCOME: ${{ steps.check-mismatch.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::check-dev-version should have failed on a Version: mismatch (outcome=$OUTCOME)"
            exit 1
          fi
      - name: Assert .Rprofile was never sourced during composite calls
        if: always()
        shell: bash
        env:
          BUMP_OUTCOME: ${{ steps.bump.outcome }}
          CHECK_MATCH_OUTCOME: ${{ steps.check-match.outcome }}
        run: |
          set -euo pipefail
          if [ -f _ci-rprofile-sourced.txt ]; then
            echo "::error::.Rprofile was sourced by a composite action; --vanilla flag is missing."
            exit 1
          fi
          if [ "$BUMP_OUTCOME" != "success" ]; then
            echo "::error::bump-dev-version composite step failed unexpectedly (outcome=$BUMP_OUTCOME)."
            exit 1
          fi
          if [ "$CHECK_MATCH_OUTCOME" != "success" ]; then
            echo "::error::check-dev-version (match) composite step failed unexpectedly (outcome=$CHECK_MATCH_OUTCOME)."
            exit 1
          fi
          echo ".Rprofile sentinel file was not created; Rscript --vanilla suppressed startup profiles across all composite calls."
      - name: Clean up dev-version test fixtures
        if: always()
        shell: bash
        run: rm -rf _ci-dev-version-bin _ci-dev-version-fixture _ci-dev-version-compare-match _ci-dev-version-compare-mismatch .Rprofile _ci-rprofile-sourced.txt
  # test-coverage is brand new, so (like check-phi/quarto-publish above) it isn't
  # at the released tag the reusable workflow pins yet. Exercise the local
  # composite against a minimal R-package fixture, with no Codecov token and
  # fail-ci-if-error off, so the upload step is a harmless no-op and the job
  # proves the covr -> Cobertura path works. The fixture is generated at run time
  # (not committed) so its DESCRIPTION/R sources aren't discovered by the other
  # jobs' repo-wide R dependency scanning (which can't resolve `covfixture`).
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate the R package fixture
        shell: bash
        run: bash test-coverage/tests/make-fixture.sh _ci-rpkg
      - name: Measure coverage on the fixture package
        uses: ./test-coverage
        with:
          path: _ci-rpkg
          fail-ci-if-error: 'false'
      - name: Assert the Cobertura report was produced
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s cobertura.xml ]; then
            echo "::error::test-coverage did not produce cobertura.xml"
            exit 1
          fi
          echo "cobertura.xml produced ($(wc -l < cobertura.xml) lines):"
          head -n 20 cobertura.xml
      - name: Assert the JUnit test-results report was produced
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "${RUNNER_TEMP}/junit.xml" ]; then
            echo "::error::test-coverage did not produce junit.xml (upload-test-results, gha#234)"
            exit 1
          fi
          echo "junit.xml produced ($(wc -l < "${RUNNER_TEMP}/junit.xml") lines):"
          head -n 20 "${RUNNER_TEMP}/junit.xml"
  # Exercises the spellcheck composite through a real `uses: ./spellcheck` call
  # against a generated R package fixture, not the @v2-pinned reusable-workflow
  # chain -- a brand-new capability is not at the tag yet, and a `@v2` reference
  # would fail the whole job at preparation time. Same "local composite, not the
  # full reusable-workflow chain" precedent `coverage` above uses.
  #
  # The two fixtures differ in exactly one thing: whether inst/WORDLIST exists.
  # Asserting that the first passes and the second fails therefore pins both
  # halves of what this capability is for -- unknown words are detected, and the
  # package's own wordlist is what accepts the ones it lists. Verified locally
  # before it was written (spell_check_package reports 0 words for the fixture
  # with the wordlist and 1, `seroincidence`, for the one without), so a red
  # assertion here means a regression rather than a fixture that never worked.
  #
  # The term sits in both the DESCRIPTION and a root README.md, so the pair also
  # pins that spell_check_package() reads root readme/news/changes/index
  # Markdown. That surface was documented wrong in this PR's first draft and
  # only a fixture caught it, which is why it is asserted rather than described.
  spellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate the R package fixtures
        shell: bash
        run: |
          set -euo pipefail
          bash spellcheck/tests/make-fixture.sh _ci-spellcheck-listed
          bash spellcheck/tests/make-fixture.sh _ci-spellcheck-unlisted --no-wordlist
          bash spellcheck/tests/make-fixture.sh _ci-spellcheck-renv --renv
      - name: Spellcheck the fixture whose inst/WORDLIST lists the term
        uses: ./spellcheck
        with:
          path: _ci-spellcheck-listed
      - name: Spellcheck the renv project fixture (inst/WORDLIST present)
        uses: ./spellcheck
        with:
          path: _ci-spellcheck-renv
      - name: Spellcheck the fixture with no inst/WORDLIST
        id: unlisted
        continue-on-error: true
        uses: ./spellcheck
        with:
          path: _ci-spellcheck-unlisted
      - name: Assert the unlisted term fails the check
        shell: bash
        env:
          OUTCOME: ${{ steps.unlisted.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "::error::expected the fixture with no inst/WORDLIST to fail the spellcheck, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "The fixture with no inst/WORDLIST failed the spellcheck, as expected."

      # The `exclude` pair (gha#555 review). Two vignettes each carry a
      # different unlisted term, and the composite is called twice over
      # identical copies -- once without `exclude`, once with a lone glob.
      #
      # The first call proves the vignettes are genuinely checked, without
      # which the second would pass vacuously. The second is the regression
      # guard for the normalize step: upstream expands `exclude` unquoted and
      # then reads only its first argument, so before that step a lone glob
      # excluded only `first.Rmd` and `serostatus` in `second.Rmd` was still
      # reported. Measured against upstream's own spellcheck.R -- no exclude
      # exits 2, the un-normalized glob exits 1, the normalized value exits 0
      # -- so removing the step turns this step red rather than quiet.
      #
      # Each call gets its own copy because the upstream action DELETES the
      # files it excludes and never restores them.
      - name: Generate the exclude fixtures
        shell: bash
        run: |
          set -euo pipefail
          bash spellcheck/tests/make-fixture.sh _ci-spellcheck-vign-checked --vignette-typos
          bash spellcheck/tests/make-fixture.sh _ci-spellcheck-vign-excluded --vignette-typos
      - name: Spellcheck the vignette fixture with no exclude
        id: vignettes-checked
        continue-on-error: true
        uses: ./spellcheck
        with:
          path: _ci-spellcheck-vign-checked
      - name: Spellcheck the vignette fixture, excluding both vignettes by glob
        uses: ./spellcheck
        with:
          path: _ci-spellcheck-vign-excluded
          exclude: 'vignettes/*.Rmd'
      - name: Assert excluded files were restored after spellcheck
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f _ci-spellcheck-vign-excluded/vignettes/first.Rmd ] || [ ! -f _ci-spellcheck-vign-excluded/vignettes/second.Rmd ]; then
            echo "::error::excluded vignette files were not restored after spellcheck"
            exit 1
          fi
          echo "Excluded vignette files were correctly restored after spellcheck."
      - name: Assert the vignettes are checked when not excluded
        shell: bash
        env:
          OUTCOME: ${{ steps.vignettes-checked.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "::error::expected the vignette fixture to fail without 'exclude', got outcome='$OUTCOME'; the exclude assertion above would then be vacuous"
            exit 1
          fi
          echo "The vignette fixture failed without 'exclude', so the exclude assertion is not vacuous."
  # claude.yml hardcodes a mirror of claude-code-action's SENSITIVE_PATHS list
  # (from src/github/operations/restore-config.ts) so its auto-commit step
  # never reverts a PR's own edits to those files (#39). That mirror can't
  # detect upstream drift on its own, so diff the pinned SHA's actual copy of
  # SENSITIVE_PATHS against the local list here on every PR (gha#152).
  sensitive-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Diff claude.yml's SENSITIVE_PATHS mirror against the pinned claude-code-action SHA
        shell: bash
        run: |
          set -euo pipefail
          sha=$(grep -oP 'anthropics/claude-code-action@\K[0-9a-f]{40}' .github/workflows/claude.yml | head -n1)
          url="https://raw.githubusercontent.com/anthropics/claude-code-action/${sha}/src/github/operations/restore-config.ts"
          # Assumes upstream keeps SENSITIVE_PATHS as a single block that ends
          # with a bare `];` on its own line (the sed range terminator below).
          # A reformat there (e.g. `] as const;`, a trailing comment on the
          # closing line) would make the range run past the intended block.
          # That can only produce a false *failure* here, never a false pass,
          # so a red run from this cause is debuggable by fetching $url by hand.
          upstream=$(curl -fsSL "$url" | sed -n '/const SENSITIVE_PATHS/,/];/p' | grep -oP '"\K[^"]+(?=")' | sort)
          local=$(grep -oP 'for cfg in \K.*(?=; do)' .github/workflows/claude.yml | tr ' ' '\n' | sort)
          if [ "$upstream" != "$local" ]; then
            echo "::error::claude.yml's SENSITIVE_PATHS mirror is out of sync with claude-code-action@${sha}."
            diff <(echo "$upstream") <(echo "$local") || true
            exit 1
          fi
          echo "claude.yml's SENSITIVE_PATHS mirror matches claude-code-action@${sha}."

  # gha#442: SUBMODULES_TOKEN authenticates a cross-owner SUBMODULE fetch
  # (via the checkout-submodules composite's `submodules-token:` input) and
  # must never gate the caller's own repo checkout --- a consumer that sets
  # it correctly for its own submodule is exactly the consumer whose main
  # checkout then fails, since the token has no reason to be able to read the
  # caller's repo. The anchor is `^\s*token:`, not a bare `token:` substring
  # match, so this does not also flag `submodules-token:` (which legitimately
  # carries the secret) --- a trimmed line starting with "submodules-token:"
  # never matches a pattern requiring "token:" immediately after the leading
  # whitespace.
  lint-checkout-tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert no workflow passes SUBMODULES_TOKEN to a top-level checkout's token input
        shell: bash
        run: |
          set -euo pipefail
          if grep -rnE '^\s*token:\s*\$\{\{[^}]*SUBMODULES_TOKEN' .github/workflows/*.yml; then
            echo "::error::A workflow above passes SUBMODULES_TOKEN to a top-level actions/checkout 'token:' input (see gha#442) --- it authenticates a cross-owner submodule fetch, not the caller's own repo. Use the checkout-submodules composite's 'submodules-token:' input instead."
            exit 1
          fi
          echo "No workflow passes SUBMODULES_TOKEN to a top-level checkout token: input."

      - name: Assert all third-party actions in workflows are SHA-pinned
        shell: bash
        run: |
          set -euo pipefail
          UNPINNED=$(grep -rnE '^\s*uses:' .github/workflows/*.yml | grep -v 'uses:\s*\./' | grep -v 'uses:\s*\.' | grep -v 'Morrison-Lab/gha' | grep -vE '@[0-9a-f]{40}' || true)
          if [ -n "$UNPINNED" ]; then
            echo "::error::Unpinned third-party actions found in workflows (see gha#328):\n$UNPINNED"
            exit 1
          fi
          echo "All third-party actions in .github/workflows/*.yml are SHA-pinned."

      # Asserts all runner jobs specify timeout-minutes and all caller jobs
      # specify only supported keys for reusable workflow calls (see gha#328,
      # gha#504, gha#582, and gha#590).
      - name: Run workflow job-guard unit tests and repo verification
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/tests/run-workflow-job-guard-tests.py --self-test
          python3 .github/workflows/scripts/tests/run-workflow-job-guard-tests.py

  # Covers the open-failure-issue action used by report-failure.yml and
  # check-links.yml.
  # The unit tests pin the matching and splitting rules; the end-to-end step
  # proves the composite resolves select-existing-issue.sh through
  # github.action_path, the wiring gha#196 showed a unit test alone does not
  # cover. It runs with dry-run: true so a selftest run never files an issue,
  # and consequently needs only `issues: read`.
  failure-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run select-existing-issue matching tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-select-existing-issue-tests.sh

      - name: Run split-csv-list tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-split-csv-list-tests.sh

      # A title no issue in this repository carries, so the lookup runs for
      # real against the live issue list and finds nothing.
      - name: Exercise open-failure-issue end-to-end (no match)
        id: no-match
        uses: ./.github/actions/open-failure-issue
        with:
          title: 'selftest placeholder title that matches no open issue'
          body: 'Selftest dry run; nothing is filed.'
          dry-run: 'true'

      - name: Assert the no-match case would file a new issue
        shell: bash
        env:
          OUTCOME: ${{ steps.no-match.outputs.outcome }}
          NUMBER: ${{ steps.no-match.outputs.issue-number }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "created" || -n "$NUMBER" ]]; then
            echo "::error::expected outcome=created with no issue number, got outcome='$OUTCOME' number='$NUMBER'"
            exit 1
          fi
          echo "open-failure-issue correctly reported it would file a new issue."

  review-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run classify-review-delivery tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-classify-review-delivery-tests.sh

      # The offline table calls the script directly, so it cannot see whether
      # the installer resolves the script at all. This step is that proof --
      # the same github.action_path resolution run-review-guard's own e2e steps
      # give -- and it is the only coverage of the mechanism ai-code-review.yml
      # will use to reach the script from inside its candidate loop.
      - name: Install the classifier via the composite
        id: install
        uses: ./.github/actions/install-gha-scripts
        with:
          scripts: 'classify-review-delivery.sh'

      - name: Assert the installed script exists and classifies a marker
        shell: bash
        env:
          DIR: ${{ steps.install.outputs.dir }}
        run: |
          set -euo pipefail
          if [ ! -x "$DIR/classify-review-delivery.sh" ]; then
            echo "::error::install-gha-scripts did not produce an executable script in '$DIR'."
            exit 1
          fi
          RUN_URL='https://github.com/Morrison-Lab/gha/actions/runs/1'
          OUT="$(printf '%s\0' \
            "> **Claude review skipped — API credential or quota unavailable.** [View run]($RUN_URL)" \
            | RUN_URL="$RUN_URL" bash "$DIR/classify-review-delivery.sh")"
          if [ "$(sed -n '1s/^delivered=//p' <<<"$OUT")" != "false" ]; then
            echo "::error::expected delivered=false for a quota-skip marker, got: $OUT"
            exit 1
          fi
          echo "install-gha-scripts resolved and ran the classifier: $OUT"

      # The path guard is the one behaviour that must fail rather than degrade:
      # a name reaching outside the scripts directory is a caller bug, and
      # silently copying nothing would leave the loop calling a missing file.
      #
      # The guard is `case "$name" in */*|..*)`, two alternatives, and each
      # needs a case only IT can reach -- the same "a test for one pattern must
      # be reachable by ONLY that pattern" rule this repo's CLAUDE.md records
      # for check-secrets' redaction chain. A single `../../../etc/passwd`
      # input is caught by `*/*` alone, so deleting `..*` would leave the step
      # green (gha#571 review).
      - name: Assert a path-bearing filename is refused
        id: traversal
        continue-on-error: true
        uses: ./.github/actions/install-gha-scripts
        with:
          scripts: '../../../etc/passwd'

      # The file has to EXIST for the next step to discriminate. Without it,
      # deleting the `..*` alternative still fails the call -- on the
      # "no such script" branch instead -- so the assertion passes either way
      # and tests nothing. Verified by simulating the guard both ways: with the
      # file present it is REFUSED with the alternative and COPIED without;
      # with the file absent both variants fail.
      - name: Plant a dot-dot-named script the guard must still refuse
        shell: bash
        run: |
          set -euo pipefail
          : > .github/workflows/scripts/..evil.sh
          echo "Planted .github/workflows/scripts/..evil.sh for the guard test."

      # No slash, so `*/*` cannot match: this is the case that actually
      # exercises the `..*` alternative.
      - name: Assert a dot-dot filename with no slash is refused
        id: dotdot
        continue-on-error: true
        uses: ./.github/actions/install-gha-scripts
        with:
          scripts: '..evil.sh'

      - name: Remove the planted script
        if: always()
        shell: bash
        run: rm -f .github/workflows/scripts/..evil.sh

      - name: Assert both refusals actually failed
        shell: bash
        env:
          SLASH_OUTCOME: ${{ steps.traversal.outcome }}
          DOTDOT_OUTCOME: ${{ steps.dotdot.outcome }}
        run: |
          set -euo pipefail
          rc=0
          if [ "$SLASH_OUTCOME" != "failure" ]; then
            echo "::error::expected install-gha-scripts to refuse a path-bearing name, got outcome='$SLASH_OUTCOME'"
            rc=1
          fi
          if [ "$DOTDOT_OUTCOME" != "failure" ]; then
            echo "::error::expected install-gha-scripts to refuse '..evil.sh', got outcome='$DOTDOT_OUTCOME'"
            rc=1
          fi
          [ "$rc" -eq 0 ] || exit 1
          echo "install-gha-scripts refused both a path-bearing name and a bare dot-dot name."

  # check-junk-files is brand new, so (like check-secrets above) it does not
  # exist at the released `@v2` tag its reusable workflow's internal
  # `uses: Morrison-Lab/gha/check-junk-files@v2` step resolves against yet.
  # Exercise the local composite directly so the selftest covers the actual PR
  # code.
  junk-files:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This repo's own tree carries no tracked junk, so this call asserts the
      # zero-match path -- and, unlike the offline suite, it proves action.yml
      # wires its inputs through to the script at all. The offline tests call
      # the script directly, so they cannot see that layer.
      - name: Check a clean tree
        uses: ./check-junk-files

      # A clean-tree call structurally cannot exercise the failing path, which
      # is where the annotations, the step summary, and the exit code live. So
      # stage a junk file into the index (the scan reads the index, not the
      # worktree, so no commit is needed) and assert the step really fails.
      - name: Track a junk file
        shell: bash
        run: |
          set -euo pipefail
          printf 'selftest\n' > .DS_Store
          git add -f .DS_Store

      - name: Check again, expecting a failure
        id: junk-expected-failure
        continue-on-error: true
        uses: ./check-junk-files

      - name: Assert the failing call actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.junk-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected check-junk-files to fail on a tracked .DS_Store, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "check-junk-files failed on a tracked .DS_Store, as expected."

      # And that paths-ignore reaches the script through action.yml -- the one
      # input whose semantics are easiest to get wrong (see its own docs), and
      # the one a wiring typo would silently turn into "exempt nothing".
      - name: Check again with the junk file exempted
        uses: ./check-junk-files
        with:
          paths-ignore: '.DS_Store'

      - name: Remove the planted junk file
        if: always()
        shell: bash
        run: |
          git rm -q --cached --ignore-unmatch .DS_Store || true
          rm -f .DS_Store

  # The job above takes the zero-match early return, proves a finding fails,
  # and proves two inputs are wired. Everything else -- the `fail`
  # normalization's fail-closed reading, the empty-pattern guard, the
  # deliberate omission of --exclude-standard, and pathspec-vs-`!` exemption
  # semantics -- runs only here. Kept as its own job so a failure is
  # attributable at a glance, the same one-capability-per-job split
  # phi-tests / new-line-breaks-tests / secrets-tests use.
  junk-files-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run check-junk-files tests
        shell: bash
        run: bash check-junk-files/tests/test-check-junk-files.sh

  # check-typos is brand new, so (like check-junk-files above) it does not
  # exist at the released `@v2` tag its reusable workflow's internal
  # `uses: Morrison-Lab/gha/check-typos@v2` step resolves against yet.
  # Exercise the local composite directly so the selftest covers the actual PR
  # code. This repo's own tree currently carries a handful of pre-existing
  # typos (`unparseable`, measured 2026-08-26), so the no-base-ref call below
  # is a live proof of the skip: a whole-tree fallback would fail it.
  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Skip when no base-ref is given
        uses: ./check-typos

      - name: A named-but-missing config must fail
        id: typos-missing-config
        continue-on-error: true
        uses: ./check-typos
        with:
          config: definitely-missing.toml

      - name: Assert the missing-config call actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.typos-missing-config.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected check-typos to fail on a missing config file, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "check-typos failed on a named-but-missing config, as expected."

      - name: Build a fixture with pre-existing drift
        shell: bash
        run: bash check-typos/tests/make-fixture.sh _ci-typos

      - name: Diff-scoped call over an unrelated addition must pass
        uses: ./check-typos
        with:
          path: _ci-typos
          base-ref: HEAD~1

      - name: Whole-tree call must fail on the pre-existing typo
        id: typos-all-expected-failure
        continue-on-error: true
        uses: ./check-typos
        with:
          path: _ci-typos
          base-ref: all

      - name: Assert the whole-tree call actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.typos-all-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected check-typos base-ref=all to fail on a pre-existing typo, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "check-typos failed on a pre-existing typo in whole-tree mode, as expected."

      - name: Build a fixture with a newly-added Quarto typo
        shell: bash
        run: bash check-typos/tests/make-fixture.sh _ci-typos-qmd --new-typo

      - name: Diff-scoped call must fail on the new .qmd typo
        id: typos-qmd-expected-failure
        continue-on-error: true
        uses: ./check-typos
        with:
          path: _ci-typos-qmd
          base-ref: HEAD~1

      - name: Assert the new .qmd typo actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.typos-qmd-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected check-typos to fail on a newly-added page.qmd typo, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "check-typos failed on a newly-added .qmd typo, as expected."

      - name: The same .qmd typo is silent when paths-ignore exempts it
        uses: ./check-typos
        with:
          path: _ci-typos-qmd
          base-ref: HEAD~1
          paths-ignore: 'page.qmd'

  # The job above proves action.yml wires path, base-ref, paths-ignore, and
  # config through a real uses: call, including the skip, the missing-config
  # fail, the whole-tree fail, and a newly-added .qmd typo. Everything else
  # -- fail-closed reading, JSONL parse errors, filename-typo scope, the
  # checksum gate -- runs only here against a stub binary (and a stub curl
  # for the installer), so a regression is caught even when this repo's
  # own tree wouldn't trip it.
  typos-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Run check-typos unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest check-typos/tests/ -q

  save-pr-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run save-pr-diff unit tests
        shell: bash
        run: bash .github/workflows/scripts/tests/run-save-pr-diff-tests.sh

      - name: Invoke save-pr-diff composite action
        id: composite-test
        uses: ./.github/actions/save-pr-diff
        with:
          pr-number: '1'
          repo: 'Morrison-Lab/gha'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert save-pr-diff output path is non-empty
        shell: bash
        env:
          SAVED_PATH: ${{ steps.composite-test.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "$SAVED_PATH" ] || [ ! -s "$SAVED_PATH" ]; then
            echo "::error::expected save-pr-diff to output a non-empty saved diff path, got '$SAVED_PATH'"
            exit 1
          fi
          echo "save-pr-diff successfully saved diff to $SAVED_PATH ($(wc -c < "$SAVED_PATH") bytes)."
