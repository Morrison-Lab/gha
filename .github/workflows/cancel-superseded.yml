name: Cancel Superseded Runs (reusable)

# Call this from a `pull_request` workflow listening for `synchronize` and
# `closed`. It cancels every other queued or running workflow run that belongs
# to the pull request and was started for a head the pull request no longer
# has, and every run started before a pull request closed (gha#1400).
#
# Limits: GitHub lists no pull request for a run from a fork, so fork pull
# requests are never matched, and their read-only token could not cancel
# anyway; Dependabot pull requests get a read-only token too.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for the job. Use a self-hosted label only for a
          private repository; never for a public one, whose pull requests
          can run arbitrary code on it.
        type: string
        default: ''

jobs:
  cancel-superseded:
    runs-on: ${{ inputs.runs-on || (github.event.repository.private && vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: read
    concurrency:
      group: cancel-superseded-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Cancel runs for old heads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          pr_json=$(gh api "repos/$REPO/pulls/$PR")
          state=$(jq -r .state <<< "$pr_json")
          head=$(jq -r .head.sha <<< "$pr_json")
          # A run created at or after the close belongs to the close itself
          # (preview teardown and the like), so only earlier runs are stale.
          closed_at=$(jq -r '.closed_at // "9999-12-31T23:59:59Z"' <<< "$pr_json")
          echo "PR $PR is $state at head $head"
          cancelled=0
          # Collect every id before cancelling, since a cancelled run leaves
          # the listing and would shift the pages that follow.
          all_ids=""
          for status in queued in_progress; do
            page=1
            while :; do
              runs=$(gh api "repos/$REPO/actions/runs?status=$status&event=pull_request&per_page=100&page=$page")
              count=$(jq '.workflow_runs | length' <<< "$runs")
              ids=$(jq -r --arg state "$state" --arg head "$head" --arg closed "$closed_at" \
                --argjson pr "$PR" --argjson self "$RUN_ID" '
                .workflow_runs[]
                | select(.id != $self)
                | select(any(.pull_requests[]?; .number == $pr))
                | select(($state == "open" and .head_sha != $head)
                    or ($state != "open" and .created_at < $closed))
                | .id' <<< "$runs")
              all_ids="$all_ids $ids"
              [ "$count" -lt 100 ] && break
              page=$((page + 1))
            done
          done
          for id in $all_ids; do
            if gh api -X POST "repos/$REPO/actions/runs/$id/cancel" > /dev/null; then
              cancelled=$((cancelled + 1))
            else
              echo "::warning::could not cancel run $id"
            fi
          done
          echo "Cancelled $cancelled superseded run(s)."
