# Active caller for this repo's own reusable Claude PR review workflow
# (dogfooding). Distinct filename from the reusable
# .github/workflows/claude-code-review.yml it calls.
#
# Three ways to start a review:
#   - pull_request events (opened / synchronize / ready_for_review / reopened)
#     — the automatic review.
#   - workflow_dispatch with a pr_number — manual, and the path claude.yml
#     re-dispatches on an `@claude review` mention or after Claude pushes commits.
#   - a `/review` comment on a PR (see the dispatch-on-comment job) — a direct,
#     on-demand review that does NOT route through claude.yml's @claude agent.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string

jobs:
  # A trusted author commenting `/review` at the start of a PR comment triggers
  # an on-demand review of that PR — bypassing claude.yml's @claude agent
  # entirely. The tag is deliberately a slash command, NOT an `@claude …`
  # mention: any `@claude` substring also wakes claude.yml (its caller gate
  # matches it), so a slash command keeps this path independent of that agent.
  #
  # Rather than call the reusable workflow directly — its jobs gate on
  # workflow_dispatch / pull_request and would skip an issue_comment run — this
  # re-enters the workflow_dispatch path below via `gh workflow run`, reusing
  # the reusable workflow's tested dispatched-review flow with no changes to it.
  # `gh workflow run` needs the workflow present on the default branch, so
  # `/review` works once this file is merged there.
  dispatch-on-comment:
    # OWNER/MEMBER/COLLABORATOR, or an allowlisted App login whose
    # author_association is NONE: cursor[bot] (Cloud Agents post /review and
    # @claude review under it) and claude[bot] (a Claude Code remote/web
    # session, and its subagents, act under it).
    #
    # claude[bot] is here because this is the ONLY review-request pathway such
    # a session has. Its pushes carry sender.type == 'Bot', which skips the
    # reusable workflow's automatic pull_request path; and a workflow_dispatch
    # it issues itself starts a run that claude-code-action then short-circuits
    # at zero cost, because `allowed-bots` admits github-actions[bot] and not
    # claude[bot] (measured on Morrison-Lab/ai-config, 2026-09-18: 4 of 4
    # claude[bot] dispatches short-circuited, 4 of 4 github-actions[bot]
    # dispatches reviewed). The dispatch below runs under GITHUB_TOKEN, so it
    # re-enters as github-actions[bot] and clears both gates without widening
    # either. Nothing this workflow posts begins with /review, so a review
    # cannot re-enter this path.
    #
    # This gate lives entirely in the caller, so it takes effect on merge to
    # main without waiting for an @v2 slide.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
      contains(fromJSON('["claude[bot]","cursor[bot]"]'), github.event.comment.user.login))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write        # dispatch this workflow via `gh workflow run`
      issues: write         # acknowledge the /review comment
    steps:
      - name: Parse this workflow's ref
        id: this-wf
        uses: Morrison-Lab/gha/.github/actions/parse-workflow-ref@v2
        with:
          workflow-ref: ${{ github.workflow_ref }}

      - name: Install helper scripts
        id: scripts
        uses: Morrison-Lab/gha/.github/actions/install-gha-scripts@v3
        with:
          scripts: 'detect-pr-workflow-edits.sh'

      - name: Dispatch a review for the commented PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.issue.number }}
          WF_PATH: ${{ steps.this-wf.outputs.path }}
          SCRIPTS_DIR: ${{ steps.scripts.outputs.dir }}
          # Passed via env (not inlined into the script) so the comment body is
          # a shell value, never interpreted as script — avoids injection.
          COMMENT_BODY: ${{ github.event.comment.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The job-level `if:` only does a cheap startsWith('/review') pre-filter;
          # GitHub Actions expressions can't reliably tell '/review' from
          # '/reviewer' or handle a newline/tab after the command. Enforce the real
          # match here: the body must begin with a standalone '/review' token,
          # followed by whitespace (space/tab/newline) or end-of-string.
          # Match case-insensitively (e.g. '/Review', '/REVIEW') matching GitHub
          # Actions' startsWith() case insensitivity (gha#908).
          shopt -s nocasematch
          if [[ ! "$COMMENT_BODY" =~ ^/review([[:space:]]|$) ]]; then
            shopt -u nocasematch
            echo "Comment does not start with a standalone '/review' command; skipping dispatch."
            exit 0
          fi
          shopt -u nocasematch
          # This workflow's own filename, so the dispatch resolves regardless
          # of what the file is named in a consumer repo — WF_PATH (from the
          # shared parse-workflow-ref action, above) is the
          # .github/workflows/<file> portion; strip the directory to get just
          # the filename `gh workflow run` expects.
          WF_FILE=$(basename "$WF_PATH")
          # This job never checks out the repo, so the PR's head branch has to
          # be looked up explicitly. --ref pins the dispatched run's check-runs
          # to that branch instead of the default branch workflow_dispatch
          # falls back to when no ref is given (#285) --- without it,
          # `require-review`'s check-run lands on the wrong commit and never
          # supersedes a stale cancelled run tied to the PR's real head SHA.
          PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          PR_STATE=$(jq -r '.state' <<< "$PR_JSON")
          PR_MERGED=$(jq -r '.merged' <<< "$PR_JSON")
          if [[ "$PR_STATE" == "closed" || "$PR_MERGED" == "true" ]]; then
            echo "::notice::PR #$PR_NUMBER is closed or merged; skipping review dispatch."
            exit 0
          fi
          PR_BRANCH=$(jq -r '.head.ref' <<< "$PR_JSON")
          PR_HEAD_REPO=$(jq -r '.head.repo.full_name' <<< "$PR_JSON")
          echo "Dispatching $WF_FILE to review PR #$PR_NUMBER ($PR_BRANCH) (/review comment)."
          # A fork PR's head branch only exists in the fork, not in $REPO, so
          # --ref would fail to resolve there (#289). Fall back to the default branch
          # for fork PRs; the resulting check-run mis-attributes to the
          # default branch (the pre-#285 behavior), the lesser problem.
          # Pass --ref explicitly with DEFAULT_BRANCH when falling back, avoiding
          # an unauthenticated GraphQL defaultBranchRef query on private repos (#931).
          DEFAULT_REF_ARGS=()
          if [ -n "${DEFAULT_BRANCH:-}" ]; then
            DEFAULT_REF_ARGS=(--ref "$DEFAULT_BRANCH")
          fi
          REF_ARGS=(--ref "$PR_BRANCH")
          if [ "$PR_HEAD_REPO" != "$REPO" ]; then
            echo "::notice::PR #$PR_NUMBER is from a fork ($PR_HEAD_REPO); dispatching $WF_FILE from the default branch."
            REF_ARGS=("${DEFAULT_REF_ARGS[@]}")
          fi
          # When the PR edits top-level workflow YAML, manual dispatches cannot
          # execute untrusted workflow YAML from the PR branch, and default-branch
          # dispatches cannot attach status checks to the PR head while preempting
          # the in-flight push-triggered review (gha#598, gha#921).
          # Skip review dispatch on workflow edits so the push-triggered pull_request review
          # (which restores default-branch workflows after checkout) runs to completion on
          # the PR head without being destroyed by a default-branch dispatch.
          # Workflow-edit detection routes through detect-pr-workflow-edits.sh (gha#920).
          # GET .../files is capped at 3000 files (GitHub REST "List pull
          # requests files", read 2026-08-26). A 200 with a short list is
          # not a complete tree. Keep in sync with list-pr-changed-files.sh.
          changed=$(jq -r '.changed_files' <<< "$PR_JSON")
          listed=0
          if ! files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate --jq '.[].filename'); then
            echo "::notice::Could not list a complete file set for PR #$PR_NUMBER; skipping review dispatch to avoid executing untrusted workflow YAML or preempting PR-head checks (gha#598, gha#921)."
            NOTICE_BODY=":warning: \`/review\` was not dispatched: Could not verify whether PR #$PR_NUMBER edits workflow files (file list API failed). The automatic review triggered on push runs with default-branch workflows restored and attaches checks to the PR head. To trigger a fresh review, push a new commit (or \`git commit --allow-empty\`)."
            printf '%s' "$NOTICE_BODY" | jq -Rs '{body: .}' \
              | gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                  --method POST \
                  -H "Content-Type: application/json" \
                  --input - > /dev/null || true
            exit 0
          else
            files=$(printf '%s' "$files" | tr -d '\r')
            if [ -n "$files" ]; then
              listed=$(printf '%s\n' "$files" | grep -c . || true)
            fi
            if [ -z "$changed" ] || [ "$changed" = "null" ] || ! [[ "$changed" =~ ^[0-9]+$ ]] || [ "$listed" -lt "$changed" ]; then
              echo "::notice::Could not list a complete file set for PR #$PR_NUMBER; skipping review dispatch to avoid executing untrusted workflow YAML or preempting PR-head checks (gha#598, gha#921)."
              NOTICE_BODY=":warning: \`/review\` was not dispatched: PR #$PR_NUMBER file list was truncated ($listed of $changed files). The automatic review triggered on push runs with default-branch workflows restored and attaches checks to the PR head. To trigger a fresh review, push a new commit (or \`git commit --allow-empty\`)."
              printf '%s' "$NOTICE_BODY" | jq -Rs '{body: .}' \
                | gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                    --method POST \
                    -H "Content-Type: application/json" \
                    --input - > /dev/null || true
              exit 0
            else
              detect_out="$(CALLER_WF_PATH="" bash "$SCRIPTS_DIR/detect-pr-workflow-edits.sh" - <<< "$files")"
              if [ "$(sed -n 's/^workflow_edits=//p' <<< "$detect_out")" = "true" ]; then
                echo "::notice::PR #$PR_NUMBER edits workflow files; skipping review dispatch because default-branch dispatches cannot attach status checks to the PR head and would preempt in-flight pull_request reviews (gha#921)."
                NOTICE_BODY=":warning: \`/review\` was not dispatched: PR #$PR_NUMBER edits workflow files (\`.github/workflows/*.yml\`). For security, manual dispatches cannot execute untrusted workflow YAML, and default-branch dispatches cannot attach status checks to the PR head (gha#921). The automatic review triggered on push runs with default-branch workflows restored and attaches checks to the PR head. To trigger a fresh review, push a new commit (or \`git commit --allow-empty\`)."
                printf '%s' "$NOTICE_BODY" | jq -Rs '{body: .}' \
                  | gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                      --method POST \
                      -H "Content-Type: application/json" \
                      --input - > /dev/null || true
                exit 0
              fi
            fi
          fi
          # --repo is required: this job doesn't check out the repo, so gh has no
          # git remote to infer it from (and gh doesn't read GITHUB_REPOSITORY).
          gh workflow run "$WF_FILE" --repo "$REPO" "${REF_ARGS[@]}" -f pr_number="$PR_NUMBER"
          # gh issue comment uses the GraphQL addComment mutation which requires
          # pull_requests: write on pull requests. Use the REST endpoint, which
          # accepts issues: write (gha#931).
          NOTICE_BODY=":mag: \`/review\` received — dispatched a Claude review of this PR (see the [dispatch run]($RUN_URL)). The review posts as its own comment when it finishes."
          if ! printf '%s' "$NOTICE_BODY" | jq -Rs '{body: .}' \
            | gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                --method POST \
                -H "Content-Type: application/json" \
                --input - > /dev/null; then
            echo "::warning::Could not acknowledge the /review comment."
          fi

  review:
    # pull_request and workflow_dispatch only; the issue_comment path is handled
    # by dispatch-on-comment above (which re-enters via workflow_dispatch).
    # Without this gate every PR comment would spawn a pointless (skipped) call
    # of the reusable workflow.
    if: github.event_name != 'issue_comment'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read   # lets the reviewer read CI status (github_ci MCP server)
      checks: read    # keep: required by @v2 until the slide, and again at the v3 (gha#833)
    uses: Morrison-Lab/gha/.github/workflows/claude-code-review.yml@v2
    # Pass secrets explicitly (not `secrets: inherit`) for parity with
    # examples/claude-code-review.yml; inherit only works for same-owner callers.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}   # optional; empty when unset
    with:
      pr-number: ${{ inputs.pr_number }}
      # gha is a GitHub Actions repo, not R-package/Quarto, so opt out of the
      # R/tidyverse SERG lab manual in reviews. (gha's own CLAUDE.md still carries
      # that guidance for the reviewing agent, so nothing is lost.)
      lab-manual: false
