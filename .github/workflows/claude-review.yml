# Active caller for this repo's own reusable Claude PR review workflow
# (dogfooding). Distinct filename from the reusable
# .github/workflows/claude-code-review.yml it calls.
#
# Three ways to start a review:
#   - pull_request events (opened / synchronize / ready_for_review / reopened)
#     — the automatic review.
#   - workflow_dispatch with a pr_number — manual, and the path claude.yml
#     re-dispatches on an `@claude review` mention or after Claude pushes commits.
#   - a `/review` comment on a PR (see the dispatch-on-comment job) — a direct,
#     on-demand review that does NOT route through claude.yml's @claude agent.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string

jobs:
  # A trusted author commenting `/review` at the start of a PR comment triggers
  # an on-demand review of that PR — bypassing claude.yml's @claude agent
  # entirely. The tag is deliberately a slash command, NOT an `@claude …`
  # mention: any `@claude` substring also wakes claude.yml (its caller gate
  # matches it), so a slash command keeps this path independent of that agent.
  #
  # Rather than call the reusable workflow directly — its jobs gate on
  # workflow_dispatch / pull_request and would skip an issue_comment run — this
  # re-enters the workflow_dispatch path below via `gh workflow run`, reusing
  # the reusable workflow's tested dispatched-review flow with no changes to it.
  # `gh workflow run` needs the workflow present on the default branch, so
  # `/review` works once this file is merged there.
  dispatch-on-comment:
    # OWNER/MEMBER/COLLABORATOR, or cursor[bot] (Cloud Agents post /review
    # and @claude review under that App login with author_association NONE).
    # This gate lives entirely in the caller, so it takes effect on merge to
    # main without waiting for an @v2 slide.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
      contains(fromJSON('["cursor[bot]"]'), github.event.comment.user.login))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write        # dispatch this workflow via `gh workflow run`
      issues: write         # acknowledge the /review comment
      pull-requests: read   # read the PR's head branch and head repo
    steps:
      - name: Parse this workflow's ref
        id: this-wf
        uses: Morrison-Lab/gha/.github/actions/parse-workflow-ref@v2
        with:
          workflow-ref: ${{ github.workflow_ref }}

      - name: Dispatch a review for the commented PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          WF_PATH: ${{ steps.this-wf.outputs.path }}
          # Passed via env (not inlined into the script) so the comment body is
          # a shell value, never interpreted as script — avoids injection.
          COMMENT_BODY: ${{ github.event.comment.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The job-level `if:` only does a cheap startsWith('/review') pre-filter;
          # GitHub Actions expressions can't reliably tell '/review' from
          # '/reviewer' or handle a newline/tab after the command. Enforce the real
          # match here: the body must begin with a standalone '/review' token,
          # followed by whitespace (space/tab/newline) or end-of-string.
          if [[ ! "$COMMENT_BODY" =~ ^/review([[:space:]]|$) ]]; then
            echo "Comment does not start with a standalone '/review' command; skipping dispatch."
            exit 0
          fi
          # This workflow's own filename, so the dispatch resolves regardless
          # of what the file is named in a consumer repo — WF_PATH (from the
          # shared parse-workflow-ref action, above) is the
          # .github/workflows/<file> portion; strip the directory to get just
          # the filename `gh workflow run` expects.
          WF_FILE=$(basename "$WF_PATH")
          # This job never checks out the repo, so the PR's head branch has to
          # be looked up explicitly. --ref pins the dispatched run's check-runs
          # to that branch instead of the default branch workflow_dispatch
          # falls back to when no ref is given (#285) --- without it,
          # `require-review`'s check-run lands on the wrong commit and never
          # supersedes a stale cancelled run tied to the PR's real head SHA.
          PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          PR_BRANCH=$(jq -r '.head.ref' <<< "$PR_JSON")
          PR_HEAD_REPO=$(jq -r '.head.repo.full_name' <<< "$PR_JSON")
          echo "Dispatching $WF_FILE to review PR #$PR_NUMBER ($PR_BRANCH) (/review comment)."
          # The reusable review workflow blocks fork PRs in gather-context.
          # Short-circuit here to provide a clear explanation rather than
          # dispatching a run that will silently skip.
          if [ "$PR_HEAD_REPO" != "$REPO" ]; then
            echo "::warning::PR #$PR_NUMBER is from a fork ($PR_HEAD_REPO); the reusable review workflow blocks fork reviews, so no review was dispatched."
            gh issue comment "$PR_NUMBER" --repo "$REPO" \
              --body ":no_entry: \`/review\` received, but this PR is from a fork, and fork PRs cannot be reviewed by this workflow." \
              || echo "::warning::Could not acknowledge the /review comment."
            exit 0
          fi
          REF_ARGS=(--ref "$PR_BRANCH")
          # --repo is required: this job doesn't check out the repo, so gh has no
          # git remote to infer it from (and gh doesn't read GITHUB_REPOSITORY).
          gh workflow run "$WF_FILE" --repo "$REPO" "${REF_ARGS[@]}" -f pr_number="$PR_NUMBER"
          gh issue comment "$PR_NUMBER" --repo "$REPO" \
            --body ":mag: \`/review\` received — dispatched a Claude review of this PR (see the [dispatch run]($RUN_URL)). The review posts as its own comment when it finishes." \
            || echo "::warning::Could not acknowledge the /review comment."

  review:
    # pull_request and workflow_dispatch only; the issue_comment path is handled
    # by dispatch-on-comment above (which re-enters via workflow_dispatch).
    # Without this gate every PR comment would spawn a pointless (skipped) call
    # of the reusable workflow.
    if: github.event_name != 'issue_comment'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read   # lets the reviewer read CI status (github_ci MCP server)
    uses: Morrison-Lab/gha/.github/workflows/claude-code-review.yml@v2
    # Pass secrets explicitly (not `secrets: inherit`) for parity with
    # examples/claude-code-review.yml; inherit only works for same-owner callers.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}   # optional; empty when unset
    with:
      pr-number: ${{ inputs.pr_number }}
      # gha is a GitHub Actions repo, not R-package/Quarto, so opt out of the
      # R/tidyverse SERG lab manual in reviews. (gha's own CLAUDE.md still carries
      # that guidance for the reviewing agent, so nothing is lost.)
      lab-manual: false
