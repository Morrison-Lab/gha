          printf '%s\n' '<div class="cell-output cell-output-stderr">' '<pre>message</pre></div>' > _ci-ccm/_site/page.html
          printf '%s\n' '```{r}' 'ggplot(d) + geom_smooth()' '```' > _ci-ccm/page.qmd
