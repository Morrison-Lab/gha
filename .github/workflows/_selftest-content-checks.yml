  # does not exist at the released tag its reusable workflow's internal `uses:`
  # step resolves against yet. Exercise the local composite directly.
  # The offline suite calls the script, so it cannot see whether action.yml
  # wires its inputs through; these calls can. A throwaway commit on top of the
  # checkout gives `HEAD^1` a diff to read, whatever the triggering event was.
  paired-file-change:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run check-paired-file-change tests
        shell: bash
        run: bash check-paired-file-change/tests/test-check-paired-file-change.sh

      - name: Commit a trigger file with no pair
        shell: bash
        run: |
          set -euo pipefail
          printf 'selftest\n' > selftest-trigger.txt
          git add selftest-trigger.txt
          git config user.name selftest
          git config user.email selftest@example.invalid  # phi-allow
          git commit -q -m 'selftest trigger'

      - name: Check the unpaired change, expecting a failure
        id: paired-expected-failure
        continue-on-error: true
        uses: ./check-paired-file-change
        with:
          trigger-paths: selftest-trigger.txt
          required-paths: selftest-required.txt
          skip-label: ''
          base-ref: HEAD^1

      - name: Assert the failing call actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.paired-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected check-paired-file-change to fail on an unpaired change, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "check-paired-file-change failed on an unpaired change, as expected."

      # And that required-paths reaches the script: the same commit, paired.
      - name: Check again with the pair present in required-paths
        uses: ./check-paired-file-change
        with:
          trigger-paths: selftest-trigger.txt
          required-paths: selftest-required.txt, selftest-trigger.txt
          skip-label: ''
          base-ref: HEAD^1

  # check-quarto-links and check-orphaned-images are brand new, so (like
  # check-typos above) they do not exist at the `@v3` tag their reusable
  # workflows' internal `uses:` steps resolve against yet. Exercise the local
  # composites directly so the selftest covers the actual PR code. The unit
  # suites run first; the composite calls then prove action.yml wires its
  # inputs through, which the suites cannot see because they call the
  # scripts directly.
  quarto-links-orphaned-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Run the unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest check-quarto-links/tests/ check-orphaned-images/tests/ -q

      # This repo's own pages carry no dead page links and it tracks no
      # images, so both calls take the clean path over the real tree.
      - name: Check this repo's own links
        uses: ./check-quarto-links
      - name: Check this repo's own images
        uses: ./check-orphaned-images
        with:
          fail: 'true'

      # A clean call cannot reach the failing path, so stage a dead link and
      # an unused image into the index (both scans read tracked files, so no
      # commit is needed) and assert each composite really fails.
      - name: Stage a dead link and an unused image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-quarto-links-fixture
          printf '# Page\n\nSee [the old page](renamed-away.qmd).\n' > ci-quarto-links-fixture/page.qmd
          # The image's name is built at run time: written out here, it would
          # appear in this workflow file, which the check reads as a source,
          # and the image would count as referenced.
          printf 'not really an image\n' > "ci-quarto-links-fixture/orphan-${GITHUB_RUN_ID}.png"
