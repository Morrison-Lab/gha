          whole-tree: 'true'
          fail: 'true'
          paths-ignore: |
            _ci-result-titles/title
            _ci-result-titles/statement
            website/**
            build-dependency-graph/tests/fixture/**
      - name: Check again with prefixes that exclude theorems
