      # title is a sentence but whose statement has no display formula, and one
      # that keeps both rules. Other checks' fixtures under
      # build-dependency-graph/tests/fixture hold results with no display
      # formula, so the whole-tree calls skip them.
      - name: Stage pages for the title and statement rules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-result-titles/title _ci-result-titles/statement _ci-result-titles/ok
          printf '%s\n' '---' 'title: "T"' '---' '' '::: {#thm-x}' '## Derivative of the logistic function' '' 'The derivative is its value times one minus its value.' '' '$$' 'x = 1' '$$' ':::' > _ci-result-titles/title/page.qmd
