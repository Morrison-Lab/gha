  # `uses: Morrison-Lab/gha/check-term-links@v3` does not resolve until the tag
  # slides past the merge. Exercise the local composite directly. The unit
  # tests cover term harvesting, first-use scoping and both scopes; the
  # composite calls below prove action.yml wires each input through.
  term-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Run check-term-links unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest check-term-links/tests/ -v
      - name: Check this PR's added lines
        uses: ./check-term-links
        with:
          base-ref: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
      # Stage a definition and a page that uses its term unlinked.
      - name: Stage a page with an unlinked first use
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-term-links
          printf '%s\n' '::: {#def-zebra}' '' '#### Zebra' '' 'A **zebra** is striped.' '' ':::' > _ci-term-links/def.qmd
          printf '%s\n' '::: {#exm-a}' '' 'The zebra ran.' '' ':::' > _ci-term-links/page.qmd
          git add -f _ci-term-links
      - name: Check the staged page, warn-only with fail false
        uses: ./check-term-links
        with:
          fail: 'false'
          whole-tree: 'true'
          globs: '_ci-term-links/*.qmd'
      - name: Check the staged page, expecting a failure
        id: term-links-expected-failure
        continue-on-error: true
        uses: ./check-term-links
        with:
          fail: 'true'
          whole-tree: 'true'
          globs: '_ci-term-links/*.qmd'
      - name: Assert the failing call actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.term-links-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected check-term-links to fail on the staged page, got outcome='$OUTCOME'"
            exit 1
          fi
      # Diff-scoped against HEAD, the staged page is an uncommitted change, so
      # the call must fail; were base-ref dropped it would skip and pass.
      - name: Check again diff-scoped against HEAD, expecting a failure
        id: term-links-diff-expected-failure
        continue-on-error: true
        uses: ./check-term-links
        with:
          fail: 'true'
          base-ref: HEAD
          globs: '_ci-term-links/*.qmd'
      - name: Assert the diff-scoped call failed
        shell: bash
        env:
          OUTCOME: ${{ steps.term-links-diff-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected the diff-scoped call to fail on the staged page, got outcome='$OUTCOME'"
            exit 1
          fi
      # A term defined only in a prerequisite directory must reach the script
      # through terms-dirs: the page alone has no definition of it (gha#1462).
      - name: Stage a prerequisite site that defines a term the page uses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prereq-site" _ci-term-links-prereq
          printf '%s\n' '::: {#def-okapi}' '' '#### Okapi' '' 'An **okapi** has stripes.' '' ':::' > "$RUNNER_TEMP/prereq-site/def.qmd"
          printf '%s\n' '::: {#exm-b}' '' 'The okapi ran.' '' ':::' > _ci-term-links-prereq/page.qmd
          git add -f _ci-term-links-prereq
      - name: Check the page without terms-dirs, expecting a pass
        uses: ./check-term-links
        with:
          fail: 'true'
          whole-tree: 'true'
          globs: '_ci-term-links-prereq/*.qmd'
      - name: Check the page with terms-dirs, expecting a failure
        id: term-links-prereq-expected-failure
        continue-on-error: true
        uses: ./check-term-links
        with:
          fail: 'true'
          whole-tree: 'true'
          globs: '_ci-term-links-prereq/*.qmd'
          terms-dirs: ${{ runner.temp }}/prereq-site
      - name: Assert terms-dirs made the term known
        shell: bash
        env:
          OUTCOME: ${{ steps.term-links-prereq-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected check-term-links to fail once terms-dirs defines the term, got outcome='$OUTCOME'"
            exit 1
          fi
      - name: Check again with no base, expecting a skip
        uses: ./check-term-links
        with:
          fail: 'true'
          base-ref: ''
          globs: '_ci-term-links/*.qmd'
      # Each of these must pass over the same staged page, so each proves its
      # input reached the script.
      - name: Check again with the page exempted through paths-ignore
        uses: ./check-term-links
        with:
          fail: 'true'
          whole-tree: 'true'
          globs: '_ci-term-links/*.qmd'
          paths-ignore: '_ci-term-links/page.qmd'
      - name: Check again with the term allowed
        shell: bash
        run: printf '%s\n' 'zebra' > "$RUNNER_TEMP/allow.txt"
      - name: Check again with allow-file naming the term
        uses: ./check-term-links
        with:
          fail: 'true'
          whole-tree: 'true'
          globs: '_ci-term-links/*.qmd'
          allow-file: ${{ runner.temp }}/allow.txt
      - name: Remove the staged page
        if: always()
        shell: bash
        run: |
          git rm -q -r --cached --ignore-unmatch _ci-term-links || true
          rm -rf _ci-term-links
  # check-local-macros is brand new, so its reusable workflow's internal
  # `uses: Morrison-Lab/gha/check-local-macros@v3` does not resolve until the
  # tag slides past the merge. Exercise the local composite directly. The unit
  # tests cover the scanner, the override rule and both scopes; the composite
  # calls below prove action.yml wires each input through to the script.
  local-macros:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Run check-local-macros unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest check-local-macros/tests/ -v
      - name: Check this PR's added lines
        uses: ./check-local-macros
        with:
          base-ref: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
      # A clean tree has nothing to flag, so stage a page that defines a macro
      # and assert that the blocking call really fails.
      - name: Stage a page that defines a macro
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-local-macros
          printf '%s\n' 'Use $\newcommand{\foo}{x}$ here.' > _ci-local-macros/page.qmd
          git add -f _ci-local-macros/page.qmd
      # Warn-only is the default: the same page must not fail the job.
      - name: Check the staged page, warn-only by default
        uses: ./check-local-macros
        with:
          whole-tree: 'true'
      - name: Check the staged page, expecting a failure
        id: local-macros-expected-failure
        continue-on-error: true
        uses: ./check-local-macros
        with:
          fail: 'true'
          whole-tree: 'true'
      - name: Assert the failing call actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.local-macros-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected check-local-macros to fail on a staged page defining a macro, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "check-local-macros failed on the staged page, as expected."
      # Diff-scoped against HEAD, the staged page is an uncommitted change, so
      # the working-tree-aware scope examines it and the call must fail. Were
      # base-ref dropped, the call would skip and pass, so this failure proves
      # base-ref arrived.
      - name: Check again diff-scoped against HEAD, expecting a failure
        id: local-macros-diff-expected-failure
        continue-on-error: true
        uses: ./check-local-macros
        with:
          fail: 'true'
          base-ref: HEAD
      - name: Assert the diff-scoped call failed
        shell: bash
        env:
          OUTCOME: ${{ steps.local-macros-diff-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected the diff-scoped call to fail on the staged page, got outcome='$OUTCOME'"
            exit 1
          fi
      # With no base and no whole-tree, the call skips (warning, exit 0). Were
      # the skip a whole-tree fallback, it would fail on the staged page.
      - name: Check again with no base, expecting a skip
        uses: ./check-local-macros
        with:
          fail: 'true'
          base-ref: ''
      # Each of these must pass over the same staged page, so each proves its
      # input reached the script: were it dropped, the call would fail as the
      # one above did.
      - name: Check again with the page exempted through paths-ignore
        uses: ./check-local-macros
        with:
          fail: 'true'
          whole-tree: 'true'
          paths-ignore: '_ci-local-macros'
      - name: Check again with globs excluding the page
        uses: ./check-local-macros
        with:
          fail: 'true'
          whole-tree: 'true'
          globs: 'website/reference/*.qmd'
      # The page is an override file naming a macro the library lacks: that is
      # still a failure, which proves override-files and library arrive. Were
      # either dropped, the page would be a plain local definition (also a
      # failure) or unchecked (a pass), so this pair brackets both.
      - name: Stage a library file and treat the page as an override
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '\providecommand{\bar}{y}' > _ci-local-macros/library.tex
          git add -f _ci-local-macros/library.tex
      - name: Check the page as an override of an unknown macro, expecting a failure
        id: local-macros-override-expected-failure
        continue-on-error: true
        uses: ./check-local-macros
        with:
          fail: 'true'
          whole-tree: 'true'
          globs: '_ci-local-macros/page.qmd'
          override-files: '_ci-local-macros/page.qmd'
          library: '_ci-local-macros/library.tex'
      - name: Assert the override call failed
        shell: bash
        env:
          OUTCOME: ${{ steps.local-macros-override-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected an override of a macro the library lacks to fail, got outcome='$OUTCOME'"
            exit 1
          fi
      - name: Check the page as an override with no library, expecting a pass
        uses: ./check-local-macros
        with:
          fail: 'true'
          whole-tree: 'true'
          globs: '_ci-local-macros/page.qmd'
          override-files: '_ci-local-macros/page.qmd'
      - name: Remove the staged files
        if: always()
        shell: bash
        run: |
          git rm -q -r --cached --ignore-unmatch _ci-local-macros || true
          rm -rf _ci-local-macros
