      - name: Check links again, expecting a failure
        id: links-expected-failure
        continue-on-error: true
        uses: ./check-quarto-links
      - name: Check images again with fail on, expecting a failure
        id: images-expected-failure
        continue-on-error: true
        uses: ./check-orphaned-images
        with:
          fail: 'true'
      - name: Assert both failing calls actually failed
        shell: bash
        env:
          LINKS: ${{ steps.links-expected-failure.outcome }}
          IMAGES: ${{ steps.images-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$LINKS" != "failure" ] || [ "$IMAGES" != "failure" ]; then
            echo "::error::expected both to fail, got links='$LINKS' images='$IMAGES'"
            exit 1
          fi
          echo "Both composites failed on the staged fixtures, as expected."
      # And that paths-ignore reaches each script through action.yml, and
      # that check-orphaned-images warns only by default.
      - name: Check again with the fixtures exempted
        uses: ./check-quarto-links
        with:
          paths-ignore: 'ci-quarto-links-fixture'
      - name: Check images with the default fail
        uses: ./check-orphaned-images
      - name: Check images with the fixture exempted
        uses: ./check-orphaned-images
        with:
          paths-ignore: 'ci-quarto-links-fixture/**'
          fail: 'true'
      - name: Remove the staged fixtures
        if: always()
        shell: bash
        run: |
          git rm -rq --cached --ignore-unmatch ci-quarto-links-fixture || true
          rm -rf ci-quarto-links-fixture

  # check-quarto-prose is brand new, so (like check-typos above) it does not
  # exist at the `@v3` tag its reusable workflow's internal `uses:` step
  # resolves against yet. Exercise the local composite directly. The unit
  # suite runs first; the composite calls then prove action.yml wires each
  # input through to the script, which the suite cannot see because it calls
  # the script directly. Every call names the fixture directory in `globs`,
  # because this repo's own docs quote the banned phrases.
  quarto-prose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Run the unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest check-quarto-prose/tests/ -q

      # The capability's own reference page quotes its banned phrases, so
      # scan that real page: a quoted phrase outside a code span fails here
      # instead of the first time someone edits the page.
      - name: Check this capability's own reference page
        uses: ./check-quarto-prose
        with:
          base-ref: all
          globs: website/reference/check-quarto-prose.qmd

      # With no base-ref the check skips rather than scanning the tree.
      - name: Check with no base-ref, expecting a skip
        uses: ./check-quarto-prose

      # A composite step's log cannot be captured, so run the script as the
      # action does and assert the skip message itself. A bare pass would
      # also be what a check that examined nothing prints.
      - name: Assert the no-base-ref run says it skipped
        shell: bash
        env:
          CQP_BASE_REF: ''
        run: |
          set -euo pipefail
          out=$(python3 -u check-quarto-prose/check-quarto-prose.py)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q '^Skipping the prose check'
          if printf '%s\n' "$out" | grep -q '^::error'; then
            echo '::error::The skipped run reported findings.'
            exit 1
          fi

      # Stage a clean page, a page with a banned phrase, and a page with an
      # example in a notes div. The check reads tracked files, so staging is
      # enough and nothing is committed.
      - name: Stage the fixtures
        shell: bash
        run: |
          set -euo pipefail
          dir=ci-quarto-prose-fixture
          mkdir -p "$dir"
          printf '# Clean\n\nPlain, literal prose.\n' > "$dir/clean.qmd"
          printf '# Idiom\n\nLet us go under the hood.\n' > "$dir/idiom.qmd"
          printf '::: notes\nExample 1. A coin.\n:::\n' > "$dir/notes.qmd"
          printf 'something else entirely\n' > "$dir/other-idioms.txt"
          git add -f "$dir"
      - name: Check the clean page
        uses: ./check-quarto-prose
        with:
          base-ref: all
          globs: 'ci-quarto-prose-fixture/clean.qmd'
      - name: Check the idiom page, expecting a failure
        id: idiom-expected-failure
        continue-on-error: true
        uses: ./check-quarto-prose
        with:
          base-ref: all
          globs: 'ci-quarto-prose-fixture/idiom.qmd'
      - name: Check the notes page, expecting a failure
        id: notes-expected-failure
        continue-on-error: true
        uses: ./check-quarto-prose
        with:
          base-ref: all
          globs: 'ci-quarto-prose-fixture/notes.qmd'
      - name: Assert both failing calls actually failed
        shell: bash
        env:
          IDIOM: ${{ steps.idiom-expected-failure.outcome }}
          NOTES: ${{ steps.notes-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$IDIOM" != "failure" ] || [ "$NOTES" != "failure" ]; then
            echo "::error::expected both to fail, got idiom='$IDIOM' notes='$NOTES'"
            exit 1
          fi
          echo "Both rules failed on the staged fixtures, as expected."
      # And that paths-ignore, fail, idioms-file and allow-file each reach
      # the script through action.yml.
      - name: Check again with the fixtures exempted
        uses: ./check-quarto-prose
        with:
          base-ref: all
          globs: 'ci-quarto-prose-fixture/*.qmd'
          paths-ignore: 'ci-quarto-prose-fixture/idiom.qmd, ci-quarto-prose-fixture/notes.qmd'
      - name: Check again with fail off
        uses: ./check-quarto-prose
        with:
          base-ref: all
          globs: 'ci-quarto-prose-fixture/*.qmd'
          fail: 'false'
      - name: Check again with a replacement idiom list
        uses: ./check-quarto-prose
        with:
          base-ref: all
          globs: 'ci-quarto-prose-fixture/idiom.qmd'
          idioms-file: ci-quarto-prose-fixture/other-idioms.txt
      - name: Stage an allow-file
        shell: bash
        run: |
          set -euo pipefail
          printf 'ci-quarto-prose-fixture/*.qmd: under the hood\n' > ci-quarto-prose-fixture/allow.txt
          git add -f ci-quarto-prose-fixture/allow.txt
      - name: Check the idiom page with the allow-file
        uses: ./check-quarto-prose
        with:
          base-ref: all
          globs: 'ci-quarto-prose-fixture/idiom.qmd'
          allow-file: ci-quarto-prose-fixture/allow.txt
      - name: Remove the staged fixtures
        if: always()
        shell: bash
        run: |
          git rm -rq --cached --ignore-unmatch ci-quarto-prose-fixture || true
          rm -rf ci-quarto-prose-fixture

  # check-pr-size is brand new, so its reusable workflow's internal
  # `uses: Morrison-Lab/gha/check-pr-size@v3` does not resolve until the tag
  # slides past the merge. Exercise the local composite directly.
  pr-size:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Run check-pr-size unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest check-pr-size/tests/ -v
      # This PR is itself a new check plus its docs, so measure a throwaway
      # commit of 22 small files instead of the PR: the cap must fail it.
      - name: Commit a 22-file sweep on a scratch branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -q -c ci-pr-size-sweep
          mkdir -p _ci-pr-size
          for i in $(seq 1 22); do echo "line $i" > "_ci-pr-size/f$i.txt"; done
          git add -f _ci-pr-size
          git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "sweep fixture" # phi-allow
      - name: Check the sweep, expecting a failure
        id: pr-size-expected-failure
        continue-on-error: true
        uses: ./check-pr-size
        with:
          base-ref: HEAD^1
      - name: Assert the failing call actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.pr-size-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected check-pr-size to fail on a 22-file sweep, got outcome='$OUTCOME'"
            exit 1
          fi
      - name: Check again with the exemption label, expecting a pass
        uses: ./check-pr-size
        with:
          base-ref: HEAD^1
          exempt: 'true'
      - name: Check again with a raised cap, expecting a pass
        uses: ./check-pr-size
        with:
          base-ref: HEAD^1
          max-files: '22'
      - name: Check again with the sweep exempted through paths-ignore
        uses: ./check-pr-size
        with:
          base-ref: HEAD^1
          paths-ignore: '_ci-pr-size/**'
      - name: Check again with fail off, expecting a pass
        uses: ./check-pr-size
        with:
          base-ref: HEAD^1
          fail: 'false'
      - name: Check again with no base, expecting a skip
        uses: ./check-pr-size
        with:
          base-ref: ''

  # check-pr-concerns is brand new, so its reusable workflow's internal
  # `uses: Morrison-Lab/gha/check-pr-concerns@v3` does not resolve until the tag
  # slides past the merge. Exercise the local composite directly.
  pr-concerns:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Run check-pr-concerns unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest check-pr-concerns/tests/ -v
      # This PR is itself infrastructure plus docs, so examine a throwaway
      # commit of one content file and one infrastructure file instead of the
      # PR: the mix must fail.
      - name: Commit a content-plus-infrastructure change on a scratch branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -q -c ci-pr-concerns-mix
          mkdir -p chapters tools
          echo "line" > chapters/_ci-concerns.qmd
          echo "line" > tools/_ci-concerns.sh
          git add -f chapters/_ci-concerns.qmd tools/_ci-concerns.sh
          git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "mix fixture" # phi-allow
      - name: Check the mix, expecting a failure
        id: pr-concerns-expected-failure
        continue-on-error: true
        uses: ./check-pr-concerns
        with:
          base-ref: HEAD^1
      - name: Assert the failing call actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.pr-concerns-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected check-pr-concerns to fail on a content-plus-infrastructure change, got outcome='$OUTCOME'"
            exit 1
          fi
      - name: Check again with the exemption label, expecting a pass
        uses: ./check-pr-concerns
        with:
          base-ref: HEAD^1
          exempt: 'true'
      - name: Check again with custom infra paths, expecting a pass
        uses: ./check-pr-concerns
        with:
          base-ref: HEAD^1
          infra-paths: 'ops/**'
      - name: Check again with the infrastructure file ignored, expecting a pass
        uses: ./check-pr-concerns
        with:
          base-ref: HEAD^1
          paths-ignore: 'tools/_ci-concerns.sh'
      - name: Check again with fail off, expecting a pass
        uses: ./check-pr-concerns
        with:
          base-ref: HEAD^1
          fail: 'false'
      - name: Check again with no base, expecting a skip
        uses: ./check-pr-concerns
        with:
          base-ref: ''

  # check-format-output-files is brand new, so its reusable workflow's internal
  # `uses: Morrison-Lab/gha/check-format-output-files@v3` does not resolve until
  # the tag slides past the merge. Exercise the local composite directly.
  format-output-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Run check-format-output-files unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest check-format-output-files/tests/ -v
      - name: Stage a page with no revealjs entry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-format-output-files
          printf '%s\n' '---' 'title: T' 'format:' '  html: default' '---' > _ci-format-output-files/page.qmd
          git add -f _ci-format-output-files/page.qmd
      - name: Check the staged page, expecting a failure
        id: format-output-files-expected-failure
        continue-on-error: true
        uses: ./check-format-output-files
        with:
          formats: revealjs
          globs: '_ci-format-output-files/*.qmd'
      - name: Assert the failing call actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.format-output-files-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected check-format-output-files to fail on a page with no revealjs entry, got outcome='$OUTCOME'"
            exit 1
          fi
      - name: Check again with fail off, expecting a pass
        uses: ./check-format-output-files
        with:
          formats: revealjs
          globs: '_ci-format-output-files/*.qmd'
          fail: 'false'
      - name: Check again with the page exempted through paths-ignore
        uses: ./check-format-output-files
        with:
          formats: revealjs
          globs: '_ci-format-output-files/*.qmd'
          paths-ignore: '_ci-format-output-files/**'
      - name: Remove the staged page
        if: always()
        shell: bash
        run: |
          git rm -q -r --cached --ignore-unmatch _ci-format-output-files || true
          rm -rf _ci-format-output-files

  # check-python-qmd-chunks is brand new, so its reusable workflow's internal
  # `uses: Morrison-Lab/gha/check-python-qmd-chunks@v3` does not resolve until
  # the tag slides past the merge. Exercise the local composite directly.
  python-qmd-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Run check-python-qmd-chunks unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet ruff==0.16.9
          python3 -m unittest discover -s check-python-qmd-chunks/tests -v
      - name: Stage a clean and a bad page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-qmd-chunks
          printf '%s\n' '```{python}' 'x = 1' 'x' '```' > _ci-qmd-chunks/clean.qmd
          printf '%s\n' '```{python}' 'x = 1' 'if x == None:' '    pass' '```' > _ci-qmd-chunks/bad.qmd
          git add -f _ci-qmd-chunks/clean.qmd _ci-qmd-chunks/bad.qmd
      - name: Check the clean page
        uses: ./check-python-qmd-chunks
        with:
          config: check-python-qmd-chunks/tests/ruff.toml
          whole-tree: 'true'
          globs: '_ci-qmd-chunks/clean.qmd'
      - name: Check the bad page, expecting a failure
        id: qmd-chunks-expected-failure
        continue-on-error: true
        uses: ./check-python-qmd-chunks
        with:
          config: check-python-qmd-chunks/tests/ruff.toml
          whole-tree: 'true'
          globs: '_ci-qmd-chunks/bad.qmd'
      - name: Assert the failing call actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.qmd-chunks-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected check-python-qmd-chunks to fail on a staged bad page, got outcome='$OUTCOME'"
            exit 1
          fi
      - name: Check the bad page with fail off
        uses: ./check-python-qmd-chunks
        with:
          config: check-python-qmd-chunks/tests/ruff.toml
          whole-tree: 'true'
          globs: '_ci-qmd-chunks/bad.qmd'
          fail: 'false'
      - name: Remove the staged pages
        if: always()
        shell: bash
        run: |
          git rm -q -r --cached --ignore-unmatch _ci-qmd-chunks || true
          rm -rf _ci-qmd-chunks
