# The content checks' selftest jobs, split out of _selftest.yml, which
# had passed GitHub's 500 KB workflow file limit, so no run of it started
# (gha#1863). Same triggers as _selftest.yml.
name: selftest-content-checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  duplicate-roxygen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run check-duplicate-roxygen unit tests
        shell: bash
        run: |
          python3 -m pip install --quiet pytest==9.1.1 pyyaml==6.0.3
          python3 -m pytest check-duplicate-roxygen/tests/ -v

      - name: Prepare runtime test fixtures for composite action
        shell: bash
        run: |
          mkdir -p fixture_roxygen_clean fixture_roxygen_dup
          cat << 'EOF' > fixture_roxygen_clean/clean.R
          # check-duplicate-roxygen: allow-duplicates
          #' First function
          #' @param x Vector of predictor values for model.
          f1 <- function(x) x
          #' Second function
          #' @param x Vector of predictor values for model.
          f2 <- function(x) x
          EOF

          cat << 'EOF' > fixture_roxygen_dup/dup.R
          #' First function
          #' @param x Vector of predictor values for model.
          f1 <- function(x) x
          #' Second function
          #' @param x Vector of predictor values for model.
          f2 <- function(x) x
          EOF

      - name: Exercise check-duplicate-roxygen on clean negative control
        uses: ./check-duplicate-roxygen
        with:
          path: fixture_roxygen_clean
          fail: 'true'

      - name: Verify positive control fixture fails closed
        shell: bash
        run: |
          if python3 check-duplicate-roxygen/check_duplicate_roxygen.py fixture_roxygen_dup --fail=true; then
            echo "Expected positive control duplicate fixture to exit 1, but got 0" >&2
            exit 1
          fi
          rm -rf fixture_roxygen_clean fixture_roxygen_dup

      - name: Check duplicate roxygen documentation
        uses: ./check-duplicate-roxygen
        with:
          python-version: '3.x'
          base-ref: ${{ github.event_name == 'pull_request' && 'HEAD^1' || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'HEAD~1') }}
          fail: 'true'

  math-definitions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run check-math-definitions unit tests
        shell: bash
        run: |
          python3 -m pip install --quiet pytest==9.1.1 pyyaml==6.0.3
          python3 -m pytest check-math-definitions/tests/ -v

      - name: Prepare runtime test fixtures for composite action
        shell: bash
        run: |
          mkdir -p fixture_math_clean fixture_math_divergent
          cat << 'EOF' > fixture_math_clean/defs.qmd
          ::: {#def-sample-mean}
          #### Sample Mean
          The sample mean is $\bar{X} = \frac{1}{n} \sum_{i=1}^n X_i$.
          :::
          EOF

          cat << 'EOF' > fixture_math_divergent/a.qmd
          ::: {#def-variance}
          #### Variance
          Direct definition: $\operatorname{Var}(X) = \mathbb{E}[(X - \mathbb{E}[X])^2]$.
          :::
          EOF

          cat << 'EOF' > fixture_math_divergent/b.qmd
          ::: {#def-variance}
          #### Variance
          Expanded definition via devn macro.
          :::
          EOF

      - name: Exercise check-math-definitions on clean control
        uses: ./check-math-definitions
        with:
          path: fixture_math_clean
          fail: 'true'
          output-json: math-clean-report.json

      # An exit 0 alone would also pass if the fixture path were silently
      # skipped, so pin that the one fixture div was actually scanned.
      - name: Verify clean control scanned the fixture div
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys
          report = json.load(open("math-clean-report.json", encoding="utf-8"))
          ids = [d["div_id"] for d in report["divs"]]
          if report["total_divs"] != 1 or ids != ["def-sample-mean"]:
              sys.exit(f"Expected exactly def-sample-mean scanned, got {report['total_divs']}: {ids}")
          if report["findings"]:
              sys.exit(f"Expected no findings on the clean control, got {report['findings']}")
          print("Clean control scanned 1 div with 0 findings.")
          PY
          rm -f math-clean-report.json

      - name: Verify positive control divergence fixture fails closed
        shell: bash
        run: |
          if python3 check-math-definitions/check_math_definitions.py --path fixture_math_divergent --fail=true; then
            echo "Expected positive control divergence fixture to exit 1, but got 0" >&2
            exit 1
          fi
          rm -rf fixture_math_clean fixture_math_divergent

      - name: Check math definitions
        uses: ./check-math-definitions
        with:
          python-version: '3.x'
          path: '.'
          fail: 'true'


  bundle-repo-actions-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run bundle-repo-actions contract tests
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml==6.0.3
          python3 .github/workflows/scripts/tests/run-bundle-repo-actions-tests.py
      - name: Exercise check-repo-hygiene composite action
        uses: ./check-repo-hygiene
        with:
          fail: 'false'

  # check-merge-drops is brand new, so its reusable workflow's internal
  # `uses: Morrison-Lab/gha/check-merge-drops@v3` step does not resolve until
  # the tag slides; exercise the local composite directly. The first step is
  # a real warn-only run over the merges this PR adds. The fixture steps then
  # commit a merge that keeps one side of a conflicted file on top of the
  # checkout, and assert the composite blocks on it with `fail: 'true'` and
  # passes once `paths-ignore` exempts the file -- which is what proves the
  # `action.yml` inputs reach the script, since the pytest suite calls the
  # script directly.
  merge-drops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check this PR's merges for dropped content
        uses: ./check-merge-drops
        with:
          base-ref: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before || '' }}
      - name: Commit a one-sided merge fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name selftest
          git config user.email selftest@example.invalid  # phi-allow
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          f=merge-drops-fixture.md
          git switch -qc fixture-main
          printf '# Fixture\n\nShared opening paragraph for the merge-drops fixture.\n' > "$f"
          git add "$f" && git commit -qm "fixture base"
          git switch -qc fixture-side
          # The dropped line carries a commit SHA so its text is not in this
          # file: the check searches the merge's whole tree for moved content,
          # and a literal here would count as the line having moved.
          printf '\nThe side branch adds paragraph %s, which the merge drops.\n' "$(git rev-parse HEAD)" >> "$f"
          git commit -qam "side paragraph"
          git switch -q fixture-main
          printf '\nThe main line adds this paragraph, which the merge keeps.\n' >> "$f"
          git commit -qam "main paragraph"
          git merge -q fixture-side || true
          git checkout --ours "$f"
          git add "$f" && git commit -qm "Merge keeping one side of the fixture"
      - name: Expect the one-sided merge to be reported
        id: blocked
        continue-on-error: true
        uses: ./check-merge-drops
        with:
          base-ref: ${{ steps.fixture.outputs.base }}
          fail: 'true'
      - name: Expect the fixture to pass once paths-ignore exempts it
        uses: ./check-merge-drops
        with:
          base-ref: ${{ steps.fixture.outputs.base }}
          paths-ignore: merge-drops-fixture.md
          fail: 'true'
      - name: Assert the one-sided merge failed the check
        shell: bash
        env:
          OUTCOME: ${{ steps.blocked.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error::check-merge-drops did not block the one-sided merge fixture (outcome: $OUTCOME)."
            exit 1
          fi
  # check-typed-output is brand new, so (like check-new-line-breaks above) its
  # reusable workflow's internal `uses: Morrison-Lab/gha/check-typed-output@v3`
  # does not resolve until the tag slides past the merge. Exercise the local
  # composite directly. The unit tests cover the detectors and both scopes
  # against throwaway git repos; the composite calls below prove action.yml
  # wires each input through to the script, which the unit tests (calling
  # the script directly) cannot see.
  typed-output:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Run check-typed-output unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest check-typed-output/tests/ -q
      # This repo's own pages carry no typed output, so a blocking whole-tree
      # run must pass; the diff-scoped run covers what this PR adds.
      - name: Check this repo's tree, blocking
        uses: ./check-typed-output
        with:
          globs: '*.md *.qmd'
          fail: 'true'
      - name: Check this PR's added lines, blocking
        uses: ./check-typed-output
        with:
          globs: '*.md *.qmd'
          fail: 'true'
          diff-scoped: 'true'
          base-ref: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
      # A clean tree cannot reach the failing path, so stage a page with
      # typed output (whole-tree mode reads the index, so no commit is
      # needed) and assert the blocking call really fails.
      - name: Stage a page with typed output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-typed-output
          printf '%s\n' '```python' 'print(1)  # -> 1' '```' > _ci-typed-output/page.qmd
          git add -f _ci-typed-output/page.qmd
      - name: Check again, expecting a failure
        id: typed-output-expected-failure
        continue-on-error: true
        uses: ./check-typed-output
        with:
          fail: 'true'
      - name: Assert the failing call actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.typed-output-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected check-typed-output to fail on a staged page with typed output, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "check-typed-output failed on the staged page, as expected."
      # Diff-scoped against HEAD, the staged page is an uncommitted change,
      # so the working-tree-aware scope examines it and the call must fail.
      # Were base-ref dropped, a diff-scoped run with no base would skip and
      # pass, so this failure proves base-ref arrived.
      - name: Check again diff-scoped against HEAD, expecting a failure
        id: typed-output-diff-expected-failure
        continue-on-error: true
        uses: ./check-typed-output
        with:
          fail: 'true'
          diff-scoped: 'true'
          base-ref: HEAD
      - name: Assert the diff-scoped call failed
        shell: bash
        env:
          OUTCOME: ${{ steps.typed-output-diff-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected the diff-scoped call to fail on the staged page, got outcome='$OUTCOME'"
            exit 1
          fi
      # Diff-scoped with no base skips (warning, exit 0). Were diff-scoped
      # dropped, the whole-tree scan would fail on the staged page.
      - name: Check again diff-scoped with no base, expecting a skip
        uses: ./check-typed-output
        with:
          fail: 'true'
          diff-scoped: 'true'
          base-ref: ''
      # Each of these must pass over the same staged page, so each proves its
      # input reached the script: were it dropped, the call would fail as the
      # one above did.
      - name: Check again with the page exempted through paths-ignore
        uses: ./check-typed-output
        with:
          fail: 'true'
          paths-ignore: '_ci-typed-output'
      - name: Check again with the patterns replaced
        uses: ./check-typed-output
        with:
          fail: 'true'
          patterns: '#\s*returns'
      - name: Check again with globs excluding the page
        uses: ./check-typed-output
        with:
          fail: 'true'
          globs: '*.md'
      - name: Remove the staged page
        if: always()
        shell: bash
        run: |
          git rm -q -r --cached --ignore-unmatch _ci-typed-output || true
          rm -rf _ci-typed-output
  # check-informal-definitions is brand new, so its reusable workflow's
  # internal `uses: Morrison-Lab/gha/check-informal-definitions@v3`
  # does not resolve until the tag slides past the merge. Exercise the local
  # composite directly. The unit tests cover the detectors, block stack, and
  # both scopes; the composite calls below prove action.yml wires each input
  # through to the script, which the unit tests (calling the script directly)
  # cannot see.
  informal-definitions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Run check-informal-definitions unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest check-informal-definitions/tests/ -v
      - name: Prepare runtime test fixtures for composite action
        shell: bash
        run: |
          mkdir -p fixture_informal_clean
          cat << 'EOF' > fixture_informal_clean/defs.qmd
          ::: {#def-sample-mean}
          #### Sample Mean
          The sample mean is $\bar{X} = \frac{1}{n} \sum_{i=1}^n X_i$.
          :::
          EOF

      - name: Exercise check-informal-definitions on clean control
        uses: ./check-informal-definitions
        with:
          path: fixture_informal_clean
          fail: 'true'
          output-json: informal-clean-report.json

      - name: Verify clean control scanned the fixture with 0 findings
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys
          report = json.load(open("informal-clean-report.json", encoding="utf-8"))
          if report.get("total_findings", 0) != 0 or len(report.get("findings", [])) != 0:
              sys.exit(f"Expected 0 findings on clean control, got: {report}")
          print("Clean control passed with 0 findings.")
          PY
          rm -f informal-clean-report.json
          rm -rf fixture_informal_clean

      - name: Check this PR's added lines, blocking
        uses: ./check-informal-definitions
        with:
          globs: '*.qmd'
          fail: 'true'
          diff-scoped: 'true'
          base-ref: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
      # A clean tree cannot reach the failing path, so stage a page with an
      # informal definition in prose and assert the blocking call really fails.
      - name: Stage a page with an informal definition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-informal-defs
          printf '%s\n' 'A **stochastic process** is a collection of random variables.' > _ci-informal-defs/page.qmd
          git add -f _ci-informal-defs/page.qmd
      - name: Check again, expecting a failure
        id: informal-defs-expected-failure
        continue-on-error: true
        uses: ./check-informal-definitions
        with:
          fail: 'true'
      - name: Assert the failing call actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.informal-defs-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected check-informal-definitions to fail on a staged page with an informal definition, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "check-informal-definitions failed on the staged page, as expected."
      # Diff-scoped against HEAD, the staged page is an uncommitted change,
      # so the working-tree-aware scope examines it and the call must fail.
      # Were base-ref dropped, a diff-scoped run with no base would skip and
      # pass, so this failure proves base-ref arrived.
      - name: Check again diff-scoped against HEAD, expecting a failure
        id: informal-defs-diff-expected-failure
        continue-on-error: true
        uses: ./check-informal-definitions
        with:
          fail: 'true'
          diff-scoped: 'true'
          base-ref: HEAD
      - name: Assert the diff-scoped call failed
        shell: bash
        env:
          OUTCOME: ${{ steps.informal-defs-diff-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected the diff-scoped call to fail on the staged page, got outcome='$OUTCOME'"
            exit 1
          fi
      # Diff-scoped with no base skips (warning, exit 0). Were diff-scoped
      # dropped, the whole-tree scan would fail on the staged page.
      - name: Check again diff-scoped with no base, expecting a skip
        uses: ./check-informal-definitions
        with:
          fail: 'true'
          diff-scoped: 'true'
          base-ref: ''
      # Each of these must pass over the same staged page, so each proves its
      # input reached the script: were it dropped, the call would fail as the
      # one above did.
      - name: Check again with the page exempted through paths-ignore
        uses: ./check-informal-definitions
        with:
          fail: 'true'
          paths-ignore: '_ci-informal-defs'
      - name: Check again with globs excluding the page
        uses: ./check-informal-definitions
        with:
          fail: 'true'
          globs: 'website/*.qmd'
      - name: Remove the staged page
        if: always()
        shell: bash
        run: |
          git rm -q -r --cached --ignore-unmatch _ci-informal-defs || true
          rm -rf _ci-informal-defs
  # check-literal-math-letters is brand new, so its reusable workflow's
  # internal `uses: Morrison-Lab/gha/check-literal-math-letters@v3` does not
  # resolve until the tag slides past the merge. Exercise the local composite
  # directly. The unit tests cover the tokenizer, the parser and both scopes;
  # the composite calls below prove action.yml wires each input through to the
  # script, which the unit tests (calling the script directly) cannot see.
  literal-math-letters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Run check-literal-math-letters unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest check-literal-math-letters/tests/ -v
      - name: Check this PR's added lines
        uses: ./check-literal-math-letters
        with:
          base-ref: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
      # A clean tree has nothing to flag, so stage a page with a literal letter
      # in math and assert that the blocking call really fails.
      - name: Stage a page with a literal letter in math
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-literal-math
          printf '%s\n' 'Let $y_i$ be the outcome.' > _ci-literal-math/page.qmd
          git add -f _ci-literal-math/page.qmd
      # Warn-only is the default: the same page must not fail the job.
      - name: Check the staged page, warn-only by default
        uses: ./check-literal-math-letters
        with:
          whole-tree: 'true'
      - name: Check the staged page, expecting a failure
        id: literal-math-expected-failure
        continue-on-error: true
        uses: ./check-literal-math-letters
        with:
          fail: 'true'
          whole-tree: 'true'
      - name: Assert the failing call actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.literal-math-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected check-literal-math-letters to fail on a staged page with a literal letter, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "check-literal-math-letters failed on the staged page, as expected."
      # Diff-scoped against HEAD, the staged page is an uncommitted change, so
      # the working-tree-aware scope examines it and the call must fail. Were
      # base-ref dropped, the call would skip and pass, so this failure proves
      # base-ref arrived.
      - name: Check again diff-scoped against HEAD, expecting a failure
        id: literal-math-diff-expected-failure
        continue-on-error: true
        uses: ./check-literal-math-letters
        with:
          fail: 'true'
          base-ref: HEAD
      - name: Assert the diff-scoped call failed
        shell: bash
        env:
          OUTCOME: ${{ steps.literal-math-diff-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected the diff-scoped call to fail on the staged page, got outcome='$OUTCOME'"
            exit 1
          fi
      # With no base and no whole-tree, the call skips (warning, exit 0). Were
      # the skip a whole-tree fallback, it would fail on the staged page.
      - name: Check again with no base, expecting a skip
        uses: ./check-literal-math-letters
        with:
          fail: 'true'
          base-ref: ''
      # Each of these must pass over the same staged page, so each proves its
      # input reached the script: were it dropped, the call would fail as the
      # one above did.
      - name: Check again with the page exempted through paths-ignore
        uses: ./check-literal-math-letters
        with:
          fail: 'true'
          whole-tree: 'true'
          # check-ai-tells' positive control quotes a literal x in math on purpose.
          paths-ignore: '_ci-literal-math,check-ai-tells/tests/**'
      - name: Check again with globs excluding the page
        uses: ./check-literal-math-letters
        with:
          fail: 'true'
          whole-tree: 'true'
          globs: 'website/reference/*.qmd'
      # The staged page's only letters are y and i, so naming J alone leaves
      # nothing to flag; were `letters` dropped, the call would fail.
      - name: Check again with letters naming only J
        uses: ./check-literal-math-letters
        with:
          fail: 'true'
          whole-tree: 'true'
          globs: '_ci-literal-math/*.qmd'
          letters: 'J'
      - name: Remove the staged page
        if: always()
        shell: bash
        run: |
          git rm -q -r --cached --ignore-unmatch _ci-literal-math || true
          rm -rf _ci-literal-math
  # check-wikipedia-further-reading is brand new, so its reusable workflow's
  # internal `uses: Morrison-Lab/gha/check-wikipedia-further-reading@v3` does
  # not resolve until the tag slides past the merge. Exercise the local
  # composite directly. The unit tests cover the rules and both scopes; the
  # composite calls below prove action.yml wires each input through.
  wikipedia-further-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Run check-wikipedia-further-reading unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest check-wikipedia-further-reading/tests/ -v
      - name: Check this PR's added lines
        uses: ./check-wikipedia-further-reading
        with:
          base-ref: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
      # A clean tree has nothing to flag, so stage a page that lists Wikipedia
      # under Further reading and assert that the blocking call really fails.
      - name: Stage a page with Wikipedia in Further reading
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-wikipedia-reading
          printf '%s\n' '## Further reading' '' '- @wikipedia_slope --- slopes' > _ci-wikipedia-reading/page.qmd
          git add -f _ci-wikipedia-reading/page.qmd
      - name: Check the staged page, expecting a failure
        id: wikipedia-reading-expected-failure
        continue-on-error: true
        uses: ./check-wikipedia-further-reading
        with:
          whole-tree: 'true'
      - name: Assert the failing call actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.wikipedia-reading-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected check-wikipedia-further-reading to fail on a staged page, got outcome='$OUTCOME'"
            exit 1
          fi
      # fail: false must downgrade the same finding to a warning.
      - name: Check the staged page with fail false
        uses: ./check-wikipedia-further-reading
        with:
          whole-tree: 'true'
          fail: 'false'
      - name: Check again diff-scoped against HEAD, expecting a failure
        id: wikipedia-reading-diff-expected-failure
        continue-on-error: true
        uses: ./check-wikipedia-further-reading
        with:
          base-ref: HEAD
      - name: Assert the diff-scoped call failed
        shell: bash
        env:
          OUTCOME: ${{ steps.wikipedia-reading-diff-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected the diff-scoped call to fail on the staged page, got outcome='$OUTCOME'"
            exit 1
          fi
      - name: Check again with no base, expecting a skip
        uses: ./check-wikipedia-further-reading
        with:
          base-ref: ''
      # Each of these must pass over the same staged page, so each proves its
      # input reached the script.
      - name: Check again with the page exempted through paths-ignore
        uses: ./check-wikipedia-further-reading
        with:
          whole-tree: 'true'
          # The unit tests carry Wikipedia bullets as fixtures.
          paths-ignore: '_ci-wikipedia-reading'
      - name: Check again with globs excluding the page
        uses: ./check-wikipedia-further-reading
        with:
          whole-tree: 'true'
          globs: 'website/reference/*.qmd'
      - name: Remove the staged page
        if: always()
        shell: bash
        run: |
          git rm -q -r --cached --ignore-unmatch _ci-wikipedia-reading || true
          rm -rf _ci-wikipedia-reading
