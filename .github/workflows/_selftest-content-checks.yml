      - name: Run check-hybrid-sentences unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest check-hybrid-sentences/tests/ -v
      - name: Check this PR's added lines
        uses: ./check-hybrid-sentences
        with:
          base-ref: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
      # This repo has no hybrid sentences, so stage one and assert
      # that the check warns by default and blocks with fail on.
      - name: Stage a hybrid sentence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-hybrid-sentences
          printf '%s\n' 'The risk is zero if and only if $f = g$.' > _ci-hybrid-sentences/page.qmd
          git add -f _ci-hybrid-sentences/page.qmd
      - name: Check the staged sentence with fail off, expecting a warning only
        shell: bash
        env:
          HS_WHOLE_TREE: 'true'
          HS_FAIL: 'false'
        run: |
          set -euo pipefail
          out=$(python3 check-hybrid-sentences/check-hybrid-sentences.py)
          echo "$out"
          grep -q '^::warning file=_ci-hybrid-sentences/page.qmd' <<<"$out" \
            || { echo "::error::expected a warning for the staged hybrid sentence"; exit 1; }
      - name: Check again with the default fail, expecting a failure
        id: hybrid-sentences-expected-failure
        continue-on-error: true
        uses: ./check-hybrid-sentences
        with:
          whole-tree: 'true'
      - name: Assert the failing call actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.hybrid-sentences-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected check-hybrid-sentences with fail on to fail on a hybrid sentence, got outcome='$OUTCOME'"
            exit 1
          fi
      - name: Check again with no base, expecting a skip
        shell: bash
        run: |
          set -euo pipefail
          out=$(python3 check-hybrid-sentences/check-hybrid-sentences.py)
          echo "$out"
          grep -q '^Skipping the hybrid-sentences' <<<"$out" \
            || { echo "::error::expected a skip with no base ref"; exit 1; }
          ! grep -q '^::warning file=' <<<"$out" \
            || { echo "::error::a skipped run must not scan the tree"; exit 1; }
      - name: Remove the staged sentence
        if: always()
        shell: bash
        run: |
          git rm -q -r --cached --ignore-unmatch _ci-hybrid-sentences || true
          rm -rf _ci-hybrid-sentences

