  # `uses: Morrison-Lab/gha/check-caller-permissions@v3` does not resolve until
  # the tag slides past the merge. Exercise the local composite directly. The
  # unit tests cover the comparison; the calls below prove action.yml wires
  # each input through and that a real callee is fetched at its pinned ref.
  caller-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Run check-caller-permissions unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1 pyyaml
          python3 -m pytest check-caller-permissions/tests/ -v
      - name: Stage callers with and without the cleanup grant
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci-ccp-bad _ci-ccp-good
          call='    uses: Morrison-Lab/gha/.github/workflows/cleanup-pr-previews.yml@v3'
          printf '%s\n' 'on: push' 'jobs:' '  cleanup:' '    permissions:' \
            '      contents: write' '      pull-requests: read' "$call" > _ci-ccp-bad/cleanup.yml
          printf '%s\n' 'on: push' 'jobs:' '  cleanup:' '    permissions:' \
            '      contents: write' '      pull-requests: read' '      actions: read' "$call" > _ci-ccp-good/cleanup.yml
      - name: Check the caller with the full grant
        uses: ./check-caller-permissions
        with:
          workflows-dir: _ci-ccp-good
      - name: Check the caller missing actions read, expecting a failure
        id: ccp-expected-failure
        continue-on-error: true
        uses: ./check-caller-permissions
        with:
          workflows-dir: _ci-ccp-bad
      - name: Assert the failing call actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.ccp-expected-failure.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected check-caller-permissions to fail on a caller missing a grant, got outcome='$OUTCOME'"
            exit 1
          fi
      - name: Check the same caller warn-only
        uses: ./check-caller-permissions
        with:
          workflows-dir: _ci-ccp-bad
          fail: 'false'
