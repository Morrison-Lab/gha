        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest check-result-titles/tests/ -v
      - name: Check this PR's added lines
        uses: ./check-result-titles
        with:
          base-ref: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
          paths-ignore: 'website/**'
