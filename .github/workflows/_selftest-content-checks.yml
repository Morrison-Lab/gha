            echo "::error::expected check-result-titles to fail on a staged page, got outcome='$OUTCOME'"
            exit 1
          fi
      # The statement rule alone must also fail the action.
      - name: Check only the page with a prose-only statement, expecting a failure
        id: result-statement-expected-failure
        continue-on-error: true
        uses: ./check-result-titles
        with:
          whole-tree: 'true'
          globs: '_ci-result-titles/statement/*.qmd'
      - name: Assert the statement call actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.result-statement-expected-failure.outcome }}
        run: |
          set -euo pipefail
