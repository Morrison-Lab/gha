# Build half of the PR-preview family for this repo's own documentation site
# (the Quarto project under website/). Renders the site read-only in the PR
# context and uploads it + PR metadata as the pr-preview-site artifact;
# website-preview-deploy.yml publishes it to gh-pages.
#
# IMPORTANT: keep this workflow's `name:` in sync with the `workflows:` list in
# website-preview-deploy.yml -- that is how the deploy half finds this run.
name: Website Preview Build

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]
    paths:
      - 'website/**'
      - '.github/workflows/website-preview.yml'

jobs:
  build:
    # timeout-minutes is defined in the reusable workflow
    uses: Morrison-Lab/gha/.github/workflows/preview.yml@v3

    # This site is pure markdown, not an R package, so turn off the R/renv
    # machinery the preview family defaults on for rme-style consumers.
    with:
      path: website
      use-renv: false
      install-package: false
      setup-chrome: false
      submodules: 'false'
      apt-packages: ''

  # Crawl the built site for MathJax render errors on the PR itself, so the
  # result is a check run on the PR head. website-check-equation-renders.yml
  # runs on `workflow_run`, which GitHub records against main's sha, so a bad
  # page in a PR's preview turned main's commit red; that workflow now only
  # warns.
  check-equations:
    needs: build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read  # needed to list this run's artifacts
    steps:
      - name: Check artifact exists
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=pr-preview-site" \
            --jq '.total_count')
          echo "found=$([ "$count" -gt 0 ] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.artifact.outputs.found == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download preview artifact
        if: steps.artifact.outputs.found == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-preview-site
          path: _preview_download/

      - name: Check equation renders
        if: steps.artifact.outputs.found == 'true' && hashFiles('_preview_download/site/**') != ''
        uses: ./check-equation-renders
        with:
          site-dir: _preview_download/site/
          fail: 'true'
