name: Check NEWS.md Changelog (reusable)

# Wraps UCD-SERG/changelog-check-action. That action's own skip-label check is
# hardcoded to the string "no changelog" (with a space) and is not
# configurable --- at least one consumer (UCD-SERG/serocalculator) documents
# and uses "no-changelog" (hyphen) instead, so the composite's own escape
# hatch never actually fires for that PR label. This job does its own label
# check via `if:`, against a configurable `no-changelog-label` input, and
# skips the composite entirely when it matches (gha#143). This does NOT
# suppress the composite's own hardcoded "no changelog" (space) recognition
# --- that's baked into UCD-SERG/changelog-check-action's own action.yml and
# can't be overridden from here, so a PR labeled literally "no changelog"
# still short-circuits the check even when no-changelog-label is set to ''
# below.
#
# Both the job-level `if` and the composite's own recognition read the
# labels frozen into the TRIGGERING EVENT's payload, which is stale for any
# label applied after that event (bump-dev-version labels its PR after
# opening it) and stays stale across run approvals and re-runs. The
# live-labels step inside the job is the authority for that case: it reads
# the labels as they are now and skips the check when either the input label
# or the composite's hardcoded spelling is present (gha#721).

on:
  workflow_call:
    inputs:
      changelog:
        description: Path to the changelog file to check.
        type: string
        default: 'NEWS.md'
      no-changelog-label:
        description: >-
          PR label that skips this workflow's own changelog check. Set to an
          empty string to disable this workflow's escape hatch (an empty
          string never matches a real label). Note: the wrapped
          UCD-SERG/changelog-check-action separately, unconditionally
          recognizes its own hardcoded "no changelog" (space) label --- that
          recognition isn't controlled by this input and can't be suppressed
          from here.
        type: string
        default: 'no-changelog'

jobs:
  Check-Changelog:
    name: Check Changelog Action
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Declared explicitly, as every sibling reusable workflow does. Without it
    # this job inherits whatever the caller granted, so a caller that needs
    # `contents: write` elsewhere would hand it to a check that only reads.
    # `contents: read` is sufficient and verified: the job checks out, diffs
    # locally, and the wrapped UCD-SERG/changelog-check-action does the same
    # (its `check.sh` is a `git diff` and makes no API calls), reading
    # everything else from the event payload.
    permissions:
      contents: read
      # For the live-label read below; the event payload's labels are stale
      # for any label applied after the triggering event.
      issues: read
    if: ${{ !contains(github.event.pull_request.labels.*.name, inputs.no-changelog-label) }}
    steps:
      - name: Check live labels for an exemption
        id: live-labels
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_LABEL: ${{ inputs.no-changelog-label }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The job-level `if` above reads the labels frozen into the
          # triggering event's payload. A label applied AFTER that event --
          # e.g. bump-dev-version labels its PR after opening it -- is
          # invisible there, and approving or re-running a gated run reuses
          # the same stale payload, so the exemption could never fire for
          # such a run. This step is the authority: it reads the labels as
          # they are NOW, matching both the configurable input label and the
          # spelling the wrapped action hardcodes ("no changelog").
          #
          # The API read is deliberately fail-loud: captured in a plain
          # assignment so `set -e` sees a failure, because an empty label
          # stream from a swallowed error would silently reproduce exactly
          # the stale-exemption defect this step exists to fix. Matching is
          # case-insensitive on both sides, mirroring the `contains()`
          # comparison the job-level `if` performs on the payload path.
          exempt=false
          if [ -n "$PR_NUMBER" ]; then
            labels=$(gh api --paginate               "repos/${{ github.repository }}/issues/$PR_NUMBER/labels"               --jq '.[].name')
            input_lc=$(printf '%s' "$INPUT_LABEL" | tr '[:upper:]' '[:lower:]')
            while IFS= read -r label; do
              [ -z "$label" ] && continue
              label_lc=$(printf '%s' "$label" | tr '[:upper:]' '[:lower:]')
              if { [ -n "$input_lc" ] && [ "$label_lc" = "$input_lc" ]; } ||
                 [ "$label_lc" = "no changelog" ]; then
                exempt=true
                break
              fi
            done <<< "$labels"
          fi
          echo "exempt=$exempt" >> "$GITHUB_OUTPUT"
          echo "live-label exemption: $exempt"

      - name: Checkout repository
        if: steps.live-labels.outputs.exempt != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for added news/changelog fragments
        if: steps.live-labels.outputs.exempt != 'true'
        id: check-fragments
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null || git diff --name-only HEAD~1)
          if echo "$CHANGED_FILES" | grep -E '^news\.d/|^changelog\.d/' | grep -q '\.md$'; then
            echo "fragment_found=true" >> "$GITHUB_OUTPUT"
            echo "Found added news/changelog fragment file in PR."
          else
            echo "fragment_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Changelog Action
        if: >-
          steps.live-labels.outputs.exempt != 'true' &&
          steps.check-fragments.outputs.fragment_found != 'true'
        uses: UCD-SERG/changelog-check-action@0189fc7eedec3ef3e9648c713908f6f2a6e99057 # v2 (major-only tag; no vX.Y.Z published)
        with:
          changelog: ${{ inputs.changelog }}
