name: Check Quarto Links (reusable)

on:
  workflow_call:
    inputs:
      globs:
        description: Space-separated git pathspecs of tracked source files to scan.
        type: string
        default: '*.qmd *.md *.Rmd'
      target-extensions:
        description: Comma- or space-separated extensions of link targets to verify.
        type: string
        default: '.qmd, .md, .Rmd, .ipynb'
      paths-ignore:
        description: Comma- or newline-separated globs of source files to skip.
        type: string
        default: ''
      fail:
        description: Fail the job when a link to a missing page is found (else warn only).
        type: boolean
        default: true

jobs:
  check-quarto-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links to missing pages
        uses: Morrison-Lab/gha/check-quarto-links@v3
        with:
          globs: ${{ inputs.globs }}
          target-extensions: ${{ inputs.target-extensions }}
          paths-ignore: ${{ inputs.paths-ignore }}
          fail: ${{ inputs.fail }}
