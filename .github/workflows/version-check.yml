name: Version check (reusable)

# Fail a PR whose DESCRIPTION Version: differs from the base branch's.
#
# Inverts the old convention (each repo's own version-check.yaml, derived from
# RMI-PACTA/actions' R-semver-check.yml, requiring a branch's version to
# EXCEED main's): now that bump-dev-version.yml owns the dev-version bump
# after every merge to main, a PR touching that line at all just guarantees a
# collision with the next PR that merges -- see the "Engineering away
# DESCRIPTION / NEWS.md merge conflicts" writeup this pair of workflows came
# from. Depends on nothing but base R's `package_version` (see
# scripts/description-version.R), so unlike the workflow it replaces this
# needs no `install.packages('desc')` step and no rocker/verse container.
#
# Two bypasses, both skip the whole check:
#   - the `no version increment` label -- preserved from the original
#     workflow, for a genuine release-cut PR that DOES bump the version by
#     hand (e.g. usethis::use_version() cutting an actual MAJOR.MINOR.PATCH).
#     Read LIVE from the API rather than from the triggering event's payload,
#     which freezes the labels as they were at that event: a label applied
#     afterwards is invisible there, and approving or re-running a gated run
#     reuses the same stale payload, so the only runnable run could never see
#     it (gha#722, the sibling of gha#721).
#   - the bump PR's own head branch (default matches bump-dev-version.yml's
#     `pr-branch` default) -- its entire job is to change this line, so
#     checking it against itself would always fail.

on:
  workflow_call:
    inputs:
      description-path:
        description: Path to the DESCRIPTION file to check.
        type: string
        default: DESCRIPTION
      no-version-increment-label:
        description: >-
          PR label that skips this check entirely (a genuine release-cut PR).
        type: string
        default: 'no version increment'
      bump-branch:
        description: >-
          Head branch name that skips this check entirely (the bump-dev-version
          automation's own PR).
        type: string
        default: automated/bump-dev-version

jobs:
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # `pull-requests: read` was already granted here and is now load-bearing:
      # it is what authorizes the live-label read below. GitHub authorizes a
      # label read on an issue object that is a pull request against the
      # pull-requests permission, not the issues one --- `issues: read` alone
      # returned 403 "Resource not accessible by integration" on check-news's
      # first consumer run (gha#724 / gha#725). `issues: read` is therefore
      # NOT added here: it is neither sufficient nor necessary, since this
      # workflow only ever runs against a pull request.
      pull-requests: read
      contents: read
    steps:
      - name: Check if this PR is exempt
        id: exempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          BUMP_BRANCH: ${{ inputs.bump-branch }}
          INPUT_LABEL: ${{ inputs.no-version-increment-label }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The label is read LIVE rather than from
          # github.event.pull_request.labels, which holds the labels frozen
          # into the triggering event's payload. A label applied AFTER that
          # event is invisible there, and approving or re-running a gated run
          # reuses the same stale payload -- so on a run that needs approval,
          # the only runnable run could never see the exemption (gha#722).
          #
          # The API read is deliberately fail-loud: captured in a plain
          # assignment so `set -e` sees a failure. An empty label stream from
          # a swallowed error reproduces exactly the never-exempt defect this
          # step exists to fix, and it would do so silently.
          #
          # Only the configured input label is matched, and no hardcoded
          # spelling alongside it. gha#721's sibling fix had to match a second
          # literal because the action it wraps recognizes that spelling
          # itself; nothing downstream of this step reads labels at all, so
          # honouring a literal here would defeat a caller's override of the
          # input.
          HAS_LABEL=false
          if [ -n "$PR_NUMBER" ] && [ -n "$INPUT_LABEL" ]; then
            labels=$(gh api --paginate \
              "repos/$REPO/issues/$PR_NUMBER/labels" --jq '.[].name')
            input_lc=$(printf '%s' "$INPUT_LABEL" | tr '[:upper:]' '[:lower:]')
            while IFS= read -r label; do
              [ -z "$label" ] && continue
              label_lc=$(printf '%s' "$label" | tr '[:upper:]' '[:lower:]')
              if [ "$label_lc" = "$input_lc" ]; then
                HAS_LABEL=true
                break
              fi
            done <<< "$labels"
          fi
          if [ "$HAS_LABEL" = "true" ]; then
            echo "::notice::Skipping: '$INPUT_LABEL' label present."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$HEAD_REF" = "$BUMP_BRANCH" ]; then
            echo "::notice::Skipping: this is the bump-dev-version automation's own PR."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out PR head
        if: steps.exempt.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            ${{ inputs.description-path }}
          path: working

      - name: Check out base branch
        if: steps.exempt.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            ${{ inputs.description-path }}
          path: compare

      - name: Set up R
        if: steps.exempt.outputs.skip != 'true'
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          use-public-rspm: true

      # Delegates to the check-dev-version composite (rather than invoking
      # Rscript on a hardcoded script path in this checkout) because the
      # actions/checkout steps above check out the CALLER's repo -- the
      # ordinary workflow_call behavior for github.repository -- not
      # Morrison-Lab/gha's own. check-dev-version.R only exists in gha's
      # tree, so a caller's own checkout never has it; the composite
      # resolves its script via github.action_path instead, which points
      # into wherever this action was fetched to, regardless of what's
      # checked out on disk.
      - name: Compare versions
        if: steps.exempt.outputs.skip != 'true'
        uses: Morrison-Lab/gha/.github/actions/check-dev-version@v2
        with:
          working-description: working/${{ inputs.description-path }}
          compare-description: compare/${{ inputs.description-path }}
