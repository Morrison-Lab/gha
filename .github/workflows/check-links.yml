name: Check Links (reusable)

on:
  workflow_call:
    inputs:
      lychee-config:
        description: Path (in the caller repo) to a lychee config; falls back to the bundled default.
        type: string
        default: ''
      lychee-args:
        description: Arguments/globs passed to lychee; if empty, a sensible default glob set is used.
        type: string
        default: ''
      fail:
        description: Fail the workflow run when broken links are found.
        type: boolean
        default: true
      fail-if-empty:
        description: Fail the workflow run when no links are found.
        type: boolean
        default: false
      create-issue-on-main:
        description: File an issue when links break on the main branch.
        type: boolean
        default: true
      skip-label:
        description: PR label that skips the link check.
        type: string
        default: 'links checked by hand'
      fail-on-any-5xx:
        description: >-
          Fail on every 5xx server error. By default a 5xx fails a PR only
          when the link is on a line the PR adds, and is otherwise a warning.
        type: boolean
        default: false

jobs:
  link-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 2 holds the merge ref's parents, so HEAD^1 resolves below.
          fetch-depth: 2

      - name: Check for manual override label
        id: check-label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SKIP_LABEL: ${{ inputs.skip-label }}
        run: |
          set -euo pipefail
          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          if printf '%s\n' "$LABELS" | grep -Fxq "$SKIP_LABEL"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Link check skipped - '$SKIP_LABEL' label present on PR"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check links
        id: lychee
        if: github.event_name != 'pull_request' || steps.check-label.outputs.skip != 'true'
        uses: Morrison-Lab/gha/check-links@v3
        with:
          lychee-config: ${{ inputs.lychee-config }}
          lychee-args: ${{ inputs.lychee-args }}
          fail: ${{ inputs.fail }}
          fail-if-empty: ${{ inputs.fail-if-empty }}
          # A 5xx fails a PR only on a line the PR adds (gha#1052). On
          # pull_request, HEAD is GitHub's merge ref and HEAD^1 the base tip it
          # was built on (gha#1007). Elsewhere no line is added, so every 5xx
          # is a warning.
          base-ref: ${{ inputs.fail-on-any-5xx && 'all' || (github.event_name == 'pull_request' && 'HEAD^1' || '') }}

      - name: Create issue on main branch if links are broken
        if: failure() && github.ref == 'refs/heads/main' && inputs.create-issue-on-main
        uses: Morrison-Lab/gha/.github/actions/open-failure-issue@v3
        with:
          title: "Broken links detected in main branch"
          labels: "bug,automated,copilot"
          body: |
            The link checker found broken links in the main branch.

            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please review the workflow logs above for details on which links are broken.

            This issue was automatically created by the link checker workflow.

            @copilot please fix the broken links found in the main branch.
