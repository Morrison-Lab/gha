name: Check Non-Standard Characters (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for the job. Use a self-hosted label only for a
          private repository; never for a public one, whose pull requests
          can run arbitrary code on it.
        type: string
        default: ubuntu-latest
      python-version:
        description: Python version to set up.
        type: string
        default: '3.x'
      extensions:
        description: Comma- or space-separated list of file extensions to check.
        type: string
        default: '.qmd, .R, .md'

jobs:
  check-chars:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for non-standard characters
        uses: Morrison-Lab/gha/check-non-standard-chars@v3
        with:
          python-version: ${{ inputs.python-version }}
          extensions: ${{ inputs.extensions }}
