name: Check format output files (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to set up.
        type: string
        default: '3.x'
      formats:
        description: >-
          Space-separated formats the publish renders with `--to`; every page
          must name an `output-file` for each.
        type: string
        default: 'revealjs pdf docx'
      globs:
        description: Space-separated git pathspecs of tracked files to check.
        type: string
        default: '*.qmd'
      paths-ignore:
        description: Comma/newline-separated glob patterns (relative paths) to skip.
        type: string
        default: ''
      fail:
        description: >-
          Fail the workflow on a finding. Defaults to true; false gives warning
          annotations only.
        type: boolean
        default: true

jobs:
  check-format-output-files:
    runs-on: ${{ (github.event.repository.private != false && vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check format output files
        uses: Morrison-Lab/gha/check-format-output-files@v3
        with:
          python-version: ${{ inputs.python-version }}
          formats: ${{ inputs.formats }}
          globs: ${{ inputs.globs }}
          paths-ignore: ${{ inputs.paths-ignore }}
          fail: ${{ inputs.fail }}
