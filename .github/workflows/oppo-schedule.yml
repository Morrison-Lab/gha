name: Opposition Research Schedule

# Scheduled automated opposition research for Morrison-Lab/gha.
# Mines community demand and feature requests across peer GitHub Actions suites
# and surfaces high-value opportunities as tracked issues.

on:
  schedule:
    - cron: '0 14 * * 1' # Weekly on Monday at 14:00 UTC
  workflow_dispatch:
    inputs:
      competitor:
        description: Competitor product, framework, or repo to research
        type: string
        default: 'r-lib/actions'
      dry-run:
        description: Run research and output to step summary without creating issues
        type: boolean
        default: false

jobs:
  oppo:
    # timeout-minutes is defined in the reusable workflow
    permissions:
      contents: read
      issues: write
    uses: Morrison-Lab/gha/.github/workflows/opposition-research.yml@v2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      competitor: ${{ inputs.competitor || 'r-lib/actions' }}
      dry-run: ${{ inputs.dry-run || false }}
      scope-guidance: >-
        Reusable GitHub Actions workflows and composite actions for R packages, Quarto books/sites, and scientific software repositories.
