name: Cursor Code Review (reusable)

# Queue a Cursor Bugbot review for a PR via the Bugbot API. Bugbot itself
# posts comments and the `Cursor Bugbot` check; this workflow's success means
# the review was queued. The API is Enterprise-scoped (admin:* key).
# Team/individual installs should enable Bugbot in the Cursor dashboard
# instead of calling this workflow.
#
# The caller stub (see examples/cursor-code-review.yml) holds the `on:`
# triggers.

on:
  workflow_call:
    inputs:
      pr-number:
        description: Pull request number to review (required for workflow_dispatch).
        type: string
        default: ''
      dry-run:
        description: >-
          Queue a Bugbot dry-run review (no SCM comments or checks). Still billed.
        type: boolean
        default: false
    secrets:
      CURSOR_API_KEY:
        required: false

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.sender.type != 'Bot'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: cursor-review-${{ inputs.pr-number || github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      dispatch_guard_blocked: ${{ steps.dispatch-guard.outputs.blocked == 'true' }}
    steps:
      - name: Resolve PR number
        id: resolve-pr
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr-number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR_NUM="${INPUT_PR_NUMBER:-$EVENT_PR_NUMBER}"
          if [ -z "$PR_NUM" ]; then
            echo "::error::No PR number available to review."
            exit 1
          fi
          if [[ ! "$PR_NUM" =~ ^[0-9]+$ ]]; then
            echo "::error::PR number must be digits only; got '$PR_NUM'."
            exit 1
          fi
          echo "pr-num=$PR_NUM" >> "$GITHUB_OUTPUT"

      - name: Guard dispatched reviews against fork / Dependabot PRs
        id: dispatch-guard
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr-num }}
        run: |
          set -euo pipefail
          if ! PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json isCrossRepository,author); then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::error::Could not resolve PR #$PR_NUMBER's cross-repository status; failing closed."
            exit 1
          fi
          IS_CROSS_REPO=$(jq -r '.isCrossRepository' <<< "$PR_JSON")
          AUTHOR_LOGIN=$(jq -r '.author.login' <<< "$PR_JSON")
          if [[ "$IS_CROSS_REPO" == "true" || "$AUTHOR_LOGIN" == "dependabot[bot]" ]]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Dispatched review of PR #$PR_NUMBER skipped -- fork or Dependabot PR."
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Queue Cursor Bugbot review
        if: success() && steps.dispatch-guard.outputs.blocked != 'true'
        uses: Morrison-Lab/gha/.github/actions/trigger-bugbot-review@v2
        with:
          pr-url: ${{ github.server_url }}/${{ github.repository }}/pull/${{ steps.resolve-pr.outputs.pr-num }}
          api-key: ${{ secrets.CURSOR_API_KEY }}
          dry-run: ${{ inputs.dry-run }}
