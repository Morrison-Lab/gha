name: Bump dev version (reusable)

# Bump an R package's DESCRIPTION dev-version counter (the 4th ".90NN"
# component) after every merge to main, and open a PR (optionally auto-merged)
# to carry it in. This exists so PRs never need to touch the Version: line
# themselves -- version-check.yml now fails a PR that does, since two PRs both
# required to bump the same line are guaranteed to collide. The caller stub
# (examples/bump-dev-version.yml) owns the `on: push: branches: [main]`
# trigger.
#
# Guards against re-triggering itself: this workflow's own commits carry a
# "[skip bump-dev-version]" marker, and the job is skipped when the triggering
# push's head commit carries it -- without this, the bump PR's own merge to
# main would be a push to main, which would bump again, forever. This
# assumes the bump PR is merged via squash (the default `auto-merge` input
# below does exactly that), so the marker survives into the merge commit's
# message; a repo that forces true merge commits for this PR would need its
# own equivalent guard.

on:
  workflow_call:
    inputs:
      description-path:
        description: Path to the DESCRIPTION file to bump.
        type: string
        default: DESCRIPTION
      base-branch:
        description: Base branch to open the bump PR against.
        type: string
        default: main
      pr-branch:
        description: Head branch for the automation PR.
        type: string
        default: automated/bump-dev-version
      auto-merge:
        description: >-
          Enable GitHub's native auto-merge (squash) on the bump PR. Safe to
          default on: the diff is always exactly one mechanical line and needs
          no review. Requires the repo to have Settings -> General -> "Allow
          auto-merge" enabled, and "Allow GitHub Actions to create and approve
          pull requests" for the PR-open step itself. In a repo with required
          status checks it also requires WORKFLOW_TOKEN: a GITHUB_TOKEN-authored
          PR does not trigger the pull_request runs those checks need, so
          without the token the required checks never report and auto-merge
          blocks forever (see the warning step below).
        type: boolean
        default: true
      dry-run:
        description: >-
          Run the version bump but skip opening (or auto-merging) a PR. Not
          yet exercised by this repo's own CI: this workflow's own internal
          `@v2` composite reference can't resolve until this capability's
          PR merges and the tag slides (see CLAUDE.md's bootstrapping-gap
          note), so _selftest.yml's dev-version job calls the bump-dev-version
          composite directly instead of this whole reusable workflow. Meant
          for a consumer repo (or this one, once @v2 moves) to smoke-test the
          bump logic without pushing a real branch/PR.
        type: boolean
        default: false
    secrets:
      WORKFLOW_TOKEN:
        required: false
    outputs:
      old-version:
        description: The DESCRIPTION version before the bump.
        value: ${{ jobs.bump.outputs.old-version }}
      new-version:
        description: The DESCRIPTION version after the bump.
        value: ${{ jobs.bump.outputs.new-version }}

concurrency:
  group: bump-dev-version-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bump:
    # Skip when the triggering push is this workflow's own prior bump landing
    # on main (see the header comment) -- head_commit is only present on a
    # `push` event, so a manually dispatched or dry-run call always proceeds.
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip bump-dev-version]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      old-version: ${{ steps.bump.outputs.old-version }}
      new-version: ${{ steps.bump.outputs.new-version }}
    steps:
      - name: Validate WORKFLOW_TOKEN before work
        # Runs first, before checkout or bump, so a misconfigured token fails
        # fast rather than after a force-push. Two independent checks:
        # (1) When WORKFLOW_TOKEN is set, probe pull-request *write* access.
        #     A GET on /pulls only needs read; on public repos GitHub grants
        #     read-only public access even when the token's Pull requests
        #     permission is unset, so GET does not catch the #524 failure mode.
        #     POST with a deliberately invalid head expects HTTP 422 (validation)
        #     when write works, and 403 / "Resource not accessible" when not.
        # (2) When auto-merge is on and the secret is unset, warn: a
        #     GITHUB_TOKEN-authored PR does not trigger `pull_request` workflow
        #     runs -- GitHub suppresses them to prevent recursion -- so in a
        #     repo with required status checks those contexts never report, and
        #     native auto-merge blocks forever (#409). That combination warns
        #     rather than fails because a repo without required checks
        #     auto-merges fine on GITHUB_TOKEN.
        if: ${{ !inputs.dry-run }}
        shell: bash
        env:
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
          BASE_BRANCH: ${{ inputs.base-branch }}
        run: |
          if [ -n "$WORKFLOW_TOKEN" ]; then
            export GH_TOKEN="$WORKFLOW_TOKEN"
            probe_err="$(mktemp)"
            probe_out="$(mktemp)"
            set +e
            gh api "repos/$GITHUB_REPOSITORY/pulls" -X POST \
              -f title="bump-dev-version WORKFLOW_TOKEN probe (discard)" \
              -f head="__gha_bump_dev_version_token_probe__" \
              -f base="$BASE_BRANCH" \
              >"$probe_out" 2>"$probe_err"
            probe_status=$?
            set -e
            probe_log="$(cat "$probe_err" "$probe_out")"
            if [ "$probe_status" -eq 0 ]; then
              probe_url="$(jq -r '.html_url // empty' "$probe_out")"
              rm -f "$probe_err" "$probe_out"
              if [ -n "$probe_url" ]; then
                gh pr close "$probe_url" --comment "Closed automatically: bump-dev-version WORKFLOW_TOKEN write probe."
              else
                echo "::warning title=bump-dev-version::WORKFLOW_TOKEN pull-request write probe succeeded but returned no PR URL; continuing."
              fi
              exit 0
            fi
            rm -f "$probe_err" "$probe_out"
            if printf '%s' "$probe_log" | grep -qiE 'Resource not accessible|403.*personal access token|403.*Forbidden'; then
              msg="WORKFLOW_TOKEN cannot create pull requests on $GITHUB_REPOSITORY. A fine-grained PAT needs 'Pull requests: Read and write' (read to find an existing bump PR, write to open one and enable auto-merge) in addition to 'Contents: write'. Grant it, or drop the secret to fall back to GITHUB_TOKEN."
              echo "::error title=bump-dev-version::$msg"
              {
                echo "> [!CAUTION]"
                echo "> $msg"
                echo ">"
                echo "> Probe output:"
                echo '```'
                printf '%s\n' "$probe_log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if printf '%s' "$probe_log" | grep -qiE '422|Validation Failed|not a commit|No commits between'; then
              exit 0
            fi
            msg="WORKFLOW_TOKEN pull-request write probe failed unexpectedly (exit $probe_status). This is not treated as a permission gap; see probe output below."
            echo "::error title=bump-dev-version::$msg"
            {
              echo "> [!CAUTION]"
              echo "> $msg"
              echo ">"
              echo "> Probe output:"
              echo '```'
              printf '%s\n' "$probe_log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$AUTO_MERGE" != "true" ]; then
            exit 0
          fi
          msg="auto-merge is enabled but WORKFLOW_TOKEN is not set. In a repo with required status checks, the bump PR is authored by the integrated GITHUB_TOKEN, whose pull_request runs GitHub suppresses -- so the required checks never report and native auto-merge blocks forever (the PR sits open on every merge). Required checks block manual merges too, so turning off auto-merge does not help. Set WORKFLOW_TOKEN (a PAT or App token) so the PR is authored by a real user whose checks run and report."
          echo "::warning title=bump-dev-version::$msg"
          {
            echo "> [!WARNING]"
            echo "> $msg"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Persist a push-capable token so open-sync-pr can push without
          # putting the token in the remote URL.
          token: ${{ secrets.WORKFLOW_TOKEN || github.token }}

      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          use-public-rspm: true

      - name: Bump the dev version
        id: bump
        uses: Morrison-Lab/gha/.github/actions/bump-dev-version@v2
        with:
          description-path: ${{ inputs.description-path }}

      - name: Open PR if the version moved
        id: sync
        if: ${{ !inputs.dry-run }}
        uses: Morrison-Lab/gha/open-sync-pr@v2
        with:
          branch: ${{ inputs.pr-branch }}
          base: ${{ inputs.base-branch }}
          paths: ${{ inputs.description-path }}
          commit-message: >-
            chore: bump dev version to ${{ steps.bump.outputs.new-version }}
            [skip bump-dev-version]
          pr-body: |
            Automated dev-version bump.

            - From: `${{ steps.bump.outputs.old-version }}`
            - To: `${{ steps.bump.outputs.new-version }}`

            Nothing to review here -- this PR only changes the `Version:`
            line. Generated by the `bump-dev-version` reusable workflow in
            [`Morrison-Lab/gha`](https://github.com/Morrison-Lab/gha).
          token: ${{ secrets.WORKFLOW_TOKEN || github.token }}

      - name: Enable auto-merge
        if: ${{ !inputs.dry-run && inputs.auto-merge && steps.sync.outputs.changed == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || github.token }}
          PR_URL: ${{ steps.sync.outputs.pr-url }}
        run: gh pr merge --squash --auto "$PR_URL"
