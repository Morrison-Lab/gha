# Move the active major-version tag (e.g. v1) to main's tip on demand,
# the way r-lib/actions maintains its sliding v2/v3 tags -- except here the
# slide is a deliberate manual step, not an automatic reaction to every push.
# Consumers pin to `@v1`, so advancing the tag is what rolls a change out to
# everyone at once. That's why this only runs on `workflow_dispatch`: merge
# the change to main, optionally point a canary consumer at `@main` (or a
# feature branch/SHA) to try it first, then dispatch this workflow once
# you're confident. The major version is derived from the latest semver tag
# (vX.Y.Z), so cutting a v2.0.0 release makes this start sliding v2 instead.
name: Slide major-version tag

on:
  workflow_dispatch:

# Never let two slides race; the most recent dispatch wins.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  slide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # workflow_dispatch can be launched from any ref; only ever slide for main.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history + all tags

      - name: Move major tag to this commit
        run: |
          source .github/workflows/scripts/resolve-major-tag.sh
          resolve_major_tag
          if [ -z "$LATEST" ]; then
            echo "::notice::No vX.Y.Z tag found; nothing to slide."
            exit 0
          fi
          echo "Sliding $MAJOR to $GITHUB_SHA (latest release: $LATEST)"

          if [ "$(git rev-parse --verify --quiet "refs/tags/$MAJOR^{commit}")" = "$GITHUB_SHA" ]; then
            echo "::notice::$MAJOR already points at $GITHUB_SHA; nothing to do."
            exit 0
          fi

          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push --force origin "refs/tags/$MAJOR"
