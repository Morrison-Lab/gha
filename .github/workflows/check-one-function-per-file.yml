name: Check One Function Per File (reusable)

on:
  workflow_call:
    inputs:
      path:
        description: Target directory or file path to scan.
        type: string
        default: '.'
      paths-ignore:
        description: Comma- or newline-separated list of paths or glob patterns to ignore.
        type: string
        default: '.git, .github, tests, test, vendor, scratch, _site, node_modules, .pytest_cache, .venv, venv'
      extensions:
        description: Comma- or space-separated list of file extensions to check.
        type: string
        default: '.R, .r, .py, .sh, .bash, .js, .ts, .mjs, .cjs, .jl'
      opt-out-comment:
        description: Optional custom comment string to treat as an opt-out directive.
        type: string
        default: ''
      base-ref:
        description: Git ref to diff against for diff-scoped checking (e.g. origin/main). If empty, checks whole tree.
        type: string
        default: ''
      fail:
        description: Whether to fail the workflow if multiple function definitions are detected in a file.
        type: boolean
        default: true
      python-version:
        description: Python version to set up.
        type: string
        default: '3.x'

jobs:
  check-one-function-per-file:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so PR runs can diff added/modified files against the base.
          fetch-depth: 0

      - name: Check one function per file
        uses: Morrison-Lab/gha/check-one-function-per-file@v2
        with:
          path: ${{ inputs.path }}
          # On PRs, scan only files added/modified relative to the base; otherwise (push)
          # the action scans the whole tracked tree unless an explicit base-ref input is given.
          base-ref: ${{ inputs.base-ref || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || '') }}
          paths-ignore: ${{ inputs.paths-ignore }}
          extensions: ${{ inputs.extensions }}
          opt-out-comment: ${{ inputs.opt-out-comment }}
          fail: ${{ inputs.fail }}
          python-version: ${{ inputs.python-version }}
