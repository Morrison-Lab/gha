name: Spellcheck (reusable)

on:
  workflow_call:
    inputs:
      path:
        description: Path to the package root, relative to the repository.
        type: string
        default: '.'
      exclude:
        description: >-
          Comma-separated files or folders to exclude from the spellcheck.
          Accepts globs. Excluded files are temporarily staged out of the package
          tree during check and restored automatically on exit.
        type: string
        default: ''
      fail:
        description: Fail the workflow when spelling errors are found ('true' or 'false').
        type: string
        default: 'true'
      additional-options:
        description: >-
          Additional options passed to Rscript. Defaults to --vanilla; pass an
          empty string to let R read the site and user profiles instead.
        type: string
        default: '--vanilla'
      install-quarto:
        description: >-
          Whether setup-r-dependencies installs Quarto ('true', 'false',
          'auto'). Defaults to 'false' because {spelling} reads vignette
          sources and never renders them.
        type: string
        default: 'false'
      runs-on:
        description: Runner label for the job.
        type: string
        default: ubuntu-latest

jobs:
  spellcheck:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Spellcheck
        uses: Morrison-Lab/gha/spellcheck@v2
        with:
          path: ${{ inputs.path }}
          exclude: ${{ inputs.exclude }}
          fail: ${{ inputs.fail }}
          additional-options: ${{ inputs.additional-options }}
          install-quarto: ${{ inputs.install-quarto }}
