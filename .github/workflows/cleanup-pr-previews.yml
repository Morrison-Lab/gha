name: Clean up PR Previews (reusable)

# Housekeeping half of the PR-preview family: walk the gh-pages `pr-preview/`
# tree and delete subdirectories for PRs that are no longer open. The caller
# stub (see examples/cleanup-pr-previews.yml) owns the `schedule` /
# `workflow_dispatch` triggers.
#
# With `compact-history: true`, this also orphan-squashes the gh-pages branch to
# a single commit after pruning, so the branch never accumulates the deleted
# full-site/preview snapshots that otherwise bloat the repo unboundedly (see
# ucdavis/epi204#352: a course site reached 1360 gh-pages commits / ~5.8 GB).
# Compaction stays in the branch-based Pages world — it does not touch the
# Actions-artifact deploy path, so it is compatible with the preview family
# (#117).

on:
  workflow_call:
    inputs:
      preview-dir:
        description: Directory on gh-pages that holds the per-PR preview subdirectories.
        type: string
        default: 'pr-preview'
      compact-history:
        description: >
          When true, orphan-squash the gh-pages branch to a single commit after
          pruning, discarding all accumulated preview/publish history. Reclaims
          the space those deleted snapshots still occupy. Safe for branch-based
          Pages (what the preview family uses); the squashed branch serves
          normally. Default false (incremental commit, history preserved).
        type: boolean
        default: false
      publish-workflow:
        description: >-
          Workflow name or filename pattern for the base-branch publish/deploy
          workflow that must succeed before a merged PR preview is removed
          (e.g. 'quarto-publish.yml' or 'Quarto Publish*'). If empty (default),
          auto-detects workflows with 'publish' or 'deploy' in their name
          (excluding preview workflows). Set to 'none' or 'false' to disable
          waiting for publish workflows.
        type: string
        default: ''
      wait-for-publish:
        description: >-
          When true (default), wait until the base branch's publish/deploy workflow
          succeeds before removing preview directories for merged PRs. When false,
          merged PR previews are removed immediately regardless of publish status.
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Serialize gh-pages branch modifications with other publish/preview deploys.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - name: Check out gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          fetch-depth: 100

      - name: Prune stale previews and publish
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_DIR: ${{ inputs.preview-dir }}
          COMPACT: ${{ inputs.compact-history }}
          PUBLISH_WORKFLOW: ${{ inputs.publish-workflow }}
          WAIT_FOR_PUBLISH: ${{ inputs.wait-for-publish }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Remove preview dirs whose PR is no longer open, in the currently
          # checked-out gh-pages working tree. Sets the global REMOVED count.
          prune_stale() {
            REMOVED=0
            if [ ! -d "$PREVIEW_DIR" ]; then
              echo "No $PREVIEW_DIR directory found, nothing to prune."
              return 0
            fi
            local dir pr_number pr_json pr_state pr_merged_at merge_oid base_ref http_status
            for dir in "$PREVIEW_DIR"/pr-*/; do
              [ -d "$dir" ] || continue
              pr_number=$(basename "$dir" | sed 's/pr-//')
              echo "Checking PR #${pr_number}..."

              if pr_json=$(gh pr view "$pr_number" \
                --repo "$GITHUB_REPOSITORY" \
                --json state,mergedAt,mergeCommit,baseRefName 2>/dev/null); then
                pr_state=$(jq -r '.state // empty' <<< "$pr_json")
                pr_merged_at=$(jq -r '.mergedAt // empty' <<< "$pr_json")
                merge_oid=$(jq -r '.mergeCommit.oid // empty' <<< "$pr_json")
                base_ref=$(jq -r '.baseRefName // empty' <<< "$pr_json")
              else
                # The query failed. Distinguish "PR does not exist" (safe to
                # delete the preview) from a transient error (skip, to avoid
                # deleting a live preview). Key on the REST API's HTTP status
                # rather than gh's human-readable error text, which can change
                # across CLI versions.
                http_status=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" -i 2>/dev/null \
                  | head -n1 | awk '{print $2}') || true
                if [ "$http_status" = "404" ]; then
                  pr_state="NOT_FOUND"
                  pr_merged_at=""
                  merge_oid=""
                  base_ref=""
                else
                  echo "Warning: could not query PR #${pr_number} (HTTP ${http_status:-unknown}); skipping to avoid accidental deletion." >&2
                  continue
                fi
              fi

              if [ "$pr_state" = "OPEN" ]; then
                echo "PR #${pr_number} is still open - keeping preview"
                continue
              fi

              if [ "$pr_state" = "NOT_FOUND" ] || [ -z "$pr_merged_at" ] || [ "$pr_merged_at" = "null" ]; then
                echo "PR #${pr_number} is ${pr_state} (not merged) - removing preview at ${dir}"
                rm -rf "$dir"
                REMOVED=$((REMOVED + 1))
                continue
              fi

              if [ "$WAIT_FOR_PUBLISH" != "true" ] || [ "$PUBLISH_WORKFLOW" = "none" ] || [ "$PUBLISH_WORKFLOW" = "false" ]; then
                echo "PR #${pr_number} was merged (publish check disabled) - removing preview at ${dir}"
                rm -rf "$dir"
                REMOVED=$((REMOVED + 1))
                continue
              fi

              # PR was merged. Verify that the merged main publish workflow has succeeded and deployed.
              local check_base="${base_ref:-main}"
              local jq_filter='
                def is_preview:
                  ((.workflowName // "") | ascii_downcase | contains("preview")) or ((.name // "") | ascii_downcase | contains("preview"));

                def matches($target; $p):
                  ($target | ascii_downcase) as $t
                  | ($p | ascii_downcase) as $pat
                  | if $pat == "" then
                      ($t | contains("publish") or contains("deploy") or contains("pages-build-deployment"))
                    elif ($pat | endswith("*")) and ($pat | startswith("*")) then
                      ($t | contains($pat[1:-1]))
                    elif $pat | endswith("*") then
                      ($t | startswith($pat[:-1]))
                    elif $pat | startswith("*") then
                      ($t | endswith($pat[1:]))
                    else
                      ($t == $pat or ($t | contains($pat)))
                    end;
              '

              local runs_json="[]" commit_runs_match="" commit_runs_success="" commit_runs_pending="" deploy_commit_found=""
              if [ -n "$merge_oid" ]; then
                runs_json=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$merge_oid" \
                  --json headSha,conclusion,status,name,workflowName,event 2>/dev/null || echo "[]")
              fi

              commit_runs_match=$(jq -r --arg pat "$PUBLISH_WORKFLOW" "$jq_filter"'
                .[]
                | select(is_preview | not)
                | select(matches(.workflowName // ""; $pat) or matches(.name // ""; $pat))
                | (.workflowName // .name)
              ' <<< "$runs_json" | head -n1)

              commit_runs_success=$(jq -r --arg pat "$PUBLISH_WORKFLOW" "$jq_filter"'
                .[]
                | select(is_preview | not)
                | select(matches(.workflowName // ""; $pat) or matches(.name // ""; $pat))
                | select(.status == "completed" and .conclusion == "success")
                | (.workflowName // .name)
              ' <<< "$runs_json" | head -n1)

              if [ -n "$commit_runs_success" ]; then
                echo "PR #${pr_number} merged at ${merge_oid:0:7} (publish workflow '${commit_runs_success}' succeeded) - removing preview at ${dir}"
                rm -rf "$dir"
                REMOVED=$((REMOVED + 1))
                continue
              fi

              commit_runs_pending=$(jq -r --arg pat "$PUBLISH_WORKFLOW" "$jq_filter"'
                .[]
                | select(is_preview | not)
                | select(matches(.workflowName // ""; $pat) or matches(.name // ""; $pat))
                | select(.status != "completed")
                | "\(.workflowName // .name): \(.status)"
              ' <<< "$runs_json" | head -n1)

              if [ -n "$commit_runs_pending" ]; then
                echo "PR #${pr_number} merged at ${merge_oid:0:7} (publish workflow ${commit_runs_pending}) - keeping preview"
                continue
              fi

              # Check if a deploy commit for merge_oid exists in gh-pages git history
              if [ -n "$merge_oid" ]; then
                deploy_commit_found=$(git log -100 --format="%s" HEAD 2>/dev/null \
                  | grep -E -i "deploy.*${merge_oid:0:8}" | head -n1 || true)
                if [ -n "$deploy_commit_found" ]; then
                  echo "PR #${pr_number} merged at ${merge_oid:0:7} (deploy commit found in gh-pages history: '${deploy_commit_found}') - removing preview at ${dir}"
                  rm -rf "$dir"
                  REMOVED=$((REMOVED + 1))
                  continue
                fi
              fi

              # Check push runs on the base branch
              local base_runs_json base_runs_match subsequent_success
              base_runs_json=$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$check_base" --event push \
                -L 100 --json headSha,conclusion,status,name,workflowName,createdAt 2>/dev/null || echo "[]")

              base_runs_match=$(jq -r --arg pat "$PUBLISH_WORKFLOW" "$jq_filter"'
                .[]
                | select(is_preview | not)
                | select(matches(.workflowName // ""; $pat) or matches(.name // ""; $pat))
                | (.workflowName // .name)
              ' <<< "$base_runs_json" | head -n1)

              if [ -z "$base_runs_match" ] && [ -z "$commit_runs_match" ]; then
                echo "PR #${pr_number} merged at ${merge_oid:0:7} (no publish workflow detected on ${check_base}) - removing preview at ${dir}"
                rm -rf "$dir"
                REMOVED=$((REMOVED + 1))
                continue
              fi

              subsequent_success=""
              while IFS=$'\t' read -r sha status conclusion wf_name; do
                [ -n "$sha" ] || continue
                if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
                  if [ "$sha" = "$merge_oid" ]; then
                    subsequent_success="$wf_name on merge commit"
                    break
                  elif [ -n "$merge_oid" ]; then
                    # Query GitHub compare API to verify sha contains merge_oid without requiring local git objects
                    local cmp_status
                    cmp_status=$(gh api "repos/$GITHUB_REPOSITORY/compare/${merge_oid}...${sha}" \
                      --jq '.status' 2>/dev/null || echo "")
                    if [ "$cmp_status" = "ahead" ] || [ "$cmp_status" = "identical" ]; then
                      subsequent_success="$wf_name at ${sha:0:7}"
                      break
                    fi
                  fi
                fi
              done < <(jq -r --arg pat "$PUBLISH_WORKFLOW" "$jq_filter"'
                .[]
                | select(is_preview | not)
                | select(matches(.workflowName // ""; $pat) or matches(.name // ""; $pat))
                | [.headSha // "", .status // "", .conclusion // "", .workflowName // .name // ""]
                | @tsv
              ' <<< "$base_runs_json")

              if [ -n "$subsequent_success" ]; then
                echo "PR #${pr_number} merged at ${merge_oid:0:7} (publish workflow ${subsequent_success} succeeded) - removing preview at ${dir}"
                rm -rf "$dir"
                REMOVED=$((REMOVED + 1))
                continue
              fi

              echo "PR #${pr_number} merged at ${merge_oid:0:7} (publish workflow on ${check_base} has not succeeded yet) - keeping preview"
            done
          }

          if [ "$COMPACT" != "true" ]; then
            # Default path: prune, then push an incremental commit (history kept).
            prune_stale
            echo "Removed ${REMOVED} stale PR preview(s)."
            echo "removed=${REMOVED}" >> "$GITHUB_OUTPUT"
            if [ "$REMOVED" != "0" ]; then
              git add -A
              git commit -m "chore: remove stale PR previews [skip ci]"
              git push
            fi
            exit 0
          fi

          # Compaction path: prune, then orphan-squash gh-pages to a single
          # commit and force-push. The published tree is a pure function of the
          # current gh-pages tip minus closed-PR previews, so each attempt
          # re-derives it from a fresh fetch (the checkout is shallow, so we
          # always squash the tip rather than counting history).
          #
          # The push uses --force-with-lease pinned to the SHA we fetched, i.e.
          # a server-side compare-and-swap: it succeeds only if gh-pages still
          # points where we based the squash. A preview that lands between our
          # fetch and our push moves gh-pages, so the lease is REJECTED rather
          # than silently overwriting that preview — and the loop retries.
          removed=0
          for attempt in $(seq 1 5); do
            git fetch --quiet origin gh-pages
            expected=$(git rev-parse FETCH_HEAD)
            git checkout --quiet --force -B work "$expected"
            prune_stale
            removed="$REMOVED"

            git checkout --quiet --orphan compacted
            git add -A
            git commit --quiet \
              -m "chore: compact gh-pages history (pruned ${removed} stale preview(s)) [skip ci]"

            # Skip a redundant rewrite: if nothing was pruned and the squashed
            # tree already matches an existing compaction commit, there is no
            # history left to collapse — avoid a no-op force-push (and the Pages
            # rebuild it would trigger) every scheduled run.
            if [ "$removed" = "0" ] \
              && [ "$(git rev-parse 'compacted^{tree}')" = "$(git rev-parse "${expected}^{tree}")" ] \
              && git log -1 --format=%s "$expected" | grep -q '^chore: compact gh-pages history'; then
              echo "gh-pages is already compact and unchanged; skipping no-op force-push."
              echo "removed=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if git push --force-with-lease=gh-pages:"$expected" origin compacted:gh-pages; then
              echo "Compacted gh-pages to a single commit on attempt ${attempt} (pruned ${removed} stale preview(s))."
              echo "removed=${removed}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push rejected (gh-pages moved under us); re-fetching and retrying (attempt ${attempt}/5)..."
            git checkout --quiet --force work
            git branch --quiet -D compacted
          done

          echo "::warning::Could not compact gh-pages after 5 attempts (concurrent pushes kept winning). Previews still work; the next scheduled run will retry."
          echo "removed=${removed}" >> "$GITHUB_OUTPUT"
