name: Test coverage (reusable)

on:
  workflow_call:
    inputs:
      path:
        description: >-
          Path to the R package root (the directory holding DESCRIPTION).
          Defaults to the repository root.
        type: string
        default: '.'
      install-quarto:
        description: Install Quarto when setting up R dependencies.
        type: boolean
        default: false
      extra-packages:
        description: >-
          Extra R packages to install for the coverage run (covr and xml2 are
          always installed).
        type: string
        default: ''
      fail-ci-if-error:
        description: >-
          Whether a Codecov upload error fails the job. 'auto' (the default)
          applies the r-lib heuristic -- fail on non-PR events, and on pull
          requests only when a token is set; pass 'true' or 'false' to force it.
        type: string
        default: 'auto'
      upload-test-results:
        description: >-
          Also generate a JUnit test-results report and upload it to Codecov
          Test Analytics (failed/flaky-test reporting), separate from the
          Cobertura line-coverage upload. On by default.
        type: boolean
        default: true
      examples-coverage:
        description: >-
          Run a second job that measures coverage from examples and vignettes
          via covr::package_coverage(type = c("examples", "vignettes"),
          commentDonttest = FALSE, commentDontrun = FALSE), so \dontrun{}
          blocks execute (they do not run under R CMD check by default,
          only with --run-dontrun, which --as-cran does not imply) and
          \donttest{} blocks execute even when a check without --as-cran
          would skip them. Off by default -- those paths can need extra
          suggested packages or Quarto, and turning this on without that
          setup would fail a job that currently passes (gha#334).
        type: boolean
        default: false
      min-coverage:
        description: >-
          Minimum percent coverage required to pass the tests job, from
          covr::percent_coverage(). Empty (the default) disables the
          threshold. Does not apply to the examples/vignettes job -- that
          job is a different measurement (example/vignette execution, not
          unit-test coverage), and sharing one bar would make the two
          inputs non-independent (gha#334).
        type: string
        default: ''
      cluster-check:
        description: >-
          Measure coverage on a WWU CS cluster node through `condor-batch`
          instead of on the runner (gha#1640). Default off. Needs a lab runner
          with the cluster ssh key (`cluster-runs-on`, or `vars.CI_RUNNER`) and
          `cluster-image`. Dependencies are installed into a library inside the
          job with `remotes::install_deps`, because the home quota is too small
          to restore them. The job writes the Cobertura report and the percent
          to the `cluster-coverage` artifact; it does not upload to Codecov.
          When true, the runner `test-coverage` job is skipped.
        type: boolean
        default: false
      cluster-runs-on:
        description: Runner label for the cluster job. Empty uses `vars.CI_RUNNER`.
        type: string
        default: ''
      cluster-head:
        description: Cluster head (or list of heads) for the cluster job.
        type: string
        default: cse-head.cluster.cs.wwu.edu
      cluster-image:
        description: Apptainer image on the cluster home that the cluster job runs in.
        type: string
        default: ''
      cluster-image-file:
        description: The same image on the runner, for heads without the cluster home.
        type: string
        default: ''
    secrets:
      CODECOV_TOKEN:
        description: >-
          Codecov upload token. Optional for public repos, but recommended --
          tokenless uploads are rate-limited and unreliable from pull requests.
        required: false

jobs:
  test-coverage:
    if: ${{ !inputs.cluster-check }}
    runs-on: ${{ (github.event.repository.private && vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test coverage
        uses: Morrison-Lab/gha/test-coverage@v3
        with:
          path: ${{ inputs.path }}
          install-quarto: ${{ inputs.install-quarto }}
          extra-packages: ${{ inputs.extra-packages }}
          token: ${{ secrets.CODECOV_TOKEN }}
          # 'auto' applies the r-lib heuristic (fail on non-PR runs; on PRs only
          # when a token is set, since tokenless PR uploads are flaky); an
          # explicit 'true'/'false' from the caller overrides it.
          fail-ci-if-error: ${{ inputs.fail-ci-if-error != 'auto' && inputs.fail-ci-if-error || (github.event_name != 'pull_request' || secrets.CODECOV_TOKEN != '') }}
          upload-test-results: ${{ inputs.upload-test-results }}
          min-coverage: ${{ inputs.min-coverage }}

  examples-coverage:
    if: ${{ inputs.examples-coverage }}
    name: Examples and vignettes coverage
    runs-on: ${{ (github.event.repository.private && vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Examples and vignettes coverage
        uses: Morrison-Lab/gha/test-coverage@v3
        with:
          path: ${{ inputs.path }}
          install-quarto: ${{ inputs.install-quarto }}
          extra-packages: ${{ inputs.extra-packages }}
          # Examples/vignettes coverage is a different measurement from the
          # unit-test report; skip Codecov and JUnit so they are not mixed in.
          upload-coverage: 'false'
          upload-test-results: 'false'
          failure-artifact-name: 'examples-coverage-test-failures'
          coverage-type: 'examples,vignettes'
          comment-donttest: 'false'
          comment-dontrun: 'false'

  test-coverage-cluster:
    name: Coverage on the cluster (${{ inputs.cluster-head }})
    if: ${{ inputs.cluster-check }}
    runs-on: ${{ inputs.cluster-runs-on || (github.event.repository.private && vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two steps, one per line: install the dependencies into a library under
      # the checkout, then measure coverage with it first on the library path.
      - name: Measure coverage on the cluster
        uses: Morrison-Lab/gha/.github/actions/condor-batch@v3
        with:
          head: ${{ inputs.cluster-head }}
          image: ${{ inputs.cluster-image }}
          image-file: ${{ inputs.cluster-image-file }}
          output: coverage
          steps: |
            mkdir -p .gha-rlib coverage && R_LIBS="$PWD/.gha-rlib" Rscript -e 'remotes::install_deps("${{ inputs.path }}", dependencies = TRUE, upgrade = "never"); remotes::install_cran(c("covr", "xml2", "testthat"))'
            R_LIBS="$PWD/.gha-rlib" Rscript -e 'cov <- covr::package_coverage("${{ inputs.path }}"); covr::to_cobertura(cov, filename = "coverage/cobertura.xml"); writeLines(format(covr::percent_coverage(cov), digits = 4), "coverage/percent.txt")'

      - name: Report coverage and apply the threshold
        shell: bash
        env:
          MIN_COVERAGE: ${{ inputs.min-coverage }}
        run: |
          set -euo pipefail
          pct="$(cat coverage/percent.txt)"
          echo "Coverage on the cluster: ${pct}%" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$MIN_COVERAGE" ] && ! awk -v p="$pct" -v m="$MIN_COVERAGE" 'BEGIN { exit !(p + 0 >= m + 0) }'; then
            echo "::error::Coverage ${pct}% is below the required ${MIN_COVERAGE}%."
            exit 1
          fi

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-coverage
          path: coverage
          if-no-files-found: ignore
