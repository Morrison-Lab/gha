name: Check Bibliography DOIs (reusable)

on:
  workflow_call:
    inputs:
      install-quarto:
        description: Install Quarto when setting up R dependencies.
        type: boolean
        default: false
      no-metadata-check:
        description: Skip CrossRef metadata comparison.
        type: boolean
        default: false
      exclude-keys:
        description: Space/comma-separated BibTeX keys to skip.
        type: string
        default: ''

jobs:
  check-dois:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check bibliography DOIs
        uses: d-morrison/gha/check-bibliography-dois@v2
        with:
          install-quarto: ${{ inputs.install-quarto }}
          no-metadata-check: ${{ inputs.no-metadata-check }}
          exclude-keys: ${{ inputs.exclude-keys }}
