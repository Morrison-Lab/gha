name: Check Bibliography DOIs (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for the job. Use a self-hosted label only for a
          private repository; never for a public one, whose pull requests
          can run arbitrary code on it.
        type: string
        default: ubuntu-latest
      install-quarto:
        description: Install Quarto when setting up R dependencies.
        type: boolean
        default: false
      no-metadata-check:
        description: Skip CrossRef metadata comparison.
        type: boolean
        default: false
      exclude-keys:
        description: Space/comma-separated BibTeX keys to skip.
        type: string
        default: ''
      preinstalled-toolchain:
        description: >-
          The runner already provides R with pak and has no sudo, as a
          self-hosted runner does. Skips the R setup steps.
        type: boolean
        default: false

jobs:
  check-dois:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check bibliography DOIs
        uses: Morrison-Lab/gha/check-bibliography-dois@v3
        with:
          install-quarto: ${{ inputs.install-quarto }}
          no-metadata-check: ${{ inputs.no-metadata-check }}
          exclude-keys: ${{ inputs.exclude-keys }}
          preinstalled-toolchain: ${{ inputs.preinstalled-toolchain }}
