# Active caller for this repo's own reusable Gemini PR review workflow
# (dogfooding). Distinct filename from the reusable
# .github/workflows/gemini-code-review.yml it calls.
#
# Dispatched via workflow_dispatch on `@gemini review` mentions from gemini-bot.yml
# or manual execution.
name: Gemini Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: Morrison-Lab/gha/.github/workflows/gemini-code-review.yml@v2
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
    with:
      pr-number: ${{ inputs.pr_number }}
