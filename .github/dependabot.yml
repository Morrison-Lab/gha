# Keep SHA-pinned third-party actions current.
#
# Every third-party action in this repo is pinned to a full commit SHA (with the
# version in a trailing comment) for supply-chain hardening; see README ("Pinning
# third-party actions"). Dependabot bumps those pins as upstreams publish new
# releases, so the pins stay current instead of silently freezing.
#
# The `/` entry below scans `.github/workflows/`; the composite actions
# (top-level and internal `.github/actions/*` alike) live in their own
# folders, so each one with external `uses:` is listed explicitly. First-party
# `Morrison-Lab/gha/*` self-references and the `examples/` templates intentionally
# track their capability's major tag (see the Versioning section of README.md)
# rather than being SHA-pinned, so they need no Dependabot coverage.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/" # .github/workflows/
      - "/antigravity-review"
      - "/check-ai-tells"
      - "/check-bibliography-dois"
      - "/check-code-similarity"
      - "/check-duplicate-roxygen"
      - "/check-extra"
      - "/check-fform-paren"
      - "/check-write-idiom"
      - "/check-formatting"
      - "/check-informal-definitions"
      - "/check-literal-math-letters"
      - "/check-wikipedia-further-reading"
      - "/check-self-credits"
      - "/check-one-div-per-subfile"
      - "/check-pr-size"
      - "/check-pr-concerns"
      - "/check-def-commentary"
      - "/check-exm-figures"
      - "/check-axis-titles"
      - "/check-def-title-synonyms"
      - "/check-multipart-exercises"
      - "/check-note-sheet-rows"
      - "/check-definite-antecedents"
      - "/build-dependency-graph"
      - "/check-term-links"
      - "/check-local-macros"
      - "/check-links"
      - "/check-math-definitions"
      - "/check-merge-drops"
      - "/check-new-line-breaks"
      - "/check-non-standard-chars"
      - "/check-one-function-per-file"
      - "/check-phi"
      - "/check-python-package"
      - "/check-typed-output"
      - "/lint-changed-files"
      - "/lint-changed-lines"
      - "/lint-workflows"
      - "/lint-yaml"
      - "/preview"
      - "/quarto-publish"
      - "/spellcheck"
      - "/student-qmd"
      - "/test-coverage"
      - "/.github/actions/generate-altdoc-landing-page"
      - "/.github/actions/generate-altdoc-version-dropdown"
      - "/.github/actions/inject-canonical-urls"
      - "/.github/actions/pack-review-payload"
      - "/.github/actions/resolve-altdoc-base-url"
      - "/.github/actions/run-claude-review-attempt"
      - "/.github/actions/upload-review-execution"
    schedule:
      interval: "weekly"
    # Batch all action bumps into one PR per run to keep review noise low.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"

  # check-equation-renders pins its Playwright version in package.json rather
  # than a SHA (it's an npm dependency, not a `uses:` action), so it needs its
  # own npm ecosystem entry to stay current.
  - package-ecosystem: "npm"
    directory: "/check-equation-renders"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
