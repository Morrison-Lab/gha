# Keep SHA-pinned third-party actions current.
#
# Every third-party action in this repo is pinned to a full commit SHA (with the
# version in a trailing comment) for supply-chain hardening; see README ("Pinning
# third-party actions"). Dependabot bumps those pins as upstreams publish new
# releases, so the pins stay current instead of silently freezing --- with
# one exception, the `ignore` block below, which deliberately freezes
# `actions/ai-inference` at its last usable major (gha#834, gha#835).
#
# The `/` entry below scans `.github/workflows/`; the composite actions
# (top-level and internal `.github/actions/*` alike) live in their own
# folders, so each one with external `uses:` is listed explicitly. First-party
# `Morrison-Lab/gha/*` self-references and the `examples/` templates intentionally
# track their capability's major tag (see the Versioning section of README.md)
# rather than being SHA-pinned, so they need no Dependabot coverage.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/" # .github/workflows/
      - "/antigravity-review"
      - "/check-bibliography-dois"
      - "/check-formatting"
      - "/check-links"
      - "/check-non-standard-chars"
      - "/check-phi"
      - "/preview"
      - "/quarto-publish"
      - "/test-coverage"
      - "/.github/actions/generate-altdoc-version-dropdown"
      - "/.github/actions/generate-altdoc-landing-page"
      - "/.github/actions/resolve-altdoc-base-url"
      - "/.github/actions/run-claude-review-attempt"
      - "/.github/actions/upload-review-execution"
    schedule:
      interval: "weekly"
    # Batch all action bumps into one PR per run to keep review noise low.
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # actions/ai-inference v3 removed the `endpoint` input outright and
      # switched to a Copilot-CLI-only provider that the runner must install
      # and authenticate first. summary.yml passes `endpoint`, passes a
      # non-Copilot `model`, and installs no CLI, so the v3 bump in gha#828
      # broke it (gha#834). On a real run that failure would be silent --
      # the step is continue-on-error and the only handling is a warning --
      # so summary-tests was the sole detector, and it went red on main.
      #
      # This is a freeze, not a deferral. Upstream removed github-models
      # support entirely in v3 (its PR #236; the v3 README says the action
      # is Copilot-only), so v2 is the last major carrying the transport
      # summary.yml uses and will see no further work on it. Migrating is
      # an architecture change, tracked in gha#835, not a pin bump -- so
      # stop proposing majors. Minors and patches on v2 still flow, on a
      # branch upstream has stopped developing.
      - dependency-name: "actions/ai-inference"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "ci"
      include: "scope"

  # check-equation-renders pins its Playwright version in package.json rather
  # than a SHA (it's an npm dependency, not a `uses:` action), so it needs its
  # own npm ecosystem entry to stay current.
  - package-ecosystem: "npm"
    directory: "/check-equation-renders"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
