name: Check static figures
description: >-
  Diff-scoped check that flags an interactive figure (plotly, htmlwidgets,
  leaflet, rgl) evaluated only in HTML output when its file draws no static
  version, and any note that sends readers to the HTML version instead of
  showing the figure (Ezra, 2026-11-10: static formats still render 3D plots
  and other interactive figures, as noninteractive versions).
  `<!-- static-version: reason -->` exempts a file. Scoped to lines a diff
  adds (an added line whose exact text was also deleted in the same diff
  counts as moved). Warn-only by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only lines added since this ref are
      checked. On a pull request the reusable workflow passes `HEAD^1`, the
      base tip GitHub built the merge ref on.
      Diff mode needs the base commit in history (checkout with
      fetch-depth: 0); when the diff can't be computed (e.g. a shallow
      clone, or no base-ref given on a push run), the check is skipped with
      a warning rather than falling back to a whole-tree scan, which would
      reflag every interactive figure the corpus already carries.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked file the globs match, in full, instead of only the
      lines added since base-ref. Use it to measure a corpus; `base-ref` is
      ignored when this is 'true'.
    default: 'false'
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check. Git pathspecs
      match at any depth, so this is recursive by default.
    default: '*.qmd'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  fail:
    description: >-
      Fail the action on a finding (else warning
      annotations only). Defaults to 'false'.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check static figures
      shell: bash
      env:
        CSF_BASE_REF: ${{ inputs.base-ref }}
        CSF_WHOLE_TREE: ${{ inputs.whole-tree }}
        CSF_GLOBS: ${{ inputs.globs }}
        CSF_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        CSF_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-static-figures.py"
