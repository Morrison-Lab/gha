name: Check for typed code output
description: >-
  Flags typed ("faked") code output in Quarto sources: a comment inside a
  python/r/julia code fence or an executable {r}/{python} chunk that stands in
  for a printed value (`# ->`, `# =>`, `#>`, `# Output:`), and a hand-written
  output block (a fence with no language, or `text`/`output`) placed right
  after a code fence. Code whose output a page shows belongs in an executable
  chunk, so the page shows what the code actually prints. Scans the whole tree
  by default; `diff-scoped: 'true'` reports only lines a pull request adds, so
  a repository carrying legacy occurrences can adopt the check without every
  run reporting them. Warn-only by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  patterns:
    description: >-
      Newline-separated Python regular expressions, each searched for in every
      line of a python/r/julia code fence or executable chunk. Replaces the
      default set rather than extending it. Empty uses the defaults:
      `#\s*->`, `#\s*=>`, `#>`, and `#\s*(?i:output):`.
    default: ''
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check. Git pathspecs
      match at any depth, so this is recursive by default.
    default: '*.qmd'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  fail:
    description: >-
      Fail the action when typed output is found. Defaults to 'false', so
      findings are warning annotations only.
    default: 'false'
  diff-scoped:
    description: >-
      Report only findings on lines added since `base-ref` (for an output
      block, any added line of the block). When the diff cannot be computed
      (no base-ref, as on a push run, or a shallow clone missing the base
      commit), the check is skipped with a warning rather than falling back
      to a whole-tree scan. Needs full history (checkout with
      fetch-depth: 0).
    default: 'false'
  base-ref:
    description: >-
      Git ref/SHA to diff against when `diff-scoped` is 'true'; the diff is
      taken from its merge base with HEAD. The reusable workflow passes the
      PR base SHA automatically. Ignored otherwise.
    default: ''
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check for typed code output
      shell: bash
      env:
        TYPED_OUTPUT_PATTERNS: ${{ inputs.patterns }}
        TYPED_OUTPUT_GLOBS: ${{ inputs.globs }}
        TYPED_OUTPUT_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        TYPED_OUTPUT_FAIL: ${{ inputs.fail }}
        TYPED_OUTPUT_DIFF_SCOPED: ${{ inputs.diff-scoped }}
        TYPED_OUTPUT_BASE_REF: ${{ inputs.base-ref }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-typed-output.py"
