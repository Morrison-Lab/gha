name: Check term links at first use
description: >-
  Diff-scoped check that flags a defined technical term whose first use in a
  div (or in a paragraph outside a div) is plain text instead of a link to its
  definition, and a bold term that no definition div covers. Learns the terms
  from the corpus itself: the titles and bold terms of `::: {#def-...}` divs,
  and the text of any link whose target ends in `#def-...`. Skips code, math,
  comments, front matter, images and headings. Warn-only by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only findings on lines added since this ref
      are reported. On a pull request the reusable workflow passes `HEAD^1`,
      the base tip GitHub built the merge ref on. Needs the base commit in
      history (checkout with fetch-depth: 0); when the diff can't be computed,
      or no base-ref is given, the check is skipped with a warning rather than
      falling back to a whole-tree scan, which would reflag every first use the
      corpus already carries.
    default: ''
  whole-tree:
    description: >-
      Report every finding in every tracked file the globs match, instead of
      only those on lines added since base-ref. Use it to measure a corpus;
      `base-ref` is ignored when this is 'true'.
    default: 'false'
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check (recursive by
      default). Terms are learned from, and findings reported in, these files.
    default: '*.qmd'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  terms-file:
    description: >-
      Path to a file of extra technical terms, one per line (`#` starts a
      comment), for terms defined on a site this repository does not link yet.
    default: ''
  allow-file:
    description: >-
      Path to a file of terms to leave alone, one per line (`#` starts a
      comment), for a term that is ordinary English in this corpus.
    default: ''
  fail:
    description: >-
      Fail the action when a finding is reported (else non-blocking).
      Defaults to 'false' (warning annotations only).
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check term links at first use
      shell: bash
      env:
        TERM_LINKS_BASE_REF: ${{ inputs.base-ref }}
        TERM_LINKS_WHOLE_TREE: ${{ inputs.whole-tree }}
        TERM_LINKS_GLOBS: ${{ inputs.globs }}
        TERM_LINKS_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        TERM_LINKS_TERMS_FILE: ${{ inputs.terms-file }}
        TERM_LINKS_ALLOW_FILE: ${{ inputs.allow-file }}
        TERM_LINKS_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-term-links.py"
