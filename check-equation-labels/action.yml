name: Check equation labels
description: >-
  Diff-scoped check that flags a `$$ ... $$` display equation with no
  `{#eq-...}` label, when the diff adds a line to it. The lab labels every
  display equation so it gets a number and a stable URL, and the
  equation-anchors filter gives a permalink only to a labeled one (moved
  from Morrison-Lab/ids#201). `<!-- check-equation-labels: allow: reason -->`
  on the equation's opening line or the line before exempts it. Scoped to
  lines a diff adds (an added line whose exact text was also deleted in the
  same diff counts as moved). Blocking by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only lines added since this ref are
      checked. On a pull request the reusable workflow passes `HEAD^1`, the
      base tip GitHub built the merge ref on.
      Diff mode needs the base commit in history (checkout with
      fetch-depth: 0); when the diff can't be computed (e.g. a shallow
      clone, or no base-ref given on a push run), the check is skipped with
      a warning rather than falling back to a whole-tree scan, which would
      reflag every unlabeled equation the corpus already carries.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked file the globs match, in full, instead of only the
      lines added since base-ref. Use it to measure a corpus, or to keep a
      fully labeled repository fully labeled; `base-ref` is ignored when
      this is 'true'.
    default: 'false'
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check. Git pathspecs
      match at any depth, so this is recursive by default.
    default: '*.qmd'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  fail:
    description: >-
      Fail the action when a display equation has no label
      (else non-blocking). Defaults to 'true'.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check equation labels
      shell: bash
      env:
        CEL_BASE_REF: ${{ inputs.base-ref }}
        CEL_WHOLE_TREE: ${{ inputs.whole-tree }}
        CEL_GLOBS: ${{ inputs.globs }}
        CEL_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        CEL_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-equation-labels.py"
