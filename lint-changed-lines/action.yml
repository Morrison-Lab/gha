name: Lint changed lines
description: >-
  Lint only the lines a pull request adds or modifies, rather than whole
  changed files. Runs lintr on each changed R file, then keeps only the lints
  on lines the PR actually added or modified (parsed from the PR diff), so lint
  rules can be adopted or tightened incrementally: new and edited code must
  comply while untouched legacy code in the same file is not flagged. Assumes
  the repository is already checked out at the PR head commit.
inputs:
  path:
    description: >-
      Path to the R package root (the directory holding DESCRIPTION). Defaults
      to the repository root.
    default: '.'
  install-quarto:
    description: Install Quarto when setting up R dependencies.
    default: 'false'
  use-renv:
    description: >-
      Restore R dependencies with renv (r-lib/actions/setup-renv) instead of
      DESCRIPTION-based setup-r-dependencies. Set 'true' for renv-pinned repos.
    default: 'false'
  renv-cache-version:
    description: Cache version suffix passed to setup-renv.
    default: '1'
  apt-packages:
    description: Extra apt packages to install before setting up R/renv dependencies (space-separated).
    default: ''
  extra-packages:
    description: >-
      Extra R packages to install (space- or comma-separated; passed to
      r-lib/actions/setup-r-dependencies under DESCRIPTION, or installed from CRAN
      under use-renv: true). gh and lintr are always installed.
    default: ''
  install-package:
    description: >-
      Run `R CMD INSTALL` on the package before linting so lintr's
      object_usage_linter can resolve the package's own functions (avoiding
      false "no visible binding" positives). Set 'false' for a repo that is
      not an installable R package.
    default: 'true'
  fail:
    description: Fail the action when a lint is found on a changed line (not just warn).
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up R
      uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      with:
        use-public-rspm: true

    - name: Install system dependencies
      if: inputs.apt-packages != ''
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y $APT_PACKAGES

    - name: Set up R dependencies (DESCRIPTION)
      if: inputs.use-renv != 'true'
      uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      with:
        working-directory: ${{ inputs.path }}
        install-quarto: ${{ inputs.install-quarto }}
        extra-packages: |
          any::gh
          any::lintr
          ${{ inputs.extra-packages }}
        needs: lint

    - name: Restore R dependencies (renv)
      if: inputs.use-renv == 'true'
      uses: r-lib/actions/setup-renv@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      env:
        GITHUB_PAT: ${{ github.token }}
        RENV_CONFIG_INSTALL_REMOTES: false
      with:
        working-directory: ${{ inputs.path }}
        cache-version: ${{ inputs.renv-cache-version }}

    - name: Set up Quarto (renv)
      if: inputs.use-renv == 'true' && inputs.install-quarto == 'true'
      uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

    - name: Ensure lintr and gh installed (renv)
      if: inputs.use-renv == 'true'
      working-directory: ${{ inputs.path }}
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        Rscript -e '
          req <- c("gh", "lintr")
          extra_str <- Sys.getenv("EXTRA_PACKAGES")
          extra <- strsplit(extra_str, "[[:space:],]+")[[1]]
          extra <- extra[nzchar(extra)]
          pkgs <- unique(c(req, sub("^.*::", "", extra)))
          needed <- setdiff(pkgs, rownames(installed.packages()))
          if (length(needed) > 0) {
            install.packages(needed, repos = "https://cloud.r-project.org")
          }
        '

    - name: Install package
      if: ${{ inputs.install-package == 'true' }}
      shell: bash
      run: R CMD INSTALL "${{ inputs.path }}"

    - name: Lint lines changed by this PR
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_PAT: ${{ github.token }}
        LINT_FAIL: ${{ inputs.fail }}
      run: Rscript "$GITHUB_ACTION_PATH/lint-changed-lines.R"
