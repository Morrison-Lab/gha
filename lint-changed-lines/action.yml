name: Lint changed lines
description: >-
  Lint only the lines a pull request adds or modifies, rather than whole
  changed files. Runs lintr on each changed R file, then keeps only the lints
  on lines the PR actually added or modified (parsed from the PR diff), so lint
  rules can be adopted or tightened incrementally: new and edited code must
  comply while untouched legacy code in the same file is not flagged. Assumes
  the repository is already checked out at the PR head commit.
inputs:
  path:
    description: >-
      Path to the R package root (the directory holding DESCRIPTION). Defaults
      to the repository root.
    default: '.'
  install-quarto:
    description: Install Quarto when setting up R dependencies.
    default: 'false'
  extra-packages:
    description: >-
      Extra R packages to install, passed to
      r-lib/actions/setup-r-dependencies. gh and lintr are always installed.
    default: ''
  install-package:
    description: >-
      Run `R CMD INSTALL` on the package before linting so lintr's
      object_usage_linter can resolve the package's own functions (avoiding
      false "no visible binding" positives). Set 'false' for a repo that is
      not an installable R package.
    default: 'true'
  fail:
    description: Fail the action when a lint is found on a changed line (not just warn).
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up R
      uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      with:
        use-public-rspm: true

    - name: Set up R dependencies
      uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      with:
        working-directory: ${{ inputs.path }}
        install-quarto: ${{ inputs.install-quarto }}
        extra-packages: |
          any::gh
          any::lintr
          ${{ inputs.extra-packages }}
        needs: lint

    - name: Install ghatools
      # Supplies added_lines(), which this check previously carried as its own
      # copy. Installed from the action's own checkout, so a consumer pinned at
      # @vN gets the ghatools that shipped with that tag rather than main's.
      shell: bash
      run: R CMD INSTALL "${{ github.action_path }}/../ghatools"

    - name: Install package
      if: ${{ inputs.install-package == 'true' }}
      shell: bash
      run: R CMD INSTALL "${{ inputs.path }}"

    - name: Lint lines changed by this PR
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_PAT: ${{ github.token }}
        LINT_FAIL: ${{ inputs.fail }}
      run: Rscript "$GITHUB_ACTION_PATH/lint-changed-lines.R"
