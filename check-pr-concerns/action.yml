name: Check pull request concerns
description: >-
  Diff-scoped, blocking check that fails a pull request changing both content
  paths (chapters, subfiles, .qmd, .Rmd) and infrastructure paths (.github,
  tools, scripts, hooks, filters, .claude, _quarto*.yml). Content and
  infrastructure go in separate PRs. The exemption label (`mixed-ok` in the
  reusable workflow) lifts the check.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against. On a pull request the reusable workflow
      passes `HEAD^1`. Needs the base commit in history (checkout with
      fetch-depth: 0); when the diff can't be computed the check is skipped
      with a warning rather than examining the whole tree.
    default: ''
  content-paths:
    description: >-
      Comma/newline-separated globs for content. Empty uses the defaults
      (`chapters/**`, `**/_subfiles/**`, `**/*.qmd`, `**/*.Rmd`).
    default: ''
  infra-paths:
    description: >-
      Comma/newline-separated globs for infrastructure. Empty uses the
      defaults (`.github/**`, `tools/**`, `scripts/**`, `hooks/**`,
      `filters/**`, `.claude/**`, `_quarto*.yml`). Infrastructure wins an
      overlap with content.
    default: ''
  paths-ignore:
    description: >-
      Comma/newline-separated globs counted as neither, in addition to the
      built-in lock, `_freeze/`, `docs/` and `changelog.d/` paths.
    default: ''
  exempt:
    description: >-
      'true' when the PR carries the exemption label; a mixed PR then passes.
      The reusable workflow reads the label live through the API.
    default: 'false'
  fail:
    description: >-
      Fail the action when the PR mixes content and infrastructure (else
      non-blocking). Defaults to 'true'.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check pull request concerns
      shell: bash
      env:
        PRC_BASE_REF: ${{ inputs.base-ref }}
        PRC_CONTENT_PATHS: ${{ inputs.content-paths }}
        PRC_INFRA_PATHS: ${{ inputs.infra-paths }}
        PRC_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        PRC_EXEMPT: ${{ inputs.exempt }}
        PRC_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-pr-concerns.py"
