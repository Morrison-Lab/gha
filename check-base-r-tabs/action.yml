name: Check base R tabs
description: >-
  Diff-scoped check that flags a `panel-tabset` with an "R (tidymodels)" tab
  and no base R tab, when the diff adds a line inside the tabset; a lab shows
  tidymodels and base R side by side (Ezra, 2026-11-17, lds#2708). Fails by
  default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only tabsets holding an added line are
      checked. Needs the base commit in history (fetch-depth: 0). Without it
      the check is skipped.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked matching file in full; `base-ref` is ignored.
    default: 'false'
  globs:
    description: Space-separated git pathspecs of tracked files to check.
    default: '*.qmd'
  fail:
    description: Fail the action on a finding (else warnings only).
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check base R tabs
      shell: bash
      env:
        CBR_BASE_REF: ${{ inputs.base-ref }}
        CBR_WHOLE_TREE: ${{ inputs.whole-tree }}
        CBR_GLOBS: ${{ inputs.globs }}
        CBR_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-base-r-tabs.py"
