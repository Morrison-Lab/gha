name: Check visualization figures
description: >-
  Diff-scoped check that flags a div that asks for a picture but has no
  figure, when the diff adds a line to it. Every div whose title mentions
  visualization has a figure, and for an exercise the solution includes it
  (Ezra, 2026-10-26). The trigger is wider than that word so the rule's own
  example, "Mark every zero-gradient point on a surface", is caught: a visual
  word (plot, sketch, draw, contour, picture, diagram, or "mark" with a
  point, curve, surface or region) in an exercise or example title,
  `visuali[sz]*` in any title, or a sketch or plot request in an exercise
  prompt. A figure is an image, a `fig-` labeled chunk or div, an `@fig-`
  reference, or an include of a `_fig` subfile, in the div or in its exercise
  family;
  `<!-- no-figure: reason -->` in the div exempts a false positive.
  Blocking by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only lines added since this ref are
      checked. On a pull request the reusable workflow passes `HEAD^1`, the
      base tip GitHub built the merge ref on.
      Diff mode needs the base commit in history (checkout with
      fetch-depth: 0); when the diff can't be computed (e.g. a shallow
      clone, or no base-ref given on a push run), the check is skipped with
      a warning rather than falling back to a whole-tree scan, which would
      reflag every div the corpus already carries.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked file the globs match, in full, instead of only the
      lines added since base-ref. Use it to measure a corpus; `base-ref` is
      ignored when this is 'true'.
    default: 'false'
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check. Git pathspecs
      match at any depth, so this is recursive by default.
    default: '*.qmd'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  fail:
    description: >-
      Fail the action when a visualization div has no figure (else
      non-blocking). Defaults to 'true'.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check visualization figures
      shell: bash
      env:
        VIZ_BASE_REF: ${{ inputs.base-ref }}
        VIZ_WHOLE_TREE: ${{ inputs.whole-tree }}
        VIZ_GLOBS: ${{ inputs.globs }}
        VIZ_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        VIZ_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-visualization-figures.py"
