name: Check citation authors
description: >-
  Diff-scoped check that flags an author's surname typed next to a citation of
  the same source in .qmd and .md prose, such as "James et al.
  [@james2021islr, Figure 6.7]", where "@james2021islr [Figure 6.7]" already
  prints the names (psw "Let the citation name the source", gha#2144). A
  capitalized word within six words before a citation key is flagged when the
  key starts with that word in lower case. Skips code fences and spans, HTML
  comments, front matter, link text and emphasis, crossrefs, and an
  author-suppressed [-@key]. Scoped to lines a diff adds (an added line whose
  exact text was also deleted in the same diff counts as moved). Warn-only by
  default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only lines added since this ref are
      checked. On a pull request the reusable workflow passes `HEAD^1`, the
      base tip GitHub built the merge ref on.
      Diff mode needs the base commit in history (checkout with
      fetch-depth: 0); when the diff can't be computed (e.g. a shallow
      clone, or no base-ref given on a push run), the check is skipped with
      a warning rather than falling back to a whole-tree scan, which would
      reflag every use the repository already has.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked file the globs match, in full, instead of only the
      lines added since base-ref. Use it to measure a corpus; `base-ref` is
      ignored when this is 'true'.
    default: 'false'
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check. Git pathspecs
      match at any depth, so this is recursive by default.
    default: '*.qmd *.md'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  fail:
    description: >-
      Fail the action when a typed author name is found (else non-blocking).
      Defaults to 'false' while the false-positive rate is measured (gha#2144).
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check citation authors
      shell: bash
      env:
        CCA_BASE_REF: ${{ inputs.base-ref }}
        CCA_WHOLE_TREE: ${{ inputs.whole-tree }}
        CCA_GLOBS: ${{ inputs.globs }}
        CCA_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        CCA_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-citation-authors.py"
