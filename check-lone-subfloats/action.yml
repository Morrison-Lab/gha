name: Check lone subfloats
description: >-
  Diff-scoped check that flags a figure (`#fig-`) or table (`#tbl-`)
  whose reader sees one subfigure or subtable, when the diff adds a line to
  it: a float with one subfloat, a float whose subfloats sit one per tab of
  a tabset (a language tabset whose chunks keep their `fig-` labels), and a
  chunk whose `fig-subcap` or `tbl-subcap` lists one entry (Ezra,
  2026-11-20). `<!-- check-lone-subfloats: allow: reason -->` in the div
  exempts it. Scoped to lines a diff adds (an added line whose exact text
  was also deleted in the same diff counts as moved). Blocking by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only lines added since this ref are
      checked. On a pull request the reusable workflow passes `HEAD^1`, the
      base tip GitHub built the merge ref on.
      Diff mode needs the base commit in history (checkout with
      fetch-depth: 0); when the diff can't be computed (e.g. a shallow
      clone, or no base-ref given on a push run), the check is skipped with
      a warning rather than falling back to a whole-tree scan, which would
      reflag every figure the corpus already carries.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked file the globs match, in full, instead of only the
      lines added since base-ref. Use it to measure a corpus; `base-ref` is
      ignored when this is 'true'.
    default: 'false'
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check. Git pathspecs
      match at any depth, so this is recursive by default.
    default: '*.qmd'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  fail:
    description: >-
      Fail the action when a figure or table shows a lone subfloat
      (else non-blocking). Defaults to 'true'.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check lone subfloats
      shell: bash
      env:
        CLS_BASE_REF: ${{ inputs.base-ref }}
        CLS_WHOLE_TREE: ${{ inputs.whole-tree }}
        CLS_GLOBS: ${{ inputs.globs }}
        CLS_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        CLS_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-lone-subfloats.py"
