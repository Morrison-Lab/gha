name: Check axis titles
description: >-
  Diff-scoped check that flags an axis title with no plain word (only a symbol
  or an expression such as "x", "x1" or "f(x)") in ggplot2 labs()/xlab()/ylab(),
  matplotlib set_xlabel()/set_ylabel() and plotly axis titles, when the diff adds
  the line (Ezra, 2026-10-26). Name the quantity in plain words, with the symbol
  optional, or add `axis-title-ok: reason` on the line. Scoped to lines a diff
  adds (an added line whose exact text was also deleted counts as moved).
  Blocking by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only lines added since this ref are
      checked. On a pull request the reusable workflow passes `HEAD^1`, the
      base tip GitHub built the merge ref on.
      Diff mode needs the base commit in history (checkout with
      fetch-depth: 0); when the diff can't be computed (e.g. a shallow
      clone, or no base-ref given on a push run), the check is skipped with
      a warning rather than falling back to a whole-tree scan, which would
      reflag every title the corpus already carries.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked file the globs match, in full, instead of only the
      lines added since base-ref. Use it to measure a corpus; `base-ref` is
      ignored when this is 'true'.
    default: 'false'
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check. Git pathspecs
      match at any depth, so this is recursive by default.
    default: '*.qmd *.Rmd *.R *.py'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  fail:
    description: >-
      Fail the action when an axis title has no plain word (else
      non-blocking). Defaults to 'true'.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check axis titles
      shell: bash
      env:
        AXT_BASE_REF: ${{ inputs.base-ref }}
        AXT_WHOLE_TREE: ${{ inputs.whole-tree }}
        AXT_GLOBS: ${{ inputs.globs }}
        AXT_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        AXT_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-axis-titles.py"
