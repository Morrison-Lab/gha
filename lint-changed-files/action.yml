name: Lint R files
description: >-
  Run lintr at one of three scopes: the files a pull request changed, a whole
  R package, or a whole project. Default is changed-files. lintr is installed
  from CRAN, not from GitHub HEAD. Assumes the repository is already checked
  out (the reusable workflow pins the PR head for changed-files).
inputs:
  scope:
    description: >-
      What to lint: 'changed-files' (only files this PR changed; requires a
      pull_request event), 'package' (lintr::lint_package()), or 'project'
      (lintr::lint_dir()).
    default: 'changed-files'
  path:
    description: >-
      Path to the R package or project root. For 'package', the directory
      holding DESCRIPTION. Defaults to the repository root.
    default: '.'
  linter-file:
    description: >-
      Path to a lintr config ('.lintr' or '.lintr.R'). Empty (default) lets
      lintr auto-detect '.lintr' / '.lintr.R' in the usual places.
    default: ''
  install-quarto:
    description: Install Quarto when setting up R dependencies.
    default: 'false'
  use-renv:
    description: >-
      Restore R dependencies with renv (r-lib/actions/setup-renv) instead of
      DESCRIPTION-based setup-r-dependencies. Set 'true' for renv-pinned repos.
    default: 'false'
  renv-cache-version:
    description: Cache version suffix passed to setup-renv.
    default: '1'
  apt-packages:
    description: Extra apt packages to install before setting up R/renv dependencies (space-separated).
    default: ''
  extra-packages:
    description: >-
      Extra R packages to install (space- or comma-separated; passed to
      r-lib/actions/setup-r-dependencies under DESCRIPTION, or installed from CRAN
      under use-renv: true or when path has no DESCRIPTION). gh and lintr are
      always installed from CRAN, never from GitHub HEAD.
    default: ''
  install-package:
    description: >-
      Run `R CMD INSTALL` on the package before linting so lintr's
      object_usage_linter can resolve the package's own functions. Skipped
      when path has no DESCRIPTION (a non-package repo). Set 'false' to skip
      even when DESCRIPTION is present.
    default: 'true'
  fail:
    description: Fail the action when lintr reports a lint (not just warn).
    default: 'true'
runs:
  using: composite
  steps:
    # Setup steps parallel lint-changed-lines (setup-r, renv, apt,
    # extra-packages, install-package). They are duplicated rather than
    # extracted into a nested composite: a new @v2 nested action cannot be
    # the first caller of itself (gha#284), and rewriting lint-changed-lines
    # onto that new action in the same PR would fail every consumer still
    # resolving the nested ref at the current tag. lint-changed-lines also
    # stays a separate capability -- its added-lines diffing is different
    # machinery from these three whole-file scopes (gha#258).
    - name: Set up R
      uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      with:
        use-public-rspm: true

    - name: Install system dependencies
      if: inputs.apt-packages != ''
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y $APT_PACKAGES

    - name: Detect DESCRIPTION
      id: desc
      shell: bash
      env:
        LINT_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        path="${LINT_PATH:-.}"
        if [ -f "${path}/DESCRIPTION" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up R dependencies (DESCRIPTION)
      if: inputs.use-renv != 'true' && steps.desc.outputs.present == 'true'
      uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      env:
        GITHUB_PAT: ${{ github.token }}
      with:
        working-directory: ${{ inputs.path }}
        install-quarto: ${{ inputs.install-quarto }}
        extra-packages: |
          any::gh
          any::lintr
          ${{ inputs.extra-packages }}
        needs: lint

    - name: Restore R dependencies (renv)
      if: inputs.use-renv == 'true'
      uses: r-lib/actions/setup-renv@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      env:
        GITHUB_PAT: ${{ github.token }}
        RENV_CONFIG_INSTALL_REMOTES: false
      with:
        working-directory: ${{ inputs.path }}
        cache-version: ${{ inputs.renv-cache-version }}

    - name: Set up Quarto (renv)
      if: inputs.use-renv == 'true' && inputs.install-quarto == 'true'
      uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

    - name: Ensure lintr and gh installed (renv or no DESCRIPTION)
      if: inputs.use-renv == 'true' || steps.desc.outputs.present != 'true'
      working-directory: ${{ inputs.path }}
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        Rscript -e '
          req <- c("gh", "lintr")
          extra_str <- Sys.getenv("EXTRA_PACKAGES")
          extra <- strsplit(extra_str, "[[:space:],]+")[[1]]
          extra <- extra[nzchar(extra)]
          pkgs <- unique(c(req, sub("^.*::", "", extra)))
          needed <- setdiff(pkgs, rownames(installed.packages()))
          if (length(needed) > 0) {
            install.packages(needed, repos = "https://cloud.r-project.org")
          }
        '

    - name: Install package
      if: ${{ inputs.install-package == 'true' && steps.desc.outputs.present == 'true' }}
      shell: bash
      env:
        LINT_PATH: ${{ inputs.path }}
      run: R CMD INSTALL "$LINT_PATH"

    - name: Lint R files
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_PAT: ${{ github.token }}
        LINT_FAIL: ${{ inputs.fail }}
        LINT_SCOPE: ${{ inputs.scope }}
        LINT_PATH: ${{ inputs.path }}
        LINT_LINTER_FILE: ${{ inputs.linter-file }}
      run: Rscript "$GITHUB_ACTION_PATH/lint-changed-files.R"
