# Derived from IndrajeetPatil/workflows check-extra.yaml (MIT):
# https://github.com/IndrajeetPatil/workflows
name: Extra R-package checks
description: >-
  Run one extra R-package check that R CMD check passes over: warnings as
  errors on examples/tests/vignettes, tests in random order, or a README.Rmd
  render (optionally requiring a committed README.md that matches). The
  wrapping reusable workflow runs each check as its own job so every
  failure surfaces instead of short-circuiting at the first.
inputs:
  check:
    description: >-
      Which check to run: `warnings`, `random-order`, or `readme`.
    required: true
  path:
    description: >-
      Path to the R package root (the directory holding DESCRIPTION).
    default: '.'
  extra-packages:
    description: >-
      Extra R packages to install, passed to setup-r-dependencies. Use
      this for packages a README or example needs that are not in
      DESCRIPTION (e.g. `any::ggthemes`). purrr, withr, fs, cli, pkgload,
      callr, devtools, testthat, and rmarkdown are always installed --
      they are declared here rather than arriving transitively via
      devtools.
    default: ''
  install-quarto:
    description: Install Quarto when setting up R dependencies.
    default: 'false'
  check-readme-freshness:
    description: >-
      When `check` is `readme`, fail if README.md is modified or untracked
      after rendering README.Rmd. Reconciles IndrajeetPatil's warnings-as-
      errors render with the freshness half a consumer like rpt wants
      (re-render, fail if the knitted README.md changed). Only an explicit
      `false` opts out.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Validate check input
      shell: bash
      env:
        CHECK: ${{ inputs.check }}
      run: |
        set -euo pipefail
        case "$CHECK" in
          warnings|random-order|readme) ;;
          *)
            echo "::error::check must be warnings, random-order, or readme; got '$CHECK'"
            exit 1
            ;;
        esac

    - name: Set up pandoc
      if: inputs.check == 'warnings' || inputs.check == 'readme'
      uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1

    - name: Set up R
      uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      with:
        use-public-rspm: true

    - name: Set up R dependencies
      uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      with:
        working-directory: ${{ inputs.path }}
        install-quarto: ${{ inputs.install-quarto }}
        extra-packages: |
          any::devtools
          any::callr
          any::purrr
          any::withr
          any::fs
          any::cli
          any::pkgload
          any::testthat
          any::rmarkdown
          local::.
          ${{ inputs.extra-packages }}
        needs: check

    - name: Run extra check
      shell: bash
      env:
        CHECK: ${{ inputs.check }}
        PKG_PATH: ${{ inputs.path }}
        CHECK_README_FRESHNESS: ${{ inputs.check-readme-freshness }}
      run: |
        set -euo pipefail
        Rscript "$GITHUB_ACTION_PATH/check-extra.R"
