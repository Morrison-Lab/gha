name: Check code-fold options
description: >-
  Diff-scoped check that flags an executed code chunk that sets
  `#| code-fold: false`, when the diff adds the line; a chunk is `show` or
  `true` (Ezra, 2026-11-05). Fails by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only added lines are checked. Needs the base
      commit in history (fetch-depth: 0). Without it the check is skipped.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked matching file in full; `base-ref` is ignored.
    default: 'false'
  globs:
    description: Space-separated git pathspecs of tracked files to check.
    default: '*.qmd'
  fail:
    description: Fail the action on a finding (else warnings only).
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check code-fold options
      shell: bash
      env:
        CCF_BASE_REF: ${{ inputs.base-ref }}
        CCF_WHOLE_TREE: ${{ inputs.whole-tree }}
        CCF_GLOBS: ${{ inputs.globs }}
        CCF_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-code-fold.py"
