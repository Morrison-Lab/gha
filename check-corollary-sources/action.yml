name: Check corollary sources
description: >-
  Diff-scoped, warn-only check that flags a corollary div (#cor-) a PR edits whose statement and proof name no earlier result (an @thm-, @lem-, @cor-, or @prp- cross-reference, or a link to such an anchor). `<!-- check-corollary-sources: allow: reason -->` exempts one. Warns by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only corollaries with a line added (in the div or its proof) since this
      ref are checked. On a pull request the reusable
      workflow passes `HEAD^1`. When the diff can't be computed, or no base-ref
      is given on a push run, the check is skipped rather than scanning the whole tree.
    default: ''
  whole-tree:
    description: >-
      Check every corollary the globs match, in full, instead of only
      touched ones. Use it to measure a corpus; `base-ref` is ignored.
    default: 'false'
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check (recursive by
      default).
    default: '*.qmd'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  fail:
    description: >-
      Fail the action on a finding. Defaults to 'false' (warning annotations
      only), until a measured corpus shows no false positive.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check corollary sources
      shell: bash
      env:
        CCS_BASE_REF: ${{ inputs.base-ref }}
        CCS_WHOLE_TREE: ${{ inputs.whole-tree }}
        CCS_GLOBS: ${{ inputs.globs }}
        CCS_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        CCS_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-corollary-sources.py"
