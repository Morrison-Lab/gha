name: Check exercise background
description: >-
  Diff-scoped, warn-only heuristic check that flags an exercise whose title
  names an object that its body never mentions, when the diff adds a line of
  the exercise (Ezra, 2026-10-29). Warns by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only added lines are checked. Needs the base
      commit in history (fetch-depth: 0). Without it the check is skipped.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked matching file in full; `base-ref` is ignored.
    default: 'false'
  globs:
    description: Space-separated git pathspecs of tracked files to check.
    default: '*.qmd'
  fail:
    description: Fail the action on a finding (else warnings only).
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check exercise background
      shell: bash
      env:
        EXB_BASE_REF: ${{ inputs.base-ref }}
        EXB_WHOLE_TREE: ${{ inputs.whole-tree }}
        EXB_GLOBS: ${{ inputs.globs }}
        EXB_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-exercise-background.py"
