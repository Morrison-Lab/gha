name: Check AI tells
description: >-
  Scans narrative prose in Markdown and Quarto files (*.md, *.qmd, *.Rmd) for
  AI-generated tells, overused vocabulary, and rhetorical templates, reporting
  density per 1,000 words.
inputs:
  paths:
    description: Comma- or space-separated list of files or globs to check. Defaults to all Markdown/Quarto files.
    default: ''
  paths-ignore:
    description: Comma- or space-separated list of file paths or globs to exclude from scanning.
    default: ''
  base-ref:
    description: Git base ref to limit checking to newly added/modified lines in diff.
    default: ''
  threshold:
    description: Maximum allowed tell density (tells per 1,000 words) before failing when fail is true.
    default: '10'
  ignore-tells:
    description: Comma- or space-separated list of tell names to ignore (e.g. 'robust, landscape').
    default: ''
  fail:
    description: Whether to fail the check if tell density exceeds threshold. Defaults to false (warn-only).
    default: 'false'
runs:
  using: composite
  steps:
    # r-lib/actions/setup-r installs `devscripts` with its recommended packages,
    # about 150 extra Perl packages. On a slow Ubuntu mirror that took 18 minutes
    # and hit the job's 20-minute limit (gha#1197). Nothing here needs them.
    # A self-hosted runner has no passwordless sudo, so the apt setting below
    # would stop on a password prompt. It already carries R, which is all
    # this check needs (base R only), so setup-r is skipped there too.
    - name: Detect passwordless sudo and R
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = Linux ] && sudo -n true 2>/dev/null; then
          echo "sudo=true" >> "$GITHUB_OUTPUT"
        else
          echo "sudo=false" >> "$GITHUB_OUTPUT"
        fi
        if command -v Rscript >/dev/null; then
          echo "r=true" >> "$GITHUB_OUTPUT"
        else
          echo "r=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Skip recommended apt packages
      if: steps.toolchain.outputs.sudo == 'true'
      shell: bash
      run: echo 'APT::Install-Recommends "false";' | sudo tee /etc/apt/apt.conf.d/99-no-install-recommends

    - name: Set up R
      if: steps.toolchain.outputs.sudo == 'true' || steps.toolchain.outputs.r != 'true'
      uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      with:
        use-public-rspm: true

    - name: Scan for AI tells
      shell: bash
      env:
        AIT_PATHS: ${{ inputs.paths }}
        AIT_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        AIT_BASE_REF: ${{ inputs.base-ref }}
        AIT_THRESHOLD: ${{ inputs.threshold }}
        AIT_IGNORE_TELLS: ${{ inputs.ignore-tells }}
        AIT_FAIL: ${{ inputs.fail }}
      run: Rscript "$GITHUB_ACTION_PATH/check-ai-tells.R"
