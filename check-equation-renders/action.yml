name: Check equation renders
description: >-
  Crawl a built Quarto/HTML site with a headless browser, let MathJax finish
  typesetting each page, and fail when any equation failed to render.
  Quarto's `html-math-method: mathjax` embeds raw TeX unchanged in the static
  HTML; only a real browser run of MathJax (not the Quarto/pandoc build log)
  reveals a broken formula.
inputs:
  site-dir:
    description: >-
      Path (relative to the caller repo, or absolute) to the built site
      directory to crawl (the directory containing the rendered `.html` files).
    required: true
  fail:
    description: Fail the action when equation render errors are found.
    default: 'true'
  max-pages:
    description: >-
      Maximum number of pages open in the headless browser at once. Each page
      costs a Chromium renderer, so keep this low on a shared self-hosted
      runner.
    default: '2'
runs:
  using: composite
  steps:
    # The crawl starts headless Chromium renderers, which is CI rendering;
    # that is banned on the self-hosted runners (cf463-01, cf463-02) and on
    # Ezra's Mac (Ezra, 2026-11-17; gha#2108). Skip it there with a notice
    # until a browser-free check can run on the cluster.
    - name: Skip the crawl on a self-hosted runner
      if: runner.environment == 'self-hosted'
      shell: bash
      run: echo "::notice::equation-render crawl skipped on a self-hosted runner (gha#2108)"
    - name: Install Playwright
      if: runner.environment != 'self-hosted'
      shell: bash
      run: |
        set -euo pipefail
        npm ci --prefix "$GITHUB_ACTION_PATH" --no-audit --no-fund
        # `--with-deps` installs system libraries through sudo, which a
        # self-hosted runner without passwordless sudo refuses, so use it
        # only where it can work; the runner must then carry the libraries.
        deps=()
        if [ "$(id -u)" -eq 0 ] || sudo -n true 2>/dev/null; then
          deps=(--with-deps)
        else
          echo "No root or passwordless sudo: installing Chromium without system dependencies."
        fi
        npx --prefix "$GITHUB_ACTION_PATH" playwright install ${deps[@]+"${deps[@]}"} chromium

    - name: Check equation renders
      if: runner.environment != 'self-hosted'
      shell: bash
      env:
        SITE_DIR: ${{ inputs.site-dir }}
        FAIL: ${{ inputs.fail }}
        MAX_PAGES: ${{ inputs.max-pages }}
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/check_equations.mjs" --site-dir "$SITE_DIR" --fail "$FAIL"
