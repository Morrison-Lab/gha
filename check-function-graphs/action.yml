name: Check function graphs
description: >-
  Diff-scoped, warn-only check that flags a definition div (`#def-`) of a
  function of one or two inputs with no graph inside it, when the diff adds
  a line to the div. Every definition for a function of one or two inputs
  includes a graph of that function, in 2D or 3D (Ezra, 2026-11-10;
  Morrison-Lab/psw#574). A candidate is a definition whose first display
  equation defines `name(a)` or `name(a, b)` with scalar arguments; a graph
  is what check-exm-figures counts as a figure; an
  `<!-- no-graph: reason -->` comment in the div is a justified exception.
  Warn-only by default, because spotting a function definition is a
  heuristic.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only lines added since this ref are
      checked. On a pull request the reusable workflow passes `HEAD^1`, the
      base tip GitHub built the merge ref on.
      Diff mode needs the base commit in history (checkout with
      fetch-depth: 0); when the diff can't be computed (e.g. a shallow
      clone, or no base-ref given on a push run), the check is skipped with
      a warning rather than falling back to a whole-tree scan, which would
      reflag every definition the corpus already carries.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked file the globs match, in full, instead of only the
      lines added since base-ref. Use it to measure a corpus; `base-ref` is
      ignored when this is 'true'.
    default: 'false'
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check. Git pathspecs
      match at any depth, so this is recursive by default.
    default: '*.qmd'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  fail:
    description: >-
      Fail the action when a function definition has no graph (else the
      findings are warnings). Defaults to 'false'.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check function graphs
      shell: bash
      env:
        FNG_BASE_REF: ${{ inputs.base-ref }}
        FNG_WHOLE_TREE: ${{ inputs.whole-tree }}
        FNG_GLOBS: ${{ inputs.globs }}
        FNG_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        FNG_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-function-graphs.py"
