name: Check removed content is moved
description: >-
  Diff-scoped check that fails a pull request that removes prose sentences
  which reappear nowhere among the lines it adds (Ezra, 2026-11-09,
  Morrison-Lab/gha#1791). A moved or reflowed sentence passes; a deliberate
  removal is opted out with `removed-content-ok: reason` in the PR body.
  Fails by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against. On a pull request the reusable workflow
      passes `HEAD^1`. Diff mode needs the base commit in history (checkout
      with fetch-depth: 0); when the diff can't be computed, or no base-ref is
      given, the check is skipped.
    default: ''
  globs:
    description: Space-separated git pathspecs of tracked files to check.
    default: '*.qmd *.md'
  pr-body:
    description: >-
      The pull request body, searched for `removed-content-ok:` and for the
      names of deleted files.
    default: ''
  min-overlap:
    description: >-
      Fraction of a removed sentence's word trigrams that must appear among
      the added lines for it to count as moved.
    default: '0.6'
  min-words:
    description: Fewest alphabetic words of a removed sentence that is examined.
    default: '5'
  fail:
    description: >-
      Fail the action when removed content is not found. Defaults to 'true';
      'false' gives warning annotations only.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check removed content is moved
      shell: bash
      env:
        RCO_BASE_REF: ${{ inputs.base-ref }}
        RCO_GLOBS: ${{ inputs.globs }}
        RCO_PR_BODY: ${{ inputs.pr-body }}
        RCO_MIN_OVERLAP: ${{ inputs.min-overlap }}
        RCO_MIN_WORDS: ${{ inputs.min-words }}
        RCO_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-removed-content.py"
