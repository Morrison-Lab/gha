name: Check exercises end with a task
description: >-
  Diff-scoped check that flags an exercise div (id `exr-...`) whose last
  paragraph holds no question or instruction, or that ends with a figure,
  table, code block or include after its last task (Ezra, 2026-11-09;
  Morrison-Lab/psw#549). Solutions, hints, comments, display math, lists and
  headings are not examined; `<!-- ends-with-task-ok: reason -->` exempts an
  exercise. Fails by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only exercises with a line added since this
      ref are checked. On a pull request the reusable workflow passes `HEAD^1`.
      Diff mode needs the base commit in history (checkout with fetch-depth:
      0); when the diff can't be computed, or no base-ref is given on a push
      run, the check is skipped rather than scanning the whole tree.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked file the globs match, in full, instead of only
      touched exercises. Use it to measure a corpus; `base-ref` is ignored.
    default: 'false'
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check (recursive by
      default).
    default: '*.qmd'
  fail:
    description: >-
      Fail the action when an exercise does not end with a task. Defaults to
      'true'; 'false' gives warning annotations only.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check exercises end with a task
      shell: bash
      env:
        EET_BASE_REF: ${{ inputs.base-ref }}
        EET_WHOLE_TREE: ${{ inputs.whole-tree }}
        EET_GLOBS: ${{ inputs.globs }}
        EET_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-exercise-ends-with-task.py"
