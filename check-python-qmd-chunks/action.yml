name: Check Python chunks in qmd files
description: >-
  Lints the Python chunks of the `.qmd` files a pull request changes, with the
  repository's Ruff configuration. The chunks of one file share a Python
  session, so they are joined in document order and linted together; each
  finding is reported at its line in the `.qmd` file. Fails by default.
  The lab configuration is `python/ruff.toml` in Morrison-Lab/psc; a
  repository copies it to its root as `ruff.toml`.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  config:
    description: Path to the Ruff configuration file.
    default: 'ruff.toml'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only `.qmd` files changed since this ref
      are checked. On a pull request the reusable workflow passes `HEAD^1`.
      Diff mode needs the base commit in history (checkout with
      fetch-depth: 0); with no base-ref the check is skipped with a warning
      instead of scanning the whole tree.
    default: ''
  whole-tree:
    description: >-
      Check every tracked file the globs match, instead of only the files
      changed since base-ref. `base-ref` is ignored when this is 'true'.
    default: 'false'
  globs:
    description: Space-separated git pathspecs of tracked files to check.
    default: '*.qmd'
  fail:
    description: Fail the action when a chunk has a finding (else warn only).
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Ruff
      shell: bash
      run: python3 -m pip install --quiet ruff==0.16.9

    - name: Lint Python chunks
      shell: bash
      env:
        QMD_CONFIG: ${{ inputs.config }}
        QMD_BASE_REF: ${{ inputs.base-ref }}
        QMD_WHOLE_TREE: ${{ inputs.whole-tree }}
        QMD_GLOBS: ${{ inputs.globs }}
        QMD_FAIL: ${{ inputs.fail }}
      run: |
        set -euo pipefail
        if [ ! -f "$QMD_CONFIG" ]; then
          echo "::error::Ruff config '$QMD_CONFIG' not found; copy python/ruff.toml from Morrison-Lab/psc to the repository root."
          exit 1
        fi
        # shellcheck disable=SC2086  # the globs are pathspecs, split on purpose
        if [ "$QMD_WHOLE_TREE" = 'true' ]; then
          mapfile -t files < <(git ls-files -- $QMD_GLOBS)
        elif [ -n "$QMD_BASE_REF" ]; then
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$QMD_BASE_REF" -- $QMD_GLOBS)
        else
          echo "::warning::No base-ref and whole-tree is off; skipping the Python chunk check."
          exit 0
        fi
        if [ "${#files[@]}" -eq 0 ]; then
          echo "No matching .qmd files to check."
          exit 0
        fi
        status=0
        python3 "$GITHUB_ACTION_PATH/lint_qmd_chunks.py" --config "$QMD_CONFIG" "${files[@]}" > findings.txt || status=$?
        if [ "$status" -eq 0 ]; then
          echo "No findings in ${#files[@]} file(s)."
          exit 0
        fi
        level=error
        if [ "$QMD_FAIL" != 'true' ]; then level=warning; fi
        sed -E "s#^([^:]+):([0-9]+): (.*)#::${level} file=\\1,line=\\2::\\3#" findings.txt
        rm -f findings.txt
        if [ "$QMD_FAIL" = 'true' ]; then exit 1; fi
