name: Check new markdown lines for missing semantic line breaks
description: >-
  Advisory, diff-scoped check that flags newly-added Markdown lines packing
  more than one sentence/clause onto a single source line -- the "semantic
  line breaks" convention (one clause/sentence per line), which keeps a diff
  scoped to the changed sentence instead of a whole reflowed paragraph.
  Scoped to lines a diff adds, so it never reflags a corpus's pre-existing
  long lines -- useful alongside lint-markdown when markdownlint's MD013 is
  disabled because the corpus already carries long-line drift. Non-blocking
  by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only lines added since this ref are
      checked. The reusable workflow passes the PR base SHA automatically.
      Diff mode needs the base commit in history (checkout with
      fetch-depth: 0); when the diff can't be computed (e.g. a shallow
      clone, or no base-ref given on a push run), the check is skipped with
      a warning rather than falling back to a whole-tree scan, which would
      reflag every pre-existing long line the corpus already carries.
    default: ''
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check. Git pathspecs
      match at any depth, so this is recursive by default.
    default: '*.md'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  fail:
    description: >-
      Fail the action when a violation is found (else non-blocking). Defaults
      to non-blocking: a long line can legitimately be un-splittable (a URL, a
      citation, a single long clause), so this is a nudge, not a gate.
    default: 'false'
  clause-breaks:
    description: >-
      Also flag a long line carrying a mid-line semicolon -- a narrow slice of
      the SemBr spec's rule 5 ("a semantic line break SHOULD occur after an
      independent clause"), on top of the rule 4 sentence check that always
      runs. On by default; set 'false' to check sentences only. See
      d-morrison/gha#336 for why only the semicolon is used, and the
      measurements behind it.
    default: 'true'
  clause-min-length:
    description: >-
      Minimum line length, in characters, before `clause-breaks` applies;
      inclusive, so a line of exactly this length is checked. Measured on the
      line's visible prose, after stripping inline markup such as code spans,
      link targets, bare URLs, and HTML entities, so a line that is long only
      because of a URL does not qualify. Ignored when `clause-breaks` is
      'false'.
    default: '80'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check new markdown lines for missing semantic breaks
      shell: bash
      env:
        NLB_BASE_REF: ${{ inputs.base-ref }}
        NLB_GLOBS: ${{ inputs.globs }}
        NLB_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        NLB_FAIL: ${{ inputs.fail }}
        NLB_CLAUSE_BREAKS: ${{ inputs.clause-breaks }}
        NLB_CLAUSE_MIN_LENGTH: ${{ inputs.clause-min-length }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-new-line-breaks.py"
