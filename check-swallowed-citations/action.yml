name: Check swallowed citations
description: >-
  Diff-scoped check that flags a citation an in-text cross-reference just
  before it swallows in .qmd and .md prose, such as "as in @eq-x
  [@key, section 3]". Pandoc reads the bracket as a suffix of the
  @eq-x citation, so the cited source drops out of the rendered page with
  no warning (Morrison-Lab/lds#3239). Flags a Quarto crossref (@fig-, @eq-,
  @def- and the other prefixes) followed, with only spaces or one line
  break between them, by a bracket holding a citation. Skips code fences
  and spans, HTML comments, front matter, links, and a crossref inside a
  bracket. Scoped to lines a diff adds (an added line whose exact text was
  also deleted in the same diff counts as moved). Fails by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only lines added since this ref are
      checked. On a pull request the reusable workflow passes `HEAD^1`, the
      base tip GitHub built the merge ref on.
      Diff mode needs the base commit in history (checkout with
      fetch-depth: 0); when the diff can't be computed (e.g. a shallow
      clone, or no base-ref given on a push run), the check is skipped with
      a warning rather than falling back to a whole-tree scan, which would
      reflag every use the repository already has.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked file the globs match, in full, instead of only the
      lines added since base-ref. Use it to measure a corpus; `base-ref` is
      ignored when this is 'true'.
    default: 'false'
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check. Git pathspecs
      match at any depth, so this is recursive by default.
    default: '*.qmd *.md'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  fail:
    description: >-
      Fail the action when a swallowed citation is found (else
      non-blocking). Defaults to 'true', since the defect is silent in the
      render.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check swallowed citations
      shell: bash
      env:
        CSC_BASE_REF: ${{ inputs.base-ref }}
        CSC_WHOLE_TREE: ${{ inputs.whole-tree }}
        CSC_GLOBS: ${{ inputs.globs }}
        CSC_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        CSC_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-swallowed-citations.py"
