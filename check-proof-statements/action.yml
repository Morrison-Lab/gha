name: Check proof statements
description: >-
  Diff-scoped check for two of the lab's proof rules (psw#426): a proof inside
  a content-hidden wrapper for revealjs is flagged when a PR touches the file
  (every proof is shown on slides), and reasoning words such as "so" and
  "because" are flagged on an added line inside a theorem, lemma, corollary or
  proposition statement (the proof carries the reasoning). Skips code fences
  and spans, HTML comments, front matter and math. Warn-only by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only lines added since this ref are
      checked. On a pull request the reusable workflow passes `HEAD^1`, the
      base tip GitHub built the merge ref on.
      Diff mode needs the base commit in history (checkout with
      fetch-depth: 0); when the diff can't be computed (e.g. a shallow
      clone, or no base-ref given on a push run), the check is skipped with
      a warning rather than falling back to a whole-tree scan, which would
      reflag every use the repository already has.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked file the globs match, in full, instead of only the
      lines added since base-ref. Use it to measure a corpus; `base-ref` is
      ignored when this is 'true'.
    default: 'false'
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check. Git pathspecs
      match at any depth, so this is recursive by default.
    default: '*.qmd *.md'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  fail:
    description: >-
      Fail the action when an hidden proof or statement reasoning is found
      (else non-blocking). Defaults to 'false' (warning annotations only).
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check proof statements
      shell: bash
      env:
        CPS_BASE_REF: ${{ inputs.base-ref }}
        CPS_WHOLE_TREE: ${{ inputs.whole-tree }}
        CPS_GLOBS: ${{ inputs.globs }}
        CPS_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        CPS_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-proof-statements.py"
