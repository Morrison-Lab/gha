name: Annotation gate
description: >-
  Fail the run when any other job in it carries a notice, warning or failure
  annotation that is not allowlisted. Annotations are the one place agents and
  authors are told something is wrong without the job going red, and they get
  ignored; this makes each one either a failure or a tracked exception.
  Run it in a job that `needs:` every other job, with `if: always()`.
inputs:
  levels:
    description: Comma list of annotation levels to enforce (notice, warning, failure).
    default: 'notice,warning,failure'
  allow-patterns:
    description: >-
      Newline-separated regexes (case-insensitive, searched in the message).
      An annotation matching one is allowed. Add the caller's tracked
      exceptions here.
    default: ''
  default-allow:
    description: >-
      Newline-separated regexes allowed for every caller: messages GitHub or a
      third-party action emits that no repository can silence, and the three
      the review workflow emits by design (a newer push supersedes a review,
      and a PR edits workflow files).
    default: |
      The ubuntu-latest label will migrate to
      Node\.js \d+ is deprecated\. The following actions target Node
      ^Process completed with exit code \d+
      ^Canceling since a higher priority waiting request for
      not posting a stale review
      ^PR edits workflow files; restored
      ^Skipping element-level diff highlighting: \d+ old / \d+ new candidate elements exceed the \d+-element cap
  job-name:
    description: >-
      Optional extra name prefix of a job to skip. The gate's own job is always
      skipped.
    default: ''
  run-id:
    description: >-
      Gate this run instead of the current one, as the `workflow_run` mode does
      with `github.event.workflow_run.id`. No job is skipped as the gate's own.
    default: ''
  run-attempt:
    description: Attempt of `run-id`, default the latest the API reports for it.
    default: ''
  head-sha:
    description: >-
      With `run-id`, also post the result as a check run named `annotation-gate`
      on this commit, so it shows on the pull request. Needs `checks: write`.
    default: ''
  token:
    description: Token granted actions read and checks read, plus checks write with `head-sha`.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Check annotations
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        GATE_LEVELS: ${{ inputs.levels }}
        GATE_ALLOW: ${{ inputs.allow-patterns }}
        GATE_DEFAULT_ALLOW: ${{ inputs.default-allow }}
        GATE_JOB_NAME: ${{ inputs.job-name }}
        GATE_RUN_ID: ${{ inputs.run-id }}
        GATE_RUN_ATTEMPT: ${{ inputs.run-attempt }}
        GATE_HEAD_SHA: ${{ inputs.head-sha }}
      run: python3 "$GITHUB_ACTION_PATH/annotation_gate.py"
