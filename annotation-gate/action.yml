name: Annotation gate
description: >-
  Fail the run when any other job in it carries a notice, warning or failure
  annotation that is not allowlisted. Annotations are the one place agents and
  authors are told something is wrong without the job going red, and they get
  ignored; this makes each one either a failure or a tracked exception.
  Run it in a job that `needs:` every other job, with `if: always()`.
inputs:
  levels:
    description: Comma list of annotation levels to enforce (notice, warning, failure).
    default: 'notice,warning,failure'
  allow-patterns:
    description: >-
      Newline-separated regexes (case-insensitive, searched in the message).
      An annotation matching one is allowed. Add the caller's tracked
      exceptions here.
    default: ''
  default-allow:
    description: >-
      Newline-separated regexes allowed for every caller: messages GitHub or a
      third-party action emits that no repository can silence (a run cancelled
      by hand among them, gha#1144), and the four
      the review workflow emits by design (a newer push supersedes a review,
      a PR edits workflow files, and `require-clean-verdict` fails on a
      non-clean verdict), and the two notices the runner job-started hook
      emits about the host (a busy host held the job, a low-disk host), and
      the git transport errors of a checkout fetch that `actions/checkout`
      retried: a fetch that keeps failing fails the job itself (gha#1731).
    default: |
      The ubuntu-latest label will migrate to
      Node\.js \d+ is deprecated\. The following actions target Node
      ^Process completed with exit code \d+
      ^Canceling since a higher priority waiting request for
      ^The operation was canceled\.$
      ^The run was canceled by @[A-Za-z0-9-]+(\[bot\])?\.$
      not posting a stale review
      ^PR edits workflow files; restored
      ^Claude review verdict is not clean \(verdict: .+\)\.$
      ^Skipping element-level diff highlighting: \d+ old / \d+ new candidate elements exceed the \d+-element cap
      ^Attempt 1 produced a stub review or short-circuited; the retry recovered cleanly\.$
      ^Claude review produced no execution output \(action exited non-zero or short-circuited
      ^Action failed with error: Failed to install Claude Code after \d+ attempts
      ^No files were found with the provided path: .*claude-execution-output\.json
      ^execution_file output not set; falling back to
      ^https?://\S+: Network error: SSL certificate not trusted\b.*the link is unverified, not known dead
      ^wait-runner-capacity: still short after \d+ minutes
      ^prune-runner-workdir: measured .+ GB free, under \d+ GB
      ^fetch-pack: (invalid index-pack output|unexpected disconnect while reading sideband packet)
      ^early EOF$
      ^\d+ bytes of body are still expected$
      ^RPC failed; curl \d+\b
      ^the remote end hung up unexpectedly$
  job-name:
    description: >-
      Optional extra name prefix of a job to skip. The gate's own job is always
      skipped.
    default: ''
  run-id:
    description: >-
      Gate this run instead of the current one, as the `workflow_run` mode does
      with `github.event.workflow_run.id`. No job is skipped as the gate's own.
    default: ''
  run-attempt:
    description: Attempt of `run-id`, default the latest the API reports for it.
    default: ''
  head-sha:
    description: >-
      With `run-id`, also post the result as a check run named `annotation-gate`
      on this commit, so it shows on the pull request. Needs `checks: write`.
    default: ''
  all-runs:
    description: >-
      With `head-sha`, gate the latest completed run of every workflow and
      event on that commit in one pass and post one `annotation-gate` check
      run, instead of one per finished run. Pair it with a concurrency group
      per commit, so a burst of finishing runs leaves one gate. A run still in
      progress is left out; its own completion starts the next gate.
    default: 'false'
  defer-while-running:
    description: >-
      With `all-runs`, exit without gating or posting a check run while another
      workflow's run on the commit is still queued or in progress. That run's
      completion starts its own gate, so the last to finish gates the commit
      and the earlier ones do no API work. A check run posted by an earlier
      gate stays until then. Turn it on only when the caller triggers on
      `workflow_run` for every workflow (`workflows: ["*"]`): with a narrower
      list, the deferring gate can wait on a run that starts no gate and leave
      the commit ungated.
      A `workflow_dispatch` run never defers, since no later run would gate the commit for it (gha#1762).
      Off by default, because a quick failure is then
      reported only when the slowest workflow on the commit finishes.
    default: 'false'
  backfill:
    description: >-
      Gate each commit that a pull request run touched in the last 24 hours
      and that has no `annotation-gate` check run, or whose newest one
      finished before a run on the commit did (a failure that a re-run has
      since fixed, gha#1752), instead of one commit, and post a check run on
      each. Run it on a schedule beside the `workflow_run`
      gate: a gate that defers posts nothing and relies on the last finishing
      run to start the gate that posts, so a lost or very late event leaves the
      required check missing and the pull request blocked with nothing to
      re-run (gha#1754). A commit with a run still queued or in progress is
      left alone. It reads runs and check runs only, so it needs no permission
      beyond `actions: read`, `checks: write` and `contents: read`; `head-sha`
      and `all-runs` are unused.
    default: 'false'
  token:
    description: Token granted actions read and checks read, plus checks write with `head-sha`.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Check annotations
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        GATE_LEVELS: ${{ inputs.levels }}
        GATE_ALLOW: ${{ inputs.allow-patterns }}
        GATE_DEFAULT_ALLOW: ${{ inputs.default-allow }}
        GATE_JOB_NAME: ${{ inputs.job-name }}
        GATE_RUN_ID: ${{ inputs.run-id }}
        GATE_RUN_ATTEMPT: ${{ inputs.run-attempt }}
        GATE_HEAD_SHA: ${{ inputs.head-sha }}
        GATE_ALL_RUNS: ${{ inputs.all-runs }}
        GATE_DEFER_WHILE_RUNNING: ${{ inputs.defer-while-running }}
        GATE_BACKFILL: ${{ inputs.backfill }}
      run: python3 "$GITHUB_ACTION_PATH/annotation_gate.py"
