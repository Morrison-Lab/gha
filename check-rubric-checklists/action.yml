name: Check rubric checklists
description: >-
  Diff-scoped check that flags a grading rubric (a line opening with
  "Grading", "Rubric" or "Marking scheme") whose block holds no task-list
  item (`- [ ] ...`), when the diff adds a line inside it. Most STEM rubrics
  are checklists (Ezra, 2026-10-27). Code fences and comments do not count;
  `<!-- rubric-ok: reason -->` exempts a rubric. Warns by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only rubrics with a line added since this
      ref are checked. On a pull request the reusable workflow passes `HEAD^1`.
      Diff mode needs the base commit in history (checkout with fetch-depth:
      0); when the diff can't be computed, or no base-ref is given on a push
      run, the check is skipped rather than scanning the whole tree.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked file the globs match, in full, instead of only
      touched rubrics. Use it to measure a corpus; `base-ref` is ignored.
    default: 'false'
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check (recursive by
      default).
    default: '*.qmd *.md'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  fail:
    description: >-
      Fail the action when a rubric is not a checklist. Defaults to 'false'
      (warning annotations only), because the rule is a default for most
      STEM rubrics, not an absolute one.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check rubric checklists
      shell: bash
      env:
        RCL_BASE_REF: ${{ inputs.base-ref }}
        RCL_WHOLE_TREE: ${{ inputs.whole-tree }}
        RCL_GLOBS: ${{ inputs.globs }}
        RCL_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        RCL_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-rubric-checklists.py"
