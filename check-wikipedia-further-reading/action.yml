name: Check Wikipedia in Further reading
description: >-
  Diff-scoped check that flags a Wikipedia citation or link in a list item of a
  Further reading section of Markdown and Quarto files. Wikipedia pages are
  citations only and never belong in Further reading (Ezra, 2026-10-18). Flags
  a list item that has a `@wikipedia_<key>` citation, a wikipedia.org link, or
  "Wikipedia on" when its nearest preceding heading says further or additional
  reading (or similar), it sits in a `.reading` div, or its file name contains
  `further-reading` or `sec-reading`. Ordinary prose is never flagged. Scoped
  to lines a diff adds (an added line whose exact text was also deleted in the
  same diff counts as moved). Fails by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only lines added since this ref are
      checked. On a pull request the reusable workflow passes `HEAD^1`, the
      base tip GitHub built the merge ref on.
      Diff mode needs the base commit in history (checkout with
      fetch-depth: 0); when the diff can't be computed (e.g. a shallow
      clone, or no base-ref given on a push run), the check is skipped with
      a warning rather than falling back to a whole-tree scan, which would
      reflag every entry the corpus already carries.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked file the globs match, in full, instead of only the
      lines added since base-ref. Use it to measure a corpus; `base-ref` is
      ignored when this is 'true'.
    default: 'false'
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check. Git pathspecs
      match at any depth, so this is recursive by default.
    default: '*.qmd *.md'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  fail:
    description: >-
      Fail the action when Wikipedia is found in Further reading (else
      non-blocking). Defaults to 'true'; 'false' gives warning annotations only.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check Wikipedia in Further reading
      shell: bash
      env:
        WFR_BASE_REF: ${{ inputs.base-ref }}
        WFR_WHOLE_TREE: ${{ inputs.whole-tree }}
        WFR_GLOBS: ${{ inputs.globs }}
        WFR_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        WFR_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-wikipedia-further-reading.py"
