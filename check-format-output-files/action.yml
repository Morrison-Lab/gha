name: Check format output files
description: >-
  Fails when a Quarto page lacks an `output-file` for a format that a
  per-format publish renders with `quarto render --to FORMAT`: `--to`
  renders every page under the default name, so a page without a
  `revealjs` entry has its HTML replaced by a slide deck (mds
  `linear-algebra.html`, 2026-10-28). Blocking by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  formats:
    description: Space-separated formats rendered with `--to`; each needs an `output-file`.
    default: 'revealjs pdf docx'
  globs:
    description: Space-separated git pathspecs of tracked files to check.
    default: '*.qmd'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      `_extensions/**` is always skipped.
    default: ''
  fail:
    description: Fail the action on a finding (else non-blocking).
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check format output files
      shell: bash
      env:
        CFO_FORMATS: ${{ inputs.formats }}
        CFO_GLOBS: ${{ inputs.globs }}
        CFO_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        CFO_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-format-output-files.py"
