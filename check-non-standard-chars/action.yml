name: Check non-standard characters
description: >-
  Detect curly quotes, en/em dashes, and the multiplication sign in .qmd, .R,
  and .md files in the caller's repository, which can cause issues in Quarto/R
  projects.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  extensions:
    description: Comma- or space-separated list of file extensions to check.
    default: '.qmd, .R, .md'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check for non-standard characters
      shell: bash
      env:
        EXTENSIONS: ${{ inputs.extensions }}
      run: python3 "$GITHUB_ACTION_PATH/check-non-standard-chars.py"
