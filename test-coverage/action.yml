name: Test coverage
description: >-
  Measure R-package test coverage with covr and upload the Cobertura report to
  Codecov. Adapts the r-lib/actions test-coverage example into a reusable
  composite: set up R and dependencies, run covr::package_coverage(), and upload
  the result with codecov/codecov-action.
inputs:
  path:
    description: >-
      Path to the R package root (the directory holding DESCRIPTION). Defaults
      to the repository root.
    default: '.'
  install-quarto:
    description: Install Quarto when setting up R dependencies.
    default: 'false'
  extra-packages:
    description: >-
      Extra R packages to install for the coverage run, passed to
      r-lib/actions/setup-r-dependencies. covr and xml2 are always installed.
    default: ''
  token:
    description: >-
      Codecov upload token (the CODECOV_TOKEN secret). Optional for public
      repos, but recommended -- tokenless uploads are rate-limited and
      unreliable from pull requests.
    default: ''
  fail-ci-if-error:
    description: Fail the job when the Codecov upload errors.
    default: 'false'
  upload-test-results:
    description: >-
      Also generate a JUnit test-results report (testthat::JunitReporter) and
      upload it to Codecov via codecov/test-results-action, powering Codecov's
      Test Analytics (failed/flaky-test reporting) -- separate from the
      Cobertura line-coverage upload above, which only measures which lines
      ran, not which tests passed or failed. On by default, matching the
      pre-migration convention at least one consumer (UCD-SERG/serocalculator)
      already used (gha#234).
    default: 'true'
  upload-coverage:
    description: >-
      Upload the Cobertura report to Codecov. On by default. The
      examples/vignettes reusable-workflow job turns this off so its report
      is not mixed into the unit-test coverage percentage (gha#334).
    default: 'true'
  coverage-type:
    description: >-
      covr coverage type(s), comma-separated: tests, vignettes, examples, all,
      or none. Default 'tests' matches covr::package_coverage()'s own default.
      Pass 'examples,vignettes' for the examples/vignettes job (gha#334).
    default: 'tests'
  comment-donttest:
    description: >-
      covr's commentDonttest: when true (the covr default), \donttest{}
      examples are commented out and not run. Pass false so those blocks
      execute. The examples/vignettes reusable-workflow job passes false
      (gha#334).
    default: 'true'
  comment-dontrun:
    description: >-
      covr's commentDontrun: when true (the covr default), \dontrun{}
      examples are commented out and not run. Pass false so those blocks
      execute. The examples/vignettes reusable-workflow job passes false
      (gha#334).
    default: 'true'
  min-coverage:
    description: >-
      Minimum percent coverage required to pass, from covr::percent_coverage().
      Empty (the default) disables the threshold. Pass a number between 0 and
      100 to opt in (gha#334). The reusable workflow applies this to the
      tests job only.
    default: ''
  failure-artifact-name:
    description: >-
      Artifact name for the covr install tree uploaded when the job fails.
      Default 'coverage-test-failures'. Pass empty to skip the upload.
      The examples/vignettes reusable-workflow job uses a distinct name so
      the two jobs cannot 409 on the same artifact in one run.
    default: 'coverage-test-failures'
runs:
  using: composite
  steps:
    - name: Set up R
      uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      with:
        use-public-rspm: true

    - name: Set up R dependencies
      uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      with:
        working-directory: ${{ inputs.path }}
        install-quarto: ${{ inputs.install-quarto }}
        # covr/xml2 power the coverage run; `needs: coverage` adds the package's
        # Config/Needs/coverage dependencies from DESCRIPTION.
        extra-packages: |
          any::covr
          any::xml2
          ${{ inputs.extra-packages }}
        needs: coverage

    - name: Measure coverage
      id: coverage
      shell: bash
      env:
        COVERAGE_PATH: ${{ inputs.path }}
        COVERAGE_TYPE: ${{ inputs.coverage-type }}
        COVERAGE_COMMENT_DONTTEST: ${{ inputs.comment-donttest }}
        COVERAGE_COMMENT_DONTRUN: ${{ inputs.comment-dontrun }}
        MIN_COVERAGE: ${{ inputs.min-coverage }}
      run: |
        set -euo pipefail
        Rscript "$GITHUB_ACTION_PATH/run-coverage.R"

    - name: Upload coverage to Codecov
      if: inputs.upload-coverage == 'true'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ inputs.token }}
        fail_ci_if_error: ${{ inputs.fail-ci-if-error }}
        files: ./cobertura.xml
        plugins: noop
        disable_search: true

    # After the upload so a threshold miss still publishes cobertura.xml
    # (the artifact this capability exists to produce).
    # `success()` here is EXPLICIT, not load-bearing. A step's implicit
    # success() is overridden only when the `if:` contains a status check
    # function (success/failure/always/cancelled); a plain expression like
    # `inputs.min-coverage != ''` still requires every earlier step to have
    # succeeded -- see lint-changed-lines/action.yml, which relies on that
    # implicit behaviour in three places. Kept for readability, since a
    # threshold gate is where a reader most wants the ordering spelled out.
    # The min-coverage check skips spawning R when the caller left the bar off.
    - name: Enforce min-coverage
      if: success() && inputs.min-coverage != ''
      shell: bash
      env:
        MIN_COVERAGE: ${{ inputs.min-coverage }}
        COVERAGE_PERCENT: ${{ steps.coverage.outputs.percent }}
      run: |
        set -euo pipefail
        Rscript --vanilla "$GITHUB_ACTION_PATH/enforce-min-coverage.R"

    # Runs the package's tests a second time (covr::package_coverage above
    # already ran them once) purely to get a JUnit-formatted report --
    # covr's own coverage object isn't convertible to JUnit. Matches the
    # pattern UCD-SERG/serocalculator's bespoke workflow already used.
    - name: Create JUnit test-results report
      if: always() && inputs.upload-test-results == 'true'
      shell: Rscript {0}
      env:
        COVERAGE_PATH: ${{ inputs.path }}
      run: |
        junit_path <- file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "junit.xml")
        testthat::test_local(
          path = Sys.getenv("COVERAGE_PATH"),
          reporter = testthat::JunitReporter$new(junit_path)
        )

    - name: Upload test results to Codecov
      if: always() && inputs.upload-test-results == 'true'
      uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
      with:
        token: ${{ inputs.token }}
        fail_ci_if_error: ${{ inputs.fail-ci-if-error }}
        file: ${{ runner.temp }}/junit.xml

    - name: Show testthat output
      if: always()
      shell: bash
      env:
        INSTALL_PATH: ${{ steps.coverage.outputs.install_path || format('{0}/package', runner.temp) }}
      run: |
        set -euo pipefail
        find "$INSTALL_PATH" -name 'testthat.Rout*' -exec cat '{}' \; || true

    - name: Upload test results on failure
      if: failure() && inputs.failure-artifact-name != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.failure-artifact-name }}
        path: ${{ steps.coverage.outputs.install_path || format('{0}/package', runner.temp) }}
