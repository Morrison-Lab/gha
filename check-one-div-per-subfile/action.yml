name: Check one div per subfile
description: >-
  Diff-scoped check that flags a Quarto subfile (a `.qmd` file whose name
  starts with `_`, under a `_subfiles` directory) that holds more than one
  top-level fenced div, when the diff adds a line to it. New and revised
  content gets one div per subfile (Ezra, 2026-10-18), except that a proof
  may share a file with its claim and a solution with its exercise (Ezra,
  2026-10-23). Nested divs and `rem-source-` remarks do not count. Scoped to lines a diff adds (an added line whose exact text was also
  deleted in the same diff counts as moved). Warn-only by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only lines added since this ref are
      checked. On a pull request the reusable workflow passes `HEAD^1`, the
      base tip GitHub built the merge ref on.
      Diff mode needs the base commit in history (checkout with
      fetch-depth: 0); when the diff can't be computed (e.g. a shallow
      clone, or no base-ref given on a push run), the check is skipped with
      a warning rather than falling back to a whole-tree scan, which would
      reflag every subfile the corpus already carries.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked file the globs match, in full, instead of only the
      lines added since base-ref. Use it to measure a corpus; `base-ref` is
      ignored when this is 'true'.
    default: 'false'
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check. Git pathspecs
      match at any depth, so this is recursive by default.
    default: '*_subfiles/*.qmd'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  fail:
    description: >-
      Fail the action when a subfile holds more than one top-level div (else
      non-blocking). Defaults to 'false' (warning annotations only).
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check one div per subfile
      shell: bash
      env:
        ODS_BASE_REF: ${{ inputs.base-ref }}
        ODS_WHOLE_TREE: ${{ inputs.whole-tree }}
        ODS_GLOBS: ${{ inputs.globs }}
        ODS_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        ODS_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-one-div-per-subfile.py"
