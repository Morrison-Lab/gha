# Copy to .github/workflows/check-def-commentary.yml in your repo.
# Diff-scoped, blocking check: flags commentary written inside a `#def-` div
# ("It is not ...", "Note that ...", "Unlike ...") when a PR adds the line.
# A definition holds the definition, its notation and its display equation
# only; commentary goes in a `#rem-` div. Only contents:read is needed.
name: Check definition divs for commentary

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-def-commentary.yml@v3
    # with:
    #   globs: '*.qmd'                          # pathspecs to check (recursive)
    #   paths-ignore: 'chapters/outtakes/**'    # skip known-noisy paths
    #   fail: false                             # warn instead of block (defaults to true)
    #   whole-tree: true                        # scan every definition, not just a PR's additions
