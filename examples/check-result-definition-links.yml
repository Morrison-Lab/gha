# Copy to .github/workflows/check-result-definition-links.yml in your repo.
# Diff-scoped, warn-only check: flags a result div (#thm-, #lem-, #cor-, #prp-) a PR edits that links no definition (an @def- cross-reference or a link to a #def- anchor). <!-- check-result-definition-links: allow --> exempts one.
# Only contents:read is needed (the default), so no permissions block is required.
name: Check result definition links

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-result-definition-links.yml@v3
    # with:
    #   globs: '*.qmd'                         # pathspecs to check (recursive)
    #   paths-ignore: 'chapters/outtakes/**'   # skip known-noisy paths
    #   fail: true                             # block instead of warn (defaults to false)
    #   whole-tree: true                       # check every result div, not just those a PR touches
