# Copy to .github/workflows/ci.yml in your repo, or add the `gate` job to a
# workflow you already have and list every other job in its `needs`.
# The gate fails the run when any of them carries a notice, warning or failure
# annotation that is not allowlisted, so an annotation cannot sit on a green
# job unnoticed. GitHub's runner-image migration notice and the forced-Node
# deprecation warning are allowed for everyone.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: echo "your checks go here, or call other reusable workflows"
  gate:
    if: ${{ always() }}
    needs: [check] # every other job in this workflow
    permissions:
      actions: read
      checks: read
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/annotation-gate.yml@v3
    # with:
    #   levels: 'warning,failure'              # skip notices
    #   allow-patterns: |                      # tracked exceptions, regexes
    #     lychee .* Rejected status code: 503
