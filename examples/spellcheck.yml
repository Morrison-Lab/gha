# Copy to .github/workflows/spellcheck.yml in your repo.
#
# Replaces a bespoke check-spelling.yaml built on
# insightsengineering/r-spellcheck-action. Your existing inst/WORDLIST is the
# accepted vocabulary and needs no migration -- that is the {spelling} package's
# own format, which this capability keeps using.
name: Spellcheck

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  spellcheck:
    uses: Morrison-Lab/gha/.github/workflows/spellcheck.yml@v2
    # All inputs are optional; the defaults spellcheck the repository root.
    # with:
    #   path: '.'                       # package root, if not the repo root
    #   exclude: 'vignettes/*.Rmd'      # comma-separated globs; DELETES matches
    #   additional-options: ''          # drop --vanilla, so R reads its profiles
    #   install-quarto: 'auto'          # only if dependency resolution needs it
    #   runs-on: ubuntu-latest
