# Copy to .github/workflows/spellcheck.yml in your repo.
# Spellcheck an R package's prose (DESCRIPTION Title/Description,
# man/*.Rd, vignettes/, root README/NEWS/CHANGES/index).
#
# Complete reference:
# https://morrison-lab.github.io/gha/reference/spellcheck.html
name: Spellcheck

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: spellcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spellcheck:
    uses: Morrison-Lab/gha/.github/workflows/spellcheck.yml@v2
