# Copy to .github/workflows/check-base-r-tabs.yml in your repo.
# Diff-scoped check: fails when a PR adds or edits a panel-tabset that has an
# "R (tidymodels)" tab and no base R tab. Labs show tidymodels and base R side
# by side; opt a tabset out with <!-- base-r-tab: none: reason -->.
# Blocking by default. Only contents:read is needed.
name: Check base R tabs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-base-r-tabs.yml@v3
    # with:
    #   globs: '*.qmd'        # pathspecs to check
    #   fail: false           # warn only (defaults to true)
    #   whole-tree: true      # scan every tabset, not just touched ones
