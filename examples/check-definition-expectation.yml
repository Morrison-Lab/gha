# Copy to .github/workflows/check-definition-expectation.yml in your repo.
# Diff-scoped, warn-only heuristic check: flags a definition div (#def-) a PR edits that writes a probability-weighted sum or integral with no expectation operator. Define a quantity as an expectation where one fits. <!-- check-definition-expectation: allow --> exempts one.
# Only contents:read is needed (the default), so no permissions block is required.
name: Check definition expectation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-definition-expectation.yml@v3
    # with:
    #   globs: '*.qmd'                         # pathspecs to check (recursive)
    #   paths-ignore: 'chapters/outtakes/**'   # skip known-noisy paths
    #   fail: true                             # block instead of warn (defaults to false)
    #   whole-tree: true                       # check every definition, not just those a PR touches
