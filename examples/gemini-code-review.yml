# Copy to .github/workflows/gemini-code-review.yml in your repo.
# NOTE: requires GEMINI_API_KEY stored as a GitHub secret.
name: Gemini Code Review

on:
  # Optional: automatic review on PR activity.
  # pull_request:
  #   types: [opened, synchronize, ready_for_review, reopened]
  # Optional: direct on-demand trigger via comment.
  # issue_comment:
  #   types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string

jobs:
  dispatch-on-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '@gemini review') || startsWith(github.event.comment.body, '@gemini-cli review') || startsWith(github.event.comment.body, '/review')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
    steps:
      - name: Parse this workflow's ref
        id: this-wf
        uses: d-morrison/gha/.github/actions/parse-workflow-ref@v2
        with:
          workflow-ref: ${{ github.workflow_ref }}

      - name: Dispatch review for commented PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          WF_PATH: ${{ steps.this-wf.outputs.path }}
        run: |
          set -euo pipefail
          WF_FILE=$(basename "$WF_PATH")
          gh workflow run "$WF_FILE" --repo "$REPO" -f pr_number="$PR_NUMBER"

  review:
    needs: []
    uses: d-morrison/gha/.github/workflows/gemini-code-review.yml@v2
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
    with:
      pr-number: ${{ inputs.pr_number }}
