# Copy to .github/workflows/check-definition-equations.yml in your repo.
# Diff-scoped, warn-only heuristic check: flags a definition div (#def-) that a PR
# edits and that shows more than the equation linking the defined symbol to its
# definitional expression (a chain of equalities, several display equations, or an
# equivalence in prose). <!-- def-equiv-ok: reason --> exempts one.
# Only contents:read is needed (the default), so no permissions block is required.
name: Check definition equations

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-definition-equations.yml@v3
    # with:
    #   globs: '*.qmd'                         # pathspecs to check (recursive)
    #   paths-ignore: 'chapters/outtakes/**'   # skip known-noisy paths
    #   fail: true                             # block instead of warn (defaults to false)
    #   whole-tree: true                       # check every definition, not just those a PR touches
