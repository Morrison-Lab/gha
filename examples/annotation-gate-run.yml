# Copy to .github/workflows/annotation-gate.yml in your repo.
# For a repository whose checks are spread over many workflow files: this
# gates the latest run of every workflow on a commit when one finishes and
# posts a single `annotation-gate` check run on that commit, so it shows on the
# pull request. Add that check to the repository ruleset as required.
name: Annotation gate

on: # zizmor: ignore[dangerous-triggers] -- the gate checks out nothing and runs no code from the triggering run
  workflow_run:
    workflows: ["*"]
    types: [completed]
  workflow_dispatch:
    inputs:
      head-sha:
        description: >-
          Commit to gate again, with no new commit and no re-run of any other
          workflow. Use it when a gate failure has been fixed upstream.
        required: true
        type: string

# One gate per commit: a newer completion on the same commit replaces the gate
# waiting behind the running one, which `all-runs` makes redundant because it
# re-checks every workflow's latest run on the commit. Do not set
# `cancel-in-progress: true`: completions arriving every few seconds then cancel
# each running gate before it posts a check run (gha#1649).
# A gate run's own completion also starts a run of this workflow, whose job
# is skipped (see `if:` below). That run gets a group of its own, keyed on its
# run id: in the commit's group it would replace the real gate waiting behind
# the running one, and the commit could go ungated (gha#1403).
concurrency:
  group: ${{ github.event.workflow_run.name == 'Annotation gate' && format('annotation-gate-self-{0}', github.run_id) || format('annotation-gate-{0}', github.event.workflow_run.head_sha || inputs.head-sha) }}
  cancel-in-progress: false

jobs:
  gate:
    # The gate's own run must not trigger another gate.
    if: ${{ github.event.workflow_run.name != 'Annotation gate' }}
    permissions:
      actions: read
      checks: write
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/annotation-gate-run.yml@v3
    with:
      run-id: ${{ github.event.workflow_run.id }}
      run-attempt: ${{ github.event.workflow_run.run_attempt }}
      head-sha: ${{ github.event.workflow_run.head_sha || inputs.head-sha }}
      all-runs: true
    #   defer-while-running: true              # only the last gate of a burst does the work
    #   levels: 'warning,failure'              # skip notices
    #   allow-patterns: |                      # tracked exceptions, regexes
    #     lychee .* Rejected status code: 503
