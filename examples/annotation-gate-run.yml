# Copy to .github/workflows/annotation-gate.yml in your repo.
# For a repository whose checks are spread over many workflow files: this
# gates the latest run of every workflow on a commit when one finishes and
# posts a single `annotation-gate` check run on that commit, so it shows on the
# pull request. Add that check to the repository ruleset as required.
name: Annotation gate

on: # zizmor: ignore[dangerous-triggers] -- the gate checks out nothing and runs no code from the triggering run
  workflow_run:
    workflows: ["*"]
    types: [completed]

# One gate per commit: a newer completion on the same commit cancels the older
# gate, which has already been superseded because `all-runs` re-checks every
# workflow's latest run on the commit.
concurrency:
  group: annotation-gate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  gate:
    # The gate's own run must not trigger another gate.
    if: ${{ github.event.workflow_run.name != 'Annotation gate' }}
    permissions:
      actions: read
      checks: write
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/annotation-gate-run.yml@v3
    with:
      run-id: ${{ github.event.workflow_run.id }}
      run-attempt: ${{ github.event.workflow_run.run_attempt }}
      head-sha: ${{ github.event.workflow_run.head_sha }}
      all-runs: true
    #   levels: 'warning,failure'              # skip notices
    #   allow-patterns: |                      # tracked exceptions, regexes
    #     lychee .* Rejected status code: 503
