# Copy to .github/workflows/check-secrets.yml in your repo.
# Scans the repository's git HISTORY for committed credentials -- API tokens,
# private keys, high-entropy password assignments -- using gitleaks.
# History rather than the diff: a secret committed and then removed in a later
# commit is still exposed, because the orphaned commit stays fetchable through
# the GitHub API until the repository is garbage-collected.
# Only contents:read is needed (the default), so no permissions block is required.
name: Check for secrets

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-secrets.yml@v2
    # with:
    #   paths-ignore: 'tests/fixtures/,docs/examples/'  # Go regexes, not globs
    #   allowlist-file: '.github/secrets-allowlist.txt' # regexes to suppress
    #   config: '.gitleaks.toml'                        # extra rules
    #   fail: false                                     # warn instead of failing
#
# Suppressing a false positive:
#   - Add a `gitleaks:allow` comment on the offending line, or
#   - Commit its fingerprint (printed in the run summary as rule/file/commit;
#     the full form is `<commit>:<file>:<rule>:<line>`) to a `.gitleaksignore`
#     file at the repo root, or
#   - List a regex matching it in the allowlist file above, or exclude the
#     whole path with `paths-ignore`.
#
# This complements GitHub's own secret scanning rather than replacing it: that
# is a repository setting, it evaluates pushes rather than running as a PR
# check, and it cannot be supplied by a reusable workflow. Neither substitutes
# for ROTATING a credential once it has been exposed -- rewriting history does
# not un-expose it.
