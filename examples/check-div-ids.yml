# Copy to .github/workflows/check-div-ids.yml in your repo.
# Diff-scoped check: flags a fenced div with a theorem-type class (.remark,
# .definition, ...) but no matching id (#rem-, #def-, ...) when a PR adds its
# opening line. Without the id the div renders as a plain block quote.
# Warn-only by default.
# Only contents:read is needed (the default), so no permissions block is required.
name: Check div ids

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-div-ids.yml@v3
    # with:
    #   globs: '*.qmd'              # pathspecs to check (recursive)
    #   paths-ignore: 'chapters/outtakes/**'   # skip known-noisy paths
    #   fail: true                             # block instead of warn (defaults to false)
    #   whole-tree: true                       # scan every div, not just a PR's additions
