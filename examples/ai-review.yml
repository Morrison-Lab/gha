# Copy to .github/workflows/ai-review.yml in your repo.
# Requests a review from one of the configured AI agents (random choice with fallback).
name: AI Review

on:
  # Opt-in to run automatically on PR activity:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string

jobs:
  ai-review:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && (contains(github.event.comment.body, '@ai review') || contains(github.event.comment.body, '@ai-review') || startsWith(github.event.comment.body, '/review'))) ||
        (github.event_name == 'pull_request_review_comment' && (contains(github.event.comment.body, '@ai review') || contains(github.event.comment.body, '@ai-review'))) ||
        (github.event_name == 'pull_request_review' && (contains(github.event.review.body, '@ai review') || contains(github.event.review.body, '@ai-review')))
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), (github.event.comment.author_association || github.event.review.author_association || github.event.sender.author_association))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    uses: d-morrison/gha/.github/workflows/ai-code-review.yml@v2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
      WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
    with:
      agents: 'claude, gemini' # pool of configured AI agents
      pr-number: ${{ inputs.pr_number }}
      claude-review-workflow-file: claude-code-review.yml
      gemini-review-workflow-file: gemini-code-review.yml
