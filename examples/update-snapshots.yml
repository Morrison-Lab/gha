# Copy to .github/workflows/update-snapshots.yml in your repo.
#
# One-time setup: Settings -> Actions -> General -> Workflow permissions ->
# "Read and write permissions" so the job can push the snapshot commit back
# to the branch. To have that commit trigger CI, also pass a WORKFLOW_TOKEN
# secret (a fine-grained PAT with Contents: Read and write), as below.
name: Update snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to update snapshots on
        required: true
        default: main

jobs:
  update-snapshots:
    uses: Morrison-Lab/gha/.github/workflows/update-snapshots.yml@v2
    permissions:
      contents: write
    with:
      ref: ${{ inputs.branch }}
      # julia: true
      # julia-version: '1'
      # julia-project: inst/julia
      # apt-packages: ''   # default installs the standard R system-deps list; set '' to skip, or pass your own
      # extra-packages: any::testthat
      # needs: check
      # commit-message: 'Update testthat snapshots [auto]'
      # committer-name: github-actions[bot]
      # committer-email: 41898282+github-actions[bot]@users.noreply.github.com
    # Optional: push with a token so the snapshot commit triggers CI.
    # secrets:
    #   WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
