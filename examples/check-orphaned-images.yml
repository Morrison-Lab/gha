# Copy to .github/workflows/check-orphaned-images.yml in your repo.
# Warns about committed images that no page, config, stylesheet or filter
# names. Warn-only by default: an unused file breaks nothing, and a name
# search cannot see an image named by a computed string (paths-ignore it).
# Only contents:read is needed (the default), so no permissions block is required.
name: Check orphaned images

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-orphaned-images.yml@v3
    # with:
    #   paths: 'images/'                       # where to look for images
    #   paths-ignore: 'images/generated/**'    # images used in ways a name search cannot see
    #   source-extensions: '.qmd, .md, .yml, .R'  # also count a script naming the figure
    #   added-only: true                       # on PRs, only report images the PR adds
    #   fail: true                             # block instead of warning
