# Copy to .github/workflows/check-heading-siblings.yml in your repo.
# Diff-scoped check: flags a heading a PR adds to a group of more than 7
# sibling headings (same level, same parent, includes expanded).
# Warn-only by default.
# Only contents:read is needed (the default), so no permissions block is required.
name: Check heading siblings

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-heading-siblings.yml@v3
    # with:
    #   globs: '*.qmd'                         # pathspecs to check (recursive)
    #   paths-ignore: 'chapters/outtakes/**'   # skip known-noisy paths
    #   max: '7'                               # sibling headings per parent
    #   fail: true                             # block instead of warn (defaults to false)
    #   whole-tree: true                       # scan every page, not just a PR's additions
