# Copy to .github/workflows/check-caller-permissions.yml in your repo.
# Whole-tree check: fails when a workflow calls a Morrison-Lab/gha reusable
# workflow from a job that does not grant the permissions the callee's jobs
# request. GitHub rejects such a call at startup, so a scheduled caller stops
# silently; this catches it at pull-request time. Blocking by default.
# Only contents:read is needed (the default), so no permissions block is required.
name: Check caller permissions

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-caller-permissions.yml@v3
    # with:
    #   workflows-dir: .github/workflows   # where the callers live
    #   fail: true                         # set false to warn only (defaults to true)
