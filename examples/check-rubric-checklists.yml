# Copy to .github/workflows/check-rubric-checklists.yml in your repo.
# Diff-scoped check: warns when a PR adds or revises a grading rubric (a line
# opening with Grading, Rubric, Marking scheme or Mark scheme) that has no task-list item
# (- [ ] ...). Most STEM rubrics are checklists. <!-- rubric-ok: reason -->
# exempts one rubric.
# Only contents:read is needed (the default), so no permissions block is required.
name: Check rubric checklists

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-rubric-checklists.yml@v3
    # with:
    #   globs: '*.qmd *.md'                    # pathspecs to check (recursive)
    #   paths-ignore: 'chapters/outtakes/**'   # skip known-noisy paths
    #   fail: true                             # block instead of warn (defaults to false)
    #   whole-tree: true                       # scan every rubric, not just those a PR touches
