# Copy to .github/workflows/check-hybrid-sentences.yml in your repo.
# Diff-scoped, warn-only heuristic check: flags a sentence in a paragraph a PR edits
# that states one condition in words and another as a relation between math
# expressions (a hybrid sentence). <!-- hybrid-ok: reason --> exempts one.
# Only contents:read is needed (the default), so no permissions block is required.
name: Check hybrid sentences

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-hybrid-sentences.yml@v3
    # with:
    #   globs: '*.qmd'                         # pathspecs to check (recursive)
    #   paths-ignore: 'chapters/outtakes/**'   # skip known-noisy paths
    #   fail: true                             # block instead of warn (defaults to false)
    #   whole-tree: true                       # check every paragraph, not just those a PR touches
