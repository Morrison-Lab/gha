# Copy to .github/workflows/check-dependency-updates.yml in your repo.
#
# Runs automated dependency freshness audit on your repository,
# checking third-party GitHub Actions pins, renv packages, and tool
# versions against upstream releases and filing high-value opportunities
# and to-dos as tracked issues.
#
# NOTE: requires either CLAUDE_CODE_OAUTH_TOKEN (Claude Max plan) or
# ANTHROPIC_API_KEY. Pass secrets explicitly below.
name: Check Dependency Updates

on:
  schedule:
    - cron: '0 14 * * 1' # Weekly on Monday at 14:00 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run audit without filing issues (output to step summary)
        type: boolean
        default: false

jobs:
  audit:
    permissions:
      contents: read
      issues: write
    uses: Morrison-Lab/gha/.github/workflows/check-dependency-updates.yml@v3
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      dry-run: ${{ inputs.dry-run || false }}
    #   max-issues: 5
    #   labels: 'enhancement'
    #   model: 'claude-sonnet-4-5'
    #   use-ai-config: true
    #   timeout-minutes: 45
