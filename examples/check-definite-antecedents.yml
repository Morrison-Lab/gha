# Copy to .github/workflows/check-definite-antecedents.yml in your repo.
# Diff-scoped, warn-only heuristic: flags a div (or a file with no div) whose first
# sentence starts with an unlinked The, These, Those, This or That, so nothing
# earlier in the div can be the antecedent. Warn-only by default.
# Only contents:read is needed (the default), so no permissions block is required.
name: Check definite antecedents

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-definite-antecedents.yml@v3
    # with:
    #   globs: '*.qmd'                        # pathspecs to check (recursive)
    #   paths-ignore: 'chapters/outtakes/**'   # skip known-noisy paths
    #   fail: true                             # block instead of warn (defaults to false)
    #   whole-tree: true                       # scan every file, not just a PR's additions
