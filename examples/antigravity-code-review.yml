# Copy to .github/workflows/antigravity-code-review.yml in your repo.
# NOTE: Do NOT declare a top-level `concurrency:` block in this caller workflow.
# The reusable workflow manages per-PR concurrency internally on its job
# (`group: antigravity-review-<mode>-<PR>`). A top-level `concurrency:` block with a PR-scoped
# group name deadlocks GitHub Actions against the nested `antigravity-review` job
# and cancels the run ([gha#437](https://github.com/Morrison-Lab/gha/issues/437)).
#
# NOTE: Requires GEMINI_API_KEY stored as a GitHub secret. Pass secrets explicitly.
#
# Default: Automatic review on every PR push.
# Optional: Uncomment `issue_comment` below to allow `/antigravity review` or `/review` comments.
name: Antigravity Code Review

on:
  # Note: GitHub suppresses pull_request workflow runs when a pull request
  # has merge conflicts with the target branch. For conflicting PRs, resolve
  # the conflict or trigger review via workflow_dispatch below (gha#859).
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

  # Option B (On-Request): Direct on-demand `/review` or `/antigravity review` path.
  # issue_comment:
  #   types: [created]

  # Manual dispatch or bot re-dispatch.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string
      mode:
        description: 'Operational mode: code-review, security-audit, or test-generation'
        required: false
        default: 'code-review'
        type: choice
        options:
          - code-review
          - security-audit
          - test-generation

jobs:
  # `/review` or `/antigravity review` comment handler for on-demand requests.
  dispatch-on-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/review') || startsWith(github.event.comment.body, '/antigravity review')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
    steps:
      - name: Parse workflow ref
        id: this-wf
        uses: Morrison-Lab/gha/.github/actions/parse-workflow-ref@v2
        with:
          workflow-ref: ${{ github.workflow_ref }}

      - name: Install helper scripts
        id: scripts
        uses: Morrison-Lab/gha/.github/actions/install-gha-scripts@v3
        with:
          scripts: 'detect-pr-workflow-edits.sh'

      - name: Dispatch Antigravity Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.issue.number }}
          WF_PATH: ${{ steps.this-wf.outputs.path }}
          SCRIPTS_DIR: ${{ steps.scripts.outputs.dir }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ ! "$COMMENT_BODY" =~ ^/(review|antigravity[[:space:]]+review)([[:space:]]|$) ]]; then
            echo "Comment does not start with a standalone '/review' or '/antigravity review' command; skipping dispatch."
            exit 0
          fi
          WF_FILE=$(basename "$WF_PATH")
          PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          PR_STATE=$(jq -r '.state' <<< "$PR_JSON")
          PR_MERGED=$(jq -r '.merged' <<< "$PR_JSON")
          if [[ "$PR_STATE" == "closed" || "$PR_MERGED" == "true" ]]; then
            echo "::notice::PR #$PR_NUMBER is closed or merged; skipping review dispatch."
            exit 0
          fi
          PR_BRANCH=$(jq -r '.head.ref' <<< "$PR_JSON")
          PR_HEAD_REPO=$(jq -r '.head.repo.full_name' <<< "$PR_JSON")

          DEFAULT_REF_ARGS=()
          if [ -n "${DEFAULT_BRANCH:-}" ]; then
            DEFAULT_REF_ARGS=(--ref "$DEFAULT_BRANCH")
          fi
          REF_ARGS=(--ref "$PR_BRANCH")
          if [ "$PR_HEAD_REPO" != "$REPO" ]; then
            echo "::notice::PR #$PR_NUMBER is from a fork ($PR_HEAD_REPO); dispatching $WF_FILE from the default branch."
            REF_ARGS=("${DEFAULT_REF_ARGS[@]}")
          fi
          # When the PR edits top-level workflow YAML, manual dispatches cannot
          # execute untrusted workflow YAML from the PR branch, and default-branch
          # dispatches cannot attach status checks to the PR head while preempting
          # the in-flight push-triggered review (gha#598, gha#921).
          # Skip review dispatch on workflow edits so the push-triggered pull_request review
          # (which restores default-branch workflows after checkout) runs to completion on
          # the PR head without being destroyed by a default-branch dispatch.
          # Workflow-edit detection routes through detect-pr-workflow-edits.sh (gha#920).
          # GET .../files is capped at 3000 files (GitHub REST "List pull
          # requests files", read 2026-08-26). Keep in sync with
          # list-pr-changed-files.sh.
          changed=$(jq -r '.changed_files' <<< "$PR_JSON")
          listed=0
          if ! files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate --jq '.[].filename'); then
            echo "::notice::Could not list a complete file set for PR #$PR_NUMBER; skipping review dispatch to avoid executing untrusted workflow YAML or preempting PR-head checks (gha#598, gha#921)."
            NOTICE_BODY=":warning: Review was not dispatched: Could not verify whether PR #$PR_NUMBER edits workflow files (file list API failed). The automatic review triggered on push runs with default-branch workflows restored and attaches checks to the PR head. To trigger a fresh review, push a new commit (or \`git commit --allow-empty\`)."
            printf '%s' "$NOTICE_BODY" | jq -Rs '{body: .}' \
              | gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                  --method POST \
                  -H "Content-Type: application/json" \
                  --input - > /dev/null || true
            exit 0
          else
            files=$(printf '%s' "$files" | tr -d '\r')
            if [ -n "$files" ]; then
              listed=$(printf '%s\n' "$files" | grep -c . || true)
            fi
            if [ -z "$changed" ] || [ "$changed" = "null" ] || ! [[ "$changed" =~ ^[0-9]+$ ]] || [ "$listed" -lt "$changed" ]; then
              echo "::notice::Could not list a complete file set for PR #$PR_NUMBER; skipping review dispatch to avoid executing untrusted workflow YAML or preempting PR-head checks (gha#598, gha#921)."
              NOTICE_BODY=":warning: Review was not dispatched: PR #$PR_NUMBER file list was truncated ($listed of $changed files). The automatic review triggered on push runs with default-branch workflows restored and attaches checks to the PR head. To trigger a fresh review, push a new commit (or \`git commit --allow-empty\`)."
              printf '%s' "$NOTICE_BODY" | jq -Rs '{body: .}' \
                | gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                    --method POST \
                    -H "Content-Type: application/json" \
                    --input - > /dev/null || true
              exit 0
            else
              detect_out="$(CALLER_WF_PATH="" bash "$SCRIPTS_DIR/detect-pr-workflow-edits.sh" - <<< "$files")"
              if [ "$(sed -n 's/^workflow_edits=//p' <<< "$detect_out")" = "true" ]; then
                echo "::notice::PR #$PR_NUMBER edits workflow files; skipping review dispatch because default-branch dispatches cannot attach status checks to the PR head and would preempt in-flight pull_request reviews (gha#921)."
                NOTICE_BODY=":warning: Review was not dispatched: PR #$PR_NUMBER edits workflow files (\`.github/workflows/*.yml\`). For security, manual dispatches cannot execute untrusted workflow YAML, and default-branch dispatches cannot attach status checks to the PR head (gha#921). The automatic review triggered on push runs with default-branch workflows restored and attaches checks to the PR head. To trigger a fresh review, push a new commit (or \`git commit --allow-empty\`)."
                printf '%s' "$NOTICE_BODY" | jq -Rs '{body: .}' \
                  | gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                      --method POST \
                      -H "Content-Type: application/json" \
                      --input - > /dev/null || true
                exit 0
              fi
            fi
          fi

          gh workflow run "$WF_FILE" --repo "$REPO" "${REF_ARGS[@]}" -f pr_number="$PR_NUMBER"
          # gh issue comment uses the GraphQL addComment mutation which requires
          # pull_requests: write on pull requests. Use the REST endpoint, which
          # accepts issues: write (gha#931).
          NOTICE_BODY=":robot: Dispatched an Antigravity Agent review for PR #$PR_NUMBER (see [run]($RUN_URL))."
          if ! printf '%s' "$NOTICE_BODY" | jq -Rs '{body: .}' \
            | gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                --method POST \
                -H "Content-Type: application/json" \
                --input - > /dev/null; then
            echo "::warning::Could not acknowledge comment."
          fi

  review:
    if: github.event_name != 'issue_comment'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: Morrison-Lab/gha/.github/workflows/antigravity-code-review.yml@v2
    with:
      mode: ${{ inputs.mode || 'code-review' }}
      pr-number: ${{ inputs.pr_number }}
      trigger-policy: ${{ github.event_name == 'pull_request' && 'on-push' || 'on-request' }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
