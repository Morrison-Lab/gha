# Copy to .github/workflows/check-exercise-question-paragraph.yml in your repo.
# Diff-scoped check: fails when a PR adds a paragraph of an exercise (#exr- div)
# that mixes scenario information with the instruction or question. The task
# goes in its own paragraph, after the scenario.
# <!-- question-paragraph-ok: reason --> exempts one exercise.
# Only contents:read is needed (the default), so no permissions block is required.
name: Check exercise question paragraphs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-exercise-question-paragraph.yml@v3
    # with:
    #   globs: '*.qmd'        # pathspecs to check (recursive)
    #   fail: false           # warn instead of block (defaults to true)
    #   whole-tree: true      # scan every exercise, not just a PR's additions
