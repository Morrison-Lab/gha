# Copy to .github/workflows/check-code-messages.yml in your repo.
# Diff-scoped check: flags a geom_smooth() or stat_smooth() call missing
# `method` or `formula`, and a geom_histogram() or stat_bin() call with no `bins`,
# `binwidth` or `breaks`, when a PR adds a line to it, so a render prints no
# warning or message. Warn-only by default.
# Only contents:read is needed (the default), so no permissions block is required.
name: Check code messages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-code-messages.yml@v3
    # with:
    #   globs: '*.qmd *.Rmd *.R'    # pathspecs to lint (recursive)
    #   fail: true                  # block instead of warn (defaults to false)
    #   whole-tree: true            # lint every file, not just a PR's additions
