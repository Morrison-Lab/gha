# Copy to .github/workflows/check-serial-comma.yml in your repo.
# Diff-scoped check: fails when a PR adds a list of three or more items with no
# comma before the final "and" or "or", as in "mean, median and mode".
# Write "mean, median, and mode". A line that must keep the other form takes
# `<!-- check-serial-comma: allow -->`.
# Blocking by default. Only contents:read is needed.
name: Check serial comma

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-serial-comma.yml@v3
    # with:
    #   globs: '*.qmd *.md'   # pathspecs to check
    #   fail: false           # warn only (defaults to true)
    #   whole-tree: true      # scan every file, not just a PR's additions
