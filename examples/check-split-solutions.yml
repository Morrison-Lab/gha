# Copy to .github/workflows/check-split-solutions.yml in your repo.
# Diff-scoped check: fails when a PR touches a split exercise (several #exr-
# divs sharing a slug once -partK is removed) whose solution is not split with
# it: a missing or orphaned #sol-, part labels in a solution, or a figure that
# a sibling exercise asks for. <!-- split-solutions-ok: reason --> exempts one.
# Only contents:read is needed (the default), so no permissions block is required.
name: Check split solutions

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-split-solutions.yml@v3
    # with:
    #   globs: '*.qmd'                         # pathspecs to check (recursive)
    #   paths-ignore: 'chapters/outtakes/**'   # skip known-noisy paths
    #   fail: false                            # warn instead of block (defaults to true)
    #   whole-tree: true                       # scan every exercise, not just those a PR touches
