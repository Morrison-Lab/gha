# Copy to .github/workflows/cleanup-pr-previews.yml in your repo.
# NOTE: Do NOT name a `concurrency:` group `gh-pages` anywhere in this
# caller workflow -- neither a top-level block nor one on the calling job,
# which deadlock identically (gha#811). Any OTHER group name is fine, and
# is how you serialize this workflow's own runs.
# The reusable workflow serializes its gh-pages branch
# modifications with the deploy workflows on its `cleanup` job
# (`group: gh-pages`). A caller-level block
# with the same group name deadlocks GitHub Actions against the nested job:
# the job fails with no runner, no steps, and no log. This workflow
# publishes nothing, so the symptom is not a stale site: the deletions
# never land, and preview directories for closed PRs accumulate on
# gh-pages ([gha#809](https://github.com/Morrison-Lab/gha/issues/809)).
#
# Housekeeping half of the PR-preview family: periodically deletes gh-pages
# preview directories for PRs that are no longer open. The calling job grants
# contents:write so it can commit the deletions back to gh-pages.
name: Clean up PR Previews

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight UTC

jobs:
  cleanup:
    permissions:
      contents: write
      pull-requests: read
    uses: Morrison-Lab/gha/.github/workflows/cleanup-pr-previews.yml@v2
    # with:
    #   preview-dir: pr-preview     # gh-pages dir holding the per-PR previews
    #   compact-history: true       # orphan-squash gh-pages to one commit after
    #                               # pruning, so deleted snapshots stop bloating
    #                               # the repo. Branch-based Pages only.
