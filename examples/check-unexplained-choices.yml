# Copy to .github/workflows/check-unexplained-choices.yml in your repo.
# Diff-scoped check: fails when a PR adds a binning choice in code (cut(),
# breaks=, bins=, binwidth=) and the figure, example or section's prose gives no
# reason for it.
# Only contents:read is needed.
name: Check for unexplained analysis choices

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-unexplained-choices.yml@v3
    # with:
    #   globs: '*.qmd'                          # pathspecs to check (recursive)
    #   paths-ignore: 'chapters/outtakes/**'    # skip known-noisy paths
    #   fail: false                             # warn instead of block (defaults to true)
    #   whole-tree: true                        # scan every choice, not just a PR's additions
