# Copy to .github/workflows/summary.yml in your repo.
# NOTE: the calling job must grant issues:write + models:read.
name: Summarize new issues

on:
  issues:
    types: [opened]

jobs:
  summary:
    permissions:
      issues: write
      models: read
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/summary.yml@v1
