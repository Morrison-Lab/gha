project:
  type: website
  output-dir: _site

website:
  title: "Morrison-Lab/gha"
  description: >-
    Central, reusable GitHub Actions for d-morrison / UCD-SERG / ucdavis
    R-package and Quarto repositories.
  site-url: "https://morrison-lab.github.io/gha/"
  repo-url: "https://github.com/Morrison-Lab/gha"
  repo-subdir: website
  repo-actions: [issue, edit]
  page-navigation: true
  navbar:
    left:
      - text: "Overview"
        href: index.qmd
      - text: "Workflows"
        href: workflows.qmd
      - text: "Permissions"
        href: permissions.qmd
      - text: "Versioning"
        href: versioning.qmd
    right:
      - icon: github
        href: "https://github.com/Morrison-Lab/gha"
        aria-label: "GitHub repository"
  sidebar:
    style: floating
    contents:
      - index.qmd
      - workflows.qmd
      - permissions.qmd
      - versioning.qmd
      - section: "Reference"
        contents:
          - reference/check-ai-tells.qmd
          - reference/check-bibliography-dois.qmd
          - reference/check-non-standard-chars.qmd
          - reference/check-phi.qmd
          - reference/check-secrets.qmd
          - reference/check-links.qmd
          - reference/lint-yaml.qmd
          - reference/lint-markdown.qmd
          - reference/check-new-line-breaks.qmd
          - reference/lint-qmd.qmd
          - reference/lint-changed-lines.qmd
          - reference/check-news.qmd
          - reference/assemble-news.qmd
          - reference/test-coverage.qmd
          - reference/update-snapshots.qmd
          - reference/summary.qmd
          - reference/quarto-publish.qmd
          - reference/report-failure.qmd
          - reference/preview.qmd
          - reference/preview-deploy.qmd
          - reference/check-equation-renders.qmd
          - reference/cleanup-pr-previews.qmd
          - reference/claude.qmd
          - reference/claude-code-review.qmd
          - reference/gemini.qmd
          - reference/gemini-code-review.qmd
          - reference/antigravity-code-review.qmd
          - reference/ai-code-review.qmd
          - reference/small-model-agent.qmd
          - reference/bump-submodule.qmd
          - reference/sync-shared-fragments.qmd
          - reference/sync-upstream.qmd
          - reference/request-dependabot-review.qmd
          - reference/altdoc-multiversion-docs.qmd
          - reference/bump-dev-version.qmd
          - reference/version-check.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    code-copy: true
