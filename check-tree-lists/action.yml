name: Check tree lists
description: >-
  Diff-scoped check that flags a definition, example, theorem-type, remark
  or exercise div that mentions a tree, holds a list nested three or more
  levels deep, and has no figure, when the diff adds a line to it. A tree
  is drawn as a diagram figure, not only written as nested bullets (Ezra,
  2026-10-26). A figure is an image, a `fig-` labelled chunk or div, an
  `@fig-` reference or an include of a `_fig` subfile; a
  `<!-- no-tree-figure: reason -->` comment in the div is a justified
  exception. Scoped to lines a diff adds. Blocking by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only lines added since this ref are
      checked. On a pull request the reusable workflow passes `HEAD^1`, the
      base tip GitHub built the merge ref on.
      Diff mode needs the base commit in history (checkout with
      fetch-depth: 0); when the diff can't be computed (e.g. a shallow
      clone, or no base-ref given on a push run), the check is skipped with
      a warning rather than falling back to a whole-tree scan, which would
      reflag every tree list the corpus already carries.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked file the globs match, in full, instead of only the
      lines added since base-ref. Use it to measure a corpus; `base-ref` is
      ignored when this is 'true'.
    default: 'false'
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check. Git pathspecs
      match at any depth, so this is recursive by default.
    default: '*.qmd'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  fail:
    description: >-
      Fail the action when a tree is written only as a list (else
      non-blocking). Defaults to 'true'.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check tree lists
      shell: bash
      env:
        TLS_BASE_REF: ${{ inputs.base-ref }}
        TLS_WHOLE_TREE: ${{ inputs.whole-tree }}
        TLS_GLOBS: ${{ inputs.globs }}
        TLS_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        TLS_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-tree-lists.py"
