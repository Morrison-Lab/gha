name: Check f forms written as \name\paren{...}
description: >-
  Diff-scoped check that flags `\name\paren{...}` (or `\sb{`, `\cb{`, `\set{`, `\abs{`, `\norm{`, `\angb{`) where a `\namef{...}` macro
  exists, in `.qmd`, `.Rmd` and `.md` files. The known f forms are read from
  the `\providecommand{\XXXf}`, `\newcommand{\XXXf}` and `\def\XXXf` definitions in a
  macros file (default `latex-macros/macros.qmd`); a missing file skips the
  check with a warning. Does not flag a bare delimiter macro or a macro with no f
  form. Skips code fences and spans, HTML comments and front matter.
  Scoped to lines a diff adds (an added line whose exact text was also deleted
  in the same diff counts as moved). Warn-only by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only lines added since this ref are
      checked. On a pull request the reusable workflow passes `HEAD^1`, the
      base tip GitHub built the merge ref on.
      Diff mode needs the base commit in history (checkout with
      fetch-depth: 0); when the diff can't be computed (e.g. a shallow
      clone, or no base-ref given on a push run), the check is skipped with
      a warning rather than falling back to a whole-tree scan, which would
      reflag every use the repository already has.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked file the globs match, in full, instead of only the
      lines added since base-ref. Use it to measure a corpus; `base-ref` is
      ignored when this is 'true'.
    default: 'false'
  macros-file:
    description: >-
      Path of the macros file whose `\providecommand{\XXXf}` and
      `\newcommand{\XXXf}` definitions name the known f forms. When the file is
      missing the check is skipped with a warning.
    default: 'latex-macros/macros.qmd'
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check. Git pathspecs
      match at any depth, so this is recursive by default.
    default: '*.qmd *.Rmd *.md'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  fail:
    description: >-
      Fail the action when a `\name\paren{...}` with an f form is found (else
      non-blocking). Defaults to 'false' (warning annotations only).
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check f forms written as \name\paren{...}
      shell: bash
      env:
        CFP_BASE_REF: ${{ inputs.base-ref }}
        CFP_WHOLE_TREE: ${{ inputs.whole-tree }}
        CFP_MACROS_FILE: ${{ inputs.macros-file }}
        CFP_GLOBS: ${{ inputs.globs }}
        CFP_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        CFP_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-fform-paren.py"
