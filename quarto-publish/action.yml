name: Build a Quarto site for GitHub Pages
description: >-
  Set up Quarto (optionally R/renv and TinyTeX) and render a Quarto project into
  its output directory. The reusable quarto-publish.yml workflow wraps this and
  deploys the rendered site to the gh-pages branch; callers that only want to
  render (e.g. a preview build, or to deploy the output themselves) can use this
  composite directly and read the site from "<path>/<output-dir>".
inputs:
  path:
    description: >-
      Path (relative to the caller repo root) to the Quarto project to render:
      the directory containing _quarto.yml. Its rendered output lands at the
      output-dir below.
    default: '.'
  setup-r:
    description: >-
      Install R and the project's R dependencies before rendering. Enable for
      R/knitr Quarto projects; leave false for pure-markdown sites.
    default: 'false'
  r-packages:
    description: >-
      r-lib/actions package specs to install when setup-r is true and use-renv
      is false (newline- or comma-separated, e.g. "any::knitr\nany::rmarkdown").
    default: |
      any::knitr
      any::rmarkdown
  use-renv:
    description: >-
      Restore R dependencies with renv instead of r-packages (requires setup-r).
    default: 'false'
  install-package:
    description: >-
      Run `R CMD INSTALL <path>` to install the caller repo as a local package
      before rendering (requires setup-r).
    default: 'false'
  setup-chrome:
    description: >-
      Install Chrome via browser-actions/setup-chrome before rendering (needed
      for revealjs / screenshot / mermaid rendering).
    default: 'false'
  tinytex:
    description: Install TinyTeX (needed to render PDF outputs).
    default: 'false'
  setup-julia:
    description: >-
      Install Julia with julia-actions/setup-julia before rendering, for pages
      that execute `{julia}` chunks. Under knitr those run through the R
      package JuliaCall, which the caller installs via `r-packages` (or renv);
      when JuliaCall is installed, its own Julia dependencies (RCall and
      Suppressor) are set up in a separate step so a failure there is not
      buried in the render log. Also sets R_LD_LIBRARY_PATH to R's own lib
      directory for that step and the render, so Julia started by R loads its own
      libunwind rather than the system one, which segfaults on any Julia
      exception.
    default: 'false'
  julia-version:
    description: Julia version to install (setup-julia's `version` syntax). Only used when setup-julia is true.
    default: '1'
  apt-packages:
    description: Extra apt packages to install before rendering (space-separated).
    default: ''
  output-dir:
    description: >-
      Directory the rendered site is written to, relative to
      `path`. Forwarded to `quarto render --output-dir`, so this input is
      authoritative — it overrides any `output-dir` set in the project's
      `_quarto.yml`. Defaults to `_site`.
    default: '_site'
  render-profile:
    description: Quarto `--profile` to render with (e.g. 'website'). Empty to omit.
    default: ''
  formats:
    description: >-
      Whitespace- or newline-separated Quarto output formats to render
      individually in order (e.g. "pdf docx revealjs html"). When set, renders
      each format in its own process passing --no-clean to subsequent formats,
      preventing V8 heap exhaustion on large multi-format sites.
    default: ''
  freeze-cache:
    description: >-
      Restore and save Quarto _freeze directory via actions/cache keyed on
      renv.lock and commit SHA.
    default: 'false'
  deno-v8-options:
    description: >-
      Options passed to Deno V8 via QUARTO_DENO_V8_OPTIONS to raise the heap
      cap for large site renders. Empty string disables the heap-cap override.
    default: '--max-old-space-size=12288,--max-heap-size=12288'
  fail-on-render-warning:
    description: >-
      Fail the build if Quarto emits any render warnings (WARN in the render log).
    default: 'false'
  forbid-log-patterns:
    description: >-
      Newline-separated fixed string patterns that will fail the build if found
      in the Quarto render log.
    default: ''
  timezone:
    description: >-
      IANA time zone (e.g. 'America/Los_Angeles') exported as `TZ` for the
      render and later steps, so `date: last-modified` and similar stamps
      are not in UTC. Empty (default) leaves the runner's time zone unchanged.
      A value containing a newline or `=` is rejected.
    default: ''
runs:
  using: composite
  steps:
    - name: Set time zone
      if: inputs.timezone != ''
      shell: bash
      env:
        TIMEZONE: ${{ inputs.timezone }}
      run: |
        set -euo pipefail
        # The value is appended to GITHUB_ENV, so a newline would inject
        # another variable and an `=` would corrupt the TZ assignment.
        case "$TIMEZONE" in
          *$'\n'* | *$'\r'* | *=*)
            echo "::error::timezone must not contain a newline or '='"
            exit 1
            ;;
        esac
        echo "TZ=$TIMEZONE" >> "$GITHUB_ENV"

    - name: Install apt packages
      if: inputs.apt-packages != ''
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y $APT_PACKAGES

    - name: Setup Chrome
      if: inputs.setup-chrome == 'true'
      uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0

    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
      env:
        # `quarto install tinytex` looks up the latest `rstudio/tinytex-releases`
        # release via the GitHub API; unauthenticated, that intermittently 403s on
        # shared runners (#270). Authenticate it, matching the `preview` composite.
        GH_TOKEN: ${{ github.token }}
      with:
        tinytex: ${{ inputs.tinytex }}

    - name: Set up R
      if: inputs.setup-r == 'true'
      uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      with:
        use-public-rspm: true

    - name: Restore R dependencies (renv)
      if: inputs.setup-r == 'true' && inputs.use-renv == 'true'
      uses: r-lib/actions/setup-renv@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      env:
        GITHUB_PAT: ${{ github.token }}
        # renv::restore() only needs each package's already-pinned RemoteSha
        # from renv.lock; it doesn't need to also re-resolve the consumer's
        # DESCRIPTION Remotes: field against GitHub's API on every run (a
        # source of flaky/rate-limited failures -- see
        # d-morrison/rme#994 / gha#239).
        RENV_CONFIG_INSTALL_REMOTES: false

    - name: Install R dependencies
      if: inputs.setup-r == 'true' && inputs.use-renv != 'true'
      uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      env:
        GITHUB_PAT: ${{ github.token }}
      with:
        packages: ${{ inputs.r-packages }}

    - name: Install local package
      if: inputs.setup-r == 'true' && inputs.install-package == 'true'
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
      run: R CMD INSTALL "$PROJECT_PATH"

    - name: Set up Julia
      if: inputs.setup-julia == 'true'
      uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
      with:
        version: ${{ inputs.julia-version }}

    - name: Cache Julia packages
      if: inputs.setup-julia == 'true'
      uses: julia-actions/cache@e32267b41e0fa7df82a3d53e8c7273620d52c586 # v3.4.0
      with:
        cache-name: julia-cache;julia=${{ inputs.julia-version }};workflow=${{ github.workflow }};job=${{ github.job }}

    # R's etc/ldpaths puts the system library directory
    # (/usr/lib/x86_64-linux-gnu) on LD_LIBRARY_PATH for every R process and
    # every process R starts. Julia embedded in R, or started from it, then
    # loads the system libunwind instead of the one Julia bundles, and the
    # first exception Julia throws, even one it catches, segfaults the
    # process (exit 139). JuliaCall's dependency install hits that, and so
    # does its knitr display path, on any chunk line that returns a value.
    # ldpaths keeps a preset R_LD_LIBRARY_PATH, so setting it to R's own lib
    # directory drops the system directory. That directory is on the
    # loader's default path anyway, so this changes only which copy wins.
    # The render step sets the same value for itself.
    #
    # knitr's julia engine calls JuliaCall::julia_setup(), which installs the
    # Julia packages RCall and Suppressor on first use and then precompiles
    # them. Doing that here, before the render, gives an install failure its
    # own step and log instead of surfacing mid-render as a chunk error.
    # Skipped (with a notice) when JuliaCall is not installed, since a page
    # could run Julia some other way.
    - name: Set up JuliaCall and its Julia dependencies
      if: inputs.setup-julia == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v R >/dev/null 2>&1; then
          R_LD_LIBRARY_PATH="$(R RHOME)/lib"
          export R_LD_LIBRARY_PATH
        fi
        if command -v Rscript >/dev/null 2>&1 \
          && Rscript -e 'quit(status = !requireNamespace("JuliaCall", quietly = TRUE))'; then
          Rscript -e 'JuliaCall::julia_setup(installJulia = FALSE)'
        else
          echo "::notice::setup-julia is true but the R package JuliaCall is not installed, so knitr cannot run {julia} chunks; add it to r-packages (any::JuliaCall) if pages need that."
        fi

    - name: Restore Quarto freeze
      id: restore-freeze
      if: inputs.freeze-cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}/_freeze
        key: quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.sha }}-${{ github.run_attempt }}
        restore-keys: |
          quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.sha }}-
          quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-
          quarto-freezer-${{ runner.os }}-

    # See the matching step in preview/action.yml: drop the frozen results of
    # pages whose own file, included subfiles or data files changed since the
    # restored cache was rendered, so the published site never serves them.
    - name: Prune frozen results of changed pages
      if: steps.restore-freeze.outputs.cache-matched-key != ''
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.path }}
        MATCHED_KEY: ${{ steps.restore-freeze.outputs.cache-matched-key }}
        SCRIPT: ${{ github.action_path }}/../preview/prune-stale-freeze.py
      run: python3 "$SCRIPT"

    - name: Configure Deno V8 heap cap for large site renders
      if: inputs.deno-v8-options != ''
      shell: bash
      # Lift Quarto's default 8 GB Deno heap cap so large multi-chapter sites
      # don't crash the publish render with "Fatal JavaScript out of memory" (gha#262).
      run: echo "QUARTO_DENO_V8_OPTIONS=${{ inputs.deno-v8-options }}" >> "$GITHUB_ENV"

    - name: Render Quarto project
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        RENDER_PROFILE: ${{ inputs.render-profile }}
        FORMATS: ${{ inputs.formats }}
        FAIL_ON_WARN: ${{ inputs.fail-on-render-warning }}
        FORBID_PATTERNS: ${{ inputs.forbid-log-patterns }}
        SETUP_JULIA: ${{ inputs.setup-julia }}
      run: |
        set -euo pipefail
        # See "Set up JuliaCall and its Julia dependencies" for why.
        if [ "$SETUP_JULIA" = "true" ] && command -v R >/dev/null 2>&1; then
          R_LD_LIBRARY_PATH="$(R RHOME)/lib"
          export R_LD_LIBRARY_PATH
        fi
        PROFILE_ARG=()
        if [ -n "${RENDER_PROFILE:-}" ]; then
          PROFILE_ARG=(--profile "$RENDER_PROFILE")
        fi

        # Parse formats (whitespace-separated)
        FORMAT_LIST=()
        for word in ${FORMATS:-}; do
          FORMAT_LIST+=("$word")
        done

        LOG_FILE=$(mktemp)

        if [ ${#FORMAT_LIST[@]} -eq 0 ]; then
          # Single render invocation
          quarto render "$PROJECT_PATH" "${PROFILE_ARG[@]}" --output-dir "$OUTPUT_DIR" 2>&1 | tee "$LOG_FILE"
        else
          # Per-format split render
          first=true
          for fmt in "${FORMAT_LIST[@]}"; do
            if [ "$first" = true ]; then
              quarto render "$PROJECT_PATH" "${PROFILE_ARG[@]}" --output-dir "$OUTPUT_DIR" --to "$fmt" 2>&1 | tee "$LOG_FILE"
              first=false
            else
              quarto render "$PROJECT_PATH" "${PROFILE_ARG[@]}" --output-dir "$OUTPUT_DIR" --to "$fmt" --no-clean 2>&1 | tee -a "$LOG_FILE"
            fi
          done
        fi

        if [ "$FAIL_ON_WARN" = "true" ]; then
          if grep -iE '(^|[[:space:]])WARN([[:space:]:]|$)|Warning:' "$LOG_FILE"; then
            echo "::error::Quarto emitted one or more render warnings and fail-on-render-warning is enabled."
            exit 1
          fi
        fi

        if [ -n "${FORBID_PATTERNS:-}" ]; then
          while IFS= read -r pattern || [ -n "$pattern" ]; do
            trimmed_pattern=$(echo "$pattern" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -n "$trimmed_pattern" ]; then
              if grep -F "$trimmed_pattern" "$LOG_FILE"; then
                echo "::error::Quarto render log contains forbidden pattern '$trimmed_pattern'."
                exit 1
              fi
            fi
          done <<< "$FORBID_PATTERNS"
        fi

    - name: Save Quarto freeze
      if: inputs.freeze-cache == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}/_freeze
        key: quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.sha }}-${{ github.run_attempt }}

    - name: Verify rendered output exists
      shell: bash
      env:
        SITE_DIR: ${{ inputs.path }}/${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        if [ ! -d "$SITE_DIR" ]; then
          echo "::error::Rendered output not found at '$SITE_DIR' after 'quarto render'; the render step produced no site."
          exit 1
        fi
