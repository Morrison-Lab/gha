name: Build a Quarto site for GitHub Pages
description: >-
  Set up Quarto (optionally R/renv and TinyTeX) and render a Quarto project into
  its output directory. The reusable quarto-publish.yml workflow wraps this and
  deploys the rendered site to the gh-pages branch; callers that only want to
  render (e.g. a preview build, or to deploy the output themselves) can use this
  composite directly and read the site from "<path>/<output-dir>".
inputs:
  path:
    description: >-
      Path (relative to the caller repo root) to the Quarto project to render:
      the directory containing _quarto.yml. Its rendered output lands at the
      output-dir below.
    default: '.'
  setup-r:
    description: >-
      Install R and the project's R dependencies before rendering. Enable for
      R/knitr Quarto projects; leave false for pure-markdown sites.
    default: 'false'
  r-packages:
    description: >-
      r-lib/actions package specs to install when setup-r is true and use-renv
      is false (newline- or comma-separated, e.g. "any::knitr\nany::rmarkdown").
    default: |
      any::knitr
      any::rmarkdown
  use-renv:
    description: >-
      Restore R dependencies with renv instead of r-packages (requires setup-r).
    default: 'false'
  install-package:
    description: >-
      Run `R CMD INSTALL <path>` to install the caller repo as a local package
      before rendering (requires setup-r).
    default: 'false'
  setup-chrome:
    description: >-
      Install Chrome via browser-actions/setup-chrome before rendering (needed
      for revealjs / screenshot / mermaid rendering).
    default: 'false'
  tinytex:
    description: Install TinyTeX (needed to render PDF outputs).
    default: 'false'
  apt-packages:
    description: Extra apt packages to install before rendering (space-separated).
    default: ''
  output-dir:
    description: >-
      Directory the rendered site is written to, relative to
      `path`. Forwarded to `quarto render --output-dir`, so this input is
      authoritative — it overrides any `output-dir` set in the project's
      `_quarto.yml`. Defaults to `_site`.
    default: '_site'
  render-profile:
    description: Quarto `--profile` to render with (e.g. 'website'). Empty to omit.
    default: ''
  formats:
    description: >-
      Whitespace- or newline-separated Quarto output formats to render
      individually in order (e.g. "pdf docx revealjs html"). When set, renders
      each format in its own process passing --no-clean to subsequent formats,
      preventing V8 heap exhaustion on large multi-format sites.
    default: ''
  freeze-cache:
    description: >-
      Restore and save Quarto _freeze directory via actions/cache keyed on
      renv.lock and commit SHA.
    default: 'false'
  deno-v8-options:
    description: >-
      Options passed to Deno V8 via QUARTO_DENO_V8_OPTIONS to raise the heap
      cap for large site renders. Empty string disables the heap-cap override.
    default: '--max-old-space-size=12288,--max-heap-size=12288'
  fail-on-render-warning:
    description: >-
      Fail the build if Quarto emits any render warnings (WARN in the render log).
    default: 'false'
  forbid-log-patterns:
    description: >-
      Newline-separated fixed string patterns that will fail the build if found
      in the Quarto render log.
    default: ''
runs:
  using: composite
  steps:
    - name: Install apt packages
      if: inputs.apt-packages != ''
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y $APT_PACKAGES

    - name: Setup Chrome
      if: inputs.setup-chrome == 'true'
      uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0

    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
      env:
        # `quarto install tinytex` looks up the latest `rstudio/tinytex-releases`
        # release via the GitHub API; unauthenticated, that intermittently 403s on
        # shared runners (#270). Authenticate it, matching the `preview` composite.
        GH_TOKEN: ${{ github.token }}
      with:
        tinytex: ${{ inputs.tinytex }}

    - name: Set up R
      if: inputs.setup-r == 'true'
      uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
      with:
        use-public-rspm: true

    - name: Restore R dependencies (renv)
      if: inputs.setup-r == 'true' && inputs.use-renv == 'true'
      uses: r-lib/actions/setup-renv@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
      env:
        GITHUB_PAT: ${{ github.token }}
        # renv::restore() only needs each package's already-pinned RemoteSha
        # from renv.lock; it doesn't need to also re-resolve the consumer's
        # DESCRIPTION Remotes: field against GitHub's API on every run (a
        # source of flaky/rate-limited failures -- see
        # d-morrison/rme#994 / gha#239).
        RENV_CONFIG_INSTALL_REMOTES: false

    - name: Install R dependencies
      if: inputs.setup-r == 'true' && inputs.use-renv != 'true'
      uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
      env:
        GITHUB_PAT: ${{ github.token }}
      with:
        packages: ${{ inputs.r-packages }}

    - name: Install local package
      if: inputs.setup-r == 'true' && inputs.install-package == 'true'
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
      run: R CMD INSTALL "$PROJECT_PATH"

    - name: Restore Quarto freeze
      if: inputs.freeze-cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}/_freeze
        key: quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.sha }}-${{ github.run_attempt }}
        restore-keys: |
          quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.sha }}-
          quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-
          quarto-freezer-${{ runner.os }}-

    - name: Configure Deno V8 heap cap for large site renders
      if: inputs.deno-v8-options != ''
      shell: bash
      # Lift Quarto's default 8 GB Deno heap cap so large multi-chapter sites
      # don't crash the publish render with "Fatal JavaScript out of memory" (gha#262).
      run: echo "QUARTO_DENO_V8_OPTIONS=${{ inputs.deno-v8-options }}" >> "$GITHUB_ENV"

    - name: Render Quarto project
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        RENDER_PROFILE: ${{ inputs.render-profile }}
        FORMATS: ${{ inputs.formats }}
        FAIL_ON_WARN: ${{ inputs.fail-on-render-warning }}
        FORBID_PATTERNS: ${{ inputs.forbid-log-patterns }}
      run: |
        set -euo pipefail
        PROFILE_ARG=()
        if [ -n "${RENDER_PROFILE:-}" ]; then
          PROFILE_ARG=(--profile "$RENDER_PROFILE")
        fi

        # Parse formats (whitespace-separated)
        FORMAT_LIST=()
        for word in ${FORMATS:-}; do
          FORMAT_LIST+=("$word")
        done

        LOG_FILE=$(mktemp)

        if [ ${#FORMAT_LIST[@]} -eq 0 ]; then
          # Single render invocation
          quarto render "$PROJECT_PATH" "${PROFILE_ARG[@]}" --output-dir "$OUTPUT_DIR" 2>&1 | tee "$LOG_FILE"
        else
          # Per-format split render
          first=true
          for fmt in "${FORMAT_LIST[@]}"; do
            if [ "$first" = true ]; then
              quarto render "$PROJECT_PATH" "${PROFILE_ARG[@]}" --output-dir "$OUTPUT_DIR" --to "$fmt" 2>&1 | tee "$LOG_FILE"
              first=false
            else
              quarto render "$PROJECT_PATH" "${PROFILE_ARG[@]}" --output-dir "$OUTPUT_DIR" --to "$fmt" --no-clean 2>&1 | tee -a "$LOG_FILE"
            fi
          done
        fi

        if [ "$FAIL_ON_WARN" = "true" ]; then
          if grep -iE '(^|[[:space:]])WARN([[:space:]:]|$)|Warning:' "$LOG_FILE"; then
            echo "::error::Quarto emitted one or more render warnings and fail-on-render-warning is enabled."
            exit 1
          fi
        fi

        if [ -n "${FORBID_PATTERNS:-}" ]; then
          while IFS= read -r pattern || [ -n "$pattern" ]; do
            trimmed_pattern=$(echo "$pattern" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -n "$trimmed_pattern" ]; then
              if grep -F "$trimmed_pattern" "$LOG_FILE"; then
                echo "::error::Quarto render log contains forbidden pattern '$trimmed_pattern'."
                exit 1
              fi
            fi
          done <<< "$FORBID_PATTERNS"
        fi

    - name: Save Quarto freeze
      if: inputs.freeze-cache == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}/_freeze
        key: quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.sha }}-${{ github.run_attempt }}

    - name: Verify rendered output exists
      shell: bash
      env:
        SITE_DIR: ${{ inputs.path }}/${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        if [ ! -d "$SITE_DIR" ]; then
          echo "::error::Rendered output not found at '$SITE_DIR' after 'quarto render'; the render step produced no site."
          exit 1
        fi
