name: Build Quarto PR preview
description: >-
  Build a Quarto site for a pull-request preview and stage it (plus the PR
  metadata the deploy half needs) into a single artifact. Runs read-only in the
  (possibly fork) PR context — all writes to the base repo happen later in the
  deploy half (see the preview-deploy reusable workflow), which runs in the
  base-repo context via workflow_run. The R-package / Quarto specifics are
  parameterized so non-rme consumers can reuse this.
inputs:
  path:
    description: >-
      Path (relative to the caller repo root) to the Quarto project to render:
      the directory containing _quarto.yml. Defaults to the repo root. Set it
      when the site lives in a subdirectory (matches quarto-publish's `path`).
    default: '.'
  r-version:
    description: R version to install with r-lib/actions/setup-r.
    default: '4.6.0'
  apt-packages:
    description: >-
      System (apt) packages to install before R/Quarto setup, space-separated.
      Defaults to the shared renv stack plus the preview build helpers. Set to
      an empty string to skip the apt step entirely.
    default: >-
      jags libcurl4-openssl-dev libpng-dev libfontconfig1-dev libjpeg-dev
      libglpk-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libtiff5-dev
      libwebp-dev libnode109 cmake libgit2-dev libnode-dev libx11-dev pandoc
  use-renv:
    description: Restore R dependencies with renv (r-lib/actions/setup-renv). Set 'false' for non-renv repos.
    default: 'true'
  r-packages:
    description: >-
      R packages to install (space-, comma-, or newline-separated) when `use-renv` is 'false',
      e.g. for non-renv Quarto projects.
    default: ''
  install-package:
    description: Run `R CMD INSTALL <path>` to install the caller repo as a local package before rendering.
    default: 'true'
  setup-chrome:
    description: Install Chrome (needed by Quarto for revealjs / screenshot rendering).
    default: 'true'
  tinytex:
    description: >-
      Install TinyTeX and enable PDF rendering. When false (default), TinyTeX
      is installed and PDF is rendered only when the PR is labeled `preview:pdf`.
    default: 'false'
  setup-julia:
    description: >-
      Install Julia with julia-actions/setup-julia before rendering, for pages
      that execute `{julia}` chunks. Under knitr those run through the R
      package JuliaCall, which the caller installs via `r-packages` (or renv);
      when JuliaCall is installed, its own Julia dependencies (RCall and
      Suppressor) are set up in a separate step so a failure there is not
      buried in the render log. Also sets R_LD_LIBRARY_PATH to R's own lib
      directory for that step and the render, so Julia started by R loads its own
      libunwind rather than the system one, which segfaults on any Julia
      exception.
    default: 'false'
  preinstalled-toolchain:
    description: >-
      The runner already provides R (with the pak and tinytex packages),
      Quarto, TinyTeX, Julia and, if needed, Chrome, and has no sudo, as a
      self-hosted runner does. When 'true', skip the steps that install them
      (apt packages, Chrome, Quarto, R, Julia and its cache), ignore `tinytex`
      for the install, and install `r-packages` with pak into the runner's
      user library. renv, the JuliaCall setup, TinyTeX packages and the
      freeze cache still run.
    default: 'false'
  julia-version:
    description: Julia version to install (setup-julia's `version` syntax). Only used when setup-julia is true.
    default: '1'
  submodules:
    description: Passed to actions/checkout `submodules` (e.g. 'recursive', 'true', or 'false').
    default: 'recursive'
  render-profile:
    description: Quarto `--profile` to render with.
    default: 'website'
  output-dir:
    description: Directory the rendered site is written to, relative to `path`. Defaults to `_site`.
    default: '_site'
  formats:
    description: >-
      Space-separated list of formats to render (e.g. 'html docx pdf revealjs').
      When empty (default), renders HTML plus any formats requested via PR labels
      (`preview:docx`, `preview:pdf`, `preview:revealjs`). Set to 'default' to run
      a single bare `quarto render` letting `_quarto.yml` decide formats (note:
      unlike `quarto-publish` where empty string defaults to bare render).
    default: ''
  skip-docx:
    description: >-
      Leave Word (docx) out of the render, which is slow, so a PR preview
      builds faster; the publish build still renders it. Applies to an
      explicit `formats` list only: `formats: default` is a bare render,
      and `quarto render --to` takes one format. A PR labelled
      `preview:docx` opts back in, and so does `docx-tracked-changes: true`,
      which needs the Word files. Set to 'false' to render docx as before.
    default: 'true'
  skip-formats:
    description: >-
      Space-separated formats (for example 'pdf docx') to leave out of the
      preview, which `skip-docx` cannot do for `formats: default`. Before the
      render, `preview/skip-formats.py` removes those formats' entries from the
      project's `_quarto*.yml` files and every page's front matter in the
      working copy, so a bare `quarto render` still builds every other format,
      slide decks included. A PR labelled `preview:<format>` keeps that format,
      and `docx-tracked-changes: true` keeps docx. Empty (default) removes
      nothing. The publish build is unaffected.
    default: ''
  fail-on-render-warning:
    description: Fail the build if Quarto emits any render warnings (WARN in the render log).
    default: 'false'
  forbid-log-patterns:
    description: >-
      Newline-separated fixed string patterns that will fail the build if found
      in the Quarto render log.
    default: ''
  timezone:
    description: >-
      IANA time zone (e.g. 'America/Los_Angeles') exported as `TZ` for the
      render and later steps, so `date: last-modified` and similar stamps
      are not in UTC. Empty (default) leaves the runner's time zone unchanged.
      A value containing a newline or `=` is rejected.
    default: ''
  detect-changed-chapters:
    description: >-
      Compare this run's render against the copy published on the deployed
      branch and expose which chapters differ as step outputs. Opt-in, so an
      existing consumer is unaffected. Implied by `changed-chapters-banner` and `highlight-changes`.
    default: 'false'
  changed-chapters-banner:
    description: >-
      Add a banner to the preview home page naming the chapters that differ
      from the published render. Turns on the comparison above.
    default: 'false'
  highlight-changes:
    description: >-
      Highlight added and modified text in the rendered HTML chapters that
      differ from the published render. Turns on changed-chapter detection.
    default: 'false'
  changed-chapters-glob:
    description: >-
      Glob, relative to the rendered site root, selecting the files the
      comparison treats as chapters.
    default: 'chapters/*.html'
  deployed-branch:
    description: Branch holding the published render to compare against.
    default: 'gh-pages'
  deployed-subdir:
    description: >-
      Path prefix, within the deployed branch, at which the published site root
      lives. Defaults to the branch root.
    default: ''
  changed-chapters-normalize-patterns:
    description: >-
      Newline-separated regexes whose matches are blanked before comparison, in
      addition to the built-in ones (htmlwidget element ids and ISO-8601
      datetimes). Set this when a project's template writes something else that
      changes on every render, since a page that always differs makes the whole
      feature noise.
    default: ''
  max-elements-for-pairwise:
    description: >-
      Maximum candidate elements per page for pairwise SequenceMatcher diffing.
      Defaults to 500. Exceeding this skips element-level diffing to avoid quadratic runtime.
    default: '500'
  banner-index:
    description: Home page the banner is inserted into, relative to the rendered site root.
    default: 'index.html'
  docx-tracked-changes:
    description: >-
      Generate Word DOCX documents with tracked changes against the published
      version on the deployed branch. Opt-in. Renders docx in the preview as
      a `preview:docx` label would, overriding `skip-docx`; an explicit
      `formats` list must still name docx.
    default: 'false'
  docx-tracked-changes-glob:
    description: >-
      Glob, relative to the rendered site root, selecting the DOCX files to
      generate tracked changes for.
    default: 'chapters/*.docx'
  incremental:
    description: >-
      Render only the pages a PR can affect, from a cached `_site` and
      `.quarto` restored beside `_freeze`. `preview/plan-incremental-render.py`
      diffs the cache's commit against HEAD and picks the changed pages plus
      those that include a changed file; it falls back to the full render when
      no cache exists, when a path that can affect every page changed
      (`incremental-full-render-paths`), or when it cannot say what a changed
      path affects. Unchanged pages keep their old navigation, search entry,
      and cross-reference numbers. Replaces the plain freeze cache when on.
    default: 'false'
  incremental-full-render-paths:
    description: >-
      Newline-separated globs (against the repo-relative path; a trailing `/`
      matches a directory) that force the full render when an incremental
      preview sees them change.
    default: |
      _quarto*.yml
      _extensions/
      filters/
      *.scss
      *.css
      *.lua
      *.bib
      *.csl
      renv.lock
      latex-macros
      macros/
      tools/
      .gitmodules
  incremental-ignore-paths:
    description: >-
      Newline-separated globs for changed paths that affect no page, so an
      incremental preview skips them instead of falling back to a full render.
    default: |
      .github/
      .claude/
      .gitignore
      AGENTS.md
      CLAUDE.md
      README.md
      LICENSE*
  incremental-max-pages:
    description: >-
      Stale-page count above which an incremental preview renders the whole
      site instead, since one `quarto render` per page costs more than one
      render of everything.
    default: '15'
  cluster-render:
    description: >-
      Run the render on a WWU CS cluster execute node through `condor-batch`,
      in the `cluster-image` Apptainer image, instead of on the runner. The
      output directory, `_freeze`, `.quarto` and the render log come back to
      the checkout, so every later step is unchanged. The runner needs the
      cluster ssh key; without it, or when the cluster cannot run the job,
      the render runs on the runner. The `lds-ci.sif` image has no renv and
      no Chromium, so a caller that sets `use-renv` or `setup-chrome` should
      leave this off. `cluster-image` is required: with it empty the steps
      run bare on the execute node, which has no Quarto. `.git` is copied unless the caller sets the
      `RSYNC_EXCLUDE` environment variable (`set-mtimes-from-git.py` needs it).
    default: 'false'
  cluster-head:
    description: Cluster head (or list of heads) for `cluster-render`; see `condor-batch` `head`.
    default: cse-head.cluster.cs.wwu.edu
  cluster-image:
    description: Apptainer image on the cluster home that `cluster-render` runs in (`condor-batch` `image`).
    default: ''
  cluster-image-file:
    description: The same image on the runner, for heads without the cluster home (`condor-batch` `image-file`).
    default: ''
outputs:
  changed-chapters:
    description: >-
      JSON array of chapter ids that differ from the published render. A
      chapter id is the rendered file's path relative to the site root, with
      its extension removed. Empty when the comparison was skipped -- read
      `detection-status` to tell the two apart.
    value: ${{ steps.changed-chapters.outputs.changed-chapters }}
  any-changed:
    description: '`true` when at least one chapter differs, `false` otherwise.'
    value: ${{ steps.changed-chapters.outputs.any-changed }}
  detection-status:
    description: >-
      `compared` when the published render was available, `skipped` when it was
      not. An empty `changed-chapters` means nothing changed only under
      `compared`.
    value: ${{ steps.changed-chapters.outputs.detection-status }}
  skip-reason:
    description: Why the comparison was skipped; empty when it ran.
    value: ${{ steps.changed-chapters.outputs.skip-reason }}
  docx-status:
    description: >-
      `generated` when DOCX tracked changes were produced, `skipped` when the
      comparison was skipped.
    value: ${{ steps.docx-tracked-changes.outputs.docx-status }}
  docx-skip-reason:
    description: Why DOCX tracked changes generation was skipped; empty when it ran.
    value: ${{ steps.docx-tracked-changes.outputs.docx-skip-reason }}
  docx-tracked-changes-files:
    description: JSON array of generated tracked changes DOCX file paths relative to the site root.
    value: ${{ steps.docx-tracked-changes.outputs.docx-tracked-changes-files }}
  any-docx-changed:
    description: '`true` when at least one DOCX file differs from published render, `false` otherwise.'
    value: ${{ steps.docx-tracked-changes.outputs.any-docx-changed }}
runs:
  using: composite
  steps:
    - name: Check out repository
      if: github.event.action != 'closed'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: ${{ inputs.submodules }}

    # For the 'closed'/remove event the checkout step is skipped, but this step
    # is unguarded and still runs, so the remove path is unaffected.
    - name: Save PR metadata
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PREVIEW_ACTION: ${{ github.event.action == 'closed' && 'remove' || 'deploy' }}
      run: |
        set -euo pipefail
        mkdir -p _preview_upload/meta
        echo "$PR_NUMBER" > _preview_upload/meta/pr-number.txt
        echo "$PREVIEW_ACTION" > _preview_upload/meta/action.txt

    - name: Put the runner's preinstalled tools on PATH
      if: github.event.action != 'closed' && inputs.preinstalled-toolchain == 'true'
      shell: bash
      run: |
        # A self-hosted runner's service has no login PATH, so a tool
        # unpacked under the runner user's home (~/opt/quarto-<version>,
        # ~/opt/julia-<version>, ~/.TinyTeX) is not found by name. For each
        # tool that is not already on PATH, use the newest matching
        # directory. Nothing happens for a tool that is on PATH or has no
        # such directory.
        set -euo pipefail
        add_newest() {
          local tool="$1"
          shift
          command -v "$tool" > /dev/null && return 0
          local pattern dir
          for pattern in "$@"; do
            dir="$(ls -d $pattern 2> /dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$dir" ] && [ -x "$dir/$tool" ]; then
              echo "$dir" >> "$GITHUB_PATH"
              return 0
            fi
          done
        }
        add_newest quarto "$HOME/opt/quarto-*/bin"
        add_newest julia "$HOME/opt/julia-*/bin" "$HOME/.juliaup/bin" "$HOME/julia-*/bin"
        add_newest pdflatex "$HOME/.TinyTeX/bin/*"

    - name: Set up Quarto
      if: github.event.action != 'closed' && inputs.preinstalled-toolchain != 'true'
      uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
      env:
        GH_TOKEN: ${{ github.token }}
      with:
        # Install TinyTeX in the same setup only when a PDF render is requested;
        # composite actions can't vary `with:` conditionally, so gate it on the
        # label expression, tinytex input, or formats containing 'pdf'.
        tinytex: ${{ inputs.tinytex == 'true' || contains(github.event.pull_request.labels.*.name, 'preview:pdf') || contains(inputs.formats, 'pdf') }}

    - name: Set up R
      if: github.event.action != 'closed' && inputs.preinstalled-toolchain != 'true'
      uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      with:
        r-version: ${{ inputs.r-version }}
        use-public-rspm: true

    - name: Install system dependencies
      if: github.event.action != 'closed' && inputs.apt-packages != '' && inputs.preinstalled-toolchain != 'true'
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: |
        set -euo pipefail
        sudo apt-get update
        # Intentional word-splitting: APT_PACKAGES is a space-separated list.
        sudo apt-get install -y $APT_PACKAGES

    - name: Setup Chrome
      if: github.event.action != 'closed' && inputs.setup-chrome == 'true' && inputs.preinstalled-toolchain != 'true'
      uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0

    - name: Restore R dependencies (renv)
      if: github.event.action != 'closed' && inputs.use-renv == 'true'
      uses: r-lib/actions/setup-renv@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      env:
        GITHUB_PAT: ${{ github.token }}
        # renv::restore() only needs each package's already-pinned RemoteSha
        # from renv.lock; it doesn't need to also re-resolve the consumer's
        # DESCRIPTION Remotes: field against GitHub's API on every run (a
        # source of flaky/rate-limited failures -- see
        # d-morrison/rme#994 / gha#239).
        RENV_CONFIG_INSTALL_REMOTES: false
      with:
        bypass-cache: never

    # setup-r writes ~/.Rprofile with two repositories: RSPM (Posit Public
    # Package Manager, which serves compiled Linux binaries) and CRAN
    # (cran.rstudio.com, source only). An lds preview resolved every package
    # to a CRAN source tarball and built 207 of them, 31 minutes of a
    # 45-minute run (gha#1174). Leaving only RSPM stops pak from resolving a
    # source tarball. Skipped when RSPM is unset, e.g. use-public-rspm off.
    - name: Prefer Posit Package Manager binaries
      if: >-
        github.event.action != 'closed' && runner.os == 'Linux' &&
        inputs.use-renv != 'true' && inputs.r-packages != '' &&
        inputs.preinstalled-toolchain != 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${RSPM:-}" ]; then
          echo "::notice::RSPM is unset, so R keeps its default repositories."
          exit 0
        fi
        printf '%s\n' 'options(repos = c(CRAN = Sys.getenv("RSPM")))' >> "$HOME/.Rprofile"

    # `cache: always` saves the package library even when the job fails or is
    # cancelled. The default (`true`) saves only on success, and a preview
    # cancelled at its time limit never saved, so the next run reinstalled
    # everything (gha#1174).
    - name: Install R dependencies
      if: github.event.action != 'closed' && inputs.use-renv != 'true' && inputs.r-packages != '' && inputs.preinstalled-toolchain != 'true'
      uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      env:
        GITHUB_PAT: ${{ github.token }}
      with:
        packages: ${{ inputs.r-packages }}
        cache: always

    # With a preinstalled toolchain the runner's own R and user library are
    # used: setup-r-dependencies would ask for sudo to install system
    # requirements, so install the packages with pak into the user library.
    - name: Install R dependencies (preinstalled R)
      if: >-
        github.event.action != 'closed' && inputs.use-renv != 'true' &&
        inputs.r-packages != '' && inputs.preinstalled-toolchain == 'true'
      shell: bash
      env:
        GITHUB_PAT: ${{ github.token }}
        R_PACKAGES: ${{ inputs.r-packages }}
      run: |
        set -euo pipefail
        bash "${{ github.action_path }}/../scripts/with-r-install-lock.sh" Rscript -e 'pkgs <- Sys.getenv("R_PACKAGES"); pkgs <- trimws(strsplit(pkgs, "[[:space:],]+")[[1]]); pkgs <- pkgs[nzchar(pkgs)]; pak::pkg_install(pkgs)'

    - name: Install local package
      if: github.event.action != 'closed' && inputs.install-package == 'true'
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
      run: R CMD INSTALL "$PROJECT_PATH"

    - name: Set up Julia
      if: github.event.action != 'closed' && inputs.setup-julia == 'true' && inputs.preinstalled-toolchain != 'true'
      uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
      with:
        version: ${{ inputs.julia-version }}

    # delete-old-caches is off because it cannot work from inside a composite.
    # julia-actions/cache's post step runs handle_caches.jl from
    # $GITHUB_ACTION_PATH, and in a post step of an action nested in a
    # composite the runner sets that to the COMPOSITE's directory, so the
    # cleanup failed with "opening file .../preview/handle_caches.jl: No such
    # file or directory" on a PR run while the job stayed green (gha#1023,
    # lds run 37824437245), so no cleanup has ever succeeded here, and turning
    # it off loses nothing. GitHub's own cache eviction still bounds the old
    # entries.
    - name: Cache Julia packages
      if: github.event.action != 'closed' && inputs.setup-julia == 'true' && inputs.preinstalled-toolchain != 'true'
      uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      with:
        # Save only when the job succeeds. The action saves on failure and
        # cancel by default, so a build cancelled mid-install stored a
        # half-installed depot that every later build on the ref restored
        # and failed on ("RCall not properly installed"). The -v2 name
        # also stops those already-saved depots from being restored.
        cache-name: julia-cache-v2;julia=${{ inputs.julia-version }};workflow=${{ github.workflow }};job=${{ github.job }}
        save-always: false
        delete-old-caches: 'false'

    # R's etc/ldpaths puts the system library directory
    # (/usr/lib/x86_64-linux-gnu) on LD_LIBRARY_PATH for every R process and
    # every process R starts. Julia embedded in R, or started from it, then
    # loads the system libunwind instead of the one Julia bundles, and the
    # first exception Julia throws, even one it catches, segfaults the
    # process (exit 139). JuliaCall's dependency install hits that, and so
    # does its knitr display path, on any chunk line that returns a value.
    # ldpaths keeps a preset R_LD_LIBRARY_PATH, so setting it to R's own lib
    # directory drops the system directory. That directory is on the
    # loader's default path anyway, so this changes only which copy wins.
    # The render step sets the same value for itself.
    #
    # knitr's julia engine calls JuliaCall::julia_setup(), which installs the
    # Julia packages RCall and Suppressor on first use and then precompiles
    # them. Doing that here, before the render, gives an install failure its
    # own step and log instead of surfacing mid-render as a chunk error.
    # Skipped (with a notice) when JuliaCall is not installed, since a page
    # could run Julia some other way.
    - name: Set up JuliaCall and its Julia dependencies
      if: github.event.action != 'closed' && inputs.setup-julia == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v R >/dev/null 2>&1; then
          R_LD_LIBRARY_PATH="$(R RHOME)/lib"
          export R_LD_LIBRARY_PATH
        fi
        # RCall depends on Conda.jl, whose build creates an empty
        # <depot>/conda/3/<arch> directory and records it in deps.jl.
        # julia-actions/cache restores packages/ (deps.jl included) but not
        # conda/, so Pkg skips the rebuild and every Julia session then fails
        # to precompile Conda with "Path to conda environment is not valid",
        # once at setup and once per page (gha#1023). Conda only checks that
        # the directory exists, and nothing here uses it, so recreate it.
        depot="${JULIA_DEPOT_PATH:-$HOME/.julia}"
        mkdir -p "${depot%%:*}/conda/3/$(uname -m)"
        if command -v Rscript >/dev/null 2>&1 \
          && Rscript -e 'quit(status = !requireNamespace("JuliaCall", quietly = TRUE))'; then
          # RCall records the R library path at build time, and the restored
          # cache keeps it (the cache holds packages/ but not the environment,
          # so Pkg sees no RCall until it is added again), so a new R release
          # (4.6.1 to 4.6.2) leaves RCall pointing at a directory that is
          # gone. Add RCall, as JuliaCall would, and rebuild it against this R.
          R_HOME="$(R RHOME)" julia -e 'import Pkg; Pkg.add("RCall"); Pkg.build("RCall")'
          Rscript -e 'JuliaCall::julia_setup(installJulia = FALSE)'
        else
          echo "::notice::setup-julia is true but the R package JuliaCall is not installed, so knitr cannot run {julia} chunks; add it to r-packages (any::JuliaCall) if pages need that."
        fi

    - name: Install TinyTeX packages required for PDF rendering
      # `skip-formats: pdf` removes pdf from the render unless the PR is
      # labelled `preview:pdf`, so a preview that skips it needs no LaTeX
      # packages even when `formats` or `tinytex` names pdf (gha#1529).
      if: >-
        github.event.action != 'closed' &&
        (contains(github.event.pull_request.labels.*.name, 'preview:pdf') ||
         (!contains(inputs.skip-formats, 'pdf') &&
          (inputs.tinytex == 'true' || contains(inputs.formats, 'pdf'))))
      shell: bash
      run: |
        set -euo pipefail
        Rscript -e "tinytex::tlmgr_install(c('luacolor', 'lua-ul'))"

    - name: Restore Quarto freeze
      id: restore-freeze
      if: >-
        github.event.action != 'closed' && inputs.incremental != 'true' &&
        !contains(github.event.pull_request.labels.*.name, 'clear freezer')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}/_freeze
        key: quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
        restore-keys: |
          quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.event.pull_request.head.sha }}-
          quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.event.pull_request.base.ref }}-
          quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-
          quarto-freezer-${{ runner.os }}-

    # With `incremental`, one cache holds the freeze, the rendered site and
    # Quarto's project state, so they always come from the same commit.
    - name: Restore incremental render cache
      id: restore-incremental
      if: >-
        github.event.action != 'closed' && inputs.incremental == 'true' &&
        !contains(github.event.pull_request.labels.*.name, 'clear freezer')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ inputs.path }}/_freeze
          ${{ inputs.path }}/${{ inputs.output-dir }}
          ${{ inputs.path }}/.quarto
        key: quarto-incremental-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
        restore-keys: |
          quarto-incremental-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.event.pull_request.head.sha }}-
          quarto-incremental-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-

    # A PR's first incremental run finds no `quarto-incremental-` cache: only
    # preview runs save one, GitHub scopes a PR's caches to that PR, and the
    # publish on the default branch saves only `quarto-freezer-` (the
    # `_freeze` directory). The PR then executed every page from scratch,
    # 30 minutes for lds (gha#1572). Fall back to the publish's freeze, as a
    # non-incremental preview does; the render stays a full one, but the
    # pruner below drops only the changed pages' frozen results.
    - name: Restore Quarto freeze (no incremental cache)
      id: restore-freeze-fallback
      if: >-
        github.event.action != 'closed' && inputs.incremental == 'true' &&
        steps.restore-incremental.outputs.cache-matched-key == '' &&
        !contains(github.event.pull_request.labels.*.name, 'clear freezer')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}/_freeze
        key: quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
        restore-keys: |
          quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.event.pull_request.base.ref }}-
          quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-
          quarto-freezer-${{ runner.os }}-

    # `freeze: auto` notices a change to a page's own file only, so a page
    # whose included subfile or data file changed would keep its stale
    # results. Drop those pages' frozen results, so the cache can be kept for
    # the rest instead of being discarded wholesale with `clear freezer`.
    - name: Prune frozen results of changed pages
      if: steps.restore-freeze.outputs.cache-matched-key != '' || steps.restore-incremental.outputs.cache-matched-key != '' || steps.restore-freeze-fallback.outputs.cache-matched-key != ''
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.path }}
        MATCHED_KEY: ${{ steps.restore-freeze.outputs.cache-matched-key || steps.restore-incremental.outputs.cache-matched-key || steps.restore-freeze-fallback.outputs.cache-matched-key }}
        SCRIPT: ${{ github.action_path }}/prune-stale-freeze.py
      run: python3 "$SCRIPT"

    # Uses the pruner's dependency graph to list the pages to re-render, or
    # chooses the full render (see plan-incremental-render.py).
    - name: Plan the incremental render
      id: plan-incremental
      if: github.event.action != 'closed' && inputs.incremental == 'true'
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        MATCHED_KEY: ${{ steps.restore-incremental.outputs.cache-matched-key }}
        RENDER_PROFILE: ${{ inputs.render-profile }}
        FULL_PATTERNS: ${{ inputs.incremental-full-render-paths }}
        IGNORE_PATTERNS: ${{ inputs.incremental-ignore-paths }}
        MAX_PAGES: ${{ inputs.incremental-max-pages }}
      run: |
        set -euo pipefail
        PROFILE_ARG=()
        if [ -n "${RENDER_PROFILE:-}" ]; then
          PROFILE_ARG=(--profile "$RENDER_PROFILE")
        fi
        INSPECT_JSON="$RUNNER_TEMP/quarto-inspect.json"
        export INSPECT_JSON
        quarto inspect . "${PROFILE_ARG[@]}" > "$INSPECT_JSON" || echo '{}' > "$INSPECT_JSON"
        PROJECT_DIR="$PWD" python3 "$GITHUB_ACTION_PATH/plan-incremental-render.py"

    # The save below skips a build that changed nothing in `_freeze`: no page
    # re-executed, so the cache already holds this build's results (gha#1529).
    - name: Fingerprint Quarto freeze before the render
      id: freeze-before
      if: github.event.action != 'closed'
      shell: bash
      env:
        FREEZE_DIR: ${{ inputs.path }}/_freeze
      run: bash "$GITHUB_ACTION_PATH/freeze-fingerprint.sh" >> "$GITHUB_OUTPUT"

    - name: Use reticulate's managed uv environment
      if: github.event.action != 'closed'
      shell: bash
      # A persistent virtualenv on a self-hosted runner (for example
      # ~/.virtualenvs/r-reticulate) otherwise shadows the environment that
      # reticulate::py_require() builds, so a page that requires a new
      # package fails with ModuleNotFoundError (gha#1540). A value the caller
      # already set is kept.
      run: |
        if [ -z "${RETICULATE_USE_MANAGED_VENV:-}" ]; then
          echo "RETICULATE_USE_MANAGED_VENV=yes" >> "$GITHUB_ENV"
        fi

    - name: Raise Deno V8 heap cap for large site renders
      if: github.event.action != 'closed'
      shell: bash
      # Quarto's launcher defaults Deno to an 8 GB V8 heap
      # (--max-old-space-size=8192,--max-heap-size=8192) and appends any
      # user-supplied QUARTO_DENO_V8_OPTIONS after those defaults; V8 lets
      # the last occurrence of a flag win, so this override takes effect.
      # Large multi-chapter sites (Morrison-Lab/rme, ~37 pages) exceed 8 GB
      # of cumulative heap late in `quarto render` and crash with
      # "Fatal JavaScript out of memory" (exit 133); standard GitHub
      # runners have 16 GB of RAM, so 12 GB leaves headroom for R and the
      # OS while lifting the binding constraint (gha#262).
      run: echo "QUARTO_DENO_V8_OPTIONS=--max-old-space-size=12288,--max-heap-size=12288" >> "$GITHUB_ENV"

    - name: Set time zone
      if: github.event.action != 'closed' && inputs.timezone != ''
      shell: bash
      env:
        TIMEZONE: ${{ inputs.timezone }}
      # Runs after setup-r, which exports TZ=UTC and would otherwise
      # overwrite this value for the render.
      run: |
        set -euo pipefail
        # The value is appended to GITHUB_ENV, so a newline would inject
        # another variable and an `=` would corrupt the TZ assignment.
        case "$TIMEZONE" in
          *$'\n'* | *$'\r'* | *=*)
            echo "::error::timezone must not contain a newline or '='"
            exit 1
            ;;
        esac
        echo "TZ=$TIMEZONE" >> "$GITHUB_ENV"

    - name: Leave skipped formats out of the preview
      if: github.event.action != 'closed' && inputs.skip-formats != ''
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        SKIP_FORMATS: ${{ inputs.skip-formats }}
        # The tracked-changes step compares rendered Word files (gha#1059).
        KEEP_FORMATS: ${{ inputs.docx-tracked-changes == 'true' && 'docx' || '' }}
        PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: python3 "$GITHUB_ACTION_PATH/skip-formats.py"

    - name: Render Quarto site
      if: github.event.action != 'closed' && inputs.cluster-render != 'true'
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
        RENDER_PROFILE: ${{ inputs.render-profile }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        FORMATS: ${{ inputs.formats }}
        SKIP_DOCX: ${{ inputs.skip-docx }}
        DOCX_TRACKED_CHANGES: ${{ inputs.docx-tracked-changes }}
        TINYTEX: ${{ inputs.tinytex }}
        HAS_LABEL_PDF: ${{ contains(github.event.pull_request.labels.*.name, 'preview:pdf') }}
        HAS_LABEL_DOCX: ${{ contains(github.event.pull_request.labels.*.name, 'preview:docx') }}
        HAS_LABEL_REVEALJS: ${{ contains(github.event.pull_request.labels.*.name, 'preview:revealjs') }}
        SETUP_JULIA: ${{ inputs.setup-julia }}
        INCREMENTAL_MODE: ${{ steps.plan-incremental.outputs.mode }}
        INCREMENTAL_PAGES: ${{ inputs.path }}/_incremental_pages.txt
        REDIRECT_STUBS_SCRIPT: ${{ github.action_path }}/../quarto-publish/redirect-stubs.py
        RENDER_SCRIPT: ${{ github.action_path }}/render-site.sh
      run: bash "$RENDER_SCRIPT"

    # The job has no runner environment, so the render's inputs travel as
    # assignments on the command line, quoted with printf %q.
    - name: Plan the cluster render
      id: cluster-plan
      if: github.event.action != 'closed' && inputs.cluster-render == 'true'
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
        RENDER_PROFILE: ${{ inputs.render-profile }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        FORMATS: ${{ inputs.formats }}
        SKIP_DOCX: ${{ inputs.skip-docx }}
        DOCX_TRACKED_CHANGES: ${{ inputs.docx-tracked-changes }}
        TINYTEX: ${{ inputs.tinytex }}
        HAS_LABEL_PDF: ${{ contains(github.event.pull_request.labels.*.name, 'preview:pdf') }}
        HAS_LABEL_DOCX: ${{ contains(github.event.pull_request.labels.*.name, 'preview:docx') }}
        HAS_LABEL_REVEALJS: ${{ contains(github.event.pull_request.labels.*.name, 'preview:revealjs') }}
        SETUP_JULIA: ${{ inputs.setup-julia }}
        INCREMENTAL_MODE: ${{ steps.plan-incremental.outputs.mode }}
        INCREMENTAL_PAGES: ${{ inputs.path }}/_incremental_pages.txt
      run: bash "$GITHUB_ACTION_PATH/plan-cluster-render.sh"

    - name: Render Quarto site on the cluster
      if: github.event.action != 'closed' && inputs.cluster-render == 'true'
      uses: Morrison-Lab/gha/.github/actions/condor-batch@v3
      with:
        head: ${{ inputs.cluster-head }}
        image: ${{ inputs.cluster-image }}
        image-file: ${{ inputs.cluster-image-file }}
        steps: ${{ steps.cluster-plan.outputs.steps }}
        output: ${{ inputs.path }}/${{ inputs.output-dir }},${{ inputs.path }}/_freeze,${{ inputs.path }}/.quarto,_quarto_preview_render.log

    - name: Verify render warnings and forbidden log patterns
      if: github.event.action != 'closed'
      shell: bash
      env:
        FAIL_ON_WARN: ${{ inputs.fail-on-render-warning }}
        FORBID_PATTERNS: ${{ inputs.forbid-log-patterns }}
      run: |
        set -euo pipefail
        LOG_FILE="_quarto_preview_render.log"
        [ -f "$LOG_FILE" ] || exit 0

        if [ "$FAIL_ON_WARN" = "true" ]; then
          if grep -iE '(^|[[:space:]])WARN([[:space:]:]|$)|Warning:' "$LOG_FILE"; then
            echo "::error::Quarto emitted one or more render warnings and fail-on-render-warning is enabled."
            exit 1
          fi
        fi

        if [ -n "${FORBID_PATTERNS:-}" ]; then
          while IFS= read -r pattern || [ -n "$pattern" ]; do
            trimmed_pattern=$(echo "$pattern" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -n "$trimmed_pattern" ]; then
              if grep -F "$trimmed_pattern" "$LOG_FILE"; then
                echo "::error::Quarto render log contains forbidden pattern '$trimmed_pattern'."
                exit 1
              fi
            fi
          done <<< "$FORBID_PATTERNS"
        fi

    # Saved straight after the render, before the steps that add a banner or
    # highlights to the site, so those are not cached and applied twice.
    # Only after a successful render: a cancelled one leaves `_site`
    # holding some pages from this commit and some from the cache's, and the
    # key claims every page is from this commit.
    - name: Save incremental render cache
      if: success() && github.event.action != 'closed' && inputs.incremental == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ inputs.path }}/_freeze
          ${{ inputs.path }}/${{ inputs.output-dir }}
          ${{ inputs.path }}/.quarto
        key: quarto-incremental-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}

    - name: Detect chapters changed since the published render
      id: changed-chapters
      if: >-
        github.event.action != 'closed'
        && (inputs.detect-changed-chapters == 'true' || inputs.changed-chapters-banner == 'true' || inputs.highlight-changes == 'true')
      shell: bash
      env:
        RENDERED_DIR: ${{ inputs.path }}/${{ inputs.output-dir }}
        CHAPTER_GLOB: ${{ inputs.changed-chapters-glob }}
        DEPLOYED_BRANCH: ${{ inputs.deployed-branch }}
        DEPLOYED_SUBDIR: ${{ inputs.deployed-subdir }}
        NORMALIZE_PATTERNS: ${{ inputs.changed-chapters-normalize-patterns }}
      run: python3 "$GITHUB_ACTION_PATH/detect-changed-chapters.py"

    - name: Add the changed-chapters banner to the preview home page
      if: github.event.action != 'closed' && inputs.changed-chapters-banner == 'true'
      shell: bash
      # Every value reaches the script through `env:` rather than through `${{ }}`
      # inside the `run:` body: CHANGED_CHAPTERS and SKIP_REASON are assembled
      # from the caller's own file names and git's own error text.
      env:
        RENDERED_DIR: ${{ inputs.path }}/${{ inputs.output-dir }}
        BANNER_INDEX: ${{ inputs.banner-index }}
        CHANGED_CHAPTERS: ${{ steps.changed-chapters.outputs.changed-chapters }}
        DETECTION_STATUS: ${{ steps.changed-chapters.outputs.detection-status }}
        SKIP_REASON: ${{ steps.changed-chapters.outputs.skip-reason }}
      run: python3 "$GITHUB_ACTION_PATH/add-home-banner.py"

    - name: Highlight rendered HTML changes in modified chapters
      if: github.event.action != 'closed' && inputs.highlight-changes == 'true'
      shell: bash
      env:
        RENDERED_DIR: ${{ inputs.path }}/${{ inputs.output-dir }}
        CHANGED_CHAPTERS: ${{ steps.changed-chapters.outputs.changed-chapters }}
        DETECTION_STATUS: ${{ steps.changed-chapters.outputs.detection-status }}
        SKIP_REASON: ${{ steps.changed-chapters.outputs.skip-reason }}
        CHAPTER_GLOB: ${{ inputs.changed-chapters-glob }}
        DEPLOYED_BRANCH: ${{ inputs.deployed-branch }}
        DEPLOYED_SUBDIR: ${{ inputs.deployed-subdir }}
        NORMALIZE_PATTERNS: ${{ inputs.changed-chapters-normalize-patterns }}
        MAX_ELEMENTS_FOR_PAIRWISE: ${{ inputs.max-elements-for-pairwise }}
      run: python3 "$GITHUB_ACTION_PATH/highlight-html-changes.py"

    - name: Install Python dependencies for DOCX tracked changes
      if: github.event.action != 'closed' && inputs.docx-tracked-changes == 'true'
      shell: bash
      run: python3 -m pip install --quiet python-docx==1.2.0

    - name: Create DOCX tracked changes
      id: docx-tracked-changes
      if: github.event.action != 'closed' && inputs.docx-tracked-changes == 'true'
      shell: bash
      env:
        RENDERED_DIR: ${{ inputs.path }}/${{ inputs.output-dir }}
        DOCX_GLOB: ${{ inputs.docx-tracked-changes-glob }}
        DEPLOYED_BRANCH: ${{ inputs.deployed-branch }}
        DEPLOYED_SUBDIR: ${{ inputs.deployed-subdir }}
      run: python3 "$GITHUB_ACTION_PATH/create-docx-tracked-changes.py"

    - name: List files
      if: github.event.action != 'closed'
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        echo "contents of $PROJECT_PATH/$OUTPUT_DIR:"
        ls "$PROJECT_PATH/$OUTPUT_DIR/"
        echo "contents of $PROJECT_PATH:"
        ls "$PROJECT_PATH"

    # `always()` so a render that fails, or is cancelled by the time limit or
    # a newer push, still saves the pages it finished. Quarto writes a page's
    # freeze file only after that page has executed, so the directory holds
    # whole pages, and `freeze: auto` re-checks each against its source file
    # (gha#1184).
    - name: Fingerprint Quarto freeze after the render
      id: freeze-after
      if: always() && github.event.action != 'closed'
      shell: bash
      env:
        FREEZE_DIR: ${{ inputs.path }}/_freeze
      run: bash "$GITHUB_ACTION_PATH/freeze-fingerprint.sh" >> "$GITHUB_OUTPUT"

    # Saved when the freeze changed, or when no cache was restored (nothing
    # to compare with, and nothing saved yet to fall back on).
    - name: Save Quarto freeze
      if: >-
        always() && github.event.action != 'closed' && inputs.incremental != 'true' &&
        (steps.restore-freeze.outputs.cache-matched-key == '' ||
         steps.freeze-before.outputs.fingerprint != steps.freeze-after.outputs.fingerprint)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}/_freeze
        key: quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}

    - name: Stage site for upload
      if: github.event.action != 'closed'
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        mkdir -p _preview_upload/site/
        cp -r "$PROJECT_PATH/$OUTPUT_DIR/." _preview_upload/site/

    - name: Upload preview artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: pr-preview-site
        path: _preview_upload/
        retention-days: 1
