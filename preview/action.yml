name: Build Quarto PR preview
description: >-
  Build a Quarto site for a pull-request preview and stage it (plus the PR
  metadata the deploy half needs) into a single artifact. Runs read-only in the
  (possibly fork) PR context — all writes to the base repo happen later in the
  deploy half (see the preview-deploy reusable workflow), which runs in the
  base-repo context via workflow_run. The R-package / Quarto specifics are
  parameterized so non-rme consumers can reuse this.
inputs:
  path:
    description: >-
      Path (relative to the caller repo root) to the Quarto project to render:
      the directory containing _quarto.yml. Defaults to the repo root. Set it
      when the site lives in a subdirectory (matches quarto-publish's `path`).
    default: '.'
  r-version:
    description: R version to install with r-lib/actions/setup-r.
    default: '4.6.0'
  apt-packages:
    description: >-
      System (apt) packages to install before R/Quarto setup, space-separated.
      Defaults to the shared renv stack plus the preview build helpers. Set to
      an empty string to skip the apt step entirely.
    default: >-
      jags libcurl4-openssl-dev libpng-dev libfontconfig1-dev libjpeg-dev
      libglpk-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libtiff5-dev
      libwebp-dev libnode109 cmake libgit2-dev libnode-dev libx11-dev pandoc
  use-renv:
    description: Restore R dependencies with renv (r-lib/actions/setup-renv). Set 'false' for non-renv repos.
    default: 'true'
  r-packages:
    description: >-
      R packages to install (space- or newline-separated) when `use-renv` is 'false',
      e.g. for non-renv Quarto projects.
    default: ''
  install-package:
    description: Run `R CMD INSTALL .` to install the caller repo as a local package before rendering.
    default: 'true'
  setup-chrome:
    description: Install Chrome (needed by Quarto for revealjs / screenshot rendering).
    default: 'true'
  submodules:
    description: Passed to actions/checkout `submodules` (e.g. 'recursive', 'true', or 'false').
    default: 'recursive'
  render-profile:
    description: Quarto `--profile` to render with.
    default: 'website'
  output-dir:
    description: Directory the rendered site is written to, relative to `path`. Defaults to `_site`.
    default: '_site'
  fail-on-render-warning:
    description: Fail the build if Quarto emits any render warnings (WARN in the render log).
    default: 'false'
  forbid-log-patterns:
    description: >-
      Newline-separated fixed string patterns that will fail the build if found
      in the Quarto render log.
    default: ''
runs:
  using: composite
  steps:
    - name: Check out repository
      if: github.event.action != 'closed'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: ${{ inputs.submodules }}

    # IMPORTANT: write the metadata AFTER checkout. actions/checkout runs
    # `git clean -ffdx` (clean: true is the default), which deletes any
    # untracked files already in the workspace — including a
    # `_preview_upload/` directory created beforehand. With the metadata
    # written before checkout, `_preview_upload/meta/` was wiped and never
    # reached the artifact, so the deploy half read an empty pr-number, the
    # deploy step's `action == 'deploy'` guard was false, and every deploy-path
    # preview was silently skipped (the job still passed). See d-morrison/rme#913.
    # For the 'closed'/remove event the checkout step is skipped, but this step
    # still runs so the empty/meta-only artifact reaches the deploy half.
    - name: Save PR metadata for the deploy workflow
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EVENT_ACTION: ${{ github.event.action }}
      run: |
        set -euo pipefail
        mkdir -p _preview_upload/meta
        echo "$PR_NUMBER" > _preview_upload/meta/pr-number
        echo "$PR_HEAD_SHA" > _preview_upload/meta/pr-head-sha
        echo "$EVENT_ACTION" > _preview_upload/meta/event-action

    # All build/render steps below gate on `action != 'closed'`. When a PR is
    # closed, this workflow uploads just the `_preview_upload/meta/` directory;
    # the deploy workflow sees no `site/` folder and routes into its removal
    # path.
    - name: Install system dependencies
      if: github.event.action != 'closed' && inputs.apt-packages != ''
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y $APT_PACKAGES

    - name: Setup Chrome
      if: github.event.action != 'closed' && inputs.setup-chrome == 'true'
      uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0

    - name: Set up Quarto
      if: github.event.action != 'closed'
      uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
      env:
        # `quarto install tinytex` looks up the latest `rstudio/tinytex-releases`
        # release via the GitHub API; unauthenticated, that intermittently 403s on
        # shared runners (#270). Authenticate it.
        GH_TOKEN: ${{ github.token }}
      with:
        tinytex: true

    - name: Set up R
      if: github.event.action != 'closed'
      uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      with:
        r-version: ${{ inputs.r-version }}
        use-public-rspm: true

    - name: Restore R dependencies
      if: github.event.action != 'closed' && inputs.use-renv == 'true'
      uses: r-lib/actions/setup-renv@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      env:
        GITHUB_PAT: ${{ github.token }}
        # renv::restore() only needs each package's already-pinned RemoteSha
        # from renv.lock; it doesn't need to also re-resolve the consumer's
        # DESCRIPTION Remotes: field against GitHub's API on every run (a
        # source of flaky/rate-limited failures -- see
        # d-morrison/rme#994 / gha#239).
        RENV_CONFIG_INSTALL_REMOTES: false

    - name: Install R dependencies
      if: github.event.action != 'closed' && inputs.setup-r == 'true' && inputs.use-renv != 'true' && inputs.r-packages != ''
      uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      with:
        packages: ${{ inputs.r-packages }}

    - name: Install local package
      if: github.event.action != 'closed' && inputs.setup-r == 'true' && inputs.install-package == 'true'
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
      run: R CMD INSTALL "$PROJECT_PATH"

    - name: Install TinyTeX packages required for PDF rendering
      if: github.event.action != 'closed' && contains(github.event.pull_request.labels.*.name, 'preview:pdf')
      shell: bash
      run: |
        set -euo pipefail
        Rscript -e "tinytex::tlmgr_repo('https://mirror.ctan.org/systems/texlive/tlnet')"
        Rscript -e "tinytex::tlmgr_install(c('luacolor', 'lua-ul'))"

    - name: Restore Quarto freeze
      if: github.event.action != 'closed' && !contains(github.event.pull_request.labels.*.name, 'clear freezer')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}/_freeze
        key: quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
        restore-keys: |
          quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.event.pull_request.head.sha }}-
          quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.event.pull_request.base.ref }}-
          quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-
          quarto-freezer-${{ runner.os }}-

    - name: Raise Deno V8 heap cap for large site renders
      if: github.event.action != 'closed'
      shell: bash
      # Quarto's launcher defaults Deno to an 8 GB V8 heap
      # (--max-old-space-size=8192,--max-heap-size=8192) and appends any
      # user-supplied QUARTO_DENO_V8_OPTIONS after those defaults; V8 lets
      # the last occurrence of a flag win, so this override takes effect.
      # Large multi-chapter sites (d-morrison/rme, ~37 pages) exceed 8 GB
      # of cumulative heap late in `quarto render` and crash with
      # "Fatal JavaScript out of memory" (exit 133); standard GitHub
      # runners have 16 GB of RAM, so 12 GB leaves headroom for R and the
      # OS while lifting the binding constraint (gha#262).
      run: echo "QUARTO_DENO_V8_OPTIONS=--max-old-space-size=12288,--max-heap-size=12288" >> "$GITHUB_ENV"

    - name: Render pdf
      if: github.event.action != 'closed' && contains(github.event.pull_request.labels.*.name, 'preview:pdf')
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
        RENDER_PROFILE: ${{ inputs.render-profile }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        [ -n "$OUTPUT_DIR" ] && OUTPUT_FLAG="--output-dir $OUTPUT_DIR" || OUTPUT_FLAG=""
        quarto render "$PROJECT_PATH" --profile "$RENDER_PROFILE" --to pdf $OUTPUT_FLAG 2>&1 | tee -a _quarto_preview_render.log

    - name: Render docx
      if: github.event.action != 'closed' && contains(github.event.pull_request.labels.*.name, 'preview:docx')
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
        RENDER_PROFILE: ${{ inputs.render-profile }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        [ -n "$OUTPUT_DIR" ] && OUTPUT_FLAG="--output-dir $OUTPUT_DIR" || OUTPUT_FLAG=""
        quarto render "$PROJECT_PATH" --profile "$RENDER_PROFILE" --to docx --no-clean $OUTPUT_FLAG 2>&1 | tee -a _quarto_preview_render.log

    - name: Render revealjs
      if: github.event.action != 'closed' && contains(github.event.pull_request.labels.*.name, 'preview:revealjs')
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
        RENDER_PROFILE: ${{ inputs.render-profile }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        [ -n "$OUTPUT_DIR" ] && OUTPUT_FLAG="--output-dir $OUTPUT_DIR" || OUTPUT_FLAG=""
        quarto render "$PROJECT_PATH" --profile "$RENDER_PROFILE" --to revealjs --no-clean $OUTPUT_FLAG 2>&1 | tee -a _quarto_preview_render.log

    - name: Render html
      if: github.event.action != 'closed'
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
        RENDER_PROFILE: ${{ inputs.render-profile }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        [ -n "$OUTPUT_DIR" ] && OUTPUT_FLAG="--output-dir $OUTPUT_DIR" || OUTPUT_FLAG=""
        quarto render "$PROJECT_PATH" --profile "$RENDER_PROFILE" --to html --no-clean $OUTPUT_FLAG 2>&1 | tee -a _quarto_preview_render.log

    - name: Verify render warnings and forbidden log patterns
      if: github.event.action != 'closed'
      shell: bash
      env:
        FAIL_ON_WARN: ${{ inputs.fail-on-render-warning }}
        FORBID_PATTERNS: ${{ inputs.forbid-log-patterns }}
      run: |
        set -euo pipefail
        LOG_FILE="_quarto_preview_render.log"
        [ -f "$LOG_FILE" ] || exit 0

        if [ "$FAIL_ON_WARN" = "true" ]; then
          if grep -iE '(^|[[:space:]])WARN([[:space:]:]|$)|Warning:' "$LOG_FILE"; then
            echo "::error::Quarto emitted one or more render warnings and fail-on-render-warning is enabled."
            exit 1
          fi
        fi

        if [ -n "${FORBID_PATTERNS:-}" ]; then
          while IFS= read -r pattern || [ -n "$pattern" ]; do
            trimmed_pattern=$(echo "$pattern" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -n "$trimmed_pattern" ]; then
              if grep -F "$trimmed_pattern" "$LOG_FILE"; then
                echo "::error::Quarto render log contains forbidden pattern '$trimmed_pattern'."
                exit 1
              fi
            fi
          done <<< "$FORBID_PATTERNS"
        fi

    - name: List files
      if: github.event.action != 'closed'
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        echo "contents of $PROJECT_PATH/$OUTPUT_DIR:"
        ls "$PROJECT_PATH/$OUTPUT_DIR/"
        echo "contents of $PROJECT_PATH:"
        ls "$PROJECT_PATH"

    - name: Save Quarto freeze
      if: github.event.action != 'closed'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}/_freeze
        key: quarto-freezer-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', inputs.path)) }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}

    - name: Stage site for upload
      if: github.event.action != 'closed'
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        mkdir -p _preview_upload/site/
        cp -r "$PROJECT_PATH/$OUTPUT_DIR/." _preview_upload/site/

    - name: Upload preview artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pr-preview-site
        path: _preview_upload/
        retention-days: 1
