name: Check bibliography DOIs
description: >-
  Validate that every book/article BibTeX entry has a DOI that resolves and
  whose CrossRef metadata is consistent with the entry. Scans all *.bib files
  in the caller's repository.
inputs:
  install-quarto:
    description: Install Quarto when setting up R dependencies.
    default: 'false'
  no-metadata-check:
    description: Skip CrossRef metadata comparison (only check DOI presence + URL resolves).
    default: 'false'
  exclude-keys:
    description: >-
      Space/comma-separated BibTeX keys to skip (e.g. older books without DOIs).
    default: ''
  preinstalled-toolchain:
    description: >-
      The runner already provides R (with the pak package) and has no sudo,
      as a self-hosted runner does. When 'true', skip setup-r and
      setup-r-dependencies, and install the check's R packages with pak into
      the runner's user library (the first writable entry of `.libPaths()`).
      `install-quarto` has no effect in this mode.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up R
      if: inputs.preinstalled-toolchain != 'true'
      uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      with:
        use-public-rspm: true

    - name: Install R packages (preinstalled R)
      if: inputs.preinstalled-toolchain == 'true'
      shell: bash
      env:
        GITHUB_PAT: ${{ github.token }}
      run: |
        set -euo pipefail
        Rscript -e 'pak::pkg_install(c("bib2df", "httr", "jsonlite", "stringr"))'

    - name: Set up R dependencies
      if: inputs.preinstalled-toolchain != 'true'
      uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      env:
        GITHUB_PAT: ${{ github.token }}
      with:
        install-quarto: ${{ inputs.install-quarto }}
        # The check reads only the caller's .bib files, so it needs the caller
        # package's hard dependencies at most. Installing its Suggests (and
        # their Remotes) made the check fail whenever a Suggests package lived
        # in a private repository the workflow token cannot read.
        dependencies: 'c("Depends", "Imports", "LinkingTo")'
        # setup-r-dependencies otherwise resolves the caller's DESCRIPTION
        # (Suggests included) once more to decide whether pandoc is needed.
        # The check never renders anything, so skip that probe.
        install-pandoc: 'false'
        packages: |
          any::bib2df
          any::httr
          any::jsonlite
          any::stringr

    - name: Check bibliography DOIs
      shell: bash
      env:
        # BIB_EXCLUDE_KEYS is read by check-bibliography-dois.R via Sys.getenv();

        # NO_METADATA_CHECK is read by this shell step below and turned into the
        # --no-metadata-check CLI flag the R script parses from commandArgs().
        BIB_EXCLUDE_KEYS: ${{ inputs.exclude-keys }}
        NO_METADATA_CHECK: ${{ inputs.no-metadata-check }}
      run: |
        set -euo pipefail

        # Collect .bib files NUL-delimited into an array so paths containing
        # spaces survive as single arguments to Rscript.
        BIB_FILES=()
        while IFS= read -r -d '' bib; do
          BIB_FILES+=("$bib")
        done < <(find . -name "*.bib" -not -path "./.git/*" -print0)

        if [ "${#BIB_FILES[@]}" -eq 0 ]; then
          echo "No bibliography (.bib) files found; nothing to check."
          exit 0
        fi
        echo "Found ${#BIB_FILES[@]} bibliography file(s):"
        printf '  %s\n' "${BIB_FILES[@]}"

        ARGS=()
        if [ "$NO_METADATA_CHECK" = "true" ]; then ARGS+=("--no-metadata-check"); fi
        Rscript "$GITHUB_ACTION_PATH/check-bibliography-dois.R" "${ARGS[@]}" "${BIB_FILES[@]}"

    - name: Summary
      if: success()
      shell: bash
      run: echo "✓ All bibliography entries have valid DOIs"
