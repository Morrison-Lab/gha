name: Spellcheck R package prose
description: >-
  Spellcheck an R package's prose with the {spelling} package, using the
  package's own inst/WORDLIST as the accepted vocabulary. Covers the
  DESCRIPTION Title and Description fields, man/*.Rd, vignette sources, and
  root README/NEWS/CHANGES/index Markdown.

inputs:
  path:
    description: Path to the package root, relative to the repository.
    default: '.'
  exclude:
    description: >-
      Comma-separated files or folders to exclude from the spellcheck.
      Accepts globs. Excluded files are temporarily staged out of the package
      tree during check and restored automatically on exit.
    default: ''
  fail:
    description: Fail the action when spelling errors are found ('true' or 'false').
    default: 'true'
  additional-options:
    description: >-
      Additional options passed to Rscript. Defaults to --vanilla; pass an
      empty string to let R read the site and user profiles instead.
    default: '--vanilla'
  install-quarto:
    description: >-
      Whether setup-r-dependencies installs Quarto ('true', 'false', 'auto').
      Defaults to 'false' because {spelling} reads vignette SOURCES and never
      renders them, so no Quarto is needed even for a .qmd vignette.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up R
      uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      with:
        use-public-rspm: true

    - name: Set up R dependencies
      uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      with:
        working-directory: ${{ inputs.path }}
        install-quarto: ${{ inputs.install-quarto }}
        packages: |
          any::spelling

    - name: Spellcheck
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_FAIL: ${{ inputs.fail }}
        ADDITIONAL_OPTIONS: ${{ inputs.additional-options }}
      run: |
        Rscript $ADDITIONAL_OPTIONS "${{ github.action_path }}/spellcheck.R" "$INPUT_PATH" "$INPUT_EXCLUDE" "$INPUT_FAIL"
