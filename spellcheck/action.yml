name: Spellcheck R package prose
description: >-
  Spellcheck an R package's prose with the {spelling} package, using the
  package's own inst/WORDLIST as the accepted vocabulary. Covers the
  DESCRIPTION Title and Description fields, man/*.Rd, vignette sources, and
  root README/NEWS/CHANGES/index Markdown. Wraps
  insightsengineering/r-spellcheck-action so consumers can drop their bespoke
  check-spelling workflows.
inputs:
  path:
    description: Path to the package root, relative to the repository.
    default: '.'
  exclude:
    description: >-
      Comma-separated files or folders to exclude from the spellcheck.
      Accepts globs. The upstream action implements this by DELETING the
      matched files from the runner's checkout and never restoring them, so
      do not run this capability in a job that later reads or publishes the
      working tree.
    default: ''
  additional-options:
    description: >-
      Additional options passed to Rscript by the upstream action. The
      upstream default is --vanilla; pass an empty string to let R read the
      site and user profiles instead.
    default: '--vanilla'
  install-quarto:
    description: >-
      Whether setup-r-dependencies installs Quarto ('true', 'false', 'auto').
      Defaults to 'false' because {spelling} reads vignette SOURCES and never
      renders them, so no Quarto is needed even for a .qmd vignette. Raise it
      to 'auto' only if a consumer's own dependency resolution needs Quarto.
    default: 'false'
runs:
  using: composite
  steps:
    # R is set up here rather than left to a container, which is the deliberate
    # difference from the bespoke workflows this capability replaces (ucdavis/win
    # and Morrison-Lab/wai both run rocker images). Every other R capability in
    # this repo uses r-lib/actions -- see check-bibliography-dois -- and matching
    # the neighbours matters more than matching the thing being migrated: a
    # consumer already paying for setup-r in its other jobs gets a warm toolchain
    # cache here, and a container image does not.
    #
    # The upstream action's first step runs under `shell: Rscript {0}`, so R has
    # to be on PATH before that step is reached. It installs {spelling} itself
    # but it cannot install R.
    - name: Set up R
      uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      with:
        use-public-rspm: true

    # {spelling} is installed here rather than left to the upstream action's own
    # `if (!require("spelling")) install.packages(...)`, because that call sets
    # `options(repos = c(CRAN = "https://cloud.r-project.org/"))` first -- which
    # serves SOURCE packages for Linux, so it compiles {spelling} and its
    # {hunspell} C++ dependency on every run. Going through setup-r-dependencies
    # instead takes the public RSPM binaries and caches them across runs, and the
    # upstream install then finds the package present and no-ops.
    #
    # `packages:` REPLACES the action's own `deps::.` default rather than adding
    # to it, which is the point: spell_check_package() reads the package's files
    # without loading it, so resolving the consumer's whole dependency tree would
    # be pure cost.
    - name: Set up R dependencies
      uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      with:
        working-directory: ${{ inputs.path }}
        install-quarto: ${{ inputs.install-quarto }}
        packages: |
          any::spelling

    - name: Spellcheck
      uses: insightsengineering/r-spellcheck-action@33b8e19df4227812758fadd88d50b710c7620e1f # v3.0.3
      with:
        path: ${{ inputs.path }}
        exclude: ${{ inputs.exclude }}
        additional_options: ${{ inputs.additional-options }}
