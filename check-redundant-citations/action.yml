name: Check redundant citations
description: >-
  Diff-scoped check that flags a source cited twice in one div or passage of
  Markdown and Quarto files (Ezra, 2026-10-19; Morrison-Lab/psw#282). A repeat
  is the same citation key with the same locator (or none) twice between two
  `:::` lines or slide breaks, counting every key in a bracketed citation and
  every `@key` on a `Source:` line. In-text citations, repeats with a
  different locator, repeats in different list items, cross-references, code
  fences and chunk options are never flagged. Scoped to repeats with an
  occurrence on a line a diff adds (an added line whose exact text was also
  deleted in the same diff counts as moved). Warn-only by default.
inputs:
  python-version:
    description: Python version to set up.
    default: '3.x'
  base-ref:
    description: >-
      Git ref/SHA to diff against; only repeats touching lines added since
      this ref are checked. On a pull request the reusable workflow passes
      `HEAD^1`, the base tip GitHub built the merge ref on.
      Diff mode needs the base commit in history (checkout with
      fetch-depth: 0); when the diff can't be computed (e.g. a shallow
      clone, or no base-ref given on a push run), the check is skipped with
      a warning rather than falling back to a whole-tree scan, which would
      reflag every repeat the corpus already carries.
    default: ''
  whole-tree:
    description: >-
      Scan every tracked file the globs match, in full, instead of only the
      lines added since base-ref. Use it to measure a corpus; `base-ref` is
      ignored when this is 'true'.
    default: 'false'
  globs:
    description: >-
      Space-separated git pathspecs of tracked files to check. Git pathspecs
      match at any depth, so this is recursive by default.
    default: '*.qmd *.md'
  paths-ignore:
    description: >-
      Comma/newline-separated glob patterns (relative paths) to skip.
      Supports `*`, `?`, and recursive `**`.
    default: ''
  fail:
    description: >-
      Fail the action when a source is cited twice in one div or passage (else
      non-blocking). Defaults to 'false': the same key twice is sometimes
      right, so the first version only annotates.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check redundant citations
      shell: bash
      env:
        RC_BASE_REF: ${{ inputs.base-ref }}
        RC_WHOLE_TREE: ${{ inputs.whole-tree }}
        RC_GLOBS: ${{ inputs.globs }}
        RC_PATHS_IGNORE: ${{ inputs.paths-ignore }}
        RC_FAIL: ${{ inputs.fail }}
      run: python3 -u "$GITHUB_ACTION_PATH/check-redundant-citations.py"
