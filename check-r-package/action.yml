name: Check R package
description: >-
  Runs the standard check suite for R package repositories (like Morrison-Lab/rpt):
  repository hygiene (junk files, secrets, non-standard characters, semantic line breaks,
  typos, YAML lint, workflow lint, Markdown lint), AI tells, duplicate roxygen documentation checks,
  one-function-per-file enforcement, extra R-package checks, R formatting with Air,
  NEWS.md changelog checks, and package version consistency checks.
inputs:
  fail:
    description: Fail the action when any enabled check reports findings.
    default: 'true'
  check-junk-files:
    description: Check for tracked operating-system and editor detritus.
    default: 'true'
  junk-patterns:
    description: Gitignore-style patterns naming what counts as junk.
    default: '.DS_Store, ._*, .Rproj.user, .Rhistory, .RData, .httr-oauth, .quarto, Thumbs.db, desktop.ini'
  junk-paths-ignore:
    description: Paths to exempt from the junk files scan.
    default: ''
  check-secrets:
    description: Scan git history for committed credentials with gitleaks.
    default: 'true'
  secrets-config:
    description: Path to a custom gitleaks TOML config file.
    default: ''
  secrets-paths-ignore:
    description: Regex patterns for paths to exempt from secret scanning.
    default: ''
  check-non-standard-chars:
    description: Flag non-standard unicode characters, curly quotes, and smart dashes.
    default: 'true'
  non-standard-chars-paths:
    description: Comma- or space-separated list of files or globs to check.
    default: ''
  non-standard-chars-paths-ignore:
    description: Paths or globs to exclude from non-standard character scanning.
    default: ''
  check-new-line-breaks:
    description: Enforce semantic line breaks on modified lines.
    default: 'true'
  new-line-breaks-base-ref:
    description: Git ref to diff against for diff-scoped new line break checking.
    default: ''
  new-line-breaks-globs:
    description: Comma- or space-separated glob patterns to check.
    default: ''
  check-typos:
    description: Scan files for spelling typos using crate-ci/typos.
    default: 'true'
  typos-config:
    description: Custom typos config file path.
    default: ''
  typos-base-ref:
    description: Git ref to diff against for diff-scoped typo checking.
    default: ''
  check-ai-tells:
    description: Scan narrative prose (*.md, *.Rmd, *.qmd) for AI cliches and tells.
    default: 'true'
  ai-tells-threshold:
    description: Maximum allowed tell density (tells per 1,000 words).
    default: '10'
  ai-tells-ignore:
    description: Comma- or space-separated list of tell names to ignore.
    default: ''
  lint-yaml:
    description: Lint tracked YAML files with yamllint.
    default: 'true'
  yaml-config-file:
    description: Path to a yamllint config file.
    default: ''
  yaml-paths-ignore:
    description: Patterns to exclude from YAML linting.
    default: ''
  lint-workflows:
    description: Lint GitHub Actions workflows with actionlint and zizmor.
    default: 'true'
  workflows-path:
    description: Path containing GitHub Actions workflow files to lint.
    default: '.github/workflows'
  lint-markdown:
    description: Lint tracked Markdown files with markdownlint-cli2.
    default: 'true'
  markdown-config-file:
    description: Path to a markdownlint config file.
    default: ''
  markdown-globs:
    description: Git pathspecs of tracked Markdown files to lint.
    default: '*.md'
  markdown-paths-ignore:
    description: Glob patterns to skip for Markdown linting.
    default: ''
  markdown-base-ref:
    description: Git ref to diff against for diff-scoped list-item splice checks.
    default: ''
  check-duplicate-roxygen:
    description: Check for duplicate roxygen parameter documentation in R code.
    default: 'true'
  duplicate-roxygen-path:
    description: Target directory to scan for duplicate roxygen documentation.
    default: '.'
  check-one-function-per-file:
    description: Enforce single function definition per file in R/.
    default: 'true'
  one-function-per-file-path:
    description: Path to R source files.
    default: 'R'
  check-extra:
    description: Run extra package checks (warnings as errors, readme freshness, or random-order tests).
    default: 'false'
  extra-check:
    description: Which extra check to run (warnings, random-order, or readme).
    default: 'warnings'
  check-formatting:
    description: Check R formatting with Air.
    default: 'true'
  air-version:
    description: Air version to install.
    default: '0.11.0'
  air-path:
    description: Path to format-check with Air.
    default: '.'
  check-news:
    description: Check NEWS.md on pull requests.
    default: 'true'
  changelog-file:
    description: Path to changelog file.
    default: 'NEWS.md'
  check-version:
    description: Check DESCRIPTION package version on pull requests.
    default: 'true'
  description-path:
    description: Path to DESCRIPTION file.
    default: 'DESCRIPTION'
runs:
  using: composite
  steps:
    - name: Check for tracked junk files
      if: inputs.check-junk-files != 'false'
      uses: Morrison-Lab/gha/check-junk-files@v2
      with:
        patterns: ${{ inputs.junk-patterns }}
        paths-ignore: ${{ inputs.junk-paths-ignore }}
        fail: ${{ inputs.fail }}

    - name: Check for committed secrets
      if: inputs.check-secrets != 'false'
      uses: Morrison-Lab/gha/check-secrets@v2
      with:
        config: ${{ inputs.secrets-config }}
        paths-ignore: ${{ inputs.secrets-paths-ignore }}
        fail: ${{ inputs.fail }}

    - name: Check for non-standard characters
      if: inputs.check-non-standard-chars != 'false'
      uses: Morrison-Lab/gha/check-non-standard-chars@v2
      with:
        paths: ${{ inputs.non-standard-chars-paths }}
        paths-ignore: ${{ inputs.non-standard-chars-paths-ignore }}
        fail: ${{ inputs.fail }}

    - name: Check new line breaks
      if: inputs.check-new-line-breaks != 'false'
      uses: Morrison-Lab/gha/check-new-line-breaks@v2
      with:
        base-ref: ${{ inputs.new-line-breaks-base-ref }}
        globs: ${{ inputs.new-line-breaks-globs }}
        fail: ${{ inputs.fail }}

    - name: Check for typos
      if: inputs.check-typos != 'false'
      uses: Morrison-Lab/gha/check-typos@v2
      with:
        config: ${{ inputs.typos-config }}
        base-ref: ${{ inputs.typos-base-ref }}
        fail: ${{ inputs.fail }}

    - name: Check AI tells
      if: inputs.check-ai-tells != 'false'
      uses: Morrison-Lab/gha/check-ai-tells@v2
      with:
        threshold: ${{ inputs.ai-tells-threshold }}
        ignore-tells: ${{ inputs.ai-tells-ignore }}
        fail: ${{ inputs.fail }}

    - name: Lint YAML
      if: inputs.lint-yaml != 'false'
      uses: Morrison-Lab/gha/lint-yaml@v2
      with:
        config-file: ${{ inputs.yaml-config-file }}
        paths-ignore: ${{ inputs.yaml-paths-ignore }}
        fail: ${{ inputs.fail }}

    - name: Lint workflows
      if: inputs.lint-workflows != 'false'
      uses: Morrison-Lab/gha/lint-workflows@v2
      with:
        path: ${{ inputs.workflows-path }}
        fail: ${{ inputs.fail }}

    - name: Lint Markdown
      if: inputs.lint-markdown != 'false'
      uses: Morrison-Lab/gha/lint-markdown@v2
      with:
        config-file: ${{ inputs.markdown-config-file }}
        globs: ${{ inputs.markdown-globs }}
        paths-ignore: ${{ inputs.markdown-paths-ignore }}
        base-ref: ${{ inputs.markdown-base-ref }}
        fail: ${{ inputs.fail }}

    - name: Check duplicate roxygen documentation
      if: inputs.check-duplicate-roxygen != 'false'
      uses: Morrison-Lab/gha/check-duplicate-roxygen@v2
      with:
        path: ${{ inputs.duplicate-roxygen-path }}
        fail: ${{ inputs.fail }}

    - name: Check one function per file
      if: inputs.check-one-function-per-file != 'false'
      uses: Morrison-Lab/gha/check-one-function-per-file@v2
      with:
        path: ${{ inputs.one-function-per-file-path }}
        fail: ${{ inputs.fail }}

    - name: Check formatting with Air
      if: inputs.check-formatting != 'false'
      uses: Morrison-Lab/gha/check-formatting@v2
      with:
        version: ${{ inputs.air-version }}
        path: ${{ inputs.air-path }}

    - name: Check extra R-package checks
      if: inputs.check-extra == 'true'
      uses: Morrison-Lab/gha/check-extra@v2
      with:
        check: ${{ inputs.extra-check }}

    - name: Check NEWS.md on PR
      if: inputs.check-news != 'false' && github.event_name == 'pull_request'
      uses: UCD-SERG/changelog-check-action@3335dbf507b538e12d43e59040fc926e849ea2e7 # v1.1.1
      with:
        changelog: ${{ inputs.changelog-file }}

    - name: Check package version on PR
      if: inputs.check-version != 'false' && github.event_name == 'pull_request'
      shell: bash
      env:
        DESC_PATH: ${{ inputs.description-path }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        if [ ! -f "$DESC_PATH" ]; then
          echo "No DESCRIPTION file found at '$DESC_PATH'; skipping version check."
          exit 0
        fi
        # Read HEAD version
        head_ver=$(grep -E '^Version:' "$DESC_PATH" | awk '{print $2}' || true)
        if [ -z "$head_ver" ]; then
          echo "::error::Could not parse Version from $DESC_PATH"
          exit 1
        fi
        # Read base version if available
        if git rev-parse --verify "origin/$BASE_REF:$DESC_PATH" >/dev/null 2>&1; then
          base_ver=$(git show "origin/$BASE_REF:$DESC_PATH" | grep -E '^Version:' | awk '{print $2}' || true)
          echo "PR target branch version: $base_ver"
          echo "PR branch version:        $head_ver"
        else
          echo "Base branch DESCRIPTION not reachable; skipping version comparison."
        fi
